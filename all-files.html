<!DOCTYPE html>

<meta charset="UTF-8">

<!-- ⭐ TASK 3 (v4.1.2): إصدار التطبيق متاح لـ app-update.js كاحتياطي -->
<meta name="app-version" content="4.6.3">

<!-- Smooth page transitions (View Transitions API + fallback fade).
     The fixed bottom navigation gets its own view-transition-name and is
     frozen, so it can never move or fade while the page content changes. -->
<style data-shell>
  /* Global theme defaults. `data-theme` is always set by theme-init.js
     (light or dark), so native controls and scrollbars follow the app. */
  :root { color-scheme: light; --medapp-amber: #fbbf24; --medapp-orange: #fb923c; --medapp-blue: #93c5fd; --medapp-blue-soft: #bfdbfe; --medapp-violet: #c4b5fd; --medapp-green: #34d399; --medapp-red: #f87171; --medapp-pink: #f472b6; }
  [data-theme="dark"] { color-scheme: dark; }
  [data-theme="light"] { --medapp-amber: #b45309; --medapp-orange: #c2410c; --medapp-blue: #2563eb; --medapp-blue-soft: #1d4ed8; --medapp-violet: #6d28d9; --medapp-green: #047857; --medapp-red: #b91c1c; --medapp-pink: #be185d; }

  /* Premium smooth scrolling. The SPA router temporarily disables this for
     page swaps / Back restoration so navigation is instant, never animated. */
  html { scroll-behavior: smooth; }
  /* app.js sets this only for instant SPA swaps / Back restoration. */
  html.medapp-scroll-jump { scroll-behavior: auto !important; }

  html.medapp-navigating { cursor: progress; }

  /* ⭐IMPORTANT: the `hidden` attribute must always win.
     Author rules like `.detail-empty { display: flex }` beat the user-agent
     `[hidden] { display: none }` rule, which made "empty" blocks stay on
     screen on top of real content. */
  [hidden] { display: none !important; }

  /* ⭐ Tap targets: 44px minimum, no double-tap zoom, no grey flash. */
  button,
  a[role="button"],
  [role="button"] {
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }

  /* ⭐ انتقال ناعم بين الوضعين النهاري والليلي.
     يُفعَّل هذا الصنف لحظياً قبل تبديل الثيم (MedApp.withThemeTransition)
     فيتحوّل لون الخلفية والنص والحدود تدريجياً بدل القفز المفاجئ. */
  html.theme-transition,
  html.theme-transition body,
  html.theme-transition *,
  html.theme-transition *::before,
  html.theme-transition *::after {
    transition:
      background-color 0.34s ease,
      color 0.34s ease,
      border-color 0.34s ease,
      fill 0.34s ease,
      stroke 0.34s ease,
      box-shadow 0.34s ease !important;
    transition-delay: 0s !important;
  }

  /* Very thin top progress bar, shown by app.js during SPA navigation. */
  #medapp-loader {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    z-index: 2147483647;
    pointer-events: none;
    overflow: hidden;
    opacity: 0;
    transition: opacity 0.15s ease;
  }

  #medapp-loader::before {
    content: '';
    display: block;
    width: 40%;
    height: 100%;
    border-radius: 0 999px 999px 0;
    background: linear-gradient(90deg, transparent, #059669 18%, #10b981 52%, #34d399 82%, transparent);
    box-shadow: 0 0 8px rgba(16, 185, 129, 0.6);
    transform: translateX(-110%);
    will-change: transform;
  }

  html.medapp-loading #medapp-loader { opacity: 1; }
  html.medapp-loading #medapp-loader::before {
    animation: medapp-loader-slide 1.05s cubic-bezier(0.4, 0, 0.2, 1) infinite;
  }

  @keyframes medapp-loader-slide {
    0%   { transform: translateX(-110%); }
    100% { transform: translateX(360%); }
  }

  /* Only same-document transitions (started by app.js). Cross-document
     @view-transition is intentionally NOT enabled: full loads must behave
     exactly like the original pages. */

  .floating-nav-wrapper { view-transition-name: medapp-bottom-nav; }
  ::view-transition-group(medapp-bottom-nav) { animation: none; }
  ::view-transition-old(medapp-bottom-nav),
  ::view-transition-new(medapp-bottom-nav) { animation: none; }

  /* Keep the sticky header out of the root cross-fade. Otherwise the old and
     new snapshots of a translucent, blurred header overlap and look frozen /
     show a ghost shadow while the page changes. */
  header { view-transition-name: medapp-header; }
  ::view-transition-group(medapp-header) { animation: none; }
  ::view-transition-old(medapp-header),
  ::view-transition-new(medapp-header) { animation: none; }

  /* Light mode: the header must use a soft neutral shadow, never the heavy
     black shadow used by the dark theme. */
  [data-theme="light"] header {
    background: rgba(248, 250, 251, 0.92);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    backdrop-filter: blur(20px) saturate(180%);
    border-bottom-color: rgba(15, 23, 42, 0.08);
    box-shadow: 0 1px 0 rgba(15, 23, 42, 0.04);
    color: var(--text-primary);
  }

  /* Wins over every page-level `header.scrolled` (higher specificity). */
  [data-theme="light"] header.scrolled {
    background: rgba(248, 250, 251, 0.97);
    border-bottom-color: rgba(15, 23, 42, 0.1);
    box-shadow:
      0 4px 18px rgba(15, 23, 42, 0.08),
      0 1px 0 rgba(15, 23, 42, 0.05);
  }

  @media (prefers-reduced-motion: no-preference) {
    ::view-transition-old(root) { animation: pt-fade-out 0.14s cubic-bezier(0.4, 0, 0.2, 1) both; }
    ::view-transition-new(root) { animation: pt-fade-in 0.2s cubic-bezier(0.4, 0, 0.2, 1) both; }
  }

  /* No body animation on browsers without View Transitions: the swap is
     already synchronous, and fading the body element would also fade the
     fixed bottom navigation. The nav must never move or fade. */

  @keyframes pt-fade-in  { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pt-fade-out { from { opacity: 1; } to { opacity: 0; } }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto !important; }
    html.theme-transition,
    html.theme-transition body,
    html.theme-transition *,
    html.theme-transition *::before,
    html.theme-transition *::after {
      transition: none !important;
    }
    #medapp-loader::before {
      animation: none !important;
      transform: none;
      width: 60%;
    }
    ::view-transition-old(root), ::view-transition-new(root),
    ::view-transition-old(medapp-bottom-nav), ::view-transition-new(medapp-bottom-nav),
    ::view-transition-old(medapp-header), ::view-transition-new(medapp-header) { animation: none !important; }
  }

  /* ============================================================
     ⭐ المنطقة الآمنة + الشريط العلوي الثابت (Phase 14)
     ------------------------------------------------------------
     • الشريط العلوي fixed ⇒ لا يختفي تحت شريط الحالة عند السحب
       (الـ rubber-band كان يُظهره خلف الشريط).
     • جسم الصفحة يحمل padding-top بمقدار ارتفاع الشريط حتى
       لا يختفي المحتوى تحته.
     • overscroll-behavior: لا اهتزاز عند السحب إلى ما بعد الحواف.
     ============================================================ */
  :root {
    /* ⭐⭐ سلّم الـ z-index — كل الطبقات في مكانها (Phase 27)
       ------------------------------------------------------------
       1        عناصر داخل الصفحة
       100      عناصر لاصقة
       9999     الشريط العلوي
       10000+   الأوراق السفلية (السلسلة · مهام اليوم …)
       20000    الطبقات شبه الشفافة (البحث · نافذة الدخول)
       1000000  نوافذ ui.js
       1000100  نافذة التحديث
       2147483647  التنبيهات (toast) — الأعلى دائماً */
    --z-header: 9999;
    --z-sheet: 10000;
    --z-overlay: 20000;
    --z-modal: 1000000;
    --z-update: 1000100;
    --z-toast: 2147483647;

    --safe-area-inset-top: env(safe-area-inset-top, 0px);
    --safe-area-inset-bottom: env(safe-area-inset-bottom, 0px);
    --safe-area-inset-left: env(safe-area-inset-left, 0px);
    --safe-area-inset-right: env(safe-area-inset-right, 0px);

    /* ⭐⭐ رموز احتياطية — الصفحات التي تعرّف رموزها الخاصة تتجاوزها،
       والصفحات التي لا تعرّفها تحصل على قيم سليمة.
       بدونها كان زر "تسجيل الدخول" بلا خلفية (لأن --accent-emerald
       غير معرّف) فيظهر النص الأبيض على خلفية شفافة = نص غير مرئي. */
    --accent-emerald: #10b981;
    --accent-light: #34d399;
    --accent-dark: #059669;
    --accent-glow: rgba(16, 185, 129, 0.25);
    --accent-glow-strong: rgba(16, 185, 129, 0.42);
    --bg-main: #06110d;
    --bg-card: rgba(16, 34, 27, 0.68);
    --bg-card-hover: rgba(22, 48, 38, 0.92);
    --bg-solid: #0d221a;
    --bg-elevated: #102a22;
    --border-card: rgba(16, 185, 129, 0.18);
    --border-card-hover: rgba(16, 185, 129, 0.46);
    --text-primary: #f0fdf4;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
    --transition-fast: 0.18s ease;
    --transition-smooth: 0.25s cubic-bezier(0.4, 0, 0.2, 1);

    --app-header-h: 72px;
    --app-header-pad-x: 20px;
  }

  [data-theme="light"] {
    --accent-emerald: #059669;
    --bg-main: #f8fafb;
    --bg-card: rgba(255, 255, 255, 0.9);
    --bg-card-hover: #ffffff;
    --bg-solid: #ffffff;
    --bg-elevated: #f1f5f9;
    --border-card: rgba(16, 185, 129, 0.24);
    --border-card-hover: rgba(16, 185, 129, 0.55);
    --text-primary: #0f172a;
    --text-secondary: #475569;
    --text-muted: #94a3b8;
  }

  @media (max-width: 480px) {
    :root {
      --app-header-h: 68px;
      --app-header-pad-x: 16px;
    }
  }

  html, body, main {
    overscroll-behavior-y: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }

  /* ⭐ لكن حقول الإدخال تبقى قابلة للتحديد والنسخ */
  input,
  textarea,
  select,
  [contenteditable="true"] {
    -webkit-user-select: text;
    user-select: text;
  }

  body {
    margin: 0;
    padding: 0;
  }

  /* ⭐ الشريط العلوي: ثابت في الأعلى، فوق كل شيء، ويحترم النوتش */
  body > header,
  body > .ml-topbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    width: 100%;
    z-index: 9999;
    box-sizing: border-box;
    min-height: calc(var(--app-header-h) + var(--safe-area-inset-top, env(safe-area-inset-top, 0px)));
    padding-top: var(--safe-area-inset-top, env(safe-area-inset-top, 0px)) !important;
    padding-bottom: 0 !important;
    padding-left: var(--app-header-pad-x) !important;
    padding-right: var(--app-header-pad-x) !important;
  }

  /* حالة "مُمرَّر" لا يجب أن تكسر الارتفاع ولا المنطقة الآمنة */
  body > header.scrolled,
  body > .ml-topbar {
    padding-top: var(--safe-area-inset-top, env(safe-area-inset-top, 0px)) !important;
  }

  /* ⭐⭐⭐ TASK 2 (v4.1.0) — إزاحة المحتوى عن الشريط العلوي الثابت
     كانت تتحقّق عبر `body:has(> header)`، وهي تعتمد على دعم :has()
     في الـ WebView؛ إن غاب الدعم يختفي أعلى المحتوى تحت الشريط.
     انتقلت المسؤولية إلى حاوية المحتوى نفسها (انظر قسم TASK 2 أدناه)
     — وهي قاعدة لا تعتمد على أي محدد حديث. */
  body:has(> header),
  body:has(> .ml-topbar) {
    padding-top: 0;
  }

  /* ============================================================
     ⭐⭐ شبكة أمان: أي طبقة مخفية يجب ألّا تعترض النقرات
     ------------------------------------------------------------
     كانت طبقة "تسجيل الدخول" بلا CSS فتُعرض كنصّ دائم أسفل الشاشة
     وتبتلع كل الضغطات. التفاصيل الكاملة في قسم TASK 4 أدناه
     (display/hidden + pointer-events لكل نافذة).
     ============================================================ */
  .auth-required-overlay:not(.active),
  .modal-backdrop:not(.open):not(.active),
  .medapp-ui-root:not(.open),
  .medapp-update-overlay:not(.open) {
    display: none !important;
    pointer-events: none !important;
  }

  /* ⭐ الطبقات المفعّلة وحدها تلتقط النقرات */
  .auth-required-overlay.active,
  .medapp-ui-root.open,
  .medapp-update-overlay.open {
    pointer-events: auto;
  }

  /* ============================================================
     ⭐⭐⭐ نافذة التحديث داخل التطبيق (In-App Update) — Premium
     ------------------------------------------------------------
     خلفية متدرّجة خضراء داكنة + أيقونة متوهّجة + شارة الإصدار.
     ============================================================ */
  .medapp-update-overlay {
    position: fixed;
    inset: 0;
    z-index: var(--z-update, 1000100);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 22px;
    background: rgba(2, 10, 7, 0.82);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    opacity: 0;
    transition: opacity 0.28s ease;
  }
  .medapp-update-overlay.open { opacity: 1; }

  .medapp-update-card {
    position: relative;
    width: 100%;
    max-width: 420px;
    max-height: 86vh;
    overflow-y: auto;
    padding: 30px 24px 22px;
    border-radius: 28px;
    text-align: center;
    background:
      radial-gradient(120% 80% at 50% 0%, rgba(16, 185, 129, 0.22) 0%, rgba(16, 185, 129, 0) 62%),
      linear-gradient(165deg, #0f3327 0%, #0a2019 48%, #06110d 100%);
    border: 1px solid rgba(52, 211, 153, 0.34);
    box-shadow:
      0 40px 90px -26px rgba(0, 0, 0, 0.85),
      0 0 70px -22px rgba(16, 185, 129, 0.45);
    transform: translateY(18px) scale(0.95);
    transition: transform 0.34s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .medapp-update-overlay.open .medapp-update-card { transform: translateY(0) scale(1); }

  /* ⭐ توهّج خلفي ناعم */
  .medapp-update-glow {
    position: absolute;
    top: -90px;
    left: 50%;
    width: 240px;
    height: 240px;
    transform: translateX(-50%);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(52, 211, 153, 0.32) 0%, rgba(52, 211, 153, 0) 68%);
    pointer-events: none;
  }

  .medapp-update-icon {
    position: relative;
    width: 74px;
    height: 74px;
    margin: 0 auto 14px;
    border-radius: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(140deg, rgba(52, 211, 153, 0.28), rgba(5, 150, 105, 0.12));
    border: 1px solid rgba(52, 211, 153, 0.5);
    color: #6ee7b7;
    box-shadow:
      0 0 0 6px rgba(16, 185, 129, 0.08),
      0 0 38px -6px rgba(52, 211, 153, 0.7);
    animation: updateGlow 2.4s ease-in-out infinite;
  }
  .medapp-update-icon i { width: 32px; height: 32px; }
  @keyframes updateGlow {
    0%, 100% { box-shadow: 0 0 0 6px rgba(16,185,129,0.08), 0 0 30px -8px rgba(52,211,153,0.55); }
    50%      { box-shadow: 0 0 0 10px rgba(16,185,129,0.05), 0 0 48px -4px rgba(52,211,153,0.85); }
  }

  .medapp-update-kicker {
    position: relative;
    margin-bottom: 6px;
    font-size: 0.7rem;
    font-weight: 800;
    letter-spacing: 0.8px;
    color: #6ee7b7;
    opacity: 0.9;
  }

  .medapp-update-title {
    position: relative;
    font-size: 1.24rem;
    font-weight: 900;
    color: #ecfdf5;
    line-height: 1.6;
  }

  /* ⭐ شارة الإصدار */
  .medapp-update-version {
    position: relative;
    display: inline-block;
    margin-top: 10px;
    padding: 6px 18px;
    border-radius: 999px;
    background: linear-gradient(135deg, rgba(52, 211, 153, 0.22), rgba(16, 185, 129, 0.1));
    border: 1px solid rgba(52, 211, 153, 0.45);
    color: #6ee7b7;
    font-size: 0.98rem;
    font-weight: 900;
    letter-spacing: 0.6px;
    direction: ltr;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
  }

  .medapp-update-from {
    position: relative;
    margin-top: 7px;
    font-size: 0.76rem;
    font-weight: 600;
    color: #94a3b8;
    direction: ltr;
  }

  .medapp-update-section-title {
    position: relative;
    margin: 18px 0 8px;
    text-align: right;
    font-size: 0.76rem;
    font-weight: 800;
    color: #a7f3d0;
    letter-spacing: 0.2px;
  }

  /* ⭐ الملاحظات — قائمة عربية نظيفة بعلامات صحّ خضراء */
  .medapp-update-notes {
    position: relative;
    margin: 0;
    padding: 14px 16px;
    list-style: none;
    text-align: right;
    border-radius: 18px;
    background: rgba(0, 0, 0, 0.26);
    border: 1px solid rgba(52, 211, 153, 0.16);
  }
  .medapp-update-notes li {
    position: relative;
    display: flex;
    align-items: flex-start;
    gap: 9px;
    margin-bottom: 9px;
    font-size: 0.81rem;
    font-weight: 600;
    line-height: 1.85;
    color: #cbd5e1;
    text-align: right;
  }
  .medapp-update-notes li:last-child { margin-bottom: 0; }
  .medapp-update-notes li i {
    flex: 0 0 auto;
    width: 15px;
    height: 15px;
    margin-top: 5px;
    color: #34d399;
    filter: drop-shadow(0 0 6px rgba(52, 211, 153, 0.45));
  }
  .medapp-update-notes li span { flex: 1; }

  .medapp-update-footnote {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-top: 14px;
    font-size: 0.68rem;
    font-weight: 600;
    line-height: 1.7;
    color: #94a3b8;
  }
  .medapp-update-footnote i {
    width: 14px;
    height: 14px;
    flex: 0 0 auto;
    color: #34d399;
  }

  /* ⭐ الأزرار */
  .medapp-update-actions {
    position: relative;
    margin-top: 20px;
    display: flex;
    gap: 10px;
  }
  .medapp-update-btn {
    flex: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 14px 16px;
    border-radius: 15px;
    border: 1px solid rgba(52, 211, 153, 0.28);
    background: rgba(255, 255, 255, 0.04);
    color: #a7f3d0;
    font-family: inherit;
    font-size: 0.88rem;
    font-weight: 800;
    cursor: pointer;
    transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
  }
  .medapp-update-btn:hover { transform: translateY(-2px); }
  .medapp-update-btn:active { transform: translateY(0) scale(0.98); }
  .medapp-update-btn.primary {
    border: none;
    background: linear-gradient(135deg, #10b981, #059669);
    color: #ffffff;
    box-shadow: 0 14px 32px -14px rgba(16, 185, 129, 0.95);
  }
  .medapp-update-btn.ghost {
    background: transparent;
    border-color: rgba(148, 163, 184, 0.3);
    color: #94a3b8;
  }
  .medapp-update-btn.ghost:hover { background: rgba(148, 163, 184, 0.08); }

  /* ============================================================
     ⭐⭐⭐ TASK 1 — RESTORED FROM GIT (v3.6.0 · commit 82efe58)
     ------------------------------------------------------------
     النوافذ المنبثقة المخصّصة (بديل alert/confirm/prompt) التي
     يبنيها ui.js. هذه القواعد كانت **محذوفة** من هذا الملف منذ
     v3.6.1 فظهرت النوافذ كبطاقات عارية ("Ghost Elements").
     تمّت استعادتها من الـ commit 82efe58 حرفياً.
     ════════════════════════════════════════════════════════════ */
  .medapp-ui-root {
    position: fixed;
    inset: 0;
    z-index: var(--z-modal, 1000000);
    pointer-events: none;
  }
  .medapp-ui-root.open { pointer-events: auto; }

  .medapp-ui-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 22px;
    background: rgba(3, 10, 8, 0.68);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    opacity: 0;
    transition: opacity 0.22s ease;
  }
  [data-theme="light"] .medapp-ui-overlay { background: rgba(15, 23, 42, 0.42); }
  .medapp-ui-root.open .medapp-ui-overlay { opacity: 1; }

  .medapp-ui-card {
    width: 100%;
    max-width: 400px;
    padding: 26px 22px 20px;
    border-radius: 24px;
    text-align: center;
    background: var(--bg-solid, #0d221a);
    border: 1px solid var(--border-card, rgba(16, 185, 129, 0.18));
    box-shadow: 0 30px 80px -24px rgba(0, 0, 0, 0.65);
    transform: translateY(16px) scale(0.94);
    opacity: 0;
    transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.22s ease;
  }
  .medapp-ui-root.open .medapp-ui-card { transform: translateY(0) scale(1); opacity: 1; }

  .medapp-ui-icon {
    width: 62px;
    height: 62px;
    margin: 0 auto 14px;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: color-mix(in srgb, var(--medapp-ui-tone, var(--medapp-blue, #60a5fa)) 16%, transparent);
    border: 1px solid color-mix(in srgb, var(--medapp-ui-tone, var(--medapp-blue, #60a5fa)) 38%, transparent);
    color: var(--medapp-ui-tone, var(--medapp-blue, #60a5fa));
  }
  .medapp-ui-icon i { width: 28px; height: 28px; }

  .medapp-ui-title {
    font-size: 1.06rem;
    font-weight: 900;
    color: var(--text-primary, #f0fdf4);
    line-height: 1.5;
  }
  .medapp-ui-message {
    margin-top: 8px;
    font-size: 0.84rem;
    font-weight: 600;
    line-height: 1.8;
    color: var(--text-secondary, #94a3b8);
  }
  .medapp-ui-actions {
    margin-top: 20px;
    display: flex;
    gap: 10px;
  }
  .medapp-ui-input {
    width: 100%;
    margin-top: 18px;
    padding: 13px 15px;
    border-radius: 13px;
    border: 1.5px solid var(--border-card, rgba(16, 185, 129, 0.18));
    background: var(--bg-elevated, #102a22);
    color: var(--text-primary, #f0fdf4);
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 700;
    text-align: center;
    outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
    -webkit-user-select: text;
    user-select: text;
  }
  .medapp-ui-input:focus {
    border-color: var(--accent-emerald, #10b981);
    box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.15);
  }
  .medapp-ui-input.shake { animation: medappShake 0.4s ease; }
  @keyframes medappShake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  .medapp-ui-btn {
    flex: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 12px 16px;
    border-radius: 13px;
    border: 1px solid var(--border-card, rgba(16, 185, 129, 0.18));
    background: var(--bg-elevated, #102a22);
    color: var(--text-primary, #f0fdf4);
    font-family: inherit;
    font-size: 0.84rem;
    font-weight: 800;
    cursor: pointer;
    transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
  }
  .medapp-ui-btn:hover { transform: translateY(-2px); }
  .medapp-ui-btn:active { transform: translateY(0) scale(0.98); }
  .medapp-ui-btn.primary {
    border: none;
    background: linear-gradient(135deg, var(--accent-emerald, #10b981), var(--accent-dark, #059669));
    color: #fff;
    box-shadow: 0 10px 26px -14px rgba(16, 185, 129, 0.8);
  }
  .medapp-ui-btn.danger {
    border: none;
    background: linear-gradient(135deg, #ef4444, #b91c1c);
    color: #fff;
    box-shadow: 0 10px 26px -14px rgba(239, 68, 68, 0.8);
  }
  .medapp-ui-btn.ghost { background: transparent; color: var(--text-secondary, #94a3b8); }

  /* ============================================================
     ⭐⭐⭐ TASK 1 — RESTORED FROM GIT (v3.6.0 · commit 82efe58)
     ------------------------------------------------------------
     نافذة "سجّل الدخول" (وضع الزائر) — مشتركة بين كل الصفحات.
     كانت قواعدها محذوفة أيضاً؛ بقيت أزرارها بلا حاوية فظهرت
     كنصّ عائم أسفل الشاشة يبتلع النقرات.
     ════════════════════════════════════════════════════════════ */
  .auth-required-overlay {
    position: fixed;
    inset: 0;
    background: rgba(3, 10, 8, 0.9);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    z-index: var(--z-overlay, 20000);
    opacity: 0;
    pointer-events: none;
    transition: opacity var(--transition-smooth);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  [data-theme="light"] .auth-required-overlay { background: rgba(248, 250, 251, 0.9); }

  .auth-required-overlay.active { opacity: 1; pointer-events: auto; }

  .auth-required-card {
    background: var(--bg-solid);
    border: 1px solid var(--border-card-hover);
    border-radius: 24px;
    padding: 28px 24px;
    max-width: 380px;
    width: 100%;
    text-align: center;
    transform: translateY(20px) scale(0.96);
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 0 0 40px var(--accent-glow);
  }

  [data-theme="light"] .auth-required-card {
    box-shadow:
      0 20px 60px rgba(15, 23, 42, 0.16),
      0 0 40px var(--accent-glow);
  }

  .auth-required-overlay.active .auth-required-card { transform: translateY(0) scale(1); }

  .auth-required-icon {
    width: 72px;
    height: 72px;
    border-radius: 22px;
    background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(5, 150, 105, 0.15));
    border: 1px solid var(--accent-emerald);
    color: var(--accent-light);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 18px;
    box-shadow: 0 8px 24px var(--accent-glow);
    position: relative;
  }

  .auth-required-icon::after {
    content: '';
    position: absolute;
    inset: -4px;
    border-radius: 26px;
    border: 1px solid rgba(16, 185, 129, 0.25);
    animation: medappAuthPulse 2.5s ease-in-out infinite;
  }

  @keyframes medappAuthPulse {
    0%, 100% { opacity: 0.55; transform: scale(1); }
    50%      { opacity: 0.15; transform: scale(1.04); }
  }

  .auth-required-title {
    font-size: 1.2rem;
    font-weight: 900;
    color: var(--text-primary);
    margin-bottom: 10px;
  }

  .auth-required-message {
    font-size: 0.85rem;
    color: var(--text-secondary);
    line-height: 1.7;
    margin-bottom: 22px;
  }

  .auth-required-actions {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .auth-required-btn {
    padding: 13px 20px;
    border-radius: 14px;
    font-family: inherit;
    font-size: 0.9rem;
    font-weight: 800;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    text-decoration: none;
    transition: all var(--transition-fast);
    border: 1px solid transparent;
  }

  .auth-required-btn i { width: 16px; height: 16px; }

  .auth-required-btn.primary {
    background: linear-gradient(135deg, var(--accent-emerald), var(--accent-dark));
    color: white;
    box-shadow: 0 8px 20px var(--accent-glow);
  }

  .auth-required-btn.primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 28px var(--accent-glow-strong);
  }

  .auth-required-btn.secondary {
    background: rgba(128, 128, 128, 0.08);
    border-color: var(--border-card);
    color: var(--text-secondary);
  }

  .auth-required-btn.secondary:hover {
    background: rgba(128, 128, 128, 0.15);
    border-color: var(--border-card-hover);
    color: var(--text-primary);
  }

  /* ============================================================
     ⭐⭐⭐ TASK 4 — النوافذ والطبقات: لا عنصر شبح يبتلع النقرات
     ------------------------------------------------------------
     • كل نافذة مُغلقة: display:none + pointer-events:none.
     • كل نافذة مفتوحة: display:flex + pointer-events:auto.
     • حركة دخول ناعمة تعوّض اختفاء الـ transition عند display:none.
     ════════════════════════════════════════════════════════════ */
  /* ⭐ ملاحظة: بعض الصفحات تفتح النافذة بـ .active وأخرى بـ .open —
     لذلك نعتبر أيّاً منهما "مفتوحة" (وإلا لبقيت النافذة مخفية). */
  .streak-sheet-overlay:not(.open),
  .today-sheet-overlay:not(.open),
  .upload-sheet-overlay:not(.open),
  .modal-overlay:not(.open):not(.active),
  .modal-backdrop:not(.open):not(.active),
  .auth-required-overlay:not(.active),
  .search-modal-overlay:not(.active),
  .medapp-ui-root:not(.open),
  .medapp-update-overlay:not(.open) {
    display: none !important;
    pointer-events: none !important;
  }

  /* ⭐ نافذة البحث وورقة السلسلة ليستا flex في صفحتهما — نُعيدهما
     block كما صُمّمتا (حتى لا يتغيّر داخلهما). */
  .streak-sheet-overlay.open,
  .search-modal-overlay.active {
    display: block !important;
    pointer-events: auto !important;
  }

  .today-sheet-overlay.open,
  .upload-sheet-overlay.open,
  .modal-overlay.open,
  .modal-overlay.active,
  .modal-backdrop.open,
  .modal-backdrop.active,
  .auth-required-overlay.active,
  .medapp-ui-root.open,
  .medapp-update-overlay.open {
    display: flex !important;
    pointer-events: auto !important;
  }

  /* ⭐ كل نافذة في طبقتها الصحيحة (سلّم الـ z-index في :root) */
  .medapp-ui-root { z-index: var(--z-modal, 1000000); }
  .medapp-update-overlay { z-index: var(--z-update, 1000100); }
  .auth-required-overlay { z-index: var(--z-overlay, 20000); }

  /* ============================================================
     ⭐⭐⭐ TASK 2 — النوافذ فوق الشريط العلوي والشريط السفلي والزرّ "+"
     ------------------------------------------------------------
     كانت نوافذ "إضافة محتوى" و"قائمة المهام" (وكذلك .modal-overlay
     في الأهداف/الملاحظات/المعدّل/الإدارة) تستخدم z-index 3000–3600،
     أي **تحت** الشريط السفلي (9999) والزرّ العائم (9500)، فكانت
     تُرسم خلفهما. نافذة "سلسلة الأيام" وحدها كانت تعمل لأنها
     تستخدم 10000. نوحّد الجميع على طبقة واحدة عالية جداً فوق كل شيء.
     ============================================================ */
  .modal-overlay,
  .modal-backdrop,
  .bottom-sheet,
  .add-modal,
  .tasks-modal,
  .upload-sheet-overlay,
  .today-sheet-overlay,
  .streak-sheet-overlay,
  .search-modal-overlay,
  .auth-required-overlay {
    position: fixed !important;
    inset: 0 !important;
    z-index: 100000 !important;
  }

  /* ⭐ display:none ⟶ flex لا يُشغّل transition، فنتكفّل بحركة الدخول
     عبر animation حتى تبقى النوافذ أنيقة كما كانت. */
  @media (prefers-reduced-motion: no-preference) {
    .streak-sheet-overlay.open,
    .today-sheet-overlay.open,
    .upload-sheet-overlay.open,
    .modal-overlay.open,
    .modal-overlay.active,
    .modal-backdrop.open,
    .modal-backdrop.active,
    .auth-required-overlay.active { animation: medappOverlayIn 0.26s ease both; }

    .streak-sheet-overlay.open > *,
    .today-sheet-overlay.open > *,
    .upload-sheet-overlay.open > *,
    .modal-overlay.open > *,
    .modal-overlay.active > * { animation: medappSheetIn 0.34s cubic-bezier(0.16, 1, 0.3, 1) both; }

    .medapp-ui-root.open .medapp-ui-overlay { animation: medappOverlayIn 0.22s ease both; }
    .medapp-ui-root.open .medapp-ui-card { animation: medappCardIn 0.28s cubic-bezier(0.16, 1, 0.3, 1) both; }
    .medapp-update-overlay.open .medapp-update-card { animation: medappCardIn 0.34s cubic-bezier(0.16, 1, 0.3, 1) both; }
  }

  @keyframes medappOverlayIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  @keyframes medappSheetIn {
    from { transform: translateY(26px) scale(0.985); }
    to   { transform: translateY(0) scale(1); }
  }

  @keyframes medappCardIn {
    from { opacity: 0; transform: translateY(16px) scale(0.94); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* ============================================================
     ⭐⭐⭐ TASK 2 — لا يختفي المحتوى تحت الشريط العلوي/السفلي
     ------------------------------------------------------------
     نُزيح حاوية المحتوى نفسها (لا نعتمد على :has() الذي قد لا
     تدعمه بعض الـ WebViews فيبدو المحتوى مختفياً تحت الشريط).
     تُستثنى الواجهات بملء الشاشة (viewer) لأنها تدير هندستها.
     ⭐ v4.1.1 — مساحة تنفّس صريحة: ارتفاع الشريط + المنطقة الآمنة
     + 20px، حتى لا تبدأ أول بطاقة ملتصقة بالشريط عند التمرير.
     ════════════════════════════════════════════════════════════ */
  body > header ~ .container,
  body > header ~ main:not(.viewer),
  body > .ml-topbar ~ .container,
  body > .ml-topbar ~ main:not(.viewer),
  body > header ~ .app-content,
  body > .ml-topbar ~ .app-content,
  .app-content {
    box-sizing: border-box;
    min-height: 100vh;
    padding-top: calc(
      var(--header-height, 80px) +
      var(--safe-area-inset-top, env(safe-area-inset-top, 0px)) +
      20px
    ) !important;
  }

  /* ⭐ الإزاحة السفلية للشريط العائم — للصفحات التي تحمله فعلاً فقط
     (حتى لا نضيف فراغاً ميّتاً في بقية الصفحات).
     110px = ارتفاع الشريط + الزرّ العائم الذي يطفو فوقه. */
  body:has(.floating-nav-wrapper) > .container,
  body:has(.floating-nav-wrapper) > main,
  body:has(.floating-nav-wrapper) .app-content {
    padding-bottom: calc(110px + var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px))) !important;
  }

  /* الشريط العلوي الثابت يجب ألّا يغطّي المحتوى حتى لو غاب :has() */
  body > header,
  body > .ml-topbar {
    min-height: calc(var(--app-header-h) + var(--safe-area-inset-top, env(safe-area-inset-top, 0px)));
  }

  /* ⭐ واجهة العرض بملء الشاشة (viewer) ترويستها في التدفّق لا ثابتة */
  body > header.header {
    position: static;
    min-height: 0;
    padding: 0 12px !important;
    view-transition-name: none;
  }

  /* ============================================================
     ⭐⭐⭐ TASK 3 — الشريط السفلي العائم + زر "+" المتمركز
     ------------------------------------------------------------
     تخطيط Flexbox صارم: عناصر متساوية، تمركز عمودي، بلا التفاف.
     (الأصناف الفعلية في المشروع: .floating-nav + .nav-btn)
     ════════════════════════════════════════════════════════════ */
  .floating-nav-wrapper {
    position: fixed !important;
    bottom: 0 !important;
    left: 0;
    right: 0;
    display: flex !important;
    justify-content: center !important;
    align-items: flex-end !important;
    z-index: 9999;
    padding: 0 16px calc(12px + var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px))) !important;
    pointer-events: none;
  }

  .floating-nav {
    display: flex !important;
    justify-content: space-around !important;
    align-items: center !important;
    position: relative !important;
    overflow: visible !important;
    width: 100%;
    max-width: 460px;
    padding: 7px 6px !important;
  }

  /* ⭐ عناصر الشريط: أعمدة متساوية العرض وممركزة */
  .floating-nav > .nav-btn {
    flex: 1 1 0 !important;
    min-width: 0 !important;
    display: flex !important;
    flex-direction: column !important;
    align-items: center !important;
    justify-content: center !important;
    gap: 4px !important;
    text-align: center;
  }

  /* ⭐ TASK 5 (v4.1.2): خانة فارغة في المنتصف بحجم عنصر — فتصبح
     العناصر الخمسة (4 أيقونات + الزرّ "+") متساوية التوزيع، ويقترب
     "دراستي" و"ملفاتي" من المنتصف بدل تباعدهما عنه. */
  .floating-nav > .nav-fab-slot {
    flex: 1 1 0 !important;
    min-width: 0 !important;
    height: 1px;
    pointer-events: none;
  }

  /* ⭐⭐⭐ زر "+" العائم — متمركز أفقياً، ومنخفض قليلاً ليلامس الشريط
     (كان top:0 فيطفو نصفه الأعلى بعيداً عن الأيقونات؛ 14px يجعل
     تداخله مع الشريط طبيعياً كما في التطبيقات الأصلية). */
  .floating-nav .nav-btn-center,
  .floating-nav-wrapper .nav-btn-center {
    position: absolute !important;
    left: 50% !important;
    right: auto !important;
    top: 14px !important;
    bottom: auto !important;
    margin: 0 !important;
    transform: translate(-50%, -50%) !important;
    z-index: 9500;
  }

  .floating-nav .nav-btn-center:hover,
  .floating-nav-wrapper .nav-btn-center:hover {
    transform: translate(-50%, calc(-50% - 3px)) rotate(90deg) !important;
  }

  .floating-nav .nav-btn-center:active,
  .floating-nav-wrapper .nav-btn-center:active {
    transform: translate(-50%, calc(-50% - 1px)) scale(0.95) !important;
  }

  /* ⭐ أسماء بديلة (توافقاً مع وصف المهمة) — لا تستخدمها أي صفحة
     حالياً، لكن إن استُخدمت مستقبلاً فستحصل على التخطيط نفسه. */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0; height: 65px; z-index: 9000;
    background: var(--bg-card); border-top: 1px solid var(--border-color);
    display: flex !important;
    justify-content: space-around !important;
    align-items: center !important;
  }
  .bottom-nav-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }
  .fab-button {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 12px; z-index: 9500;
  }

  /* ============================================================
     Premium file visual — shared by every file surface.
     The helper `getFileIconMarkup()` in files.js supplies the
     colour tokens; page classes (mini-file-icon, file-icon,
     file-type-icon, …) keep their existing dimensions.
     ============================================================ */
  .premium-file-icon {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    border-radius: 12px;
    flex-shrink: 0;
    overflow: hidden;
    isolation: isolate;
    color: var(--pf-color, #94a3b8);
    background:
      linear-gradient(145deg, var(--pf-bg, rgba(148, 163, 184, 0.16)), rgba(255, 255, 255, 0.02)),
      var(--bg-card, #0a1a14);
    border: 1px solid var(--pf-border, rgba(148, 163, 184, 0.34));
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.34),
      0 6px 15px -9px var(--pf-glow, rgba(148, 163, 184, 0.24));
    transition: transform 0.24s ease, box-shadow 0.24s ease, border-color 0.24s ease;
  }

  .premium-file-icon::before {
    content: '';
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.32), transparent 46%);
    opacity: 0.85;
  }

  .premium-file-icon::after {
    content: '';
    position: absolute;
    top: -36%;
    right: -30%;
    width: 78%;
    height: 78%;
    z-index: 0;
    border-radius: 50%;
    pointer-events: none;
    background: var(--pf-glow, rgba(148, 163, 184, 0.24));
    filter: blur(9px);
  }

  .premium-file-icon > i {
    position: relative;
    z-index: 2;
    display: inline-block;
    line-height: 1;
    font-size: 1.14rem;
    transform: translateY(-2px);

<style>
:root {

<header>

<div class="header-sub" id="countLabel">جاري التحميل...</div>  </div>

</header>



<div class="container">

  <div class="search-wrapper">
    <input type="text" id="searchInput" class="search-input"
           placeholder="ابحث في جميع الملفات..."
           oninput="handleSearch(this.value)">
    <i class="fa-solid fa-magnifying-glass icon-right"></i>
    <span class="icon-left" id="searchClear" onclick="clearSearch()">
      <i class="fa-solid fa-xmark"></i>
    </span>
  </div>

  <div class="files-list" id="filesList">
    <div class="skeleton"></div>

      <i class="fa-solid fa-folder-open"></i>
    </div>
    <h3 id="emptyTitle">لا توجد ملفات</h3>
    <p id="emptyMessage">لم نجد أي ملفات.</p>
  </div>

</div>

<script src="supabase-config.js"></script>

<script>

/* ═══════════════════════════════════════════════════════
   الحالة
   ═══════════════════════════════════════════════════════ */
var allFiles = [];
var downloadedIds = new Set();
var currentSearch = '';

/* ═══════════════════════════════════════════════════════
   Toast
   ═══════════════════════════════════════════════════════ */
function showToast(message, type = 'success', title = null) {
  if (document.activeElement &&
      ['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) {
    document.activeElement.blur();
  }

  let container = document.querySelector('.toast-container');
  if (!container) {
    container = document.createElement('div');
    container.className = 'toast-container';
    document.body.appendChild(container);
  }

  const config = {
    success: { icon: 'fa-circle-check',       title: 'تم بنجاح' },
    error:   { icon: 'fa-circle-exclamation', title: 'خطأ' },
    info:    { icon: 'fa-circle-info',        title: 'معلومة' }
  };

  const cfg = config[type] || config.info;
  const displayTitle = title || cfg.title;

  const toast = document.createElement('div');
  toast.className = 'toast ' + type;
  toast.innerHTML = `
    <div class="toast-icon"><i class="fa-solid ${cfg.icon}"></i></div>
    <div class="toast-content">
      <div class="toast-title">${displayTitle}</div>
      <div class="toast-message">${message}</div>
    </div>
  `;
  container.appendChild(toast);

  setTimeout(() => {
    toast.style.transition = 'all 0.3s';
    toast.style.opacity = '0';
    toast.style.transform = 'translateY(-30px)';
    setTimeout(() => {
      toast.remove();
      if (container.children.length === 0) container.remove();
    }, 300);
  }, 3500);
}

/* ═══════════════════════════════════════════════════════
   أدوات
   ═══════════════════════════════════════════════════════ */
function hexToRgba(hex, alpha) {
  if (!hex || hex[0] !== '#') return `rgba(16, 185, 129, ${alpha})`;
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

/* ═══════════════════════════════════════════════════════
   تحميل كل الملفات
   ═══════════════════════════════════════════════════════ */
async function loadAllFiles() {
  try {
    // offline
    if (!navigator.onLine) {
      const cached = getDataCache('all_files');
      if (cached) {
        allFiles = cached;
      } else {
        showEmpty('لا يوجد اتصال', 'يجب الاتصال بالإنترنت لتحميل الملفات.');
        return;
      }
    } else {
      const { data, error } = await supabaseClient
        .from('files')
        .select(`*, subjects(name, slug, icon, color)`)
        .eq('is_published', true)
        .order('created_at', { ascending: false });

      if (error) throw error;
      allFiles = data || [];
      saveDataCache('all_files', allFiles);
    }

    // الملفات المحمّلة
    const downloaded = await getAllDownloadedFiles();
    downloadedIds = new Set(downloaded.map(f => f.id));

    // تحديث العدد
    document.getElementById('countLabel').textContent =
      allFiles.length === 0 ? 'لا توجد ملفات' :
      allFiles.length === 1 ? 'ملف واحد' :
      `${allFiles.length} ملف متاح`;

    renderFiles(allFiles);

  } catch (err) {
    console.error('loadAllFiles error:', err);

    // fallback من cache
    const cached = getDataCache('all_files');
    if (cached) {
      allFiles = cached;
      document.getElementById('countLabel').textContent = `${allFiles.length} ملف متاح`;
      renderFiles(allFiles);
      return;
    }

    showEmpty('تعذّر التحميل', 'حدث خطأ. حاول مرة أخرى.');
  }
}

/* ═══════════════════════════════════════════════════════
   رسم الملفات
   ═══════════════════════════════════════════════════════ */
function renderFiles(files) {
  const list = document.getElementById('filesList');
  const empty = document.getElementById('emptyState');

  list.innerHTML = '';

  if (files.length === 0) {
    empty.classList.add('visible');
    if (currentSearch) {
      document.getElementById('emptyTitle').textContent = 'لا توجد نتائج';
      document.getElementById('emptyMessage').textContent = 'لم نجد أي ملفات تطابق بحثك.';
    } else {
      document.getElementById('emptyTitle').textContent = 'لا توجد ملفات';
      document.getElementById('emptyMessage').textContent = 'لم يتم رفع أي ملفات بعد.';
    }
    return;
  }

  empty.classList.remove('visible');

  files.forEach((file, i) => {
    list.appendChild(createFileCard(file, i));
  });
}

/* ═══════════════════════════════════════════════════════
   بطاقة ملف
   ═══════════════════════════════════════════════════════ */
function createFileCard(file, index) {
  const catInfo = getCategoryInfo(file.category);
  const typeInfo = detectFileType(file);
  const isDownloaded = downloadedIds.has(file.id);
  const isExternal = file.source === 'link';

  const card = document.createElement('div');
  card.className = 'file-card';
  card.style.animationDelay = (index * 0.03) + 's';

  // شارة المصدر
  const sourceBadge = isExternal
    ? `<span class="source-badge"><i class="fa-solid fa-link"></i>${typeInfo.host || 'رابط'}</span>`
    : '';

  // شارة "محمّل"
  const downloadedBadge = (isDownloaded && !isExternal)
    ? `<span class="downloaded-badge"><i class="fa-solid fa-circle-check"></i>محمّل</span>`
    : '';

  // الحجم
  const sizeText = isExternal ? typeInfo.label : formatFileSize(file.file_size);

  card.innerHTML = `
    ${getFileIconMarkup(file, { className: 'file-icon' })}
    <div class="file-content">
      <div class="file-title">${file.title}</div>
      <div class="file-meta">
        ${file.subjects?.name ? `<span>${file.subjects.name}</span><span class="dot"></span>` : ''}
        <span>${sizeText}</span>
        <span class="dot"></span>
        <span>${catInfo.label}</span>
        ${sourceBadge}
        ${downloadedBadge}
      </div>
    </div>
    <i class="fa-solid fa-chevron-left file-arrow"></i>
  `;

  card.addEventListener('click', () => openFile(file));

  return card;
}

/* ═══════════════════════════════════════════════════════
   فتح ملف — ذكي
   ═══════════════════════════════════════════════════════ */
function openFile(file) {
  // زيادة العداد
  incrementFileViews(file.id).catch(() => {});

  // خارجي → تبويب جديد
  if (file.source === 'link') {
    const url = file.external_url || file.file_url;
    if (!url) {
      showToast('لا يوجد رابط لهذا الملف', 'error');
      return;
    }
    openExternal(url);
    return;
  }

  // PDF → viewer
  const typeInfo = detectFileType(file);
  if (typeInfo.viewer) {
    window.location.href = buildViewerUrl(file);
    return;
  }

  // أنواع أخرى → تبويب جديد
  if (file.file_url) {
    openExternal(file.file_url);
  }
}

/* ═══════════════════════════════════════════════════════
   البحث
   ═══════════════════════════════════════════════════════ */
function handleSearch(query) {
  currentSearch = query.toLowerCase().trim();
  document.getElementById('searchClear').classList.toggle('visible', currentSearch.length > 0);

  if (!currentSearch) {
    renderFiles(allFiles);
    return;
  }

  const filtered = allFiles.filter(f =>
    (f.title || '').toLowerCase().includes(currentSearch) ||
    (f.description || '').toLowerCase().includes(currentSearch) ||
    (f.subjects?.name || '').toLowerCase().includes(currentSearch)
  );

  renderFiles(filtered);
}

function clearSearch() {
  const input = document.getElementById('searchInput');
  input.value = '';
  currentSearch = '';
  document.getElementById('searchClear').classList.remove('visible');
  renderFiles(allFiles);
  input.focus();
}

/* ═══════════════════════════════════════════════════════
   حالة فارغة مخصصة
   ═══════════════════════════════════════════════════════ */
function showEmpty(title, message) {
  document.getElementById('filesList').innerHTML = '';
  const empty = document.getElementById('emptyState');
  empty.classList.add('visible');
  document.getElementById('emptyTitle').textContent = title;
  document.getElementById('emptyMessage').textContent = message;
  document.getElementById('countLabel').textContent = '—';
}

/* ═══════════════════════════════════════════════════════
   اختصارات لوحة المفاتيح
   ═══════════════════════════════════════════════════════ */
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
    e.preventDefault();
    document.getElementById('searchInput')?.focus();
  }
  if (e.key === 'Escape') {
    if (currentSearch) clearSearch();
    else location.href = 'index.html';
  }
});

<script data-shell>
if ('serviceWorker' in navigator) {
  // If an older worker controlled this page, refresh once when the new worker
  // takes over. This guarantees a stale (previous-deploy) page cannot linger.
  var hadController = !!navigator.serviceWorker.controller;
  var reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (!hadController || reloading) return;
    reloading = true;
    window.location.reload();
  });

  // ⭐⭐⭐ عامل خدمة جديد — نُعيد تحميل الصفحة فوراً حتى لا تخلط
  //    الصفحة الجديدة (HTML) مع JavaScript قديم
  navigator.serviceWorker.addEventListener('updatefound', function () {
    var reg = navigator.serviceWorker.controller;
    if (!reg) return;
    reg.addEventListener('statechange', function () {
      if (reg.state === 'installed' && navigator.serviceWorker.controller) {
        try { reg.update(); } catch (e) {}
        if (!reloading) { reloading = true; window.location.reload(); }
      }
    });
  });

  window.addEventListener('load', () => {
    // Force a fresh check so a previously cached (possibly outdated) worker
    // is replaced as soon as a new sw.js is deployed.
    navigator.serviceWorker.getRegistration().then(reg => {
      if (reg) { try { reg.update(); } catch (e) {} }
    }).catch(() => {});

    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
      .then(reg => {
        console.log('✅ SW registered:', reg.scope);
        try { reg.update(); } catch (e) {}
      })
      .catch(err => console.warn('⚠️ SW failed:', err));
  });
}
</script>

<script data-shell>
  (function () {
    try {
      if (!(window.CSS && CSS.supports && CSS.supports('view-transition-name', 'none'))) {
        document.documentElement.classList.add('no-vt');
      }
    } catch (e) {
      document.documentElement.classList.add('no-vt');
    }
  })();
