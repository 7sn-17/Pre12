<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#06110d">
  <title>جميع الملفات - المنصة الطبية</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
<!-- PWA Meta Tags -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="المنصة الطبية">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-512.png">
  <style>
    :root {
      --bg-main: #06110d;
      --bg-card: rgba(16, 34, 27, 0.7);
      --border-card: rgba(16, 185, 129, 0.18);
      --border-card-hover: rgba(16, 185, 129, 0.5);
      --accent-emerald: #10b981;
      --accent-light: #34d399;
      --accent-dark: #059669;
      --accent-glow: rgba(16, 185, 129, 0.25);
      --text-primary: #f0fdf4;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --transition-fast: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }

    body {
      background-color: var(--bg-main);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(16, 185, 129, 0.1) 0%, transparent 50%);
      background-attachment: fixed;
      color: var(--text-primary);
      min-height: 100vh;
      padding-bottom: 40px;
    }

    header {
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-card);
      backdrop-filter: blur(20px);
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(6, 17, 13, 0.85);
      gap: 12px;
    }

    .nav-btn {
      width: 42px; height: 42px;
      border-radius: 14px;
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      color: var(--text-primary);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      text-decoration: none;
      transition: all var(--transition-fast);
      flex-shrink: 0;
    }

    .nav-btn:hover { border-color: var(--accent-emerald); color: var(--accent-light); }

    .header-center { flex: 1; text-align: center; }

    .header-title { font-size: 1rem; font-weight: 800; }

    .header-sub { font-size: 0.72rem; color: var(--accent-light); font-weight: 600; margin-top: 2px; }

    .container { max-width: 780px; margin: 0 auto; padding: 18px; }

    .search-wrapper { position: relative; margin-bottom: 16px; }

    .search-input {
      width: 100%;
      padding: 13px 46px 13px 46px;
      border-radius: 16px;
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      color: var(--text-primary);
      font-size: 0.9rem;
      outline: none;
      font-family: inherit;
      transition: all var(--transition-fast);
    }

    .search-input::placeholder { color: var(--text-muted); }

    .search-input:focus {
      border-color: var(--accent-emerald);
      box-shadow: 0 0 0 4px var(--accent-glow);
    }

    .search-wrapper .icon-right {
      position: absolute;
      right: 15px; top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    .files-list { display: flex; flex-direction: column; gap: 10px; }

    .file-card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: all var(--transition-fast);
      animation: cardIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) backwards;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .file-card:hover {
      background: rgba(22, 48, 38, 0.9);
      border-color: var(--border-card-hover);
      transform: translateY(-2px);
    }

    .file-icon {
      width: 48px; height: 48px;
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    .file-icon i { width: 22px; height: 22px; }

    .file-content { flex: 1; min-width: 0; }

    .file-title {
      font-size: 0.9rem;
      font-weight: 700;
      margin-bottom: 4px;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .file-meta {
      font-size: 0.72rem;
      color: var(--text-muted);
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .file-meta .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--text-muted); }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .empty-state.visible { display: flex; }

    .empty-icon {
      width: 80px; height: 80px;
      border-radius: 24px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px dashed var(--border-card);
      display: flex; align-items: center; justify-content: center;
      color: var(--text-muted);
    }

    .empty-icon i { width: 36px; height: 36px; }

    .skeleton {
      height: 76px;
      border-radius: 16px;
      background: linear-gradient(90deg, rgba(255,255,255,0.04) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.04) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="nav-btn">
      <i data-lucide="arrow-right" style="width: 20px; height: 20px;"></i>
    </a>
    <div class="header-center">
      <div class="header-title">جميع الملفات</div>
      <div class="header-sub" id="countLabel">جاري التحميل...</div>
    </div>
    <div style="width: 42px;"></div>
  </header>

  <div class="container">
    <div class="search-wrapper">
      <input type="text" id="searchInput" class="search-input" placeholder="ابحث في جميع الملفات..." oninput="handleSearch(this.value)">
      <i data-lucide="search" class="icon-right" style="width: 18px; height: 18px;"></i>
    </div>

    <div class="files-list" id="filesList">
      <div class="skeleton"></div>
      <div class="skeleton"></div>
      <div class="skeleton"></div>
    </div>

    <div class="empty-state" id="emptyState">
      <div class="empty-icon"><i data-lucide="file-x"></i></div>
      <h3>لا توجد ملفات</h3>
      <p>لم نجد أي ملفات تطابق بحثك.</p>
    </div>
  </div>

  <script src="supabase-config.js"></script>
  <script src="db.js"></script>
  <script src="files.js"></script>

  <script>
    lucide.createIcons();
    let allFiles = [];
    let downloadedIds = new Set();

    async function loadAllFiles() {
      try {
        const { data, error } = await supabaseClient
          .from('files')
          .select(`*, subjects(name, slug, icon, color)`)
          .eq('is_published', true)
          .order('created_at', { ascending: false });
        
        if (error) throw error;
        allFiles = data || [];
        
        // حالات التحميل
        const downloaded = await getAllDownloadedFiles();
        downloadedIds = new Set(downloaded.map(f => f.id));
        
        document.getElementById('countLabel').textContent = `${allFiles.length} ملف متاح`;
        
        renderFiles(allFiles);
      } catch (err) {
        console.error(err);
      }
    }

    function renderFiles(files) {
      const list = document.getElementById('filesList');
      const empty = document.getElementById('emptyState');
      
      list.innerHTML = '';
      
      if (files.length === 0) {
        empty.classList.add('visible');
        return;
      }
      
      empty.classList.remove('visible');
      
      files.forEach((file, i) => {
        const catInfo = getCategoryInfo(file.category);
        const iconBg = hexToRgba(catInfo.color, 0.15);
        const iconBorder = hexToRgba(catInfo.color, 0.35);
        const isDownloaded = downloadedIds.has(file.id);
        
        const card = document.createElement('div');
        card.className = 'file-card';
        card.style.animationDelay = (i * 0.03) + 's';
        card.onclick = () => {
          window.location.href = buildViewerUrl(file);
        };
        
        card.innerHTML = `
          <div class="file-icon" style="background: ${iconBg}; border: 1px solid ${iconBorder}; color: ${catInfo.color};">
            <i data-lucide="${catInfo.icon}"></i>
          </div>
          <div class="file-content">
            <div class="file-title">${file.title}</div>
            <div class="file-meta">
              <span>${file.subjects?.name || ''}</span>
              <span class="dot"></span>
              <span>${formatFileSize(file.file_size)}</span>
              <span class="dot"></span>
              <span>${catInfo.label}</span>
              ${isDownloaded ? '<span class="dot"></span><span style="color: var(--accent-light);">محمّل</span>' : ''}
            </div>
          </div>
          <i data-lucide="chevron-left" style="width: 18px; height: 18px; color: var(--text-muted);"></i>
        `;
        
        list.appendChild(card);
      });
      
      lucide.createIcons();
    }

    function handleSearch(query) {
      const q = query.toLowerCase().trim();
      if (!q) {
        renderFiles(allFiles);
        return;
      }
      const filtered = allFiles.filter(f => 
        f.title.toLowerCase().includes(q) ||
        (f.description && f.description.toLowerCase().includes(q)) ||
        (f.subjects?.name && f.subjects.name.toLowerCase().includes(q))
      );
      renderFiles(filtered);
    }

    function hexToRgba(hex, alpha) {
      if (!hex || hex[0] !== '#') return `rgba(16, 185, 129, ${alpha})`;
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    loadAllFiles();
  </script>
<!-- PWA Service Worker -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js')
        .then(reg => {
          console.log('✅ SW registered:', reg.scope);
          
          // تحديث تلقائي عند وجود نسخة جديدة
          reg.addEventListener('updatefound', () => {
            const newWorker = reg.installing;
            if (newWorker) {
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  console.log('🔄 New version available');
                }
              });
            }
          });
        })
        .catch(err => console.warn('⚠️ SW failed:', err));
    });
  }
</script>
</body>
</html>
