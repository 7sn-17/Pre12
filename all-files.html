<!-- Smooth page transitions (View Transitions API + fallback fade).
     The fixed bottom navigation gets its own view-transition-name and is
     frozen, so it can never move or fade while the page content changes. -->
<style data-shell>
  /* Global theme defaults. `data-theme` is always set by theme-init.js
     (light or dark), so native controls and scrollbars follow the app. */
  :root { color-scheme: light; --medapp-amber: #fbbf24; --medapp-orange: #fb923c; --medapp-blue: #93c5fd; --medapp-blue-soft: #bfdbfe; --medapp-violet: #c4b5fd; --medapp-green: #34d399; --medapp-red: #f87171; --medapp-pink: #f472b6; }
  [data-theme="dark"] { color-scheme: dark; }
  [data-theme="light"] { --medapp-amber: #b45309; --medapp-orange: #c2410c; --medapp-blue: #2563eb; --medapp-blue-soft: #1d4ed8; --medapp-violet: #6d28d9; --medapp-green: #047857; --medapp-red: #b91c1c; --medapp-pink: #be185d; }

  /* Premium smooth scrolling. The SPA router temporarily disables this for
     page swaps / Back restoration so navigation is instant, never animated. */
  html { scroll-behavior: smooth; }
  /* app.js sets this only for instant SPA swaps / Back restoration. */
  html.medapp-scroll-jump { scroll-behavior: auto !important; }

  html.medapp-navigating { cursor: progress; }

  /* ⭐IMPORTANT: the `hidden` attribute must always win.
     Author rules like `.detail-empty { display: flex }` beat the user-agent
     `[hidden] { display: none }` rule, which made "empty" blocks stay on
     screen on top of real content. */
  [hidden] { display: none !important; }

  /* ⭐ Tap targets: 44px minimum, no double-tap zoom, no grey flash. */
  button,
  a[role="button"],
  [role="button"] {
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }

  /* ⭐ انتقال ناعم بين الوضعين النهاري والليلي.
     يُفعَّل هذا الصنف لحظياً قبل تبديل الثيم (MedApp.withThemeTransition)
     فيتحوّل لون الخلفية والنص والحدود تدريجياً بدل القفز المفاجئ. */
  html.theme-transition,
  html.theme-transition body,
  html.theme-transition *,
  html.theme-transition *::before,
  html.theme-transition *::after {
    transition:
      background-color 0.34s ease,
      color 0.34s ease,
      border-color 0.34s ease,
      fill 0.34s ease,
      stroke 0.34s ease,
      box-shadow 0.34s ease !important;
    transition-delay: 0s !important;
  }

  /* Very thin top progress bar, shown by app.js during SPA navigation. */
  #medapp-loader {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    z-index: 2147483647;
    pointer-events: none;
    overflow: hidden;
    opacity: 0;
    transition: opacity 0.15s ease;
  }

  #medapp-loader::before {
    content: '';
    display: block;
    width: 40%;
    height: 100%;
    border-radius: 0 999px 999px 0;
    background: linear-gradient(90deg, transparent, #059669 18%, #10b981 52%, #34d399 82%, transparent);
    box-shadow: 0 0 8px rgba(16, 185, 129, 0.6);
    transform: translateX(-110%);
    will-change: transform;
  }

  html.medapp-loading #medapp-loader { opacity: 1; }
  html.medapp-loading #medapp-loader::before {
    animation: medapp-loader-slide 1.05s cubic-bezier(0.4, 0, 0.2, 1) infinite;
  }

  @keyframes medapp-loader-slide {
    0%   { transform: translateX(-110%); }
    100% { transform: translateX(360%); }
  }

  /* Only same-document transitions (started by app.js). Cross-document
     @view-transition is intentionally NOT enabled: full loads must behave
     exactly like the original pages. */

  .floating-nav-wrapper { view-transition-name: medapp-bottom-nav; }
  ::view-transition-group(medapp-bottom-nav) { animation: none; }
  ::view-transition-old(medapp-bottom-nav),
  ::view-transition-new(medapp-bottom-nav) { animation: none; }

  /* Keep the sticky header out of the root cross-fade. Otherwise the old and
     new snapshots of a translucent, blurred header overlap and look frozen /
     show a ghost shadow while the page changes. */
  header { view-transition-name: medapp-header; }
  ::view-transition-group(medapp-header) { animation: none; }
  ::view-transition-old(medapp-header),
  ::view-transition-new(medapp-header) { animation: none; }

  /* Light mode: the header must use a soft neutral shadow, never the heavy
     black shadow used by the dark theme. */
  [data-theme="light"] header {
    background: rgba(248, 250, 251, 0.92);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    backdrop-filter: blur(20px) saturate(180%);
    border-bottom-color: rgba(15, 23, 42, 0.08);
    box-shadow: 0 1px 0 rgba(15, 23, 42, 0.04);
    color: var(--text-primary);
  }

  /* Wins over every page-level `header.scrolled` (higher specificity). */
  [data-theme="light"] header.scrolled {
    background: rgba(248, 250, 251, 0.97);
    border-bottom-color: rgba(15, 23, 42, 0.1);
    box-shadow:
      0 4px 18px rgba(15, 23, 42, 0.08),
      0 1px 0 rgba(15, 23, 42, 0.05);
  }

  @media (prefers-reduced-motion: no-preference) {
    ::view-transition-old(root) { animation: pt-fade-out 0.14s cubic-bezier(0.4, 0, 0.2, 1) both; }
    ::view-transition-new(root) { animation: pt-fade-in 0.2s cubic-bezier(0.4, 0, 0.2, 1) both; }
  }

  /* No body animation on browsers without View Transitions: the swap is
     already synchronous, and fading the body element would also fade the
     fixed bottom navigation. The nav must never move or fade. */

  @keyframes pt-fade-in  { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pt-fade-out { from { opacity: 1; } to { opacity: 0; } }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto !important; }
    html.theme-transition,
    html.theme-transition body,
    html.theme-transition *,
    html.theme-transition *::before,
    html.theme-transition *::after {
      transition: none !important;
    }
    #medapp-loader::before {
      animation: none !important;
      transform: none;
      width: 60%;
    }
    ::view-transition-old(root), ::view-transition-new(root),
    ::view-transition-old(medapp-bottom-nav), ::view-transition-new(medapp-bottom-nav),
    ::view-transition-old(medapp-header), ::view-transition-new(medapp-header) { animation: none !important; }
  }

  /* ============================================================
     ⭐ المنطقة الآمنة + الشريط العلوي الثابت (Phase 14)
     ------------------------------------------------------------
     • الشريط العلوي fixed ⇒ لا يختفي تحت شريط الحالة عند السحب
       (الـ rubber-band كان يُظهره خلف الشريط).
     • جسم الصفحة يحمل padding-top بمقدار ارتفاع الشريط حتى
       لا يختفي المحتوى تحته.
     • overscroll-behavior: لا اهتزاز عند السحب إلى ما بعد الحواف.
     ============================================================ */
  :root {
    /* ⭐⭐ سلّم الـ z-index — كل الطبقات في مكانها (Phase 27)
       ------------------------------------------------------------
       1        عناصر داخل الصفحة
       100      عناصر لاصقة
       9999     الشريط العلوي
       10000+   الأوراق السفلية (السلسلة · مهام اليوم …)
       20000    الطبقات شبه الشفافة (البحث · نافذة الدخول)
       1000000  نوافذ ui.js
       1000100  نافذة التحديث
       2147483647  التنبيهات (toast) — الأعلى دائماً */
    --z-header: 9999;
    --z-sheet: 10000;
    --z-overlay: 20000;
    --z-modal: 1000000;
    --z-update: 1000100;
    --z-toast: 2147483647;

    --safe-area-inset-top: env(safe-area-inset-top, 0px);
    --safe-area-inset-bottom: env(safe-area-inset-bottom, 0px);
    --safe-area-inset-left: env(safe-area-inset-left, 0px);
    --safe-area-inset-right: env(safe-area-inset-right, 0px);

    /* ⭐⭐ رموز احتياطية — الصفحات التي تعرّف رموزها الخاصة تتجاوزها،
       والصفحات التي لا تعرّفها تحصل على قيم سليمة.
       بدونها كان زر "تسجيل الدخول" بلا خلفية (لأن --accent-emerald
       غير معرّف) فيظهر النص الأبيض على خلفية شفافة = نص غير مرئي. */
    --accent-emerald: #10b981;
    --accent-light: #34d399;
    --accent-dark: #059669;
    --accent-glow: rgba(16, 185, 129, 0.25);
    --accent-glow-strong: rgba(16, 185, 129, 0.42);
    --bg-main: #06110d;
    --bg-card: rgba(16, 34, 27, 0.68);
    --bg-card-hover: rgba(22, 48, 38, 0.92);
    --bg-solid: #0d221a;
    --bg-elevated: #102a22;
    --border-card: rgba(16, 185, 129, 0.18);
    --border-card-hover: rgba(16, 185, 129, 0.46);
    --text-primary: #f0fdf4;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
    --transition-fast: 0.18s ease;
    --transition-smooth: 0.25s cubic-bezier(0.4, 0, 0.2, 1);

    --app-header-h: 72px;
    --app-header-pad-x: 20px;
  }

  [data-theme="light"] {
    --accent-emerald: #059669;
    --bg-main: #f8fafb;
    --bg-card: rgba(255, 255, 255, 0.9);
    --bg-card-hover: #ffffff;
    --bg-solid: #ffffff;
    --bg-elevated: #f1f5f9;
    --border-card: rgba(16, 185, 129, 0.24);
    --border-card-hover: rgba(16, 185, 129, 0.55);
    --text-primary: #0f172a;
    --text-secondary: #475569;
    --text-muted: #94a3b8;
  }

  @media (max-width: 480px) {
    :root {
      --app-header-h: 68px;
      --app-header-pad-x: 16px;
    }
  }

  html, body, main {
    overscroll-behavior-y: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }

  /* ⭐ لكن حقول الإدخال تبقى قابلة للتحديد والنسخ */
  input,
  textarea,
  select,
  [contenteditable="true"] {
    -webkit-user-select: text;
    user-select: text;
  }

  body {
    margin: 0;
    padding: 0;
  }

  /* ⭐ الشريط العلوي: ثابت في الأعلى، فوق كل شيء، ويحترم النوتش */
  body > header,
  body > .ml-topbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    width: 100%;
    z-index: 9999;
    box-sizing: border-box;
    min-height: calc(var(--app-header-h) + var(--safe-area-inset-top, env(safe-area-inset-top, 0px)));
    padding-top: var(--safe-area-inset-top, env(safe-area-inset-top, 0px)) !important;
    padding-bottom: 0 !important;
    padding-left: var(--app-header-pad-x) !important;
    padding-right: var(--app-header-pad-x) !important;
  }

  /* حالة "مُمرَّر" لا يجب أن تكسر الارتفاع ولا المنطقة الآمنة */
  body > header.scrolled,
  body > .ml-topbar {
    padding-top: var(--safe-area-inset-top, env(safe-area-inset-top, 0px)) !important;
  }

  /* ⭐ جسم الصفحة يتزحزح بمقدار الشريط حتى لا يختفي تحته */
  body:has(> header),
  body:has(> .ml-topbar) {
    padding-top: calc(var(--app-header-h) + var(--safe-area-inset-top, env(safe-area-inset-top, 0px)));
  }

  /* ⭐ حاويات التطبيق تحترم المنطقة الآمنة من الأسفل */
  body > main,
  body > .container,
  .app-container {
    padding-bottom: var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));
  }

  /* ============================================================
     ⭐⭐⭐ نافذة التحديث داخل التطبيق (In-App Update)
     ------------------------------------------------------------
     تصميم أخضر فاخر يعرض الإصدار الجديد وملاحظات الإصدار.
     ============================================================ */
  .medapp-update-overlay {
    position: fixed;
    inset: 0;
    z-index: var(--z-update, 1000100);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 22px;
    background: rgba(2, 10, 7, 0.78);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    opacity: 0;
    transition: opacity 0.25s ease;
  }
  .medapp-update-overlay.open { opacity: 1; }

  .medapp-update-card {
    width: 100%;
    max-width: 430px;
    max-height: 86vh;
    overflow-y: auto;
    padding: 26px 22px 20px;
    border-radius: 26px;
    text-align: center;
    background: linear-gradient(160deg, #0e2b21 0%, #08170f 100%);
    border: 1px solid rgba(16, 185, 129, 0.4);
    box-shadow: 0 30px 90px -24px rgba(0, 0, 0, 0.8), 0 0 60px -20px rgba(16, 185, 129, 0.35);
    transform: translateY(18px) scale(0.95);
    transition: transform 0.32s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .medapp-update-overlay.open .medapp-update-card { transform: translateY(0) scale(1); }

  .medapp-update-badge {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 6px 14px;
    border-radius: 999px;
    background: rgba(16, 185, 129, 0.16);
    border: 1px solid rgba(16, 185, 129, 0.38);
    color: #34d399;
    font-size: 0.7rem;
    font-weight: 800;
    margin-bottom: 14px;
  }
  .medapp-update-icon {
    width: 66px;
    height: 66px;
    margin: 0 auto 12px;
    border-radius: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, rgba(16, 185, 129, 0.24), rgba(5, 150, 105, 0.12));
    border: 1px solid rgba(16, 185, 129, 0.4);
    color: #34d399;
    box-shadow: 0 0 34px -8px rgba(16, 185, 129, 0.55);
  }
  .medapp-update-icon i { width: 30px; height: 30px; }
  .medapp-update-title {
    font-size: 1.2rem;
    font-weight: 900;
    color: #f0fdf4;
    line-height: 1.5;
  }
  .medapp-update-version {
    display: inline-block;
    margin-top: 8px;
    padding: 5px 14px;
    border-radius: 10px;
    background: rgba(16, 185, 129, 0.14);
    color: #34d399;
    font-size: 0.92rem;
    font-weight: 900;
    direction: ltr;
  }
  .medapp-update-notes {
    margin-top: 16px;
    padding: 14px;
    border-radius: 16px;
    background: rgba(0, 0, 0, 0.25);
    border: 1px solid rgba(16, 185, 129, 0.16);
    color: #cbd5e1;
    font-size: 0.78rem;
    font-weight: 600;
    line-height: 1.85;
    text-align: right;
    max-height: 220px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .medapp-update-progress {
    margin-top: 14px;
    display: none;
  }
  .medapp-update-progress.visible { display: block; }
  .medapp-update-bar {
    height: 7px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.08);
    overflow: hidden;
  }
  .medapp-update-bar span {
    display: block;
    height: 100%;
    width: 0%;
    border-radius: 999px;
    background: linear-gradient(90deg, #10b981, #34d399);
    transition: width 0.25s ease;
  }
  .medapp-update-status {
    margin-top: 8px;
    font-size: 0.74rem;
    font-weight: 700;
    color: #94a3b8;
  }
  .medapp-update-link {
    margin-top: 12px;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 8px 14px;
    border-radius: 10px;
    border: 1px solid rgba(16, 185, 129, 0.28);
    background: transparent;
    color: #34d399;
    font-family: inherit;
    font-size: 0.76rem;
    font-weight: 800;
    cursor: pointer;
    transition: background 0.2s ease;
  }
  .medapp-update-link:hover { background: rgba(16, 185, 129, 0.1); }

  .medapp-update-actions {
    margin-top: 20px;
    display: flex;
    gap: 10px;
  }
  .medapp-update-btn {
    flex: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 13px 16px;
    border-radius: 14px;
    border: 1px solid rgba(16, 185, 129, 0.3);
    background: transparent;
    color: #94a3b8;
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 800;
    cursor: pointer;
    transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
  }
  .medapp-update-btn.primary {
    border: none;
    background: linear-gradient(135deg, #10b981, #059669);
    color: #fff;
    box-shadow: 0 12px 30px -14px rgba(16, 185, 129, 0.9);
  }
  .medapp-update-btn:hover { transform: translateY(-2px); }
  .medapp-update-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

  /* ============================================================
     ⭐⭐ النوافذ المنبثقة المخصّصة (Custom Alerts / Modals)
     ------------------------------------------------------------
     تحلّ محل alert() و confirm() الأصليين في أندرويد.
     ════════════════════════════════════════════════════════════ */
  .medapp-ui-root {
    position: fixed;
    inset: 0;
    z-index: var(--z-modal, 1000000);
    pointer-events: none;
  }
  .medapp-ui-root.open { pointer-events: auto; }

  .medapp-ui-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 22px;
    background: rgba(3, 10, 8, 0.68);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    opacity: 0;
    transition: opacity 0.22s ease;
  }
  [data-theme="light"] .medapp-ui-overlay { background: rgba(15, 23, 42, 0.42); }
  .medapp-ui-root.open .medapp-ui-overlay { opacity: 1; }

  .medapp-ui-card {
    width: 100%;
    max-width: 400px;
    padding: 26px 22px 20px;
    border-radius: 24px;
    text-align: center;
    background: var(--bg-solid, #0d221a);
    border: 1px solid var(--border-card, rgba(16, 185, 129, 0.18));
    box-shadow: 0 30px 80px -24px rgba(0, 0, 0, 0.65);
    transform: translateY(16px) scale(0.94);
    opacity: 0;
    transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.22s ease;
  }
  .medapp-ui-root.open .medapp-ui-card { transform: translateY(0) scale(1); opacity: 1; }

  .medapp-ui-icon {
    width: 62px;
    height: 62px;
    margin: 0 auto 14px;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: color-mix(in srgb, var(--medapp-ui-tone, var(--medapp-blue, #60a5fa)) 16%, transparent);
    border: 1px solid color-mix(in srgb, var(--medapp-ui-tone, var(--medapp-blue, #60a5fa)) 38%, transparent);
    color: var(--medapp-ui-tone, var(--medapp-blue, #60a5fa));
  }
  .medapp-ui-icon i { width: 28px; height: 28px; }

  .medapp-ui-title {
    font-size: 1.06rem;
    font-weight: 900;
    color: var(--text-primary, #f0fdf4);
    line-height: 1.5;
  }
  .medapp-ui-message {
    margin-top: 8px;
    font-size: 0.84rem;
    font-weight: 600;
    line-height: 1.8;
    color: var(--text-secondary, #94a3b8);
  }
  .medapp-ui-actions {
    margin-top: 20px;
    display: flex;
    gap: 10px;
  }
  .medapp-ui-input {
    width: 100%;
    margin-top: 18px;
    padding: 13px 15px;
    border-radius: 13px;
    border: 1.5px solid var(--border-card, rgba(16, 185, 129, 0.18));
    background: var(--bg-elevated, #102a22);
    color: var(--text-primary, #f0fdf4);
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 700;
    text-align: center;
    outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
    -webkit-user-select: text;
    user-select: text;
  }
  .medapp-ui-input:focus {
    border-color: var(--accent-emerald, #10b981);
    box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.15);
  }
  .medapp-ui-input.shake { animation: medappShake 0.4s ease; }

  background: rgba(16, 185, 129, 0.1);
  border: 1px dashed var(--border-card);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  font-size: 2rem;
}

.empty-state h3 {
  font-size: 1rem;
  font-weight: 700;
  color: var(--text-primary);
}

.empty-state p {
  font-size: 0.82rem;
  color: var(--text-secondary);
  max-width: 300px;
  line-height: 1.6;
}

/* ═══ Skeleton ═══ */
.skeleton {
  height: 76px;
  border-radius: 16px;
  background: linear-gradient(90deg, rgba(255,255,255,0.04) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.04) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.5s infinite;
}

[data-theme="light"] .skeleton {
  background: linear-gradient(90deg, rgba(0,0,0,0.04) 25%, rgba(0,0,0,0.08) 50%, rgba(0,0,0,0.04) 75%);
  background-size: 200% 100%;
}

@keyframes shimmer {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

/* ═══ Toast ═══ */
.toast-container {
  position: fixed;
  top: 80px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  gap: 8px;
  width: calc(100% - 24px);
  max-width: 400px;
  pointer-events: none;
  z-index: 2147483647;
}

.toast {
  background: linear-gradient(145deg, rgba(14, 34, 24, 0.98), rgba(6, 18, 12, 0.98));
  backdrop-filter: blur(15px);
  border-radius: 14px;
  padding: 12px 15px;
  display: flex;
  align-items: center;
  gap: 11px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
  color: #fff;
  opacity: 0;
  transform: translateY(-30px);
  animation: toastIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  border-right: 4px solid #10b981;
  pointer-events: auto;
  z-index: 2147483647;
}

@keyframes toastIn { to { opacity: 1; transform: translateY(0); } }

.toast.error { border-right-color: #ef4444; }
.toast.info { border-right-color: #3b82f6; }

.toast-icon {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: linear-gradient(145deg, #10b981, #059669);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  font-size: 0.9rem;
}

.toast.error .toast-icon { background: linear-gradient(145deg, #ff6b5b, #b8332a); }
.toast.info .toast-icon { background: linear-gradient(145deg, #5dade2, #21618c); }

.toast-content { flex: 1; min-width: 0; }
.toast-title { font-weight: 800; font-size: 0.85rem; }
.toast-message { font-size: 0.75rem; color: #b0c8b0; margin-top: 1px; }

/* ═══ استجابة ═══ */
@media (max-width: 640px) {
  header { padding: 12px 14px; }
  .container { padding: 14px; }
  .file-icon { width: 44px; height: 44px; font-size: 1.15rem; }
  .file-title { font-size: 0.86rem; }
}
</style>
</head>
<body>

<header>
  <a href="index.html" class="nav-btn">
    <i class="fa-solid fa-arrow-right"></i>
  </a>
  <div class="header-center">
  <div class="header-title">جميع الملفات</div>
<div class="header-sub" id="countLabel">جاري التحميل...</div>  </div>
  <div style="width: 42px;"></div>
</header>



<div class="container">

  <div class="search-wrapper">
    <input type="text" id="searchInput" class="search-input"
           placeholder="ابحث في جميع الملفات..."
           oninput="handleSearch(this.value)">
    <i class="fa-solid fa-magnifying-glass icon-right"></i>
    <span class="icon-left" id="searchClear" onclick="clearSearch()">
      <i class="fa-solid fa-xmark"></i>
    </span>
  </div>

  <div class="files-list" id="filesList">
    <div class="skeleton"></div>
    <div class="skeleton"></div>
    <div class="skeleton"></div>
    <div class="skeleton"></div>
  </div>

  <div class="empty-state" id="emptyState">
    <div class="empty-icon">
      <i class="fa-solid fa-folder-open"></i>
    </div>
    <h3 id="emptyTitle">لا توجد ملفات</h3>
    <p id="emptyMessage">لم نجد أي ملفات.</p>
  </div>

</div>

<!-- ⭐ نافذة "سجّل الدخول" (وضع الزائر) -->
<div class="auth-required-overlay" id="authRequiredModal" onclick="closeAuthPrompt()">
  <div class="auth-required-card" onclick="event.stopPropagation()">
    <div class="auth-required-icon" style="background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(37, 99, 235, 0.15)); border-color: #3b82f6; color: var(--medapp-blue);">
      <i data-lucide="lock" style="width: 32px; height: 32px;"></i>
    </div>
    <div class="auth-required-title">سجّل الدخول للمتابعة</div>
    <div class="auth-required-message" data-auth-message>
      يمكنك التصفح والقراءة بلا حساب — لكن نحتاج تسجيل الدخول لحفظ المفضّلة، أو تحميل الملفات للقراءة دون إنترنت.
    </div>

    <div class="auth-required-actions">
      <a href="login.html" class="auth-required-btn primary">
        <i data-lucide="log-in" style="width: 16px; height: 16px;"></i>
        تسجيل الدخول
      </a>
      <button type="button" class="auth-required-btn secondary" onclick="closeAuthPrompt()">متابعة التصفح</button>
    </div>
  </div>
</div>

<script src="supabase-config.js"></script>
<script src="db.js"></script>
<script src="files.js"></script>
<script src="native.js"></script>
<script src="notifications.js"></script>


<script src="app.js?v=3.6.0"></script>
<script>

/* ═══════════════════════════════════════════════════════
   الحالة
   ═══════════════════════════════════════════════════════ */
var allFiles = [];
var downloadedIds = new Set();
var currentSearch = '';

/* ═══════════════════════════════════════════════════════
   Toast
   ═══════════════════════════════════════════════════════ */
function showToast(message, type = 'success', title = null) {
  if (document.activeElement &&
      ['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) {
    document.activeElement.blur();
  }

  let container = document.querySelector('.toast-container');
  if (!container) {
    container = document.createElement('div');
    container.className = 'toast-container';
    document.body.appendChild(container);
  }

  const config = {
    success: { icon: 'fa-circle-check',       title: 'تم بنجاح' },
    error:   { icon: 'fa-circle-exclamation', title: 'خطأ' },
    info:    { icon: 'fa-circle-info',        title: 'معلومة' }
  };

  const cfg = config[type] || config.info;
  const displayTitle = title || cfg.title;

  const toast = document.createElement('div');
  toast.className = 'toast ' + type;
  toast.innerHTML = `
    <div class="toast-icon"><i class="fa-solid ${cfg.icon}"></i></div>
    <div class="toast-content">
      <div class="toast-title">${displayTitle}</div>
      <div class="toast-message">${message}</div>
    </div>
  `;
  container.appendChild(toast);

  setTimeout(() => {
    toast.style.transition = 'all 0.3s';
    toast.style.opacity = '0';
    toast.style.transform = 'translateY(-30px)';
    setTimeout(() => {
      toast.remove();
      if (container.children.length === 0) container.remove();
    }, 300);
  }, 3500);
}

/* ═══════════════════════════════════════════════════════
   أدوات
   ═══════════════════════════════════════════════════════ */
function hexToRgba(hex, alpha) {
  if (!hex || hex[0] !== '#') return `rgba(16, 185, 129, ${alpha})`;
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

/* ═══════════════════════════════════════════════════════
   تحميل كل الملفات
   ═══════════════════════════════════════════════════════ */
async function loadAllFiles() {
  try {
    // offline
    if (!navigator.onLine) {
      const cached = getDataCache('all_files');
      if (cached) {
        allFiles = cached;
      } else {
        showEmpty('لا يوجد اتصال', 'يجب الاتصال بالإنترنت لتحميل الملفات.');
        return;
      }
    } else {
      const { data, error } = await supabaseClient
        .from('files')
        .select(`*, subjects(name, slug, icon, color)`)
        .eq('is_published', true)
        .order('created_at', { ascending: false });

      if (error) throw error;
      allFiles = data || [];
      saveDataCache('all_files', allFiles);
    }

    // الملفات المحمّلة
    const downloaded = await getAllDownloadedFiles();
    downloadedIds = new Set(downloaded.map(f => f.id));

    // تحديث العدد
    document.getElementById('countLabel').textContent =
      allFiles.length === 0 ? 'لا توجد ملفات' :
      allFiles.length === 1 ? 'ملف واحد' :
      `${allFiles.length} ملف متاح`;

    renderFiles(allFiles);

  } catch (err) {
    console.error('loadAllFiles error:', err);

    // fallback من cache
    const cached = getDataCache('all_files');
    if (cached) {
      allFiles = cached;
      document.getElementById('countLabel').textContent = `${allFiles.length} ملف متاح`;
      renderFiles(allFiles);
      return;
    }

    showEmpty('تعذّر التحميل', 'حدث خطأ. حاول مرة أخرى.');
  }
}

/* ═══════════════════════════════════════════════════════
   رسم الملفات
   ═══════════════════════════════════════════════════════ */
function renderFiles(files) {
  const list = document.getElementById('filesList');
  const empty = document.getElementById('emptyState');

  list.innerHTML = '';

  if (files.length === 0) {
    empty.classList.add('visible');
    if (currentSearch) {
      document.getElementById('emptyTitle').textContent = 'لا توجد نتائج';
      document.getElementById('emptyMessage').textContent = 'لم نجد أي ملفات تطابق بحثك.';
    } else {
      document.getElementById('emptyTitle').textContent = 'لا توجد ملفات';
      document.getElementById('emptyMessage').textContent = 'لم يتم رفع أي ملفات بعد.';
    }
    return;
  }

  empty.classList.remove('visible');

  files.forEach((file, i) => {
    list.appendChild(createFileCard(file, i));
  });
}

/* ═══════════════════════════════════════════════════════
   بطاقة ملف
   ═══════════════════════════════════════════════════════ */
function createFileCard(file, index) {
  const catInfo = getCategoryInfo(file.category);
  const typeInfo = detectFileType(file);
  const isDownloaded = downloadedIds.has(file.id);
  const isExternal = file.source === 'link';

  const card = document.createElement('div');
  card.className = 'file-card';
  card.style.animationDelay = (index * 0.03) + 's';

  // شارة المصدر
  const sourceBadge = isExternal
    ? `<span class="source-badge"><i class="fa-solid fa-link"></i>${typeInfo.host || 'رابط'}</span>`
    : '';

  // شارة "محمّل"
  const downloadedBadge = (isDownloaded && !isExternal)
    ? `<span class="downloaded-badge"><i class="fa-solid fa-circle-check"></i>محمّل</span>`
    : '';

  // الحجم
  const sizeText = isExternal ? typeInfo.label : formatFileSize(file.file_size);

  card.innerHTML = `
    ${getFileIconMarkup(file, { className: 'file-icon' })}
    <div class="file-content">
      <div class="file-title">${file.title}</div>
      <div class="file-meta">
        ${file.subjects?.name ? `<span>${file.subjects.name}</span><span class="dot"></span>` : ''}
        <span>${sizeText}</span>
        <span class="dot"></span>
        <span>${catInfo.label}</span>
        ${sourceBadge}
        ${downloadedBadge}
      </div>
    </div>
    <i class="fa-solid fa-chevron-left file-arrow"></i>
  `;

  card.addEventListener('click', () => openFile(file));

  return card;
}

/* ═══════════════════════════════════════════════════════
   فتح ملف — ذكي
   ═══════════════════════════════════════════════════════ */
function openFile(file) {
  // زيادة العداد
  incrementFileViews(file.id).catch(() => {});

  // خارجي → تبويب جديد
  if (file.source === 'link') {
    const url = file.external_url || file.file_url;
    if (!url) {
      showToast('لا يوجد رابط لهذا الملف', 'error');
      return;
    }
    openExternal(url);
    return;
  }

  // PDF → viewer
  const typeInfo = detectFileType(file);
  if (typeInfo.viewer) {
    window.location.href = buildViewerUrl(file);
    return;
  }

  // أنواع أخرى → تبويب جديد
  if (file.file_url) {
    openExternal(file.file_url);
  }
}

/* ═══════════════════════════════════════════════════════
   البحث
   ═══════════════════════════════════════════════════════ */
function handleSearch(query) {
  currentSearch = query.toLowerCase().trim();
  document.getElementById('searchClear').classList.toggle('visible', currentSearch.length > 0);

  if (!currentSearch) {
    renderFiles(allFiles);
    return;
  }

  const filtered = allFiles.filter(f =>
    (f.title || '').toLowerCase().includes(currentSearch) ||
    (f.description || '').toLowerCase().includes(currentSearch) ||
    (f.subjects?.name || '').toLowerCase().includes(currentSearch)
  );

  renderFiles(filtered);
}

function clearSearch() {
  const input = document.getElementById('searchInput');
  input.value = '';
  currentSearch = '';
  document.getElementById('searchClear').classList.remove('visible');
  renderFiles(allFiles);
  input.focus();
}

/* ═══════════════════════════════════════════════════════
   حالة فارغة مخصصة
   ═══════════════════════════════════════════════════════ */
function showEmpty(title, message) {
  document.getElementById('filesList').innerHTML = '';
  const empty = document.getElementById('emptyState');
  empty.classList.add('visible');
  document.getElementById('emptyTitle').textContent = title;
  document.getElementById('emptyMessage').textContent = message;
  document.getElementById('countLabel').textContent = '—';
}

/* ═══════════════════════════════════════════════════════
   اختصارات لوحة المفاتيح
   ═══════════════════════════════════════════════════════ */
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
    e.preventDefault();
    document.getElementById('searchInput')?.focus();
  }
  if (e.key === 'Escape') {
    if (currentSearch) clearSearch();
    else location.href = 'index.html';
  }
});

/* ═══════════════════════════════════════════════════════
   التشغيل
   ═══════════════════════════════════════════════════════ */
loadAllFiles();


</script>

<script data-shell>
if ('serviceWorker' in navigator) {
  // If an older worker controlled this page, refresh once when the new worker
  // takes over. This guarantees a stale (previous-deploy) page cannot linger.
  var hadController = !!navigator.serviceWorker.controller;
  var reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (!hadController || reloading) return;
    reloading = true;
    window.location.reload();
  });

  window.addEventListener('load', () => {
    // Force a fresh check so a previously cached (possibly outdated) worker
    // is replaced as soon as a new sw.js is deployed.
    navigator.serviceWorker.getRegistration().then(reg => {
      if (reg) { try { reg.update(); } catch (e) {} }
    }).catch(() => {});

    navigator.serviceWorker.register('sw.js')
      .then(reg => {
        console.log('✅ SW registered:', reg.scope);
        try { reg.update(); } catch (e) {}
      })
      .catch(err => console.warn('⚠️ SW failed:', err));
  });
}
</script>


<!-- ============================================
     Shell feature flag: browsers without the View Transitions API.
     app.js picks the fallback animation itself; this class is exposed
     for page CSS that may want to opt out of motion.
     ============================================ -->
<script data-shell>
  (function () {
    try {
      if (!(window.CSS && CSS.supports && CSS.supports('view-transition-name', 'none'))) {
        document.documentElement.classList.add('no-vt');
      }
    } catch (e) {
      document.documentElement.classList.add('no-vt');
    }
  })();
</script>
