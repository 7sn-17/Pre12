<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#06110d">
<title>جميع الملفات — المنصة الطبية</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="theme-init.js"></script>

<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-512.png">

<style>
:root {
  --bg-main: #06110d;
  --bg-card: rgba(16, 34, 27, 0.7);
  --bg-card-hover: rgba(22, 48, 38, 0.9);
  --bg-elevated: #0a1a14;
  --border-card: rgba(16, 185, 129, 0.18);
  --border-card-hover: rgba(16, 185, 129, 0.5);
  --accent-emerald: #10b981;
  --accent-light: #34d399;
  --accent-dark: #059669;
  --accent-glow: rgba(16, 185, 129, 0.25);
  --text-primary: #f0fdf4;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;
  --danger: #ef4444;
  --t: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}

[data-theme="light"] {
  --bg-main: #f8fafb;
  --bg-card: rgba(255, 255, 255, 0.9);
  --bg-card-hover: rgba(255, 255, 255, 0.98);
  --bg-elevated: #f1f5f9;
  --border-card: rgba(16, 185, 129, 0.25);
  --border-card-hover: rgba(16, 185, 129, 0.6);
  --accent-emerald: #059669;
  --accent-light: #10b981;
  --text-primary: #0f172a;
  --text-secondary: #475569;
  --text-muted: #94a3b8;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Cairo', sans-serif;
  -webkit-tap-highlight-color: transparent;
}

body {
  background-color: var(--bg-main);
  color: var(--text-primary);
  min-height: 100vh;
  padding-bottom: 40px;
  transition: background 0.3s;
}

[data-theme="light"] body {
  background-image:
    radial-gradient(circle at 10% 10%, rgba(16, 185, 129, 0.06) 0%, transparent 40%),
    radial-gradient(circle at 90% 80%, rgba(5, 150, 105, 0.04) 0%, transparent 40%);
  background-attachment: fixed;
}

/* ═══ الهيدر ═══ */
header {
  padding: 14px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border-card);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(6, 17, 13, 0.85);
  gap: 10px;
}

[data-theme="light"] header { background: rgba(248, 250, 251, 0.92); }

.nav-btn {
  width: 42px;
  height: 42px;
  border-radius: 13px;
  background: var(--bg-card);
  border: 1px solid var(--border-card);
  color: var(--text-primary);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  text-decoration: none;
  transition: all var(--t);
  flex-shrink: 0;
  font-size: 1rem;
}

.nav-btn:hover {
  border-color: var(--accent-emerald);
  color: var(--accent-light);
}

.header-center {
  flex: 1;
  text-align: center;
  min-width: 0;
}

.header-title {
  font-size: 1rem;
  font-weight: 800;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.header-sub {
  font-size: 0.72rem;
  color: var(--accent-light);
  font-weight: 700;
  margin-top: 2px;
}

/* ═══ الحاوية ═══ */
.container {
  max-width: 780px;
  margin: 0 auto;
  padding: 16px;
}

/* ═══ البحث ═══ */
.search-wrapper {
  position: relative;
  margin-bottom: 14px;
}

.search-input {
  width: 100%;
  padding: 13px 46px 13px 46px;
  border-radius: 15px;
  background: var(--bg-card);
  border: 1px solid var(--border-card);
  color: var(--text-primary);
  font-size: 0.9rem;
  outline: none;
  font-family: inherit;
  transition: all var(--t);
  backdrop-filter: blur(10px);
}

.search-input::placeholder { color: var(--text-muted); }

.search-input:focus {
  border-color: var(--accent-emerald);
  box-shadow: 0 0 0 4px var(--accent-glow);
}

.search-wrapper .icon-right {
  position: absolute;
  right: 15px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  pointer-events: none;
  font-size: 0.95rem;
}

.search-wrapper .icon-left {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  cursor: pointer;
  display: none;
  padding: 6px;
  border-radius: 8px;
  font-size: 0.95rem;
}

.search-wrapper .icon-left:hover {
  color: var(--danger);
  background: rgba(239, 68, 68, 0.1);
}

.search-wrapper .icon-left.visible { display: flex; }

/* ═══ قائمة الملفات ═══ */
.files-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.file-card {
  background: var(--bg-card);
  border: 1px solid var(--border-card);
  border-radius: 16px;
  padding: 13px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  transition: all var(--t);
  animation: cardIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) backwards;
  backdrop-filter: blur(10px);
}

@keyframes cardIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.file-card:hover {
  background: var(--bg-card-hover);
  border-color: var(--border-card-hover);
  transform: translateY(-2px);
}

.file-card:active {
  transform: translateY(0) scale(0.99);
}

/* أيقونة الملف */
.file-icon {
  width: 48px;
  height: 48px;
  border-radius: 13px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  font-size: 1.25rem;
}

/* محتوى الملف */
.file-content {
  flex: 1;
  min-width: 0;
}

.file-title {
  font-size: 0.9rem;
  font-weight: 700;
  margin-bottom: 4px;
  overflow: hidden;
  text-overflow: ellipsis;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  line-height: 1.35;
}

.file-meta {
  font-size: 0.7rem;
  color: var(--text-muted);
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
  align-items: center;
}

.file-meta .dot {
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: var(--text-muted);
}

.file-meta .source-badge {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 2px 6px;
  border-radius: 6px;
  background: rgba(59, 130, 246, 0.12);
  border: 1px solid rgba(59, 130, 246, 0.25);
  color: #93c5fd;
  font-size: 0.6rem;
  font-weight: 700;
}

[data-theme="light"] .file-meta .source-badge {
  background: rgba(59, 130, 246, 0.1);
  color: #2563eb;
}

.file-meta .downloaded-badge {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 2px 6px;
  border-radius: 6px;
  background: rgba(16, 185, 129, 0.15);
  border: 1px solid var(--accent-emerald);
  color: var(--accent-light);
  font-size: 0.6rem;
  font-weight: 700;
}

.file-arrow {
  color: var(--text-muted);
  font-size: 0.85rem;
  flex-shrink: 0;
  transition: all var(--t);
}

.file-card:hover .file-arrow {
  color: var(--accent-light);
  transform: translateX(-4px);
}

/* ═══ حالة فارغة ═══ */
.empty-state {
  text-align: center;
  padding: 60px 20px;
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}

.empty-state.visible { display: flex; }

.empty-icon {
  width: 80px;
  height: 80px;
  border-radius: 24px;
  background: rgba(16, 185, 129, 0.1);
  border: 1px dashed var(--border-card);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  font-size: 2rem;
}

.empty-state h3 {
  font-size: 1rem;
  font-weight: 700;
  color: var(--text-primary);
}

.empty-state p {
  font-size: 0.82rem;
  color: var(--text-secondary);
  max-width: 300px;
  line-height: 1.6;
}

/* ═══ Skeleton ═══ */
.skeleton {
  height: 76px;
  border-radius: 16px;
  background: linear-gradient(90deg, rgba(255,255,255,0.04) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.04) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.5s infinite;
}

[data-theme="light"] .skeleton {
  background: linear-gradient(90deg, rgba(0,0,0,0.04) 25%, rgba(0,0,0,0.08) 50%, rgba(0,0,0,0.04) 75%);
  background-size: 200% 100%;
}

@keyframes shimmer {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

/* ═══ Toast ═══ */
.toast-container {
  position: fixed;
  top: 80px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 9999;
  display: flex;
  flex-direction: column;
  gap: 8px;
  width: calc(100% - 24px);
  max-width: 400px;
  pointer-events: none;
}

.toast {
  background: linear-gradient(145deg, rgba(14, 34, 24, 0.98), rgba(6, 18, 12, 0.98));
  backdrop-filter: blur(15px);
  border-radius: 14px;
  padding: 12px 15px;
  display: flex;
  align-items: center;
  gap: 11px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
  color: #fff;
  opacity: 0;
  transform: translateY(-30px);
  animation: toastIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  border-right: 4px solid #10b981;
  pointer-events: auto;
}

@keyframes toastIn { to { opacity: 1; transform: translateY(0); } }

.toast.error { border-right-color: #ef4444; }
.toast.info { border-right-color: #3b82f6; }

.toast-icon {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: linear-gradient(145deg, #10b981, #059669);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  font-size: 0.9rem;
}

.toast.error .toast-icon { background: linear-gradient(145deg, #ff6b5b, #b8332a); }
.toast.info .toast-icon { background: linear-gradient(145deg, #5dade2, #21618c); }

.toast-content { flex: 1; min-width: 0; }
.toast-title { font-weight: 800; font-size: 0.85rem; }
.toast-message { font-size: 0.75rem; color: #b0c8b0; margin-top: 1px; }

/* ═══ استجابة ═══ */
@media (max-width: 640px) {
  header { padding: 12px 14px; }
  .container { padding: 14px; }
  .file-icon { width: 44px; height: 44px; font-size: 1.15rem; }
  .file-title { font-size: 0.86rem; }
}
</style>
</head>
<body>

<header>
  <a href="index.html" class="nav-btn">
    <i class="fa-solid fa-arrow-right"></i>
  </a>
  <div class="header-center">
    <div class="header-title">جميع الملفات</div>
    <div class="header-sub" id="countLabel">جاري التحميل...</div>
  </div>
  <div style="width: 42px;"></div>
</header>

<div class="container">

  <div class="search-wrapper">
    <input type="text" id="searchInput" class="search-input"
           placeholder="ابحث في جميع الملفات..."
           oninput="handleSearch(this.value)">
    <i class="fa-solid fa-magnifying-glass icon-right"></i>
    <span class="icon-left" id="searchClear" onclick="clearSearch()">
      <i class="fa-solid fa-xmark"></i>
    </span>
  </div>

  <div class="files-list" id="filesList">
    <div class="skeleton"></div>
    <div class="skeleton"></div>
    <div class="skeleton"></div>
    <div class="skeleton"></div>
  </div>

  <div class="empty-state" id="emptyState">
    <div class="empty-icon">
      <i class="fa-solid fa-folder-open"></i>
    </div>
    <h3 id="emptyTitle">لا توجد ملفات</h3>
    <p id="emptyMessage">لم نجد أي ملفات.</p>
  </div>

</div>

<script src="supabase-config.js"></script>
<script src="db.js"></script>
<script src="files.js"></script>

<script>
/* ═══════════════════════════════════════════════════════
   الحالة
   ═══════════════════════════════════════════════════════ */
let allFiles = [];
let downloadedIds = new Set();
let currentSearch = '';

/* ═══════════════════════════════════════════════════════
   Toast
   ═══════════════════════════════════════════════════════ */
function showToast(message, type = 'success', title = null) {
  if (document.activeElement &&
      ['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) {
    document.activeElement.blur();
  }

  let container = document.querySelector('.toast-container');
  if (!container) {
    container = document.createElement('div');
    container.className = 'toast-container';
    document.body.appendChild(container);
  }

  const config = {
    success: { icon: 'fa-circle-check',       title: 'تم بنجاح' },
    error:   { icon: 'fa-circle-exclamation', title: 'خطأ' },
    info:    { icon: 'fa-circle-info',        title: 'معلومة' }
  };

  const cfg = config[type] || config.info;
  const displayTitle = title || cfg.title;

  const toast = document.createElement('div');
  toast.className = 'toast ' + type;
  toast.innerHTML = `
    <div class="toast-icon"><i class="fa-solid ${cfg.icon}"></i></div>
    <div class="toast-content">
      <div class="toast-title">${displayTitle}</div>
      <div class="toast-message">${message}</div>
    </div>
  `;
  container.appendChild(toast);

  setTimeout(() => {
    toast.style.transition = 'all 0.3s';
    toast.style.opacity = '0';
    toast.style.transform = 'translateY(-30px)';
    setTimeout(() => {
      toast.remove();
      if (container.children.length === 0) container.remove();
    }, 300);
  }, 3500);
}

/* ═══════════════════════════════════════════════════════
   أدوات
   ═══════════════════════════════════════════════════════ */
function hexToRgba(hex, alpha) {
  if (!hex || hex[0] !== '#') return `rgba(16, 185, 129, ${alpha})`;
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

/* ═══════════════════════════════════════════════════════
   تحميل كل الملفات
   ═══════════════════════════════════════════════════════ */
async function loadAllFiles() {
  try {
    // offline
    if (!navigator.onLine) {
      const cached = getDataCache('all_files');
      if (cached) {
        allFiles = cached;
      } else {
        showEmpty('لا يوجد اتصال', 'يجب الاتصال بالإنترنت لتحميل الملفات.');
        return;
      }
    } else {
      const { data, error } = await supabaseClient
        .from('files')
        .select(`*, subjects(name, slug, icon, color)`)
        .eq('is_published', true)
        .order('created_at', { ascending: false });

      if (error) throw error;
      allFiles = data || [];
      saveDataCache('all_files', allFiles);
    }

    // الملفات المحمّلة
    const downloaded = await getAllDownloadedFiles();
    downloadedIds = new Set(downloaded.map(f => f.id));

    // تحديث العدد
    document.getElementById('countLabel').textContent =
      allFiles.length === 0 ? 'لا توجد ملفات' :
      allFiles.length === 1 ? 'ملف واحد' :
      `${allFiles.length} ملف متاح`;

    renderFiles(allFiles);

  } catch (err) {
    console.error('loadAllFiles error:', err);

    // fallback من cache
    const cached = getDataCache('all_files');
    if (cached) {
      allFiles = cached;
      document.getElementById('countLabel').textContent = `${allFiles.length} ملف متاح`;
      renderFiles(allFiles);
      return;
    }

    showEmpty('تعذّر التحميل', 'حدث خطأ. حاول مرة أخرى.');
  }
}

/* ═══════════════════════════════════════════════════════
   رسم الملفات
   ═══════════════════════════════════════════════════════ */
function renderFiles(files) {
  const list = document.getElementById('filesList');
  const empty = document.getElementById('emptyState');

  list.innerHTML = '';

  if (files.length === 0) {
    empty.classList.add('visible');
    if (currentSearch) {
      document.getElementById('emptyTitle').textContent = 'لا توجد نتائج';
      document.getElementById('emptyMessage').textContent = 'لم نجد أي ملفات تطابق بحثك.';
    } else {
      document.getElementById('emptyTitle').textContent = 'لا توجد ملفات';
      document.getElementById('emptyMessage').textContent = 'لم يتم رفع أي ملفات بعد.';
    }
    return;
  }

  empty.classList.remove('visible');

  files.forEach((file, i) => {
    list.appendChild(createFileCard(file, i));
  });
}

/* ═══════════════════════════════════════════════════════
   بطاقة ملف
   ═══════════════════════════════════════════════════════ */
function createFileCard(file, index) {
  const catInfo = getCategoryInfo(file.category);
  const typeInfo = detectFileType(file);
  const isDownloaded = downloadedIds.has(file.id);
  const isExternal = file.source === 'link';

  const card = document.createElement('div');
  card.className = 'file-card';
  card.style.animationDelay = (index * 0.03) + 's';

  const iconBg = hexToRgba(typeInfo.color, 0.15);
  const iconBorder = hexToRgba(typeInfo.color, 0.35);

  // شارة المصدر
  const sourceBadge = isExternal
    ? `<span class="source-badge"><i class="fa-solid fa-link"></i>${typeInfo.host || 'رابط'}</span>`
    : '';

  // شارة "محمّل"
  const downloadedBadge = (isDownloaded && !isExternal)
    ? `<span class="downloaded-badge"><i class="fa-solid fa-circle-check"></i>محمّل</span>`
    : '';

  // الحجم
  const sizeText = isExternal ? typeInfo.label : formatFileSize(file.file_size);

  card.innerHTML = `
    <div class="file-icon" style="background: ${iconBg}; border: 1px solid ${iconBorder}; color: ${typeInfo.color};">
      <i class="fa-solid ${typeInfo.icon}"></i>
    </div>
    <div class="file-content">
      <div class="file-title">${file.title}</div>
      <div class="file-meta">
        ${file.subjects?.name ? `<span>${file.subjects.name}</span><span class="dot"></span>` : ''}
        <span>${sizeText}</span>
        <span class="dot"></span>
        <span>${catInfo.label}</span>
        ${sourceBadge}
        ${downloadedBadge}
      </div>
    </div>
    <i class="fa-solid fa-chevron-left file-arrow"></i>
  `;

  card.addEventListener('click', () => openFile(file));

  return card;
}

/* ═══════════════════════════════════════════════════════
   فتح ملف — ذكي
   ═══════════════════════════════════════════════════════ */
function openFile(file) {
  // زيادة العداد
  incrementFileViews(file.id).catch(() => {});

  // خارجي → تبويب جديد
  if (file.source === 'link') {
    const url = file.external_url || file.file_url;
    if (!url) {
      showToast('لا يوجد رابط لهذا الملف', 'error');
      return;
    }
    window.open(url, '_blank', 'noopener,noreferrer');
    return;
  }

  // PDF → viewer
  const typeInfo = detectFileType(file);
  if (typeInfo.viewer) {
    window.location.href = buildViewerUrl(file);
    return;
  }

  // أنواع أخرى → تبويب جديد
  if (file.file_url) {
    window.open(file.file_url, '_blank', 'noopener,noreferrer');
  }
}

/* ═══════════════════════════════════════════════════════
   البحث
   ═══════════════════════════════════════════════════════ */
function handleSearch(query) {
  currentSearch = query.toLowerCase().trim();
  document.getElementById('searchClear').classList.toggle('visible', currentSearch.length > 0);

  if (!currentSearch) {
    renderFiles(allFiles);
    return;
  }

  const filtered = allFiles.filter(f =>
    (f.title || '').toLowerCase().includes(currentSearch) ||
    (f.description || '').toLowerCase().includes(currentSearch) ||
    (f.subjects?.name || '').toLowerCase().includes(currentSearch)
  );

  renderFiles(filtered);
}

function clearSearch() {
  const input = document.getElementById('searchInput');
  input.value = '';
  currentSearch = '';
  document.getElementById('searchClear').classList.remove('visible');
  renderFiles(allFiles);
  input.focus();
}

/* ═══════════════════════════════════════════════════════
   حالة فارغة مخصصة
   ═══════════════════════════════════════════════════════ */
function showEmpty(title, message) {
  document.getElementById('filesList').innerHTML = '';
  const empty = document.getElementById('emptyState');
  empty.classList.add('visible');
  document.getElementById('emptyTitle').textContent = title;
  document.getElementById('emptyMessage').textContent = message;
  document.getElementById('countLabel').textContent = '—';
}

/* ═══════════════════════════════════════════════════════
   اختصارات لوحة المفاتيح
   ═══════════════════════════════════════════════════════ */
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
    e.preventDefault();
