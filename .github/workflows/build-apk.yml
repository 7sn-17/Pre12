# self-heal: true
# =============================================================================
# بناء تطبيق Android (APK) — المنصة الطبية
# -----------------------------------------------------------------------------
# ✅ يبني التطبيق على كل push إلى main
# ✅ يرفع الـ APK كـ artifact
# ✅ ينشئ GitHub Release تلقائياً مع الـ APK
# ✅ النسخة **موقّعة** (Production) — المفتاح يأتي من GitHub Secrets
#
# المتطلبات (مضبوطة مسبقاً على runner ubuntu-latest):
#   • Node.js 22  ← الـ Capacitor 8 CLI يتطلب Node >= 22
#   • JDK 21      ← Capacitor 8 يستخدم sourceCompatibility = VERSION_21
#
# الأسرار المطلوبة (GitHub → Settings → Secrets):
#   • KEYSTORE_BASE64   ← محتوى release.keystore بترميز base64
#   • KEYSTORE_PASSWORD
#   • KEY_ALIAS
#   • KEY_PASSWORD
# =============================================================================
name: Build Android APK

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # لإنشاء الـ Release
  actions: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🧰 Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 📦 Install dependencies
        run: npm install

      - name: 🏗️ Build the web app
        run: npm run build

      - name: 🎨 Generate Android assets (icons + splash)
        run: node tools/generate-android-assets.js

      - name: 🔗 Sync Capacitor
        run: npx cap sync android

      - name: 🏛️ Make gradlew executable
        working-directory: android
        run: chmod +x gradlew

      - name: 🏷️ Read the app version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: 🔑 Decode the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing — cannot sign the release."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          echo "keystore decoded: $(stat -c %s android/app/release.keystore) bytes"

      - name: 📦 Build the signed release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: ✅ Verify the APK signature
        working-directory: android
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::The release APK was not produced."
            exit 1
          fi
          echo "APK size: $(stat -c %s "$APK") bytes"
          # jarsigner -verify يكشف إن كان الملف موقّعاً فعلاً
          if jarsigner -verify -verbose:summary "$APK" 2>/dev/null | grep -q "jar verified"; then
            echo "✅ The APK is signed."
          else
            echo "::warning::Could not confirm the signature (jarsigner output below):"
            jarsigner -verify "$APK" || true
          fi

      - name: 📤 Upload the APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: 🚀 Publish the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # ⭐ الـ Release يحتاج تاجاً — ننشئه من رقم الإصدار في package.json
          #    (وإن كان موجوداً، يُحدَّث الـ Release ويُستبدل الملف).
          tag_name: v${{ steps.version.outputs.version }}
          files: android/app/build/outputs/apk/release/app-release.apk
          name: المنصة الطبية — v${{ steps.version.outputs.version }}
          body: |
            ## 📱 المنصة الطبية — نسخة Android v${{ steps.version.outputs.version }}

            تطبيق أندرويد **موقّع** مبني من نفس كود الواجهة (WebView + Capacitor).

            | الملف | الوصف |
            |---|---|
            | `app-release.apk` | نسخة الإنتاج الموقّعة — قابلة للتثبيت والتحديث |

            **التثبيت على الهاتف:**
            1. نزّل `app-release.apk` إلى جهازك.
            2. افتحه من مدير الملفات.
            3. اسمح للتثبيت من هذا المصدر، ثم أكّد التثبيت.

            ---
            بُني تلقائياً عبر [GitHub Actions](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
          fail_on_unmatched_files: true
          draft: false
          make_latest: true
          prerelease: false
