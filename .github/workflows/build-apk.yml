# self-heal: true
# =============================================================================
# بناء تطبيق Android (APK) — المنصة الطبية
# -----------------------------------------------------------------------------
# ✅ يبني التطبيق على كل push إلى main
# ✅ يرفع الـ APK كـ artifact
# ✅ ينشئ GitHub Release تلقائياً مع الـ APK
# ✅ النسخة **موقّعة** (Production) — المفتاح يأتي من GitHub Secrets
#
# المتطلبات (مضبوطة مسبقاً على runner ubuntu-latest):
#   • Node.js 22  ← الـ Capacitor 8 CLI يتطلب Node >= 22
#   • JDK 21      ← Capacitor 8 يستخدم sourceCompatibility = VERSION_21
#
# الأسرار المطلوبة (GitHub → Settings → Secrets):
#   • KEYSTORE_BASE64   ← محتوى release.keystore بترميز base64
#   • KEYSTORE_PASSWORD
#   • KEY_ALIAS
#   • KEY_PASSWORD
# =============================================================================
name: Build Android APK

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # لإنشاء الـ Release
  actions: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🧰 Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 📦 Install dependencies
        run: npm install

      - name: 🏗️ Build the web app
        run: npm run build

      - name: 🔗 Sync Capacitor
        run: npx cap sync android

      - name: 🖼️ Verify the web assets
        # ⭐ نتأكّد أن أصول الويب الأساسية موجودة فعلاً داخل مجلد
        #    الأصول الذي سينتقل إلى الـ APK.
        run: |
          echo "── the main pages ──"
          ls android/app/src/main/assets/public/*.html
          echo "── the shared scripts ──"
          for f in app.js auth.js db.js files.js sync.js streak.js native.js notifications.js ui.js theme-init.js sw.js; do
            if [ ! -f "android/app/src/main/assets/public/$f" ]; then
              echo "::error::$f is missing from the android assets"
              exit 1
            fi
          done
          echo "── the launcher icons ──"
          ls android/app/src/main/res/mipmap-xxxhdpi/
          echo "── the size of the web assets ──"
          du -sh android/app/src/main/assets/public/
          echo "✅ the web assets are inside the build"

      - name: 🏛️ Make gradlew executable
        working-directory: android
        run: chmod +x gradlew

      - name: 🏷️ Read the app version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: 🔎 Inspect the signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "KEYSTORE_BASE64 length : ${#KEYSTORE_BASE64}"
          echo "KEYSTORE_PASSWORD len  : ${#KEYSTORE_PASSWORD}"
          echo "KEY_ALIAS length       : ${#KEY_ALIAS}"
          echo "KEY_PASSWORD length    : ${#KEY_PASSWORD}"

      - name: 🔑 Decode the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          # ⭐ printf وليس echo: echo يضيف سطراً جديداً إلى المخرجات،
          #    وهذا ما يُفسد بنية ملف التوقيع (ASN.1) فيحسبه keytool
          #    ملفاً مبتوراً (java.io.EOFException).
          printf "%s" "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore

          # ⭐ بديل احتياطي: لو كان الترميز base64 الآمن (URL-safe)
          #    (أي - و _ بدل + و /) فسيرفض keytool الملف — فنجرّب الشكل الآخر.
          if ! keytool -list -keystore android/app/release.keystore -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "::warning::The standard base64 form was rejected — trying the URL-safe form."
            printf "%s" "$KEYSTORE_BASE64" | tr -- '-_' '+/' | base64 -d > android/app/release.keystore.alt || true
            if keytool -list -keystore android/app/release.keystore.alt -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
              mv android/app/release.keystore.alt android/app/release.keystore
              echo "✅ the URL-safe form is the correct one."
            else
              rm -f android/app/release.keystore.alt
              echo "::error::The decoded file is not a valid keystore for alias '$KEY_ALIAS' — check KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS."
              exit 1
            fi
          fi

      - name: ✅ Verify the keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          ls -l android/app/release.keystore
          file android/app/release.keystore
          keytool -list -keystore android/app/release.keystore -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" | head -6

      - name: 🩹 Self-heal an unusable base64 secret
        # يعمل حتى لو فشلت خطوة الفك — يجرّب صيغ base64 الأخرى ثم
        # يتحقق من كل واحدة بمفتاح keytool.
        if: always()
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if keytool -list -keystore android/app/release.keystore -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "✅ the keystore is valid — nothing to repair."
            exit 0
          fi
          echo "::warning::the decoded keystore is invalid — trying alternative base64 forms."
          python3 - <<'PY'
          import base64, os, re, subprocess, sys
          raw = os.environ.get('KEYSTORE_BASE64', '')
          password = os.environ.get('KEYSTORE_PASSWORD', '')
          alias = os.environ.get('KEY_ALIAS', '')
          target = 'android/app/release.keystore'

          def forms(text):
              base = re.sub(r'[^A-Za-z0-9+/=_-]', '', text)
              out = []
              for variant in (base, base.replace('-', '+').replace('_', '/')):
                  stripped = variant.rstrip('=')
                  for pad in ('', '=', '=='):
                      out.append(stripped + pad)
              return out

          for index, candidate in enumerate(forms(raw)):
              try:
                  data = base64.b64decode(candidate, validate=False)
              except Exception:
                  continue
              if len(data) < 512:
                  continue
              path = target if index == 0 else target + '.alt'
              with open(path, 'wb') as handle:
                  handle.write(data)
              check = subprocess.run(
                  ['keytool', '-list', '-keystore', path, '-storepass', password, '-alias', alias],
                  stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              if check.returncode == 0:
                  if path != target:
                      os.replace(path, target)
                  print('✅ repaired: the keystore is valid (%d bytes).' % len(data))
                  sys.exit(0)
              if path != target and os.path.exists(path):
                  os.remove(path)
          print('::error::No usable keystore could be produced from KEYSTORE_BASE64 — the secret itself is incomplete.')
          sys.exit(1)
          PY

      - name: 📦 Build the signed release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: ✅ Verify the APK signature
        working-directory: android
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::The release APK was not produced."
            exit 1
          fi
          echo "APK size: $(stat -c %s "$APK") bytes"
          # ⭐ apksigner هو الأداة الرسمية — يدعم مخطّطي التوقيع v2/v3
          #    (بينما jarsigner يرى توقيع JAR v1 فقط فيقول "unsigned" خطأً).
          APKSIGNER=$(ls -1 "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/"*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -n "$APKSIGNER" ]; then
            echo "using $APKSIGNER"
            "$APKSIGNER" verify --verbose --print-certs "$APK" | head -25
            if "$APKSIGNER" verify "$APK"; then
              echo "✅ the APK signature is valid (verified with apksigner)."
            else
              echo "::error::apksigner rejected the APK signature."
              exit 1
            fi
          else
            echo "::warning::apksigner not found — falling back to jarsigner (v1 only)."
            jarsigner -verify -verbose:summary "$APK" | head -10 || true
          fi

      - name: 🧪 Inspect the APK structure
        # ⭐ قبل النشر: نثبت أن الـ APK سليم البنية (اسم الحزمة،
        #    النشاط الرئيسي، الأصول، ومكتبات المعماريات).
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          BUILD_TOOLS="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools"
          AAPT=$(ls -1 "$BUILD_TOOLS"/*/aapt 2>/dev/null | sort -V | tail -1)
          if [ -z "$AAPT" ]; then
            AAPT=$(ls -1 "$BUILD_TOOLS"/*/aapt2 2>/dev/null | sort -V | tail -1)
          fi

          if [ -n "$AAPT" ]; then
            echo "── aapt dump badging (using $AAPT) ──"
            "$AAPT" dump badging "$APK" | head -n 10
          else
            echo "::warning::aapt/aapt2 not found — skipping the badging dump"
          fi

          echo "── the web assets inside the APK ──"
          unzip -l "$APK" | grep "assets/public/" | head -n 15

          echo "── the shared scripts inside the APK ──"
          unzip -l "$APK" | grep -E "assets/public/(ui|app|auth|native)\.js"

          echo "── the native libraries inside the APK ──"
          unzip -l "$APK" | grep "lib/" | head -n 12

          echo "── the essentials ──"
          for entry in "assets/public/index.html" "assets/public/confirm.html" "assets/public/login.html" "assets/public/ui.js" "assets/public/app.js" "assets/public/auth.js" "assets/public/native.js" "assets/public/sw.js" "assets/public/icon-512.png" "classes.dex" "resources.arsc" "AndroidManifest.xml"; do
            if unzip -l "$APK" | grep -q "$entry"; then
              echo "   ✅ $entry"
            else
              echo "::error::$entry is missing from the APK"
              exit 1
            fi
          done
          echo "✅ the APK structure is complete"

      - name: 🏷️ Rename the APK for production
        # ⭐ الاسم النهائي للنشر: Medical_Platform_v<version>.apk
        run: |
          cd android/app/build/outputs/apk/release
          NEW_NAME="Medical_Platform_v${{ steps.version.outputs.version }}.apk"
          mv app-release.apk "$NEW_NAME"
          ls -l "$NEW_NAME"
          echo "::notice::the APK is published as $NEW_NAME"

      - name: 🔐 Publish the SHA-256 checksum
        # ⭐ lets the user verify their download (a truncated download
        #    is the usual cause of "there is a problem parsing the package").
        run: |
          cd android/app/build/outputs/apk/release
          NEW_NAME="Medical_Platform_v${{ steps.version.outputs.version }}.apk"
          sha256sum "$NEW_NAME" | tee "$NEW_NAME.sha256"
          echo "APK_SHA256=$(cut -d' ' -f1 "$NEW_NAME.sha256")" >> "$GITHUB_ENV"

      - name: 📤 Upload the APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/Medical_Platform_v${{ steps.version.outputs.version }}.apk
          if-no-files-found: error

      - name: 🚀 Publish the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # ⭐ الـ Release يحتاج تاجاً — ننشئه من رقم الإصدار في package.json
          #    (وإن كان موجوداً، يُحدَّث الـ Release ويُستبدل الملف).
          tag_name: v${{ steps.version.outputs.version }}
          files: |
            android/app/build/outputs/apk/release/Medical_Platform_v${{ steps.version.outputs.version }}.apk
            android/app/build/outputs/apk/release/Medical_Platform_v${{ steps.version.outputs.version }}.apk.sha256
          name: المنصة الطبية — v${{ steps.version.outputs.version }}
          # ⭐ جسم الإصدار يأتي من CHANGELOG.md (توثيق عربي أنيق)
          body_path: ./CHANGELOG.md
          fail_on_unmatched_files: true
          draft: false
          make_latest: true
          prerelease: false

      - name: 🌐 Verify the published asset
        # ⭐ نتأكّد أن الملف المنشور على GitHub مطابق تماماً للملف المبني.
        continue-on-error: true
        run: |
          sleep 15
          mkdir -p /tmp/verify && cd /tmp/verify
          gh release download "v${{ steps.version.outputs.version }}" --repo "${{ github.repository }}" --pattern "Medical_Platform_v*.apk" --dir . --clobber
          ACTUAL=$(sha256sum Medical_Platform_v*.apk | cut -d' ' -f1)
          echo "published : $ACTUAL"
          echo "expected  : ${{ env.APK_SHA256 }}"
          if [ "$ACTUAL" = "${{ env.APK_SHA256 }}" ]; then
            echo "✅ the published APK is intact."
          else
            echo "::warning::the published file does not match the build (a CDN cache issue?)"
          fi

