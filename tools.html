<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#06110d">
  <title>صندوق أدواتي - المنصة الطبية</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-512.png">
  <script src="theme-init.js"></script>

  <style>
    :root {
      --bg-main: #06110d;
      --bg-card: rgba(16, 34, 27, 0.65);
      --bg-card-hover: rgba(22, 48, 38, 0.9);
      --bg-solid: #0d221a;
      --bg-elevated: #102a22;
      --border-card: rgba(16, 185, 129, 0.18);
      --border-card-hover: rgba(16, 185, 129, 0.5);
      --accent-emerald: #10b981;
      --accent-light: #34d399;
      --accent-dark: #059669;
      --accent-glow: rgba(16, 185, 129, 0.25);
      --accent-glow-strong: rgba(16, 185, 129, 0.45);
      --text-primary: #f0fdf4;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --radius-md: 16px;
      --radius-lg: 20px;
      --radius-xl: 24px;
      --transition-fast: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-smooth: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    [data-theme="light"] {
      --bg-main: #f8fafb;
      --bg-card: rgba(255, 255, 255, 0.85);
      --bg-card-hover: rgba(255, 255, 255, 0.98);
      --bg-solid: #ffffff;
      --bg-elevated: #f1f5f9;
      --border-card: rgba(16, 185, 129, 0.25);
      --border-card-hover: rgba(16, 185, 129, 0.6);
      --accent-emerald: #059669;
      --accent-light: #10b981;
      --accent-dark: #047857;
      --accent-glow: rgba(16, 185, 129, 0.2);
      --accent-glow-strong: rgba(16, 185, 129, 0.35);
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
    html { scroll-behavior: smooth; }

    body {
      background-color: var(--bg-main);
      background-image: 
        radial-gradient(circle at 10% 10%, rgba(16, 185, 129, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(5, 150, 105, 0.06) 0%, transparent 40%);
      background-attachment: fixed;
      color: var(--text-primary);
      padding-bottom: 40px;
      min-height: 100vh;
      overflow-x: hidden;
      transition: background-color var(--transition-smooth), color var(--transition-smooth);
    }

    [data-theme="light"] body {
      background-image: 
        radial-gradient(circle at 10% 10%, rgba(16, 185, 129, 0.06) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(5, 150, 105, 0.04) 0%, transparent 40%);
    }

    /* ===== الهيدر ===== */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(6, 17, 13, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-card);
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    [data-theme="light"] header {
      background: rgba(248, 250, 251, 0.85);
    }

    .header-back-btn {
      width: 42px; height: 42px;
      border-radius: 12px;
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      color: var(--text-primary);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: all var(--transition-fast);
      text-decoration: none;
      flex-shrink: 0;
    }

    .header-back-btn:hover {
      background: var(--bg-card-hover);
      border-color: var(--accent-emerald);
      color: var(--accent-light);
      transform: translateY(-2px);
    }

    .header-title {
      font-size: 1.05rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--text-primary), var(--accent-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header-actions { display: flex; gap: 8px; }

    .icon-btn {
      width: 42px; height: 42px;
      border-radius: 12px;
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      color: var(--text-primary);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: all var(--transition-fast);
      font-family: inherit;
    }

    .icon-btn:hover {
      background: var(--bg-card-hover);
      border-color: var(--accent-emerald);
      color: var(--accent-light);
    }

    /* ===== الحاوية ===== */
    .container {
      padding: 20px;
      max-width: 720px;
      margin: 0 auto;
    }

    /* ===== Hero ===== */
    .tools-hero {
      padding: 24px 22px;
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.15), rgba(6, 17, 13, 0.4));
      border: 1px solid var(--border-card);
      border-radius: var(--radius-xl);
      margin-bottom: 22px;
      position: relative;
      overflow: hidden;
    }

    [data-theme="light"] .tools-hero {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.12), rgba(255, 255, 255, 0.7));
    }

    .tools-hero::before {
      content: '';
      position: absolute;
      top: -60%; right: -20%;
      width: 240px; height: 240px;
      background: radial-gradient(circle, var(--accent-glow-strong) 0%, transparent 70%);
      pointer-events: none;
      animation: rotateGlow 22s linear infinite;
    }

    @keyframes rotateGlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .tools-hero-top {
      display: flex;
      align-items: center;
      gap: 14px;
      position: relative;
      z-index: 1;
      margin-bottom: 18px;
    }

    .tools-hero-icon {
      width: 60px; height: 60px;
      border-radius: 18px;
      background: linear-gradient(135deg, var(--accent-emerald), var(--accent-dark));
      display: flex; align-items: center; justify-content: center;
      color: white;
      box-shadow: 0 10px 28px var(--accent-glow-strong);
      flex-shrink: 0;
      position: relative;
    }

    .tools-hero-icon::after {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 21px;
      border: 1px solid rgba(16, 185, 129, 0.35);
      animation: pulse 3s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.5; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.06); }
    }

    .tools-hero-icon i {
      font-size: 1.55rem;
      position: relative;
      z-index: 1;
    }

    .tools-hero-content { flex: 1; min-width: 0; }

    .tools-hero-title {
      font-size: 1.2rem;
      font-weight: 900;
      color: var(--text-primary);
      margin-bottom: 4px;
      line-height: 1.3;
    }

    .tools-hero-desc {
      font-size: 0.8rem;
      color: var(--text-secondary);
      font-weight: 600;
      line-height: 1.5;
    }

    .tools-hero-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      position: relative;
      z-index: 1;
      padding-top: 16px;
      border-top: 1px solid var(--border-card);
    }

    .hero-stat {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 8px 4px;
    }

    .hero-stat-value {
      font-size: 1.05rem;
      font-weight: 900;
      color: var(--accent-light);
      line-height: 1;
    }

    .hero-stat-label {
      font-size: 0.68rem;
      color: var(--text-muted);
      font-weight: 700;
    }

    /* ===== شبكة الأدوات ===== */
    .tools-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 22px;
    }

    .tool-grid-card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: var(--radius-lg);
      padding: 18px 12px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      cursor: pointer;
      transition: all var(--transition-smooth);
      backdrop-filter: blur(12px);
      animation: cardIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) backwards;
      position: relative;
      overflow: hidden;
      min-height: 175px;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(15px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .tool-grid-card::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.06), transparent);
      transition: left 0.7s ease;
      pointer-events: none;
    }

    [data-theme="light"] .tool-grid-card::before {
      background: linear-gradient(90deg, transparent, rgba(16, 185, 129, 0.08), transparent);
    }

    .tool-grid-card:hover::before { left: 100%; }

    .tool-grid-card::after {
      content: '';
      position: absolute;
      bottom: -50%;
      left: 50%;
      transform: translateX(-50%);
      width: 80%;
      height: 60%;
      background: radial-gradient(ellipse, var(--accent-glow) 0%, transparent 70%);
      opacity: 0;
      transition: opacity 0.4s ease;
      pointer-events: none;
    }

    .tool-grid-card:hover::after { opacity: 1; }

    .tool-grid-card:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-card-hover);
      transform: translateY(-5px);
      box-shadow: 0 16px 36px -8px rgba(0, 0, 0, 0.4), 0 0 28px var(--accent-glow);
    }

    .tool-grid-card:active {
      transform: translateY(-2px) scale(0.98);
    }

    .tool-grid-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      font-size: 0.6rem;
      font-weight: 900;
      padding: 3px 8px;
      border-radius: 7px;
      letter-spacing: 0.3px;
      z-index: 2;
      text-transform: uppercase;
    }

    .tool-grid-icon {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
      background: rgba(128, 128, 128, 0.08);
      border: 1px solid var(--border-card);
      transition: all var(--transition-smooth);
      margin-bottom: 12px;
      position: relative;
      z-index: 1;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    }

    .tool-grid-card:hover .tool-grid-icon {
      transform: scale(1.1) rotate(-3deg);
      box-shadow: 0 14px 28px rgba(0, 0, 0, 0.3);
    }

    .tool-grid-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 19px;
    }

    .tool-grid-icon i {
      font-size: 2rem;
      color: white;
    }

    .tool-grid-name {
      font-size: 0.88rem;
      font-weight: 800;
      color: var(--text-primary);
      line-height: 1.3;
      margin-bottom: 8px;
      position: relative;
      z-index: 1;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 2.3em;
    }

    .tool-grid-rating {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.7rem;
      font-weight: 800;
      color: var(--text-secondary);
      padding: 3px 9px;
      border-radius: 8px;
      background: rgba(128, 128, 128, 0.08);
      border: 1px solid var(--border-card);
      position: relative;
      z-index: 1;
    }

    .tool-grid-rating i {
      color: #fbbf24;
      font-size: 0.68rem;
    }

    /* ============================================ */
    /* بطاقة اقتراح أداة — محسّنة                    */
    /* ============================================ */
    .suggest-card {
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.15), rgba(16, 34, 27, 0.6));
      border: 1px solid rgba(139, 92, 246, 0.35);
      border-radius: var(--radius-xl);
      padding: 24px 22px;
      display: flex;
      align-items: center;
      gap: 16px;
      animation: cardIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.3s backwards;
      position: relative;
      overflow: hidden;
    }

    [data-theme="light"] .suggest-card {
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.12), rgba(255, 255, 255, 0.75));
    }

    .suggest-card::before {
      content: '';
      position: absolute;
      top: -60%; left: -20%;
      width: 200px; height: 200px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.35) 0%, transparent 70%);
      pointer-events: none;
      animation: rotateGlow 18s linear infinite;
    }

    .suggest-icon {
      width: 58px;
      height: 58px;
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.3), rgba(139, 92, 246, 0.15));
      border: 1px solid rgba(139, 92, 246, 0.45);
      color: #c4b5fd;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      position: relative;
      z-index: 1;
      box-shadow: 0 8px 20px rgba(139, 92, 246, 0.2);
    }

    .suggest-icon i { font-size: 1.5rem; }

    .suggest-content {
      flex: 1;
      min-width: 0;
      position: relative;
      z-index: 1;
    }

    .suggest-title {
      font-size: 1rem;
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 4px;
    }

    .suggest-desc {
      font-size: 0.78rem;
      color: var(--text-secondary);
      line-height: 1.5;
      font-weight: 600;
    }

    .suggest-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 11px 16px;
      border-radius: 13px;
      background: rgba(139, 92, 246, 0.2);
      border: 1px solid rgba(139, 92, 246, 0.5);
      color: #c4b5fd;
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 800;
      cursor: pointer;
      text-decoration: none;
      transition: all var(--transition-fast);
      position: relative;
      z-index: 1;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .suggest-btn:hover {
      background: rgba(139, 92, 246, 0.35);
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(139, 92, 246, 0.35);
      color: white;
    }

    /* ============================================ */
    /* Bottom Sheet Modal — v2.0 احترافي جداً      */
    /* ============================================ */
    .sheet-overlay {
      position: fixed;
      inset: 0;
      background: rgba(3, 10, 8, 0.78);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 3000;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--transition-smooth);
    }

    [data-theme="light"] .sheet-overlay {
      background: rgba(15, 23, 42, 0.55);
    }

    .sheet-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .sheet-modal {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--bg-solid);
      border-radius: 32px 32px 0 0;
      border-top: 1px solid var(--border-card-hover);
      z-index: 3001;
      transform: translateY(100%);
      transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
      max-height: 92vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 -20px 60px rgba(0, 0, 0, 0.5);
      max-width: 720px;
      margin: 0 auto;
      overflow: hidden;
    }

    .sheet-modal.active {
      transform: translateY(0);
    }

    /* شريط علوي متدرج */
    .sheet-accent-bar {
      height: 3px;
      background: linear-gradient(90deg, 
        transparent 0%, 
        var(--accent-emerald) 20%, 
        var(--accent-light) 50%, 
        var(--accent-emerald) 80%, 
        transparent 100%);
      flex-shrink: 0;
    }

    /* Drag Handle */
    .sheet-handle {
      width: 44px;
      height: 4px;
      border-radius: 2px;
      background: var(--border-card-hover);
      margin: 14px auto 0;
      flex-shrink: 0;
    }

    /* زر الإغلاق */
    .sheet-close {
      position: absolute;
      top: 20px;
      left: 20px;
      width: 36px;
      height: 36px;
      border-radius: 12px;
      background: rgba(128, 128, 128, 0.1);
      border: 1px solid var(--border-card);
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-family: inherit;
      transition: all var(--transition-fast);
      z-index: 2;
    }

    .sheet-close:hover {
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.35);
      color: #f87171;
      transform: rotate(90deg);
    }

    .sheet-close i { font-size: 0.9rem; }

    /* محتوى الـ Sheet */
    .sheet-content {
      overflow-y: auto;
      padding: 22px 24px 32px;
      -webkit-overflow-scrolling: touch;
    }

    .sheet-content::-webkit-scrollbar { width: 0; }

    /* ===== رأس الـ Sheet ===== */
    .sheet-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 24px;
      padding-top: 6px;
      position: relative;
    }

    /* حاوية الأيقونة مع حلقة توهج */
    .sheet-app-icon-wrapper {
      position: relative;
      margin-bottom: 18px;
      padding: 6px;
    }

    .sheet-app-icon-wrapper::before {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 30px;
      background: conic-gradient(from 0deg,
        transparent 0%,
        var(--accent-emerald) 25%,
        transparent 50%,
        var(--accent-emerald) 75%,
        transparent 100%);
      opacity: 0.4;
      animation: rotateGlow 6s linear infinite;
      z-index: 0;
    }

    .sheet-app-icon {
      width: 104px;
      height: 104px;
      border-radius: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: rgba(128, 128, 128, 0.08);
      border: 1px solid var(--border-card);
      box-shadow: 
        0 16px 40px rgba(0, 0, 0, 0.3),
        0 0 40px var(--accent-glow);
      position: relative;
      z-index: 1;
    }

    .sheet-app-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 25px;
    }

    .sheet-app-icon i {
      font-size: 2.7rem;
      color: white;
    }

    .sheet-app-name {
      font-size: 1.4rem;
      font-weight: 900;
      color: var(--text-primary);
      margin-bottom: 6px;
      line-height: 1.3;
      position: relative;
      z-index: 1;
    }

    .sheet-app-subtitle {
      font-size: 0.85rem;
      color: var(--text-secondary);
      font-weight: 600;
      margin-bottom: 18px;
      position: relative;
      z-index: 1;
      max-width: 320px;
      line-height: 1.5;
    }

    /* إحصائيات */
    .sheet-stats {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      position: relative;
      z-index: 1;
    }

    .sheet-stat {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      font-weight: 800;
      color: var(--text-secondary);
      padding: 8px 14px;
      border-radius: 12px;
      background: rgba(128, 128, 128, 0.06);
      border: 1px solid var(--border-card);
    }

    .sheet-stat i {
      font-size: 0.8rem;
      color: var(--accent-light);
    }

    .sheet-stat.rating i { color: #fbbf24; }

    /* ===== الأقسام كبطاقات ===== */
    .sheet-section {
      margin-bottom: 14px;
      padding: 16px;
      border-radius: 16px;
      background: rgba(128, 128, 128, 0.04);
      border: 1px solid var(--border-card);
    }

    [data-theme="light"] .sheet-section {
      background: rgba(16, 185, 129, 0.03);
    }

    .sheet-section-title {
      font-size: 0.82rem;
      font-weight: 900;
      color: var(--accent-light);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: 0.2px;
    }

    .sheet-section-title i {
      font-size: 0.85rem;
      width: 22px;
      height: 22px;
      border-radius: 7px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .sheet-description {
      font-size: 0.86rem;
      color: var(--text-secondary);
      line-height: 1.75;
      font-weight: 600;
    }

    /* قائمة لماذا */
    .sheet-why-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .sheet-why-list li {
      font-size: 0.83rem;
      color: var(--text-secondary);
      font-weight: 600;
      line-height: 1.55;
      padding-right: 28px;
      position: relative;
    }

    .sheet-why-list li::before {
      content: '\f00c';
      font-family: 'Font Awesome 6 Free';
      font-weight: 900;
      position: absolute;
      right: 0;
      top: 1px;
      color: var(--accent-emerald);
      font-size: 0.65rem;
      width: 19px;
      height: 19px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ===== زر Google Play الرسمي (المدموج) ===== */
    .sheet-google-play-btn {
      width: 100%;
      padding: 14px 18px;
      border-radius: 16px;
      background: linear-gradient(135deg, #10b981, #047857);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
      font-family: inherit;
      transition: all var(--transition-fast);
      box-shadow: 
        0 10px 28px var(--accent-glow),
        inset 0 1px 0 rgba(255, 255, 255, 0.15);
      position: relative;
      overflow: hidden;
      margin-top: 8px;
    }

    .sheet-google-play-btn::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.7s ease;
    }

    .sheet-google-play-btn:hover::before { left: 100%; }

    .sheet-google-play-btn:hover {
      transform: translateY(-2px);
      box-shadow: 
        0 14px 36px var(--accent-glow-strong),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }

    .sheet-google-play-btn:active {
      transform: translateY(0) scale(0.99);
    }

    /* أيقونة Google Play */
    .gp-btn-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      position: relative;
      z-index: 1;
    }

    .gp-btn-icon i {
      font-size: 1.4rem;
      color: white;
    }

    /* النص */
    .gp-btn-text {
      flex: 1;
      min-width: 0;
      text-align: right;
      position: relative;
      z-index: 1;
    }

    .gp-btn-sub {
      display: block;
      font-size: 0.68rem;
      font-weight: 700;
      opacity: 0.85;
      margin-bottom: 2px;
      letter-spacing: 0.3px;
    }

    .gp-btn-main {
      display: block;
      font-size: 1rem;
      font-weight: 900;
      letter-spacing: 0.2px;
    }

    /* سهم */
    .gp-btn-arrow {
      position: relative;
      z-index: 1;
      opacity: 0.85;
      transition: transform var(--transition-fast);
    }

    .gp-btn-arrow i {
      font-size: 1rem;
    }

    .sheet-google-play-btn:hover .gp-btn-arrow {
      transform: translateX(-4px);
      opacity: 1;
    }

    /* ===== Toast ===== */
    .toast {
      position: fixed;
      top: 90px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: rgba(16, 185, 129, 0.98);
      color: white;
      padding: 13px 22px;
      border-radius: 14px;
      font-size: 0.88rem;
      font-weight: 700;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5), 0 0 20px var(--accent-glow);
      z-index: 9999;
      opacity: 0;
      transition: all var(--transition-smooth);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(16px);
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: calc(100vw - 40px);
      pointer-events: none;
    }

    .toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.error { background: rgba(239, 68, 68, 0.98); }
    .toast.info { background: rgba(59, 130, 246, 0.98); }

    /* ===== Responsive ===== */
    @media (max-width: 640px) {
      .container { padding: 16px 14px; }
      header { padding: 12px 16px; }
      .header-title { font-size: 0.98rem; }
      .header-back-btn, .icon-btn { width: 38px; height: 38px; }

      .tools-hero { padding: 20px 18px; }
      .tools-hero-top { gap: 12px; }
      .tools-hero-icon { width: 54px; height: 54px; }
      .tools-hero-icon i { font-size: 1.35rem; }
      .tools-hero-title { font-size: 1.08rem; }
      .tools-hero-desc { font-size: 0.75rem; }
      .hero-stat-value { font-size: 0.95rem; }
      .hero-stat-label { font-size: 0.65rem; }

      .tools-grid { gap: 10px; }
      .tool-grid-card { padding: 16px 10px 14px; min-height: 165px; }
      .tool-grid-badge { font-size: 0.55rem; padding: 2px 6px; top: 8px; right: 8px; }
      .tool-grid-icon { width: 64px; height: 64px; margin-bottom: 10px; border-radius: 18px; }
      .tool-grid-icon img { border-radius: 17px; }
      .tool-grid-icon i { font-size: 1.75rem; }
      .tool-grid-name { font-size: 0.83rem; }
      .tool-grid-rating { font-size: 0.68rem; padding: 3px 8px; }

      /* Suggest card responsive */
      .suggest-card {
        flex-direction: column;
        text-align: center;
        padding: 22px 18px;
        gap: 12px;
      }
      .suggest-icon { width: 54px; height: 54px; }
      .suggest-icon i { font-size: 1.35rem; }
      .suggest-title { font-size: 0.95rem; }
      .suggest-desc { font-size: 0.74rem; }
      .suggest-btn { width: 100%; padding: 12px; }

      /* Bottom Sheet */
      .sheet-content { padding: 18px 20px 28px; }
      .sheet-app-icon { width: 92px; height: 92px; border-radius: 24px; }
      .sheet-app-icon img { border-radius: 23px; }
      .sheet-app-icon i { font-size: 2.3rem; }
      .sheet-app-name { font-size: 1.2rem; }
      .sheet-app-subtitle { font-size: 0.8rem; }
      .sheet-description { font-size: 0.83rem; }
      .sheet-why-list li { font-size: 0.8rem; }
      .sheet-google-play-btn { padding: 12px 14px; gap: 12px; }
      .gp-btn-icon { width: 40px; height: 40px; }
      .gp-btn-icon i { font-size: 1.25rem; }
      .gp-btn-sub { font-size: 0.64rem; }
      .gp-btn-main { font-size: 0.92rem; }
    }

    @media (max-width: 380px) {
      .tools-grid { gap: 8px; }
      .tool-grid-card { min-height: 155px; padding: 14px 8px 12px; }
      .tool-grid-icon { width: 58px; height: 58px; }
      .tool-grid-icon i { font-size: 1.55rem; }
      .tool-grid-name { font-size: 0.78rem; }
      .hero-stat-value { font-size: 0.88rem; }
      .hero-stat-label { font-size: 0.6rem; }
      .gp-btn-main { font-size: 0.86rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <!-- الهيدر -->
  <header>
    <a href="index.html" class="header-back-btn" title="رجوع">
      <i class="fa-solid fa-arrow-right"></i>
    </a>
    <div class="header-title">صندوق أدواتي</div>
    <div class="header-actions">
      <button class="icon-btn" onclick="toggleTheme()" title="تبديل الثيم" id="themeToggleBtn">
        <i class="fa-solid fa-sun"></i>
      </button>
    </div>
  </header>

  <div class="container">

    <!-- Hero -->
    <div class="tools-hero">
      <div class="tools-hero-top">
        <div class="tools-hero-icon">
          <i class="fa-solid fa-toolbox"></i>
        </div>
        <div class="tools-hero-content">
          <div class="tools-hero-title">أدوات مختارة بعناية</div>
          <div class="tools-hero-desc">تطبيقات موثوقة تُساعدك في رحلتك الدراسية</div>
        </div>
      </div>
      <div class="tools-hero-stats">
        <div class="hero-stat">
          <div class="hero-stat-value">4</div>
          <div class="hero-stat-label">أدوات</div>
        </div>
        <div class="hero-stat">
          <div class="hero-stat-value">4.6</div>
          <div class="hero-stat-label">متوسط التقييم</div>
        </div>
        <div class="hero-stat">
          <div class="hero-stat-value">100%</div>
          <div class="hero-stat-label">مجانية</div>
        </div>
      </div>
    </div>

    <!-- شبكة الأدوات -->
    <div class="tools-grid" id="toolsGrid"></div>

    <!-- اقتراح أداة — محسّنة -->
    <div class="suggest-card">
      <div class="suggest-icon">
        <i class="fa-solid fa-lightbulb"></i>
      </div>
      <div class="suggest-content">
        <div class="suggest-title">هل تعرف أداة مفيدة؟</div>
        <div class="suggest-desc">رشّحها لنا وسنراجعها لنضيفها إلى الصندوق</div>
      </div>
      <a href="https://t.me/DOVx3" target="_blank" rel="noopener" class="suggest-btn">
        <i class="fa-brands fa-telegram"></i>
        <span>اقترح</span>
      </a>
    </div>

  </div>

  <!-- Overlay -->
  <div class="sheet-overlay" id="sheetOverlay" onclick="closeSheet()"></div>

  <!-- Bottom Sheet Modal -->
  <div class="sheet-modal" id="sheetModal">
    <div class="sheet-accent-bar"></div>
    <div class="sheet-handle"></div>
    <button class="sheet-close" onclick="closeSheet()">
      <i class="fa-solid fa-xmark"></i>
    </button>
    <div class="sheet-content" id="sheetContent"></div>
  </div>

  <script>
    // ============================================
    // بيانات الأدوات
    // ============================================
    const TOOLS = [
      {
        id: 'flipclock',
        name: 'Flip Clock',
        subtitle: 'مؤقّت بومودورو + ساعة عالمية',
        badge: '⏱️ إنتاجية',
        badgeBg: 'rgba(59, 130, 246, 0.15)',
        badgeColor: '#60a5fa',
        badgeBorder: 'rgba(59, 130, 246, 0.35)',
        iconImage: 'icons/flipclock.png',
        iconFallback: 'fa-clock',
        iconColor: '#3b82f6',
        rating: '4.7',
        downloads: '50 مليون+',
        description: 'تطبيق مؤقّت احترافي يجمع بين ساعة بومودورو، ساعة عالمية، وساعة طقس في واجهة أنيقة ومريحة للعين. مثالي لجلسات المراجعة الطويلة.',
        why: [
          'أفضل مؤقّت بومودورو للجلسات الطويلة',
          'واجهة نظيفة بلا تشتيت',
          'يعمل بدون إنترنت + إشعارات ذكية'
        ],
        downloadUrl: 'https://play.google.com/store/apps/details?id=com.wssc.simpleclock'
      },
      {
        id: 'drbaraa',
        name: 'تعلم الفوكاب',
        subtitle: 'د. براء المدلل — كلمات الإنجليزي',
        badge: '📚 مراجعة',
        badgeBg: 'rgba(236, 72, 153, 0.15)',
        badgeColor: '#f472b6',
        badgeBorder: 'rgba(236, 72, 153, 0.35)',
        iconImage: 'icons/drbaraa.png',
        iconFallback: 'fa-language',
        iconColor: '#dc2626',
        rating: '4.6',
        downloads: '50 ألف+',
        description: 'تطبيق متخصص لتعلم مفردات اللغة الإنجليزية للسنة التحضيرية الطبية، مع نظام مراجعة ذكي يعتمد على أدائك الشخصي.',
        why: [
          'مخصص لمنهج السنة التحضيرية بالضبط',
          'يحتوي كل كلمات المنهج المطلوبة',
          'نظام مراجعة ذكي متكيف مع مستواك'
        ],
        downloadUrl: 'https://play.google.com/store/apps/details?id=com.BMODvocab.app'
      },
      {
        id: 'notion',
        name: 'Notion',
        subtitle: 'تنظيم الملاحظات والمهام',
        badge: '✍️ تنظيم',
        badgeBg: 'rgba(139, 92, 246, 0.15)',
        badgeColor: '#a78bfa',
        badgeBorder: 'rgba(139, 92, 246, 0.35)',
        iconImage: 'icons/notion.png',
        iconFallback: 'fa-book',
        iconColor: '#1f2937',
        rating: '4.5',
        downloads: '10 مليون+',
        description: 'مساحة عمل شاملة تجمع الملاحظات، المهام، الجداول، وقواعد البيانات في تطبيق واحد مع مزامنة سحابية فورية عبر جميع أجهزتك.',
        why: [
          'تنظيم كل شيء في مكان واحد',
          'نسخ احتياطي سحابي آمن',
          'مجاني بالكامل للطلاب والجامعات'
        ],
        downloadUrl: 'https://play.google.com/store/apps/details?id=notion.id'
      },
      {
        id: 'forest',
        name: 'Forest',
        subtitle: 'ركّز بدون هاتف — ازرع شجرة',
        badge: '🌲 تركيز',
        badgeBg: 'rgba(16, 185, 129, 0.15)',
        badgeColor: '#34d399',
        badgeBorder: 'rgba(16, 185, 129, 0.35)',
        iconImage: 'icons/forest.png',
        iconFallback: 'fa-tree',
        iconColor: '#10b981',
        rating: '4.6',
        downloads: '10 مليون+',
        description: 'تطبيق يحوّل تركيزك إلى أشجار حقيقية تُزرع في العالم، مما يحفّزك على الابتعاد عن هاتفك والتركيز في دراستك. مشروع مكافحة التسويف الأكبر عالمياً.',
        why: [
          'يحفّزك على الابتعاد عن الهاتف',
          'يزرع أشجاراً حقيقية عند إنجازك',
          'تقارير أسبوعية مفصلة عن تركيزك'
        ],
        downloadUrl: 'https://play.google.com/store/apps/details?id=cc.forestapp'
      }
    ];

    // ============================================
    // عرض الشبكة
    // ============================================
    function renderGrid() {
      const grid = document.getElementById('toolsGrid');
      grid.innerHTML = '';

      TOOLS.forEach((tool, index) => {
        const card = document.createElement('div');
        card.className = 'tool-grid-card';
        card.style.animationDelay = (index * 0.07) + 's';
        card.onclick = () => openSheet(tool.id);

        card.innerHTML = `
          <div class="tool-grid-badge" style="background: ${tool.badgeBg}; color: ${tool.badgeColor}; border: 1px solid ${tool.badgeBorder};">
            ${tool.badge}
          </div>

          <div class="tool-grid-icon" style="background: ${hexToRgba(tool.iconColor, 0.15)}; border-color: ${hexToRgba(tool.iconColor, 0.35)};">
            <img 
              src="${tool.iconImage}" 
              alt="${tool.name}"
              onerror="this.style.display='none'; this.parentElement.innerHTML='<i class=\\'fa-solid ${tool.iconFallback}\\' style=\\'color: ${tool.iconColor}\\'></i>';"
            >
          </div>

          <div class="tool-grid-name">${tool.name}</div>

          <div class="tool-grid-rating">
            <i class="fa-solid fa-star"></i>
            <span>${tool.rating}</span>
          </div>
        `;

        grid.appendChild(card);
      });
    }

    // ============================================
    // فتح الـ Bottom Sheet
    // ============================================
    function openSheet(toolId) {
      const tool = TOOLS.find(t => t.id === toolId);
      if (!tool) return;

      const content = document.getElementById('sheetContent');
      const whyList = tool.why.map(item => `<li>${item}</li>`).join('');

      content.innerHTML = `
        <div class="sheet-header">
          <div class="sheet-app-icon-wrapper">
            <div class="sheet-app-icon" style="background: ${hexToRgba(tool.iconColor, 0.15)}; border-color: ${hexToRgba(tool.iconColor, 0.35)};">
              <img 
                src="${tool.iconImage}" 
                alt="${tool.name}"
                onerror="this.style.display='none'; this.parentElement.innerHTML='<i class=\\'fa-solid ${tool.iconFallback}\\' style=\\'color: ${tool.iconColor}\\'></i>';"
              >
            </div>
          </div>
          <div class="sheet-app-name">${tool.name}</div>
          <div class="sheet-app-subtitle">${tool.subtitle}</div>
          
          <div class="sheet-stats">
            <div class="sheet-stat rating">
              <i class="fa-solid fa-star"></i>
              <span>${tool.rating}</span>
            </div>
            <div class="sheet-stat">
              <i class="fa-solid fa-download"></i>
              <span>${tool.downloads}</span>
            </div>
          </div>
        </div>

        <div class="sheet-section">
          <div class="sheet-section-title">
            <i class="fa-solid fa-circle-info"></i>
            <span>عن التطبيق</span>
          </div>
          <div class="sheet-description">${tool.description}</div>
        </div>

        <div class="sheet-section">
          <div class="sheet-section-title">
            <i class="fa-solid fa-thumbs-up"></i>
            <span>لماذا رشّحناه؟</span>
          </div>
          <ul class="sheet-why-list">
            ${whyList}
          </ul>
        </div>

        <a href="${tool.downloadUrl}" target="_blank" rel="noopener noreferrer" class="sheet-google-play-btn">
          <div class="gp-btn-icon">
            <i class="fa-brands fa-google-play"></i>
          </div>
          <div class="gp-btn-text">
            <span class="gp-btn-sub">تحميل مجاني من</span>
            <span class="gp-btn-main">Google Play</span>
          </div>
          <div class="gp-btn-arrow">
            <i class="fa-solid fa-arrow-up-left-from-square"></i>
          </div>
        </a>
      `;

      document.getElementById('sheetOverlay').classList.add('active');
      document.getElementById('sheetModal').classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeSheet() {
      document.getElementById('sheetOverlay').classList.remove('active');
      document.getElementById('sheetModal').classList.remove('active');
      document.body.style.overflow = '';
    }

    // إغلاق بـ Escape
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeSheet();
    });

    // Swipe down للإغلاق
    let touchStartY = 0;
    const sheetModal = document.getElementById('sheetModal');
    if (sheetModal) {
      sheetModal.addEventListener('touchstart', (e) => {
        touchStartY = e.touches[0].clientY;
      }, { passive: true });

      sheetModal.addEventListener('touchmove', (e) => {
        const deltaY = e.touches[0].clientY - touchStartY;
        if (deltaY > 100 && sheetModal.scrollTop === 0) {
          closeSheet();
        }
      }, { passive: true });
    }

    // ============================================
    // أدوات مساعدة
    // ============================================
    function hexToRgba(hex, alpha) {
      if (!hex || hex[0] !== '#') return `rgba(16, 185, 129, ${alpha})`;
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    // ============================================
    // الثيمات
    // ============================================
    function applyTheme(theme) {
      localStorage.setItem('medfav_theme', theme);
      if (theme === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
      } else {
        document.documentElement.removeAttribute('data-theme');
      }
      const btn = document.getElementById('themeToggleBtn');
      if (btn) {
        btn.innerHTML = theme === 'light'
          ? '<i class="fa-solid fa-moon"></i>'
          : '<i class="fa-solid fa-sun"></i>';
      }
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', theme === 'light' ? '#f8fafb' : '#06110d');
    }

    function toggleTheme() {
      const current = localStorage.getItem('medfav_theme') || 'light';
      const next = current === 'light' ? 'dark' : 'light';
      applyTheme(next);
      showToast(next === 'light' ? 'تم تفعيل الوضع النهاري' : 'تم تفعيل الوضع الليلي', 'info');
    }

    // ============================================
    // Toast
    // ============================================
    function showToast(message, type = 'success') {
      const existing = document.querySelector('.toast');
      if (existing) existing.remove();

      const toast = document.createElement('div');
      toast.className = 'toast' + (type === 'error' ? ' error' : type === 'info' ? ' info' : '');

      const icon = type === 'error' ? 'fa-circle-exclamation'
                  : type === 'info' ? 'fa-circle-info'
                  : 'fa-circle-check';

      toast.innerHTML = `
        <i class="fa-solid ${icon}"></i>
        <span>${message}</span>
      `;

      document.body.appendChild(toast);
      requestAnimationFrame(() => toast.classList.add('visible'));

      setTimeout(() => {
        toast.classList.remove('visible');
        setTimeout(() => toast.remove(), 350);
      }, 2600);
    }

    // ============================================
    // التشغيل
    // ============================================
    document.addEventListener('DOMContentLoaded', () => {
      const savedTheme = localStorage.getItem('medfav_theme') || 'light';
      applyTheme(savedTheme);
      renderGrid();
      console.log('✅ tools.html v2.0 — ', TOOLS.length, 'أدوات احترافية');
    });
  </script>
</body>
</html>
