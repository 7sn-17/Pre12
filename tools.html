<!-- Smooth page transitions (View Transitions API + fallback fade).
     The fixed bottom navigation gets its own view-transition-name and is
     frozen, so it can never move or fade while the page content changes. -->
<style data-shell>
  /* Global theme defaults. `data-theme` is always set by theme-init.js
     (light or dark), so native controls and scrollbars follow the app. */
  :root { color-scheme: light; --medapp-amber: #fbbf24; --medapp-orange: #fb923c; --medapp-blue: #93c5fd; --medapp-blue-soft: #bfdbfe; --medapp-violet: #c4b5fd; --medapp-green: #34d399; --medapp-red: #f87171; --medapp-pink: #f472b6; }
  [data-theme="dark"] { color-scheme: dark; }
  [data-theme="light"] { --medapp-amber: #b45309; --medapp-orange: #c2410c; --medapp-blue: #2563eb; --medapp-blue-soft: #1d4ed8; --medapp-violet: #6d28d9; --medapp-green: #047857; --medapp-red: #b91c1c; --medapp-pink: #be185d; }

  /* Premium smooth scrolling. The SPA router temporarily disables this for
     page swaps / Back restoration so navigation is instant, never animated. */
  html { scroll-behavior: smooth; }
  /* app.js sets this only for instant SPA swaps / Back restoration. */
  html.medapp-scroll-jump { scroll-behavior: auto !important; }

  html.medapp-navigating { cursor: progress; }

  /* ⭐IMPORTANT: the `hidden` attribute must always win.
     Author rules like `.detail-empty { display: flex }` beat the user-agent
     `[hidden] { display: none }` rule, which made "empty" blocks stay on
     screen on top of real content. */
  [hidden] { display: none !important; }

  /* ⭐ Tap targets: 44px minimum, no double-tap zoom, no grey flash. */
  button,
  a[role="button"],
  [role="button"] {
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }

  /* ⭐ انتقال ناعم بين الوضعين النهاري والليلي.
     يُفعَّل هذا الصنف لحظياً قبل تبديل الثيم (MedApp.withThemeTransition)
     فيتحوّل لون الخلفية والنص والحدود تدريجياً بدل القفز المفاجئ. */
  html.theme-transition,
  html.theme-transition body,
  html.theme-transition *,
  html.theme-transition *::before,
  html.theme-transition *::after {
    transition:
      background-color 0.34s ease,
      color 0.34s ease,
      border-color 0.34s ease,
      fill 0.34s ease,
      stroke 0.34s ease,
      box-shadow 0.34s ease !important;
    transition-delay: 0s !important;
  }

  /* Very thin top progress bar, shown by app.js during SPA navigation. */
  #medapp-loader {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    z-index: 2147483647;
    pointer-events: none;
    overflow: hidden;
    opacity: 0;
    transition: opacity 0.15s ease;
  }

  #medapp-loader::before {
    content: '';
    display: block;
    width: 40%;
    height: 100%;
    border-radius: 0 999px 999px 0;
    background: linear-gradient(90deg, transparent, #059669 18%, #10b981 52%, #34d399 82%, transparent);
    box-shadow: 0 0 8px rgba(16, 185, 129, 0.6);
    transform: translateX(-110%);
    will-change: transform;
  }

  html.medapp-loading #medapp-loader { opacity: 1; }
  html.medapp-loading #medapp-loader::before {
    animation: medapp-loader-slide 1.05s cubic-bezier(0.4, 0, 0.2, 1) infinite;
  }

  @keyframes medapp-loader-slide {
    0%   { transform: translateX(-110%); }
    100% { transform: translateX(360%); }
  }

  /* Only same-document transitions (started by app.js). Cross-document
     @view-transition is intentionally NOT enabled: full loads must behave
     exactly like the original pages. */

  .floating-nav-wrapper { view-transition-name: medapp-bottom-nav; }
  ::view-transition-group(medapp-bottom-nav) { animation: none; }
  ::view-transition-old(medapp-bottom-nav),
  ::view-transition-new(medapp-bottom-nav) { animation: none; }

  /* Keep the sticky header out of the root cross-fade. Otherwise the old and
     new snapshots of a translucent, blurred header overlap and look frozen /
     show a ghost shadow while the page changes. */
  header { view-transition-name: medapp-header; }
  ::view-transition-group(medapp-header) { animation: none; }
  ::view-transition-old(medapp-header),
  ::view-transition-new(medapp-header) { animation: none; }

  /* Light mode: the header must use a soft neutral shadow, never the heavy
     black shadow used by the dark theme. */
  [data-theme="light"] header {
    background: rgba(248, 250, 251, 0.92);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    backdrop-filter: blur(20px) saturate(180%);
    border-bottom-color: rgba(15, 23, 42, 0.08);
    box-shadow: 0 1px 0 rgba(15, 23, 42, 0.04);
    color: var(--text-primary);
  }

  /* Wins over every page-level `header.scrolled` (higher specificity). */
  [data-theme="light"] header.scrolled {
    background: rgba(248, 250, 251, 0.97);
    border-bottom-color: rgba(15, 23, 42, 0.1);
    box-shadow:
      0 4px 18px rgba(15, 23, 42, 0.08),
      0 1px 0 rgba(15, 23, 42, 0.05);
  }

  @media (prefers-reduced-motion: no-preference) {
    ::view-transition-old(root) { animation: pt-fade-out 0.14s cubic-bezier(0.4, 0, 0.2, 1) both; }
    ::view-transition-new(root) { animation: pt-fade-in 0.2s cubic-bezier(0.4, 0, 0.2, 1) both; }
  }

  /* No body animation on browsers without View Transitions: the swap is
     already synchronous, and fading the body element would also fade the
     fixed bottom navigation. The nav must never move or fade. */

  @keyframes pt-fade-in  { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pt-fade-out { from { opacity: 1; } to { opacity: 0; } }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto !important; }
    html.theme-transition,
    html.theme-transition body,
    html.theme-transition *,
    html.theme-transition *::before,
    html.theme-transition *::after {
      transition: none !important;
    }
    #medapp-loader::before {
      animation: none !important;
      transform: none;
      width: 60%;
    }
    ::view-transition-old(root), ::view-transition-new(root),
    ::view-transition-old(medapp-bottom-nav), ::view-transition-new(medapp-bottom-nav),
    ::view-transition-old(medapp-header), ::view-transition-new(medapp-header) { animation: none !important; }
  }

  /* ============================================================
     ⭐ المنطقة الآمنة + الشريط العلوي الثابت (Phase 14)
     ------------------------------------------------------------
     • الشريط العلوي fixed ⇒ لا يختفي تحت شريط الحالة عند السحب
       (الـ rubber-band كان يُظهره خلف الشريط).
     • جسم الصفحة يحمل padding-top بمقدار ارتفاع الشريط حتى
       لا يختفي المحتوى تحته.
     • overscroll-behavior: لا اهتزاز عند السحب إلى ما بعد الحواف.
     ============================================================ */
  :root {
    --safe-area-inset-top: env(safe-area-inset-top, 0px);
    --safe-area-inset-bottom: env(safe-area-inset-bottom, 0px);
    --safe-area-inset-left: env(safe-area-inset-left, 0px);
    --safe-area-inset-right: env(safe-area-inset-right, 0px);

    /* ⭐⭐ رموز احتياطية — الصفحات التي تعرّف رموزها الخاصة تتجاوزها،
       والصفحات التي لا تعرّفها تحصل على قيم سليمة.
       بدونها كان زر "تسجيل الدخول" بلا خلفية (لأن --accent-emerald
       غير معرّف) فيظهر النص الأبيض على خلفية شفافة = نص غير مرئي. */
    --accent-emerald: #10b981;
    --accent-light: #34d399;
    --accent-dark: #059669;
    --accent-glow: rgba(16, 185, 129, 0.25);
    --accent-glow-strong: rgba(16, 185, 129, 0.42);
    --bg-main: #06110d;
    --bg-card: rgba(16, 34, 27, 0.68);
    --bg-card-hover: rgba(22, 48, 38, 0.92);
    --bg-solid: #0d221a;
    --bg-elevated: #102a22;
    --border-card: rgba(16, 185, 129, 0.18);
    --border-card-hover: rgba(16, 185, 129, 0.46);
    --text-primary: #f0fdf4;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
    --transition-fast: 0.18s ease;
    --transition-smooth: 0.25s cubic-bezier(0.4, 0, 0.2, 1);

    --app-header-h: 72px;
    --app-header-pad-x: 20px;
  }

  [data-theme="light"] {
    --accent-emerald: #059669;
    --bg-main: #f8fafb;
    --bg-card: rgba(255, 255, 255, 0.9);
    --bg-card-hover: #ffffff;
    --bg-solid: #ffffff;
    --bg-elevated: #f1f5f9;
    --border-card: rgba(16, 185, 129, 0.24);
    --border-card-hover: rgba(16, 185, 129, 0.55);
    --text-primary: #0f172a;
    --text-secondary: #475569;
    --text-muted: #94a3b8;
  }

  @media (max-width: 480px) {
    :root {
      --app-header-h: 68px;
      --app-header-pad-x: 16px;
    }
  }

  html, body, main {
    overscroll-behavior-y: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }

  /* ⭐ لكن حقول الإدخال تبقى قابلة للتحديد والنسخ */
  input,
  textarea,
  select,
  [contenteditable="true"] {
    -webkit-user-select: text;
    user-select: text;
  }

  body {
    margin: 0;
    padding: 0;
  }

  /* ⭐ الشريط العلوي: ثابت في الأعلى، فوق كل شيء، ويحترم النوتش */
  body > header,
  body > .ml-topbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    width: 100%;
    z-index: 9999;
    box-sizing: border-box;
    min-height: calc(var(--app-header-h) + var(--safe-area-inset-top, env(safe-area-inset-top, 0px)));
    padding-top: var(--safe-area-inset-top, env(safe-area-inset-top, 0px)) !important;
    padding-bottom: 0 !important;
    padding-left: var(--app-header-pad-x) !important;
    padding-right: var(--app-header-pad-x) !important;
  }

  /* حالة "مُمرَّر" لا يجب أن تكسر الارتفاع ولا المنطقة الآمنة */
  body > header.scrolled,
  body > .ml-topbar {
    padding-top: var(--safe-area-inset-top, env(safe-area-inset-top, 0px)) !important;
  }

  /* ⭐ جسم الصفحة يتزحزح بمقدار الشريط حتى لا يختفي تحته */
  body:has(> header),
  body:has(> .ml-topbar) {
    padding-top: calc(var(--app-header-h) + var(--safe-area-inset-top, env(safe-area-inset-top, 0px)));
  }

  /* ⭐ حاويات التطبيق تحترم المنطقة الآمنة من الأسفل */
  body > main,
  body > .container,
  .app-container {
    padding-bottom: var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));
  }

  /* ============================================================
     نافذة "سجّل الدخول" (وضع الزائر) — مشتركة بين كل الصفحات
     ============================================================ */
    .auth-required-overlay {
      position: fixed;
      inset: 0;
      background: rgba(3, 10, 8, 0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 4000;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--transition-smooth);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    [data-theme="light"] .auth-required-overlay { background: rgba(248, 250, 251, 0.9); }

    .auth-required-overlay.active { opacity: 1; pointer-events: auto; }

    .auth-required-card {
      background: var(--bg-solid);
      border: 1px solid var(--border-card-hover);
      border-radius: 24px;
      padding: 28px 24px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      transform: translateY(20px) scale(0.96);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 0 0 40px var(--accent-glow);
    }

    [data-theme="light"] .auth-required-card {
      box-shadow:
        0 20px 60px rgba(15, 23, 42, 0.16),
        0 0 40px var(--accent-glow);
    }

    .auth-required-overlay.active .auth-required-card { transform: translateY(0) scale(1); }

    .auth-required-icon {
      width: 72px;
      height: 72px;
      border-radius: 22px;
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(5, 150, 105, 0.15));
      border: 1px solid var(--accent-emerald);
      color: var(--accent-light);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 18px;
      box-shadow: 0 8px 24px var(--accent-glow);
      position: relative;
    }

    .auth-required-icon::after {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 26px;
      border: 1px solid rgba(16, 185, 129, 0.25);
      animation: pulse 2.5s ease-in-out infinite;
    }

    .auth-required-title {
      font-size: 1.2rem;
      font-weight: 900;
      color: var(--text-primary);
      margin-bottom: 10px;
    }

    .auth-required-message {
      font-size: 0.85rem;
      color: var(--text-secondary);
      line-height: 1.7;
      margin-bottom: 22px;
    }

    .auth-required-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .auth-required-btn {
      padding: 13px 20px;
      border-radius: 14px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      transition: all var(--transition-fast);
      border: 1px solid transparent;
    }

    .auth-required-btn i { width: 16px; height: 16px; }

    .auth-required-btn.primary {
      background: linear-gradient(135deg, var(--accent-emerald), var(--accent-dark));
      color: white;
      box-shadow: 0 8px 20px var(--accent-glow);
    }

    .auth-required-btn.primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px var(--accent-glow-strong);
    }

    .auth-required-btn.secondary {
      background: rgba(128, 128, 128, 0.08);
      border-color: var(--border-card);
      color: var(--text-secondary);
    }

    .auth-required-btn.secondary:hover {
      background: rgba(128, 128, 128, 0.15);
      border-color: var(--border-card-hover);
      color: var(--text-primary);
    }

    /* ============================================ */
    /* Responsive */
    /* ============================================ */
    @media (max-width: 640px) {
      .container { padding: 16px 14px; }
      header { padding: 12px 16px; }
      .brand-title { font-size: 1rem; }
      .brand-icon { width: 40px; height: 40px; }
      .welcome-header { padding: 16px; }
      .welcome-greeting { font-size: 1.05rem; }
      .welcome-icon-wrap { width: 48px; height: 48px; }
      .welcome-icon-wrap i { width: 22px; height: 22px; }
      .subject-icon-box { width: 46px; height: 46px; }
      .floating-nav { max-width: 100%; }
      .toast { top: 78px; padding: 12px 18px; font-size: 0.84rem;
      z-index: 2147483647;
    }
      .files-horizontal { margin: 0 -14px; padding-left: 14px; padding-right: 14px; }
      .user-name { display: none; }
      .user-avatar-btn { padding: 6px; }
      .file-mini-card { min-width: 260px; max-width: 260px; }
      .skeleton-mini { min-width: 260px; }
      .search-modal-close { width: 42px; height: 42px; }
      .icon-btn { width: 38px; height: 38px; }
      .icon-btn i { width: 18px; height: 18px; }
      .nav-btn-center { width: 54px; height: 54px; margin-top: -22px; }
      .nav-btn-center i { width: 22px; height: 22px; }
      .quick-access-grid { gap: 8px; }
      .quick-access-btn { padding: 12px 6px; }
      .qa-icon { width: 40px; height: 40px; }
      .qa-icon i { width: 20px; height: 20px; }
      .qa-label { font-size: 0.68rem; }
      .study-card-icon { width: 46px; height: 46px; }
      .study-card-icon i { width: 22px; height: 22px; }
    }

    @media (max-width: 380px) {
      .toast { top: 72px; font-size: 0.8rem; padding: 10px 16px;
      z-index: 2147483647;
    }
      .file-mini-card { min-width: 240px; max-width: 240px; }
      .nav-btn-center { width: 50px; height: 50px; margin-top: -20px; }
      .nav-btn span { font-size: 0.6rem; }
      .quick-access-grid { gap: 6px; }
      .quick-access-btn { padding: 10px 4px; }
      .qa-icon { width: 36px; height: 36px; }
      .qa-icon i { width: 18px; height: 18px; }
      .qa-label { font-size: 0.62rem; }
    }

    @supports (padding: env(safe-area-inset-bottom)) {
      .floating-nav-wrapper { bottom: calc(20px + env(safe-area-inset-bottom)); }
    }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

  /* ============================================================
     Premium file visual — shared by every file surface.
     The helper `getFileIconMarkup()` in files.js supplies the
     colour tokens; page classes (mini-file-icon, file-icon,
     file-type-icon, …) keep their existing dimensions.
     ============================================================ */

    .sheet-stat i {
      font-size: 0.8rem;
      color: var(--accent-light);
    }

    .sheet-stat.rating i { color: var(--medapp-amber); }

    /* ===== الأقسام كبطاقات ===== */
    .sheet-section {
      margin-bottom: 14px;
      padding: 16px;
      border-radius: 16px;
      background: rgba(128, 128, 128, 0.04);
      border: 1px solid var(--border-card);
    }

    [data-theme="light"] .sheet-section {
      background: rgba(16, 185, 129, 0.03);
    }

    .sheet-section-title {
      font-size: 0.82rem;
      font-weight: 900;
      color: var(--accent-light);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: 0.2px;
    }

    .sheet-section-title i {
      font-size: 0.85rem;
      width: 22px;
      height: 22px;
      border-radius: 7px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .sheet-description {
      font-size: 0.86rem;
      color: var(--text-secondary);
      line-height: 1.75;
      font-weight: 600;
    }

    /* قائمة لماذا */
    .sheet-why-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .sheet-why-list li {
      font-size: 0.83rem;
      color: var(--text-secondary);
      font-weight: 600;
      line-height: 1.55;
      padding-right: 28px;
      position: relative;
    }

    .sheet-why-list li::before {
      content: '\f00c';
      font-family: 'Font Awesome 6 Free';
      font-weight: 900;
      position: absolute;
      right: 0;
      top: 1px;
      color: var(--accent-emerald);
      font-size: 0.65rem;
      width: 19px;
      height: 19px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ===== زر Google Play الرسمي (المدموج) ===== */
    .sheet-google-play-btn {
      width: 100%;
      padding: 14px 18px;
      border-radius: 16px;
      background: linear-gradient(135deg, #10b981, #047857);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
      font-family: inherit;
      transition: all var(--transition-fast);
      box-shadow: 
        0 10px 28px var(--accent-glow),
        inset 0 1px 0 rgba(255, 255, 255, 0.15);
      position: relative;
      overflow: hidden;
      margin-top: 8px;
    }

    .sheet-google-play-btn::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.7s ease;
    }

    .sheet-google-play-btn:hover::before { left: 100%; }

    .sheet-google-play-btn:hover {
      transform: translateY(-2px);
      box-shadow: 
        0 14px 36px var(--accent-glow-strong),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }

    .sheet-google-play-btn:active {
      transform: translateY(0) scale(0.99);
    }

    /* أيقونة Google Play */
    .gp-btn-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      position: relative;
      z-index: 1;
    }

    .gp-btn-icon i {
      font-size: 1.4rem;
      color: white;
    }

    /* النص */
    .gp-btn-text {
      flex: 1;
      min-width: 0;
      text-align: right;
      position: relative;
      z-index: 1;
    }

    .gp-btn-sub {
      display: block;
      font-size: 0.68rem;
      font-weight: 700;
      opacity: 0.85;
      margin-bottom: 2px;
      letter-spacing: 0.3px;
    }

    .gp-btn-main {
      display: block;
      font-size: 1rem;
      font-weight: 900;
      letter-spacing: 0.2px;
    }

    /* سهم */
    .gp-btn-arrow {
      position: relative;
      z-index: 1;
      opacity: 0.85;
      transition: transform var(--transition-fast);
    }

    .gp-btn-arrow i {
      font-size: 1rem;
    }

    .sheet-google-play-btn:hover .gp-btn-arrow {
      transform: translateX(-4px);
      opacity: 1;
    }

    /* ===== Toast ===== */
    .toast {
      position: fixed;
      top: 90px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: rgba(16, 185, 129, 0.98);
      color: white;
      padding: 13px 22px;
      border-radius: 14px;
      font-size: 0.88rem;
      font-weight: 700;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5), 0 0 20px var(--accent-glow);
      opacity: 0;
      transition: all var(--transition-smooth);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(16px);
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: calc(100vw - 40px);
      pointer-events: none;
      z-index: 2147483647;
    }

    .toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.error { background: rgba(239, 68, 68, 0.98); }
    .toast.info { background: rgba(59, 130, 246, 0.98); }

    /* ===== Responsive ===== */
    @media (max-width: 640px) {
      .container { padding: 16px 14px; }
      header { padding: 12px 16px; }
      .header-title { font-size: 0.98rem; }
      .header-back-btn, .icon-btn { width: 38px; height: 38px; }

      .tools-hero { padding: 20px 18px; }
      .tools-hero-top { gap: 12px; }
      .tools-hero-icon { width: 54px; height: 54px; }
      .tools-hero-icon i { font-size: 1.35rem; }
      .tools-hero-title { font-size: 1.08rem; }
      .tools-hero-desc { font-size: 0.75rem; }
      .hero-stat-value { font-size: 0.95rem; }
      .hero-stat-label { font-size: 0.65rem; }

      .tools-grid { gap: 10px; }
      .tool-grid-card { padding: 16px 10px 14px; min-height: 165px; }
      .tool-grid-badge { font-size: 0.55rem; padding: 2px 6px; top: 8px; right: 8px; }
      .tool-grid-icon { width: 64px; height: 64px; margin-bottom: 10px; border-radius: 18px; }
      .tool-grid-icon img { border-radius: 17px; }
      .tool-grid-icon i { font-size: 1.75rem; }
      .tool-grid-name { font-size: 0.83rem; }
      .tool-grid-rating { font-size: 0.68rem; padding: 3px 8px; }

      /* Suggest card responsive */
      .suggest-card {
        flex-direction: column;
        text-align: center;
        padding: 22px 18px;
        gap: 12px;
      }
      .suggest-icon { width: 54px; height: 54px; }
      .suggest-icon i { font-size: 1.35rem; }
      .suggest-title { font-size: 0.95rem; }
      .suggest-desc { font-size: 0.74rem; }
      .suggest-btn { width: 100%; padding: 12px; }

      /* Bottom Sheet */
      .sheet-content { padding: 18px 20px 28px; }
      .sheet-app-icon { width: 92px; height: 92px; border-radius: 24px; }
      .sheet-app-icon img { border-radius: 23px; }
      .sheet-app-icon i { font-size: 2.3rem; }
      .sheet-app-name { font-size: 1.2rem; }
      .sheet-app-subtitle { font-size: 0.8rem; }
      .sheet-description { font-size: 0.83rem; }
      .sheet-why-list li { font-size: 0.8rem; }
      .sheet-google-play-btn { padding: 12px 14px; gap: 12px; }
      .gp-btn-icon { width: 40px; height: 40px; }
      .gp-btn-icon i { font-size: 1.25rem; }
      .gp-btn-sub { font-size: 0.64rem; }
      .gp-btn-main { font-size: 0.92rem; }
    }

    @media (max-width: 380px) {
      .tools-grid { gap: 8px; }
      .tool-grid-card { min-height: 155px; padding: 14px 8px 12px; }
      .tool-grid-icon { width: 58px; height: 58px; }
      .tool-grid-icon i { font-size: 1.55rem; }
      .tool-grid-name { font-size: 0.78rem; }
      .hero-stat-value { font-size: 0.88rem; }
      .hero-stat-label { font-size: 0.6rem; }
      .gp-btn-main { font-size: 0.86rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <!-- الهيدر -->
  <header>

    </div>
  </header>

  <div class="container">

    <!-- Hero -->
    <div class="tools-hero">
      <div class="tools-hero-top">

          <div class="hero-stat-value">4.6</div>
          <div class="hero-stat-label">متوسط التقييم</div>
        </div>

          <div class="hero-stat-value">100%</div>
          <div class="hero-stat-label">مجانية</div>
        </div>
      </div>
    </div>

    <!-- شبكة الأدوات -->
    <div class="tools-grid" id="toolsGrid"></div>

    <!-- اقتراح أداة — محسّنة -->
    <div class="suggest-card">
      <div class="suggest-icon">
        <i class="fa-solid fa-lightbulb"></i>
      </div>
      <div class="suggest-content">
        <div class="suggest-title">هل تعرف أداة مفيدة؟</div>
        <div class="suggest-desc">رشّحها لنا وسنراجعها لنضيفها إلى الصندوق</div>
      </div>
      <a href="https://t.me/DOVx3" target="_blank" rel="noopener" class="suggest-btn">
        <i class="fa-brands fa-telegram"></i>
        <span>اقترح</span>
      </a>
    </div>

  </div>

  <!-- Overlay -->
  <div class="sheet-overlay" id="sheetOverlay" onclick="closeSheet()"></div>

  <!-- Bottom Sheet Modal -->
  <div class="sheet-modal" id="sheetModal">
    <div class="sheet-accent-bar"></div>
    <div class="sheet-handle"></div>
    <button class="sheet-close" onclick="closeSheet()">
      <i class="fa-solid fa-xmark"></i>
    </button>
    <div class="sheet-content" id="sheetContent"></div>
  </div>

  <script src="app.js?v=2.7.2"></script>
<script>

    // ============================================
    // بيانات الأدوات
    // ============================================
    var TOOLS = [
      {
        id: 'flipclock',
        name: 'Flip Clock',
        subtitle: 'مؤقّت بومودورو + ساعة عالمية',

        iconFallback: 'fa-clock',
        iconColor: '#3b82f6',
        rating: '4.7',
        downloads: '50 مليون+',

        why: [
          'أفضل مؤقّت بومودورو للجلسات الطويلة',
          'واجهة نظيفة بلا تشتيت',
          'يعمل بدون إنترنت + إشعارات ذكية'
        ],
        downloadUrl: 'https://play.google.com/store/apps/details?id=com.wssc.simpleclock'
      },
      {
        id: 'drbaraa',

        subtitle: 'د. براء المدلل — كلمات الإنجليزي',
        badge: '📚 مراجعة',
        badgeBg: 'rgba(236, 72, 153, 0.15)',
        badgeColor: '#f472b6',
        badgeBorder: 'rgba(236, 72, 153, 0.35)',
        iconImage: 'icons/drbaraa.jpg',
        iconFallback: 'fa-language',
        iconColor: '#dc2626',
        rating: '4.6',
        downloads: '50 ألف+',
        description: 'تطبيق متخصص لتعلم مفردات اللغة الإنجليزية للسنة التحضيرية الطبية، مع نظام مراجعة ذكي يعتمد على أدائك الشخصي.',
        why: [
          'مخصص لمنهج السنة التحضيرية بالضبط',
          'يحتوي كل كلمات المنهج المطلوبة',
          'نظام مراجعة ذكي متكيف مع مستواك'
        ],
        downloadUrl: 'https://play.google.com/store/apps/details?id=com.BMODvocab.app'
      },
      {
        id: 'notion',
        name: 'Notion',
        subtitle: 'تنظيم الملاحظات والمهام',
        badge: '✍️ تنظيم',
        badgeBg: 'rgba(139, 92, 246, 0.15)',
        badgeColor: '#a78bfa',
        badgeBorder: 'rgba(139, 92, 246, 0.35)',
        iconImage: 'icons/notion.jpg',
        iconFallback: 'fa-book',
        iconColor: '#1f2937',
        rating: '4.5',
        downloads: '10 مليون+',
        description: 'مساحة عمل شاملة تجمع الملاحظات، المهام، الجداول، وقواعد البيانات في تطبيق واحد مع مزامنة سحابية فورية عبر جميع أجهزتك.',
        why: [
          'تنظيم كل شيء في مكان واحد',
          'نسخ احتياطي سحابي آمن',
          'مجاني بالكامل للطلاب والجامعات'
        ],
        downloadUrl: 'https://play.google.com/store/apps/details?id=notion.id'
      },
      {
        id: 'forest',
        name: 'Forest',
        subtitle: 'ركّز بدون هاتف — ازرع شجرة',
        badge: '🌲 تركيز',
        badgeBg: 'rgba(16, 185, 129, 0.15)',
        badgeColor: '#34d399',
        badgeBorder: 'rgba(16, 185, 129, 0.35)',
        iconImage: 'icons/forest.jpg',
        iconFallback: 'fa-tree',
        iconColor: '#10b981',
        rating: '4.6',
        downloads: '10 مليون+',
        description: 'تطبيق يحوّل تركيزك إلى أشجار حقيقية تُزرع في العالم، مما يحفّزك على الابتعاد عن هاتفك والتركيز في دراستك. مشروع مكافحة التسويف الأكبر عالمياً.',
        why: [
          'يحفّزك على الابتعاد عن الهاتف',
          'يزرع أشجاراً حقيقية عند إنجازك',
          'تقارير أسبوعية مفصلة عن تركيزك'
        ],
        downloadUrl: 'https://play.google.com/store/apps/details?id=cc.forestapp'
      }
    ];

    // ============================================
    // عرض الشبكة
    // ============================================
    function renderGrid() {
      const grid = document.getElementById('toolsGrid');
      grid.innerHTML = '';

      TOOLS.forEach((tool, index) => {
        const card = document.createElement('div');
        card.className = 'tool-grid-card';
        card.style.animationDelay = (index * 0.07) + 's';
        card.onclick = () => openSheet(tool.id);

        card.innerHTML = `
          <div class="tool-grid-badge" style="background: ${tool.badgeBg}; color: ${tool.badgeColor}; border: 1px solid ${tool.badgeBorder};">
            ${tool.badge}
          </div>

          <div class="tool-grid-icon" style="background: ${hexToRgba(tool.iconColor, 0.15)}; border-color: ${hexToRgba(tool.iconColor, 0.35)};">
            <img 
              src="${tool.iconImage}" 
              alt="${tool.name}"
              onerror="this.style.display='none'; this.parentElement.innerHTML='<i class=\\'fa-solid ${tool.iconFallback}\\' style=\\'color: ${tool.iconColor}\\'></i>';"
            >
          </div>

          <div class="tool-grid-name">${tool.name}</div>

          <div class="tool-grid-rating">
            <i class="fa-solid fa-star"></i>
            <span>${tool.rating}</span>
          </div>
        `;

        grid.appendChild(card);
      });
    }

    // ============================================
    // فتح الـ Bottom Sheet
    // ============================================
    function openSheet(toolId) {
      const tool = TOOLS.find(t => t.id === toolId);
      if (!tool) return;

      const content = document.getElementById('sheetContent');
      const whyList = tool.why.map(item => `<li>${item}</li>`).join('');

      content.innerHTML = `
        <div class="sheet-header">
          <div class="sheet-app-icon-wrapper">
            <div class="sheet-app-icon" style="background: ${hexToRgba(tool.iconColor, 0.15)}; border-color: ${hexToRgba(tool.iconColor, 0.35)};">
              <img 
                src="${tool.iconImage}" 
                alt="${tool.name}"
                onerror="this.style.display='none'; this.parentElement.innerHTML='<i class=\\'fa-solid ${tool.iconFallback}\\' style=\\'color: ${tool.iconColor}\\'></i>';"
              >
            </div>
          </div>
          <div class="sheet-app-name">${tool.name}</div>
          <div class="sheet-app-subtitle">${tool.subtitle}</div>
          
          <div class="sheet-stats">
            <div class="sheet-stat rating">
              <i class="fa-solid fa-star"></i>
              <span>${tool.rating}</span>
            </div>
            <div class="sheet-stat">
              <i class="fa-solid fa-download"></i>
              <span>${tool.downloads}</span>
            </div>
          </div>
        </div>

        <div class="sheet-section">
          <div class="sheet-section-title">
            <i class="fa-solid fa-circle-info"></i>
            <span>عن التطبيق</span>
          </div>
          <div class="sheet-description">${tool.description}</div>
        </div>

        <div class="sheet-section">
          <div class="sheet-section-title">
            <i class="fa-solid fa-thumbs-up"></i>
            <span>لماذا رشّحناه؟</span>
          </div>
          <ul class="sheet-why-list">
            ${whyList}
          </ul>
        </div>

        <a href="${tool.downloadUrl}" target="_blank" rel="noopener noreferrer" class="sheet-google-play-btn">
          <div class="gp-btn-icon">
            <i class="fa-brands fa-google-play"></i>
          </div>
          <div class="gp-btn-text">
            <span class="gp-btn-sub">تحميل مجاني من</span>
            <span class="gp-btn-main">Google Play</span>
          </div>
          <div class="gp-btn-arrow">
            <i class="fa-solid fa-up-right-from-square"></i>
          </div>
        </a>
      `;

      document.getElementById('sheetOverlay').classList.add('active');
      document.getElementById('sheetModal').classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeSheet() {
      document.getElementById('sheetOverlay').classList.remove('active');
      document.getElementById('sheetModal').classList.remove('active');
      document.body.style.overflow = '';
    }

    // إغلاق بـ Escape
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeSheet();
    });

    // Swipe down للإغلاق
    var touchStartY = 0;
    var sheetModal = document.getElementById('sheetModal');
    if (sheetModal) {
      sheetModal.addEventListener('touchstart', (e) => {
        touchStartY = e.touches[0].clientY;
      }, { passive: true });

      sheetModal.addEventListener('touchmove', (e) => {
        const deltaY = e.touches[0].clientY - touchStartY;
        if (deltaY > 100 && sheetModal.scrollTop === 0) {
          closeSheet();
        }
      }, { passive: true });
    }

    // ============================================
    // أدوات مساعدة
    // ============================================
    function hexToRgba(hex, alpha) {
      if (!hex || hex[0] !== '#') return `rgba(16, 185, 129, ${alpha})`;
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    // ============================================
    // الثيمات
    // ============================================
    function applyTheme(theme) {
      localStorage.setItem('medfav_theme', theme);
      if (theme === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
      } else {
        document.documentElement.removeAttribute('data-theme');
      }
      const btn = document.getElementById('themeToggleBtn');
      if (btn) {
        btn.innerHTML = theme === 'light'
          ? '<i class="fa-solid fa-moon"></i>'
          : '<i class="fa-solid fa-sun"></i>';
      }
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', theme === 'light' ? '#f8fafb' : '#06110d');
    }

    function toggleTheme() {
      const current = localStorage.getItem('medfav_theme') || 'light';
      const next = current === 'light' ? 'dark' : 'light';
      applyTheme(next);
      showToast(next === 'light' ? 'تم تفعيل الوضع النهاري' : 'تم تفعيل الوضع الليلي', 'info');
    }

    // ============================================
    // Toast
    // ============================================
    function showToast(message, type = 'success') {
      const existing = document.querySelector('.toast');
      if (existing) existing.remove();

      const toast = document.createElement('div');
      toast.className = 'toast' + (type === 'error' ? ' error' : type === 'info' ? ' info' : '');

      const icon = type === 'error' ? 'fa-circle-exclamation'
                  : type === 'info' ? 'fa-circle-info'
                  : 'fa-circle-check';

      toast.innerHTML = `
        <i class="fa-solid ${icon}"></i>
        <span>${message}</span>
      `;

      document.body.appendChild(toast);
      requestAnimationFrame(() => toast.classList.add('visible'));

      setTimeout(() => {
        toast.classList.remove('visible');
        setTimeout(() => toast.remove(), 350);
      }, 2600);
    }

    // ============================================
    // التشغيل
    // ============================================
    document.addEventListener('DOMContentLoaded', () => {
      const savedTheme = localStorage.getItem('medfav_theme') || 'light';
      applyTheme(savedTheme);
      renderGrid();
      console.log('✅ tools.html v2.0 — ', TOOLS.length, 'أدوات احترافية');
    });
  
</script>
<script src="native.js"></script>
<script src="notifications.js"></script>

<!-- ============================================
     Shell feature flag: browsers without the View Transitions API.
     app.js picks the fallback animation itself; this class is exposed
     for page CSS that may want to opt out of motion.
     ============================================ -->
<script data-shell>
  (function () {
    try {
      if (!(window.CSS && CSS.supports && CSS.supports('view-transition-name', 'none'))) {
        document.documentElement.classList.add('no-vt');
      }
    } catch (e) {
      document.documentElement.classList.add('no-vt');
    }
  })();
</script>
