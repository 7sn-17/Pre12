<!-- Smooth page transitions (View Transitions API + fallback fade).
     The fixed bottom navigation gets its own view-transition-name and is
     frozen, so it can never move or fade while the page content changes. -->
<style data-shell>
  /* Global theme defaults. `data-theme` is always set by theme-init.js
     (light or dark), so native controls and scrollbars follow the app. */
  :root { color-scheme: light; --medapp-amber: #fbbf24; --medapp-orange: #fb923c; --medapp-blue: #93c5fd; --medapp-blue-soft: #bfdbfe; --medapp-violet: #c4b5fd; --medapp-green: #34d399; --medapp-red: #f87171; --medapp-pink: #f472b6; }
  [data-theme="dark"] { color-scheme: dark; }
  [data-theme="light"] { --medapp-amber: #b45309; --medapp-orange: #c2410c; --medapp-blue: #2563eb; --medapp-blue-soft: #1d4ed8; --medapp-violet: #6d28d9; --medapp-green: #047857; --medapp-red: #b91c1c; --medapp-pink: #be185d; }

  /* Premium smooth scrolling. The SPA router temporarily disables this for
     page swaps / Back restoration so navigation is instant, never animated. */
  html { scroll-behavior: smooth; }
  /* app.js sets this only for instant SPA swaps / Back restoration. */
  html.medapp-scroll-jump { scroll-behavior: auto !important; }

  html.medapp-navigating { cursor: progress; }

  /* ⭐IMPORTANT: the `hidden` attribute must always win.
     Author rules like `.detail-empty { display: flex }` beat the user-agent
     `[hidden] { display: none }` rule, which made "empty" blocks stay on
     screen on top of real content. */
  [hidden] { display: none !important; }

  /* ⭐ Tap targets: 44px minimum, no double-tap zoom, no grey flash. */
  button,
  a[role="button"],
  [role="button"] {
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }

  /* ⭐ انتقال ناعم بين الوضعين النهاري والليلي.
     يُفعَّل هذا الصنف لحظياً قبل تبديل الثيم (MedApp.withThemeTransition)
     فيتحوّل لون الخلفية والنص والحدود تدريجياً بدل القفز المفاجئ. */
  html.theme-transition,
  html.theme-transition body,
  html.theme-transition *,
  html.theme-transition *::before,
  html.theme-transition *::after {
    transition:
      background-color 0.34s ease,
      color 0.34s ease,
      border-color 0.34s ease,
      fill 0.34s ease,
      stroke 0.34s ease,
      box-shadow 0.34s ease !important;
    transition-delay: 0s !important;
  }

  /* Very thin top progress bar, shown by app.js during SPA navigation. */
  #medapp-loader {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    z-index: 2147483647;
    pointer-events: none;
    overflow: hidden;
    opacity: 0;
    transition: opacity 0.15s ease;
  }

  #medapp-loader::before {
    content: '';
    display: block;
    width: 40%;
    height: 100%;
    border-radius: 0 999px 999px 0;
    background: linear-gradient(90deg, transparent, #059669 18%, #10b981 52%, #34d399 82%, transparent);
    box-shadow: 0 0 8px rgba(16, 185, 129, 0.6);
    transform: translateX(-110%);
    will-change: transform;
  }

  html.medapp-loading #medapp-loader { opacity: 1; }
  html.medapp-loading #medapp-loader::before {
    animation: medapp-loader-slide 1.05s cubic-bezier(0.4, 0, 0.2, 1) infinite;
  }

  @keyframes medapp-loader-slide {
    0%   { transform: translateX(-110%); }
    100% { transform: translateX(360%); }
  }

  /* Only same-document transitions (started by app.js). Cross-document
     @view-transition is intentionally NOT enabled: full loads must behave
     exactly like the original pages. */

  .floating-nav-wrapper { view-transition-name: medapp-bottom-nav; }
  ::view-transition-group(medapp-bottom-nav) { animation: none; }
  ::view-transition-old(medapp-bottom-nav),
  ::view-transition-new(medapp-bottom-nav) { animation: none; }

  /* Keep the sticky header out of the root cross-fade. Otherwise the old and
     new snapshots of a translucent, blurred header overlap and look frozen /
     show a ghost shadow while the page changes. */
  header { view-transition-name: medapp-header; }
  ::view-transition-group(medapp-header) { animation: none; }
  ::view-transition-old(medapp-header),
  ::view-transition-new(medapp-header) { animation: none; }

  /* Light mode: the header must use a soft neutral shadow, never the heavy
     black shadow used by the dark theme. */
  [data-theme="light"] header {
    background: rgba(248, 250, 251, 0.92);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    backdrop-filter: blur(20px) saturate(180%);
    border-bottom-color: rgba(15, 23, 42, 0.08);
    box-shadow: 0 1px 0 rgba(15, 23, 42, 0.04);
    color: var(--text-primary);
  }

  /* Wins over every page-level `header.scrolled` (higher specificity). */
  [data-theme="light"] header.scrolled {
    background: rgba(248, 250, 251, 0.97);
    border-bottom-color: rgba(15, 23, 42, 0.1);
    box-shadow:
      0 4px 18px rgba(15, 23, 42, 0.08),
      0 1px 0 rgba(15, 23, 42, 0.05);
  }

  @media (prefers-reduced-motion: no-preference) {
    ::view-transition-old(root) { animation: pt-fade-out 0.14s cubic-bezier(0.4, 0, 0.2, 1) both; }
    ::view-transition-new(root) { animation: pt-fade-in 0.2s cubic-bezier(0.4, 0, 0.2, 1) both; }
  }

  /* No body animation on browsers without View Transitions: the swap is
     already synchronous, and fading the body element would also fade the
     fixed bottom navigation. The nav must never move or fade. */

  @keyframes pt-fade-in  { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pt-fade-out { from { opacity: 1; } to { opacity: 0; } }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto !important; }
    html.theme-transition,
    html.theme-transition body,
    html.theme-transition *,
    html.theme-transition *::before,
    html.theme-transition *::after {
      transition: none !important;
    }
    #medapp-loader::before {
      animation: none !important;
      transform: none;
      width: 60%;
    }
    ::view-transition-old(root), ::view-transition-new(root),
    ::view-transition-old(medapp-bottom-nav), ::view-transition-new(medapp-bottom-nav),
    ::view-transition-old(medapp-header), ::view-transition-new(medapp-header) { animation: none !important; }
  }

  /* ============================================================
     Premium file visual — shared by every file surface.
     The helper `getFileIconMarkup()` in files.js supplies the
     colour tokens; page classes (mini-file-icon, file-icon,
     file-type-icon, …) keep their existing dimensions.
     ============================================================ */
  .premium-file-icon {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    border-radius: 12px;
    flex-shrink: 0;
    overflow: hidden;
    isolation: isolate;
    color: var(--pf-color, #94a3b8);
    background:
      linear-gradient(145deg, var(--pf-bg, rgba(148, 163, 184, 0.16)), rgba(255, 255, 255, 0.02)),
      var(--bg-card, #0a1a14);
    border: 1px solid var(--pf-border, rgba(148, 163, 184, 0.34));
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.34),
      0 6px 15px -9px var(--pf-glow, rgba(148, 163, 184, 0.24));
    transition: transform 0.24s ease, box-shadow 0.24s ease, border-color 0.24s ease;
  }

  .premium-file-icon::before {
    content: '';
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.32), transparent 46%);
    opacity: 0.85;
  }

  .premium-file-icon::after {
    content: '';
    position: absolute;
    top: -36%;
    right: -30%;
    width: 78%;
    height: 78%;
    z-index: 0;
    border-radius: 50%;
    pointer-events: none;
    background: var(--pf-glow, rgba(148, 163, 184, 0.24));
    filter: blur(9px);
  }

  .premium-file-icon > i {
    position: relative;
    z-index: 2;
    display: inline-block;
    line-height: 1;
    font-size: 1.14rem;
    transform: translateY(-2px);
    filter: drop-shadow(0 2px 3px var(--pf-glow, rgba(148, 163, 184, 0.24)));
  }

  .premium-file-icon__ext {
    position: absolute;
    left: 50%;
    bottom: 2px;
    z-index: 2;
    transform: translateX(-50%);
    font-family: 'Cairo', sans-serif;
    font-size: 0.39rem;
    font-weight: 900;
    line-height: 1;
    letter-spacing: 0.15px;
    color: var(--pf-color, #94a3b8);
    opacity: 0.92;
    pointer-events: none;
  }

  [data-theme="light"] .premium-file-icon {
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.78),
      0 5px 13px -10px var(--pf-glow, rgba(148, 163, 184, 0.24));
  }

  [data-theme="light"] .premium-file-icon::before {
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.55), transparent 48%);
  }

  @media (prefers-reduced-motion: reduce) {
    .premium-file-icon { transition: none; }
  }

<style>

    [data-theme="light"] {

    }

    * { 
      box-sizing: border-box; 
      margin: 0;

    /* ============ Connection Banner ============ */
    .connection-banner {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      padding: 8px 16px;
      text-align: center;
      font-size: 0.78rem;
      font-weight: 800;
      z-index: 9999;
      transform: translateY(-100%);
      transition: transform 0.3s ease;
      display: flex;

      justify-content: center;

    /* ============ Header ============ */
    /* ============================================================
   Unified Top Bar — المصدر الوحيد لشكل الشريط العلوي
   ------------------------------------------------------------
   التصميم مستوحى من notes.html (الصفحة المرجعية)، ومطبَّق على:
     notes.html · my-lectures.html · progress.html
     admin.html · admin-user.html

   كل القيم تستخدم متغيّرات الصفحة مع قيم احتياطية، حتى يعمل
   الجزء نفسه على الصفحات التي تسمّي المتغيّر --accent أو
   --accent-emerald، أو --t أو --transition-fast.
   ============================================================ */

header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(6, 17, 13, 0.9);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border-card, rgba(16, 185, 129, 0.18));
  padding: 14px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  min-height: 70px;
  box-sizing: border-box;
}

[data-theme="light"] header {
  background: rgba(248, 250, 251, 0.9);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  backdrop-filter: blur(20px) saturate(180%);
  border-bottom-color: rgba(15, 23, 42, 0.08);
  box-shadow: 0 1px 0 rgba(15, 23, 42, 0.04);
}

.nav-btn {
  width: 46px;
  height: 46px;
  min-width: 46px;
  min-height: 46px;
  padding: 0;
  border-radius: 14px;
  background: var(--bg-card, rgba(16, 34, 27, 0.65));
  border: 1px solid var(--border-card, rgba(16, 185, 129, 0.18));
  color: var(--text-primary, #f0fdf4);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  text-decoration: none;
  transition: all var(--transition-fast, var(--t, var(--t-fast, 0.2s cubic-bezier(0.4, 0, 0.2, 1))));
  flex-shrink: 0;
  line-height: 1;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  position: relative;
  pointer-events: auto;
  overflow: visible;
  box-sizing: border-box;
}

/* ⭐ منطقة اللمس تغطي المربع بالكامل (وليس الأيقونة فقط).
   العنصر ::after يغطي الصندوق بالكامل، والنقر عليه يمر إلى الزر. */
.nav-btn::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: auto;
}

.nav-btn:hover {
  border-color: var(--accent-emerald, var(--accent, #10b981));
  color: var(--accent-light, #34d399);
  transform: translateY(-1px);
}

.nav-btn:active {
  transform: scale(0.92);
  border-color: var(--accent-emerald, var(--accent, #10b981));
  background: var(--bg-card-hover, rgba(22, 48, 38, 0.9));
}

/* Lucide (svg) و Font Awesome (i) — يملآن المربع تقريباً */
.nav-btn svg {
  width: 22px;
  height: 22px;
  display: block;
  flex-shrink: 0;
}

.nav-btn i {
  font-size: 1.15rem;
  line-height: 1;
  width: 22px;
  height: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

/* Lucide (svg) و Font Awesome (i) — نفس المقاس والتمركز */
.header-title {

    .container {

    /* ============ Tabs ============ */

      border: 1px solid var(--border-card);

      padding: 12px 14px;

      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: all var(--transition-fast);
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      position: relative;
    }

    .notes-tab i { width: 16px; height: 16px; }

    .notes-tab.active {
      background: linear-gradient(135deg, var(--accent-emerald), var(--accent-dark));
      color: white;
      box-shadow: 0 4px 12px var(--accent-glow-strong);
    }

    .notes-tab .tab-count {

      padding: 2px 8px;
      border-radius: 8px;
      font-size: 0.7rem;
      font-weight: 800;
    }

    .notes-tab.active .tab-count {
      background: rgba(255, 255, 255, 0.25);
    }

    /* مؤشر المزامنة */
    .sync-indicator {
      position: absolute;
      top: 6px;
      left: 8px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #fbbf24;
      box-shadow: 0 0 8px #fbbf24;
      animation: syncPulse 1.5s ease-in-out infinite;
      display: none;
    }

    .sync-indicator.visible { display: block; }

    @keyframes syncPulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.4); opacity: 0.6; }
    }

    /* ============ Search ============ */
    .search-wrapper {
      position: relative;
      margin-bottom: 16px;
    }

    .search-input {
      width: 100%;
      padding: 13px 46px 13px 46px;
      border-radius: 14px;
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      color: var(--text-primary);
      font-size: 0.9rem;
      outline: none;
      font-family: inherit;
      transition: all var(--transition-fast);

    .notes-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* ============ Note Card ============ */
    .note-card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 20px;
      padding: 18px;
      position: relative;
      overflow: hidden;
      transition: all var(--transition-smooth);
      animation: cardIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) backwards;
      backdrop-filter: blur(12px);
      box-shadow: 
        0 1px 2px rgba(0, 0, 0, 0.06),
        0 4px 12px rgba(0, 0, 0, 0.1),
        0 12px 28px -8px rgba(0, 0, 0, 0.2);
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .note-card::before {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      width: 4px;
      height: 100%;
      background: linear-gradient(180deg, var(--accent-emerald), var(--accent-dark));
      opacity: 0.6;
      transition: opacity 0.3s;
    }

    .note-card.private::before {
      background: linear-gradient(180deg, #a78bfa, #7c3aed);
    }

    .note-card.shared::before {
      background: linear-gradient(180deg, #60a5fa, #2563eb);
    }

    .note-card.pending::before {
      background: linear-gradient(180deg, #fbbf24, #f59e0b);
      animation: pulseBorder 2s infinite;
    }

    @keyframes pulseBorder {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    .note-card:hover {
      border-color: var(--border-card-hover);
      transform: translateY(-3px);
      background: var(--bg-card-hover);
      box-shadow: 
        0 4px 8px rgba(0, 0, 0, 0.1),
        0 12px 24px rgba(0, 0, 0, 0.15),
        0 20px 40px -10px rgba(16, 185, 129, 0.25);
    }

    .note-card.removing {
      opacity: 0;
      transform: translateX(-30px) scale(0.95);
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.4, 0, 1, 1);
    }

    .note-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border-card);
    }

    .note-header-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0;
    }

    .note-type-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 12px;
      flex-shrink: 0;
      border: 1px solid;
    }

    .note-type-badge i { width: 20px; height: 20px; }

    .note-type-badge.private {
      background: rgba(139, 92, 246, 0.15);
      border-color: rgba(139, 92, 246, 0.4);
      color: var(--medapp-violet);
    }

    .note-type-badge.shared {
      background: rgba(59, 130, 246, 0.15);
      border-color: rgba(59, 130, 246, 0.4);
      color: var(--medapp-blue);
    }

    .note-title {
      font-size: 1.02rem;
      font-weight: 800;
      color: var(--text-primary);
      line-height: 1.4;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    /* ============ Delete Button ============ */
    .note-delete-btn {
      width: 36px;
      height: 36px;
      border-radius: 11px;
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.2);
      color: var(--medapp-red);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all var(--transition-fast);
      font-family: inherit;
      opacity: 0.7;
      position: relative;
      z-index: 2;
    }

    .note-delete-btn:hover {
      background: rgba(239, 68, 68, 0.18);
      border-color: var(--danger);
      opacity: 1;
      transform: scale(1.05);
    }

    .note-delete-btn i { width: 16px; height: 16px; }

    /* ============ Delete Confirmation ============ */
    .delete-confirm {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 12px;
      margin-top: 12px;
      animation: slideDown 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .delete-confirm-text {
      flex: 1;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--medapp-red);
    }

    .delete-confirm-btn {
      padding: 6px 12px;
      border-radius: 8px;
      border: none;
      font-size: 0.75rem;
      font-weight: 800;
      cursor: pointer;
      font-family: inherit;
      transition: all var(--transition-fast);
    }

    .delete-confirm-btn.yes {
      background: var(--danger);
      color: white;
    }

    .delete-confirm-btn.yes:hover {
      background: #b91c1c;
      transform: scale(1.05);
    }

    .delete-confirm-btn.no {
      background: rgba(128, 128, 128, 0.15);
      color: var(--text-primary);
    }

    .delete-confirm-btn.no:hover {
      background: rgba(128, 128, 128, 0.25);
    }

    /* ============ Content ============ */
    .note-content {
      font-size: 0.94rem;
      color: var(--text-primary);
      line-height: 1.85;
      white-space: pre-wrap;
      word-break: break-word;
      margin-bottom: 16px;
      opacity: 0.9;
    }

    .note-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding-top: 12px;
      border-top: 1px solid var(--border-card);
    }

    .note-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.74rem;
      color: var(--text-muted);
      font-weight: 600;
      flex-wrap: wrap;
    }

    .note-meta-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .note-meta-item i { width: 13px; height: 13px; }

    .note-meta-item.pending {
      color: var(--medapp-amber);
      font-weight: 800;
    }

    .note-author {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 10px 4px 4px;
      border-radius: 20px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.25);
    }

    .note-author-avatar {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-emerald), var(--accent-dark));
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 0.7rem;
      font-weight: 800;
      flex-shrink: 0;
    }

    .note-author-name {
      font-size: 0.76rem;
      color: var(--accent-light);
      font-weight: 800;
    }

    /* ============ Empty ============ */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      animation: fadeIn 0.4s ease;
    }

    .empty-state.visible { display: flex; }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .empty-icon {
      width: 80px; height: 80px;
      border-radius: 24px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px dashed var(--border-card);
      display: flex; align-items: center; justify-content: center;
      color: var(--text-muted);
    }

    .empty-icon i { width: 36px; height: 36px; }

    .empty-state h3 { font-size: 1rem; font-weight: 800; color: var(--text-primary); }
    .empty-state p { font-size: 0.82rem; color: var(--text-secondary); max-width: 280px; line-height: 1.6; }

    /* ============ FAB ============ */
    .fab {
      position: fixed;
      bottom: 24px;
      left: 24px;
      width: 58px; height: 58px;
      border-radius: 18px;
      background: linear-gradient(135deg, var(--accent-emerald), var(--accent-dark));
      border: none;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 
        0 4px 8px rgba(0, 0, 0, 0.15),
        0 12px 24px rgba(16, 185, 129, 0.4),
        0 20px 40px -8px rgba(16, 185, 129, 0.5);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 500;
      font-family: inherit;
    }

    .fab:hover {
      transform: translateY(-4px) rotate(90deg);
      box-shadow: 
        0 6px 12px rgba(0, 0, 0, 0.2),
        0 16px 32px rgba(16, 185, 129, 0.5),
        0 24px 48px -8px rgba(16, 185, 129, 0.6);
    }

    .fab i { width: 26px; height: 26px; }

    /* ============ Modal ============ */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(3, 10, 8, 0.92);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      z-index: 3000;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--transition-smooth);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-y: auto;
    }

    [data-theme="light"] .modal-overlay { background: rgba(248, 250, 251, 0.92); }

    .modal-overlay.active { opacity: 1; pointer-events: auto; }

    .modal-card {
      background: linear-gradient(180deg, var(--bg-elevated) 0%, var(--bg-solid) 100%);
      border: 1px solid var(--border-card-hover);
      border-radius: 28px;
      padding: 0;
      max-width: 500px;
      width: 100%;
      max-height: 92vh;
      overflow: hidden;
      transform: scale(0.9) translateY(30px);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 
        0 20px 60px rgba(0, 0, 0, 0.6),
        0 40px 100px -20px rgba(16, 185, 129, 0.3);
      position: relative;
      display: flex;
      flex-direction: column;
    }

    [data-theme="light"] .modal-card {
      background: linear-gradient(180deg, #ffffff 0%, #f8fafb 100%);
      box-shadow:
        0 20px 60px rgba(15, 23, 42, 0.16),
        0 40px 100px -20px rgba(16, 185, 129, 0.18);
    }

    .modal-overlay.active .modal-card { 
      transform: scale(1) translateY(0); 
    }

    .modal-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, 
        var(--accent-emerald), 
        var(--accent-light), 
        var(--accent-emerald));
      background-size: 200% 100%;
      animation: gradientShift 3s ease infinite;
    }

    @keyframes gradientShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .modal-header {
      padding: 24px 24px 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      position: relative;
    }

    .modal-title-wrapper {
      display: flex;
      align-items: center;
      gap: 14px;
      flex: 1;
      min-width: 0;
    }

    .modal-title-icon {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--accent-emerald), var(--accent-dark));
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      flex-shrink: 0;
      box-shadow: 
        0 8px 20px var(--accent-glow-strong),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
      animation: iconPop 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes iconPop {
      from { transform: scale(0.5) rotate(-10deg); opacity: 0; }
      to { transform: scale(1) rotate(0); opacity: 1; }
    }

    .modal-title-icon i { width: 26px; height: 26px; }

    .modal-title-text {
      min-width: 0;
      flex: 1;
    }

    .modal-title {
      font-size: 1.2rem;
      font-weight: 900;
      color: var(--text-primary);
      line-height: 1.3;
      margin-bottom: 2px;
    }

    .modal-subtitle {
      font-size: 0.78rem;
      color: var(--text-secondary);
      font-weight: 600;
      line-height: 1.4;
    }

    .modal-close {
      width: 38px; height: 38px;
      border-radius: 12px;
      background: rgba(128, 128, 128, 0.08);
      border: 1px solid var(--border-card);
      color: var(--text-secondary);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: all var(--transition-fast);
      font-family: inherit;
      flex-shrink: 0;
    }

    .modal-close:hover { 
      background: rgba(239, 68, 68, 0.15); 
      border-color: var(--danger); 
      color: var(--danger);
      transform: rotate(90deg);
    }

    .modal-close i { width: 18px; height: 18px; }

    .modal-body {
      padding: 8px 24px 20px;
      overflow-y: auto;
      flex: 1;
      scrollbar-width: thin;
      scrollbar-color: var(--border-card) transparent;
    }

    .modal-body::-webkit-scrollbar { width: 4px; }
    .modal-body::-webkit-scrollbar-thumb { 
      background: var(--border-card); 
      border-radius: 2px;
    }

    .form-group { margin-bottom: 18px; }

    .form-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 10px;
    }

    .form-label-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .form-label-left i {
      width: 14px;
      height: 14px;
      color: var(--accent-light);
    }

    .form-label-hint {
      font-size: 0.68rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .form-input, .form-textarea {
      width: 100%;
      padding: 14px 16px;
      border-radius: 14px;
      background: rgba(6, 17, 13, 0.5);
      border: 1.5px solid var(--border-card);
      color: var(--text-primary);
      font-size: 0.92rem;
      outline: none;
      font-family: inherit;
      transition: all var(--transition-fast);
      resize: none;
    }

    [data-theme="light"] .form-input,
    [data-theme="light"] .form-textarea {
      background: rgba(248, 250, 252, 0.8);
    }

    .form-input:focus, .form-textarea:focus {
      border-color: var(--accent-emerald);
      box-shadow: 0 0 0 4px var(--accent-glow);
      background: rgba(6, 17, 13, 0.8);
    }

    [data-theme="light"] .form-input:focus,
    [data-theme="light"] .form-textarea:focus {
      background: #ffffff;
    }

    .form-input::placeholder, 
    .form-textarea::placeholder { 
      color: var(--text-muted); 
    }

    .form-textarea {
      min-height: 140px;
      line-height: 1.7;
    }

    /* عداد الأحرف */
    .char-counter {
      display: flex;
      justify-content: flex-end;
      font-size: 0.68rem;
      color: var(--text-muted);
      font-weight: 700;
      margin-top: 4px;
      transition: color var(--transition-fast);
    }

    .char-counter.warning { color: var(--warning); }
    .char-counter.danger { color: var(--danger); }

    /* اختيار النوع */
    .type-selector {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .type-option {
      padding: 16px 12px;
      border-radius: 16px;
      background: rgba(6, 17, 13, 0.4);
      border: 2px solid var(--border-card);
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      font-family: inherit;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      position: relative;
      overflow: hidden;
    }

    [data-theme="light"] .type-option {
      background: rgba(248, 250, 252, 0.6);
    }

    .type-option::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, currentColor 0%, transparent 70%);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .type-option:hover {
      border-color: var(--border-card-hover);
      transform: translateY(-2px);
    }

    .type-option.selected {
      border-color: var(--accent-emerald);
      background: rgba(16, 185, 129, 0.08);
      box-shadow: 0 6px 20px var(--accent-glow);
    }

    .type-option.selected[data-type="private"] {
      border-color: var(--violet);
      background: rgba(139, 92, 246, 0.08);
      box-shadow: 0 6px 20px rgba(139, 92, 246, 0.25);
    }

    .type-option.selected[data-type="shared"] {
      border-color: var(--info);
      background: rgba(59, 130, 246, 0.08);
      box-shadow: 0 6px 20px rgba(59, 130, 246, 0.25);
    }

    /* علامة الاختيار */
    .type-option.selected::after {
      content: '✓';
      position: absolute;
      top: 8px;
      left: 10px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--accent-emerald);
      color: white;
      font-size: 0.7rem;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: checkPop 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .type-option.selected[data-type="private"]::after {
      background: var(--violet);
    }

    .type-option.selected[data-type="shared"]::after {
      background: var(--info);
    }

    @keyframes checkPop {
      from { transform: scale(0); }
      to { transform: scale(1); }
    }

    .type-icon {
      width: 40px; height: 40px;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      position: relative;
      z-index: 1;
      transition: transform 0.3s;
    }

    .type-option:hover .type-icon {
      transform: scale(1.1) rotate(-5deg);
    }

    .type-option.selected .type-icon {
      transform: scale(1.15);
    }

    .type-icon i { width: 20px; height: 20px; }

    /* ✅ إصلاح: ألوان النص واضحة لكل نوع */
    .type-label { 
      font-size: 0.85rem; 
      font-weight: 800; 
      position: relative;
      z-index: 1;
      transition: color 0.25s ease;
    }

    /* خاصة - بنفسجي واضح */
    .type-option[data-type="private"] .type-label {
      color: var(--medapp-violet);
    }

    /* مشتركة - أزرق واضح */
    .type-option[data-type="shared"] .type-label {
      color: var(--medapp-blue);
    }

    /* عند الاختيار تصبح أكثر إشراقاً */
    .type-option.selected[data-type="private"] .type-label {
      color: var(--medapp-violet);
      text-shadow: 0 0 12px rgba(167, 139, 250, 0.5);
    }

    .type-option.selected[data-type="shared"] .type-label {
      color: var(--medapp-blue);
      text-shadow: 0 0 12px rgba(96, 165, 250, 0.5);
    }

    /* في الوضع الفاتح - أغمق قليلاً ليكون واضحاً */
    [data-theme="light"] .type-option[data-type="private"] .type-label {
      color: #7c3aed;
    }

    [data-theme="light"] .type-option[data-type="shared"] .type-label {
      color: #2563eb;
    }

    [data-theme="light"] .type-option.selected[data-type="private"] .type-label {
      color: #6d28d9;
    }

    [data-theme="light"] .type-option.selected[data-type="shared"] .type-label {
      color: #1d4ed8;
    }
    
    .type-desc { 
      font-size: 0.68rem; 
      color: var(--text-muted); 
      font-weight: 600;
      position: relative;
      z-index: 1;
      line-height: 1.3;
    }

    /* أزرار المودال */
    .modal-actions {
      padding: 16px 24px 20px;
      display: flex;
      gap: 10px;
      background: rgba(6, 17, 13, 0.3);
      border-top: 1px solid var(--border-card);
      backdrop-filter: blur(10px);
    }

    [data-theme="light"] .modal-actions {
      background: rgba(248, 250, 252, 0.5);
    }

    .btn {
      flex: 1;
      padding: 14px;
      border-radius: 14px;
      border: 1px solid transparent;
      font-family: inherit;
      font-size: 0.92rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
      transform: translateX(-100%);
      transition: transform 0.6s;
    }

    .btn:hover::before { transform: translateX(100%); }

    .btn i { width: 18px; height: 18px; position: relative; z-index: 1; }
    .btn span { position: relative; z-index: 1; }

    .btn.primary {
      background: linear-gradient(135deg, var(--accent-emerald), var(--accent-dark));
      color: white;
      box-shadow: 0 6px 16px var(--accent-glow-strong);
    }

    .btn.primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px var(--accent-glow-strong);
    }

    .btn.secondary {
      background: rgba(128, 128, 128, 0.08);
      border-color: var(--border-card);
      color: var(--text-secondary);
    }

    .btn.secondary:hover {
      background: rgba(128, 128, 128, 0.15);
      color: var(--text-primary);
    }

    .btn:disabled { 
      opacity: 0.6; 
      cursor: not-allowed; 
      transform: none !important;
    }

    /* ============ Toast ============ */
    .toast {
      position: fixed;
      top: 90px; left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: rgba(16, 185, 129, 0.98);
      color: white;
      padding: 13px 22px;
      border-radius: 14px;
      font-size: 0.88rem;
      font-weight: 700;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
      z-index: 9999;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(16px);
      display: flex; 
      align-items: center; 
      gap: 10px;
      max-width: calc(100vw - 40px);
      pointer-events: none;
    }

    .toast.visible { 
      opacity: 1; 
      visibility: visible;
      transform: translateX(-50%) translateY(0); 
    }
    
    .toast.error { background: rgba(239, 68, 68, 0.98); }
    .toast.info { background: rgba(59, 130, 246, 0.98); }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { animation: spin 1s linear infinite; }

    /* ============ Responsive ============ */
    @media (max-width: 640px) {
      header { padding: 12px 16px; }
      .container { padding: 16px 14px; }
      .notes-tab { padding: 10px; font-size: 0.8rem; }
      .note-card { padding: 14px 16px; border-radius: 16px; }
      .fab { bottom: 20px; left: 16px; width: 54px; height: 54px; }
      .fab i { width: 24px; height: 24px; }
      .modal-card { border-radius: 24px; max-height: 94vh; }
      .modal-header { padding: 20px 18px 12px; }
      .modal-body { padding: 8px 18px 16px; }
      .modal-actions { padding: 14px 18px 18px; }
      .modal-title-icon { width: 44px; height: 44px; }
      .modal-title-icon i { width: 22px; height: 22px; }
      .modal-title { font-size: 1.05rem; }
      .type-option { padding: 14px 10px; }
    }

    @media (max-width: 380px) {
      .type-selector { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { 
        animation-duration: 0.01ms !important; 
        transition-duration: 0.01ms !important; 
      }
    }
  </style>
</head>
<body>

  <!-- شريط حالة الاتصال -->
  <div class="connection-banner" id="connectionBanner">
    <i data-lucide="wifi-off"></i>
    <span id="connectionText">لا يوجد اتصال بالإنترنت</span>
  </div>

<header>
  <a href="index.html" class="nav-btn">
    <i data-lucide="arrow-right"></i>
  </a>

  <div class="header-title">الملاحظات</div>

  <div style="width: 42px;"></div>
</header>



  <div class="container">

    <div class="notes-tabs">
      <button class="notes-tab active" data-tab="mine" onclick="switchNotesTab('mine')">
        <i data-lucide="lock"></i>
        <span>ملاحظاتي</span>
        <span class="tab-count" id="mineCount">0</span>
      </button>
      <button class="notes-tab" data-tab="shared" onclick="switchNotesTab('shared')">
        <span class="sync-indicator" id="syncIndicator"></span>
        <i data-lucide="users"></i>
        <span>ملاحظات الزملاء</span>
        <span class="tab-count" id="sharedCount">0</span>
      </button>
    </div>

    <div class="search-wrapper">
      <input 
        type="text" 
        id="notesSearch"
        class="search-input" 
        placeholder="ابحث في الملاحظات..."
        oninput="handleSearch(this.value)"
      >
      <i data-lucide="search" class="icon-right"></i>
    </div>

    <div class="notes-list" id="notesList"></div>

    <div class="empty-state" id="notesEmpty">
      <div class="empty-icon"><i data-lucide="notebook-pen"></i></div>
      <h3 id="emptyTitle">لا توجد ملاحظات بعد</h3>
      <p id="emptyMessage">ابدأ بإضافة ملاحظاتك الخاصة</p>
    </div>

  </div>

  <button class="fab" onclick="openAddModal()" title="إضافة ملاحظة">
    <i data-lucide="plus"></i>
  </button>

  <!-- Modal -->
  <div class="modal-overlay" id="addModal" onclick="closeAddModalIfOutside(event)">
    <div class="modal-card" onclick="event.stopPropagation()">
      
      <div class="modal-header">
        <div class="modal-title-wrapper">
          <div class="modal-title-icon">
            <i data-lucide="notebook-pen"></i>
          </div>
          <div class="modal-title-text">
            <div class="modal-title">ملاحظة جديدة</div>
            <div class="modal-subtitle">وثّق أفكارك الدراسية</div>
          </div>
        </div>
        <button class="modal-close" onclick="closeAddModal()">
          <i data-lucide="x"></i>
        </button>
      </div>

      <div class="modal-body">
        
        <div class="form-group">
          <label class="form-label" for="noteTitle">
            <div class="form-label-left">
              <i data-lucide="type"></i>
              <span>العنوان</span>
            </div>
            <span class="form-label-hint" id="titleCounter">0/100</span>
          </label>
          <input 
            type="text" 
            id="noteTitle" 
            class="form-input" 
            placeholder="مثال: ملخص الفصل الأول"
            maxlength="100"
            oninput="updateCounter('noteTitle', 'titleCounter', 100)"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="noteContent">
            <div class="form-label-left">
              <i data-lucide="align-right"></i>
              <span>المحتوى</span>
            </div>
            <span class="form-label-hint" id="contentCounter">0/5000</span>
          </label>
          <textarea 
            id="noteContent" 
            class="form-textarea" 
            placeholder="اكتب ملاحظتك هنا..."
            maxlength="5000"
            oninput="updateCounter('noteContent', 'contentCounter', 5000)"
          ></textarea>
        </div>

        <div class="form-group">
          <label class="form-label">
            <div class="form-label-left">
              <i data-lucide="eye"></i>
              <span>نوع الملاحظة</span>
            </div>
          </label>
          <div class="type-selector">
            <button type="button" class="type-option selected" data-type="private" onclick="selectNoteType('private')">
              <div class="type-icon" style="background: rgba(139, 92, 246, 0.15); color: var(--medapp-violet);">
                <i data-lucide="lock"></i>
              </div>
              <div class="type-label">خاصة</div>
              <div class="type-desc">أنت فقط — تُزامن بين أجهزتك</div>
            </button>
            <button type="button" class="type-option" data-type="shared" onclick="selectNoteType('shared')">
              <div class="type-icon" style="background: rgba(59, 130, 246, 0.15); color: var(--medapp-blue);">
                <i data-lucide="users"></i>
              </div>
              <div class="type-label">مشتركة</div>
              <div class="type-desc">الجميع — تحتاج إنترنت</div>
            </button>
          </div>
        </div>

      </div>

      <div class="modal-actions">
        <button class="btn secondary" onclick="closeAddModal()">
          <i data-lucide="x"></i>
          <span>إلغاء</span>
        </button>
        <button class="btn primary" onclick="saveNote()" id="saveBtn">
          <i data-lucide="check"></i>
          <span>حفظ الملاحظة</span>
        </button>
      </div>

    </div>
  </div>

<script src="supabase-config.js"></script>
<script src="auth.js"></script>
<script src="db.js"></script>
<script src="sync.js"></script>


  <script src="app.js?v=4.7.0"></script>
<script>

    lucide.createIcons();

    // ============================================
    // State
    // ============================================
    var state = {
      currentUser: null,
      currentProfile: null,
      currentTab: 'mine',
      currentType: 'private',
      myNotes: [],
      sharedNotes: [],
      pendingNotes: [],
      searchQuery: '',
      deletingId: null,
      isSaving: false,      // 🔒 منع الحفظ المزدوج
      isSyncing: false      // 🔒 منع المزامنة المزدوجة
    };

    // ============================================
    // Storage Keys
    // ============================================
    var KEYS = {
      MY_NOTES: 'medfav_my_notes_v3',
      PENDING: 'medfav_pending_v3',
      SHARED_CACHE: 'medfav_shared_cache_v3',
      PROFILE_CACHE: 'medfav_profile_cache_v3',
      NOTE_DELETES: 'medapp_note_deletes_v1'
    };

    // ============================================
    // Storage Helpers
    // ============================================
    function saveToStorage(key, data) {
      try {
        localStorage.setItem(key, JSON.stringify(data));
        return true;
      } catch (err) {
        console.error('saveToStorage error:', err);
        // محاولة تنظيف المساحة
        try {
          if (err.name === 'QuotaExceededError') {
            showToast('الذاكرة ممتلئة — احذف ملاحظات قديمة', 'error');
          }
        } catch (e) {}
        return false;
      }
    }

    function loadFromStorage(key, fallback = []) {
      try {
        const data = localStorage.getItem(key);
        return data ? JSON.parse(data) : fallback;
      } catch (err) {
        console.error('loadFromStorage error:', err);
        return fallback;
      }
    }

    // ============================================
    // Toast
    // ============================================
    var toastTimeout;
    function showToast(message, type = 'success') {
      try {
        const existing = document.querySelector('.toast');
        if (existing) existing.remove();
        
        clearTimeout(toastTimeout);
        
        const toast = document.createElement('div');
        toast.className = 'toast' + (type === 'error' ? ' error' : type === 'info' ? ' info' : '');
        
        const icon = type === 'error' ? 'alert-circle' : type === 'info' ? 'info' : 'check-circle-2';
        toast.innerHTML = `
          <i data-lucide="${icon}" style="width: 18px; height: 18px; flex-shrink: 0;"></i>
          <span>${message}</span>
        `;
        
        document.body.appendChild(toast);
        lucide.createIcons();
        
        requestAnimationFrame(() => toast.classList.add('visible'));
        
        toastTimeout = setTimeout(() => {
          toast.classList.remove('visible');
          setTimeout(() => toast.remove(), 300);
        }, 2000);
      } catch (err) {
        console.error('showToast error:', err);
      }
    }

    // ============================================
    // Connection Banner
    // ============================================
    var bannerTimeout;
    function showConnectionBanner(isOnline) {
      const banner = document.getElementById('connectionBanner');
      const text = document.getElementById('connectionText');
      const icon = banner.querySelector('i');
      
      banner.classList.remove('offline', 'online');
      
      if (isOnline) {
        banner.classList.add('online');
        text.textContent = 'تم استعادة الاتصال ✓';
        icon.setAttribute('data-lucide', 'wifi');
      } else {
        banner.classList.add('offline');
        text.textContent = 'لا يوجد اتصال — ستُزامن ملاحظاتك عند العودة';
        icon.setAttribute('data-lucide', 'wifi-off');
      }
      
      banner.classList.add('visible');
      lucide.createIcons();
      
      clearTimeout(bannerTimeout);
      bannerTimeout = setTimeout(() => {
        banner.classList.remove('visible');
      }, 3500);
    }

    // ============================================
    // Load User
    // ============================================
    async function loadUser() {
      const cachedProfile = loadFromStorage(KEYS.PROFILE_CACHE, null);
      
      let session = null;
      try {
        session = await getSession();
      } catch (err) {
        console.log('Session check failed:', err);
      }
      
      if (!session) {
        // محاولة استخدام البروفايل المخزن (offline)
        if (!navigator.onLine && cachedProfile) {
          state.currentUser = { 
            id: cachedProfile.id, 
            email: cachedProfile.email 
          };
          state.currentProfile = cachedProfile;
          return true;
        }
        
        window.location.href = 'login.html';
        return false;
      }
      
      state.currentUser = session.user;
      
      // استخدام الكاش فوراً لتجنب التأخير
      if (cachedProfile && cachedProfile.id === session.user.id) {
        state.currentProfile = cachedProfile;
      }
      
      // تحديث البروفايل في الخلفية
      if (navigator.onLine) {
        try {
          const profile = await getProfile(session.user.id);
          if (profile) {
            state.currentProfile = profile;
            saveToStorage(KEYS.PROFILE_CACHE, profile);
          }
        } catch (err) {
          console.log('Profile fetch failed, using cache');
        }
      }
      
      return true;
    }

    // ============================================
    // Load Notes
    // ============================================
    function generateNoteId() {
      try {
        if (window.crypto && typeof window.crypto.randomUUID === 'function') {
          return window.crypto.randomUUID();
        }
      } catch (e) {}
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (c) => {
        const r = Math.random() * 16 | 0;
        const v = c === 'x' ? r : ((r & 0x3) | 0x8);
        return v.toString(16);
      });
    }

    function loadPendingNotes() {
      const pending = loadFromStorage(KEYS.PENDING, []);
      state.pendingNotes = Array.isArray(pending) ? pending : [];
    }

    function privatePendingNotes() {
      return state.pendingNotes.filter(n => n && !n.is_shared);
    }

    function sharedPendingNotes() {
      return state.pendingNotes.filter(n => n && n.is_shared);
    }

    function loadMyNotes() {
      state.myNotes = loadFromStorage(KEYS.MY_NOTES, []);
      updateMineCount();
    }

    function loadCachedSharedNotes() {
      state.sharedNotes = loadFromStorage(KEYS.SHARED_CACHE, []);
      updateSharedCount();
    }

    async function loadSharedNotes() {
      // الكاش أولاً حتى تظهر الملاحظات بسرعة وبدون إنترنت.
      loadCachedSharedNotes();

      if (!navigator.onLine) return;

      // Central sync downloads both private and shared notes for this account.
      if (typeof syncNotesFromCloud === 'function') {
        const result = await syncNotesFromCloud(state.currentUser);
        if (result && result.ok) {
          state.myNotes = loadFromStorage(KEYS.MY_NOTES, []);
          state.sharedNotes = loadFromStorage(KEYS.SHARED_CACHE, []);
          loadPendingNotes();
          updateMineCount();
          updateSharedCount();
        }
        return;
      }

      // Fallback for an old cached shell.
      try {
        const { data, error } = await supabaseClient
          .from('notes')
          .select('*')
          .eq('is_shared', true)
          .order('created_at', { ascending: false });
        if (error) throw error;
        state.sharedNotes = data || [];
        saveToStorage(KEYS.SHARED_CACHE, state.sharedNotes);
        updateSharedCount();
      } catch (err) {
        console.error('loadSharedNotes error:', err);
      }
    }

    function updateMineCount() {
      const el = document.getElementById('mineCount');
      if (el) el.textContent = state.myNotes.length + privatePendingNotes().length;
    }

    function updateSharedCount() {
      const total = state.sharedNotes.length + sharedPendingNotes().length;
      const el = document.getElementById('sharedCount');
      if (el) el.textContent = total;

      const indicator = document.getElementById('syncIndicator');
      if (indicator) {
        indicator.classList.toggle('visible', state.pendingNotes.length > 0);
      }
    }

    // ============================================
    // Sync Pending
    // ============================================
    async function syncPending() {
      if (state.isSyncing) return;
      if (!navigator.onLine) return;
      if (typeof syncNotesFromCloud !== 'function') return;

      state.isSyncing = true;
      const before = state.pendingNotes.length;

      try {
        const result = await syncNotesFromCloud(state.currentUser);
        state.myNotes = loadFromStorage(KEYS.MY_NOTES, []);
        state.sharedNotes = loadFromStorage(KEYS.SHARED_CACHE, []);
        loadPendingNotes();
        updateMineCount();
        updateSharedCount();
        renderNotes();

        const remaining = state.pendingNotes.length;
        const successCount = Math.max(0, before - remaining);
        if (result && result.ok) {
          if (successCount > 0 && remaining === 0) {
            showToast(`تمت مزامنة ${successCount} ملاحظة ✓`);
          } else if (successCount > 0 && remaining > 0) {
            showToast(`تمت مزامنة ${successCount} — فشل ${remaining}`, 'info');
          }
        } else if (before > 0) {
          showToast('تعذّرت المزامنة — ستتم تلقائياً', 'info');
        }
      } catch (err) {
        console.warn('syncPending error:', err);
        if (before > 0) showToast('تعذّرت المزامنة — ستتم تلقائياً', 'info');
      } finally {
        state.isSyncing = false;
      }
    }

    // ============================================
    // Switch Tabs
    // ============================================
    function switchNotesTab(tab) {
      state.currentTab = tab;
      state.deletingId = null;
      
      document.querySelectorAll('.notes-tab').forEach(t => {
        t.classList.toggle('active', t.dataset.tab === tab);
      });
      
      const searchInput = document.getElementById('notesSearch');
      if (searchInput) {
        searchInput.value = '';
        state.searchQuery = '';
      }
      
      renderNotes();
    }

    // ============================================
    // Search
    // ============================================
    function handleSearch(query) {
      state.searchQuery = (query || '').toLowerCase().trim();
      renderNotes();
    }

    // ============================================
    // Render
    // ============================================
    function renderNotes() {
      try {
        const list = document.getElementById('notesList');
        const empty = document.getElementById('notesEmpty');
        const emptyTitle = document.getElementById('emptyTitle');
        const emptyMessage = document.getElementById('emptyMessage');
        
        if (!list) return;
        
        let notes = state.currentTab === 'mine'
          ? [...privatePendingNotes(), ...state.myNotes]
          : [...sharedPendingNotes(), ...state.sharedNotes];
        
        if (state.searchQuery) {
          notes = notes.filter(n => 
            (n.title || '').toLowerCase().includes(state.searchQuery) ||
            (n.content || '').toLowerCase().includes(state.searchQuery) ||
            (n.author_name && n.author_name.toLowerCase().includes(state.searchQuery))
          );
        }
        
        list.innerHTML = '';
        
        if (notes.length === 0) {
          empty.classList.add('visible');
          const iconEl = empty.querySelector('.empty-icon i');
          
          if (state.searchQuery) {
            emptyTitle.textContent = 'لا توجد نتائج';
            emptyMessage.textContent = 'لم نعثر على ملاحظات تطابق بحثك';
            iconEl.setAttribute('data-lucide', 'search-x');
          } else if (state.currentTab === 'mine') {
            emptyTitle.textContent = 'لا توجد ملاحظات';
            emptyMessage.textContent = 'ابدأ بإضافة ملاحظاتك الخاصة — تُحفظ وتُزامن بين أجهزتك';
            iconEl.setAttribute('data-lucide', 'notebook-pen');
          } else {
            emptyTitle.textContent = 'لا توجد ملاحظات مشتركة';
            emptyMessage.textContent = navigator.onLine 
              ? 'عندما يشارك الزملاء ملاحظاتهم، ستظهر هنا'
              : 'أنت غير متصل بالإنترنت حالياً';
            iconEl.setAttribute('data-lucide', 'users');
          }
          lucide.createIcons();
          return;
        }
        
        empty.classList.remove('visible');
        
        notes.forEach((note, i) => {
          list.appendChild(createNoteCard(note, i));
        });
        
        lucide.createIcons();
      } catch (err) {
        console.error('renderNotes error:', err);
      }
    }

    // ============================================
    // Create Card
    // ============================================
    function createNoteCard(note, index) {
      const isMine = state.currentUser && note.user_id === state.currentUser.id;
      const isPending = note._pending === true;
      const canDelete = isMine || state.currentProfile?.role === 'admin';
      const typeClass = note.is_shared ? 'shared' : 'private';
      const isDeleting = state.deletingId === note.id;
      
      const card = document.createElement('div');
      card.className = `note-card ${typeClass}` + (isPending ? ' pending' : '');
      card.dataset.noteId = note.id;
      card.style.animationDelay = (index * 0.04) + 's';
      
      const typeIcon = note.is_shared ? 'users' : 'lock';
      const authorInitial = note.author_name ? note.author_name.charAt(0).toUpperCase() : '؟';
      const authorName = note.is_shared ? escapeHtml(note.author_name || 'مجهول') : 'أنت';
      
      const pendingHtml = isPending ? `
        <div class="note-meta-item pending">
          <i data-lucide="clock"></i>
          <span>قيد المزامنة</span>
        </div>
      ` : '';
      
      const deleteHtml = isDeleting ? `
        <div class="delete-confirm">
          <span class="delete-confirm-text">حذف هذه الملاحظة؟</span>
          <button class="delete-confirm-btn yes" onclick="confirmDelete('${note.id}')">
            نعم
          </button>
          <button class="delete-confirm-btn no" onclick="cancelDelete()">
            لا
          </button>
        </div>
      ` : '';
      
      card.innerHTML = `
        <div class="note-header">
          <div class="note-header-left">
            <div class="note-type-badge ${typeClass}">
              <i data-lucide="${typeIcon}"></i>
            </div>
            <div class="note-title">${escapeHtml(note.title)}</div>
          </div>
          ${canDelete && !isDeleting ? `
            <button class="note-delete-btn" onclick="requestDelete('${note.id}')" title="حذف">
              <i data-lucide="trash-2"></i>
            </button>
          ` : ''}
        </div>
        
        <div class="note-content">${escapeHtml(note.content)}</div>
        
        <div class="note-footer">
          <div class="note-meta">
            <div class="note-meta-item">
              <i data-lucide="clock"></i>
              <span>${formatDate(note.created_at)}</span>
            </div>
            ${pendingHtml}
          </div>
          
          <div class="note-author">
            <div class="note-author-avatar">${authorInitial}</div>
            <span class="note-author-name">${authorName}</span>
          </div>
        </div>
        
        ${deleteHtml}
      `;
      
      return card;
    }

    // ============================================
    // Delete Flow
    // ============================================
    function requestDelete(noteId) {
      state.deletingId = noteId;
      renderNotes();
      lucide.createIcons();
    }

    function cancelDelete() {
      state.deletingId = null;
      renderNotes();
      lucide.createIcons();
    }

    function rememberQueuedDelete(noteId) {
      if (typeof queueNoteDelete === 'function') {
        queueNoteDelete(noteId);
        return;
      }
      try {
        const pending = loadFromStorage(KEYS.NOTE_DELETES, []);
        const ids = Array.isArray(pending) ? pending : [];
        if (ids.indexOf(noteId) === -1) ids.push(noteId);
        saveToStorage(KEYS.NOTE_DELETES, ids);
      } catch (e) {}
    }

    async function confirmDelete(noteId) {
      const card = document.querySelector(`[data-note-id="${noteId}"]`);
      
      if (card) {
        card.classList.add('removing');
        await new Promise(r => setTimeout(r, 300));
      }
      
      try {
        const pendingNote = state.pendingNotes.find(n => n && n.id === noteId);
        const cloudNote = state.myNotes.concat(state.sharedNotes).find(n => n && n.id === noteId);

        // لم تُرفع بعد — احذفها من الطابور فقط.
        if (pendingNote) {
          state.pendingNotes = state.pendingNotes.filter(n => n.id !== noteId);
          saveToStorage(KEYS.PENDING, state.pendingNotes);
          updateMineCount();
          updateSharedCount();
        }
        // ملاحظة قديمة محلية من نسخة سابقة.
        else if (noteId.startsWith('local_')) {
          state.myNotes = state.myNotes.filter(n => n.id !== noteId);
          saveToStorage(KEYS.MY_NOTES, state.myNotes);
          updateMineCount();
        }
        // ملاحظة خاصة في السحابة: احذفها محلياً الآن، وأرسل الحذف
        // للسحابة أو ضعه في الطابور إذا انقطع الاتصال.
        else if (cloudNote && !cloudNote.is_shared) {
          state.myNotes = state.myNotes.filter(n => n.id !== noteId);
          saveToStorage(KEYS.MY_NOTES, state.myNotes);
          updateMineCount();

          let deleted = false;
          if (navigator.onLine && typeof deleteCloudNote === 'function') {
            deleted = await deleteCloudNote(noteId, state.currentUser.id);
          } else if (navigator.onLine) {
            const { error } = await supabaseClient
              .from('notes')
              .delete()
              .eq('id', noteId)
              .eq('user_id', state.currentUser.id);
            deleted = !error;
          }
          if (!deleted) rememberQueuedDelete(noteId);

          showToast(deleted ? 'تم الحذف' : 'تم الحذف محلياً — ستُزامن تلقائياً', deleted ? 'success' : 'info');
        }
        // ملاحظة مشتركة — الحذف السحابي يحتاج اتصالاً.
        else {
          if (!navigator.onLine) {
            showToast('حذف الملاحظات المشتركة يحتاج إنترنت', 'error');
            state.deletingId = null;
            renderNotes();
            return;
          }
          
          const { error } = await supabaseClient
            .from('notes')
            .delete()
            .eq('id', noteId);
          
          if (error) throw error;
          
          state.sharedNotes = state.sharedNotes.filter(n => n.id !== noteId);
          saveToStorage(KEYS.SHARED_CACHE, state.sharedNotes);
          updateSharedCount();
          showToast('تم الحذف');
        }
        
        state.deletingId = null;
        renderNotes();
        
      } catch (err) {
        console.error('deleteNote error:', err);
        showToast('تعذّر الحذف', 'error');
        state.deletingId = null;
        renderNotes();
      }
    }

    // ============================================
    // Helpers
    // ============================================
    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = String(text);
      return div.innerHTML;
    }

    function formatDate(dateString) {
      try {
        const date = new Date(dateString);
        if (isNaN(date.getTime())) return '—';
        
        const now = new Date();
        const diffMs = now - date;
        const diffMins = Math.floor(diffMs / 60000);
        const diffHours = Math.floor(diffMs / 3600000);
        const diffDays = Math.floor(diffMs / 86400000);
        
        if (diffMins < 1) return 'الآن';
        if (diffMins < 60) return `منذ ${diffMins} دقيقة`;
        if (diffHours < 24) return `منذ ${diffHours} ساعة`;
        if (diffDays < 7) return `منذ ${diffDays} يوم`;
        
        return date.toLocaleDateString('ar-EG', {
          year: 'numeric',
          month: 'short',
          day: 'numeric'
        });
      } catch {
        return '—';
      }
    }

    function updateCounter(inputId, counterId, max) {
      try {
        const input = document.getElementById(inputId);
        const counter = document.getElementById(counterId);
        if (!input || !counter) return;
        
        const length = input.value.length;
        counter.textContent = `${length}/${max}`;
        
        if (length > max * 0.9) {
          counter.style.color = 'var(--danger)';
        } else if (length > max * 0.75) {
          counter.style.color = 'var(--warning)';
        } else {
          counter.style.color = 'var(--text-muted)';
        }
      } catch (err) {
        console.error('updateCounter error:', err);
      }
    }

    // ============================================
    // Modal
    // ============================================
    function openAddModal() {
      document.getElementById('noteTitle').value = '';
      document.getElementById('noteContent').value = '';
      document.getElementById('titleCounter').textContent = '0/100';
      document.getElementById('contentCounter').textContent = '0/5000';
      document.getElementById('titleCounter').style.color = 'var(--text-muted)';
      document.getElementById('contentCounter').style.color = 'var(--text-muted)';
      
      selectNoteType('private');
      
      document.getElementById('addModal').classList.add('active');
      document.body.style.overflow = 'hidden';
      
      setTimeout(() => {
        try { document.getElementById('noteTitle').focus(); } catch {}
      }, 350);
      
      lucide.createIcons();
    }

    function closeAddModal() {
      document.getElementById('addModal').classList.remove('active');
      document.body.style.overflow = '';
      state.isSaving = false;
    }

    function closeAddModalIfOutside(event) {
      if (event.target.id === 'addModal') closeAddModal();
    }

    function selectNoteType(type) {
      state.currentType = type;
      
      document.querySelectorAll('.type-option').forEach(opt => {
        opt.classList.toggle('selected', opt.dataset.type === type);
      });
      
      lucide.createIcons();
    }

    // ============================================
    // Save Note — نسخة قوية
    // ============================================
    async function saveNote() {
      // 🔒 منع الحفظ المزدوج
      if (state.isSaving) return;
      
      const title = document.getElementById('noteTitle').value.trim();
      const content = document.getElementById('noteContent').value.trim();
      
      // التحقق من الإدخال
      if (!title) {
        showToast('العنوان مطلوب', 'error');
        document.getElementById('noteTitle').focus();
        return;
      }
      
      if (!content) {
        showToast('المحتوى مطلوب', 'error');
        document.getElementById('noteContent').focus();
        return;
      }
      
      // التحقق من المستخدم
      if (!state.currentUser || !state.currentUser.id) {
        showToast('يجب تسجيل الدخول أولاً', 'error');
        return;
      }
      
      state.isSaving = true;
      
      const saveBtn = document.getElementById('saveBtn');
      const originalBtnHTML = saveBtn.innerHTML;
      saveBtn.disabled = true;
      saveBtn.innerHTML = '<i data-lucide="loader-2" class="spin" style="width: 18px; height: 18px;"></i><span>جاري الحفظ...</span>';
      lucide.createIcons();
      
      try {
        const displayName = state.currentProfile?.full_name 
          || state.currentUser.email?.split('@')[0] 
          || 'مستخدم';
        
        const isShared = state.currentType === 'shared';
        let cloudNote = {
          // UUID is generated on the client so retries/offline sync are
          // idempotent and the same note can never be inserted twice.
          id: generateNoteId(),
          user_id: state.currentUser.id,
          author_name: displayName,
          title,
          content,
          is_shared: isShared,
          created_at: new Date().toISOString()
        };

        let savedToCloud = false;
        let lastError = null;

        if (navigator.onLine) {
          for (let attempt = 1; attempt <= 2; attempt++) {
            try {
              let result;
              if (typeof upsertCloudNote === 'function') {
                result = await upsertCloudNote(cloudNote, state.currentUser.id);
                if (!result.ok) throw result.error || new Error('cloud save failed');
                if (result.note) cloudNote = Object.assign({}, cloudNote, result.note);
              } else {
                const { error } = await supabaseClient
                  .from('notes')
                  .upsert(cloudNote, { onConflict: 'id' });
                if (error) throw error;
              }
              savedToCloud = true;
              break;
            } catch (err) {
              lastError = err;
              console.warn(`Save attempt ${attempt} failed:`, err);
              if (attempt < 2) await new Promise(r => setTimeout(r, 800));
            }
          }
        }

        if (savedToCloud) {
          if (isShared) {
            state.sharedNotes = [cloudNote].concat(state.sharedNotes.filter(n => n.id !== cloudNote.id));
            saveToStorage(KEYS.SHARED_CACHE, state.sharedNotes);
            updateSharedCount();
            showToast('تم نشر الملاحظة ✓');
            closeAddModal();
            switchNotesTab('shared');
          } else {
            state.myNotes = [cloudNote].concat(state.myNotes.filter(n => n.id !== cloudNote.id));
            saveToStorage(KEYS.MY_NOTES, state.myNotes);
            updateMineCount();
            showToast('تم حفظ ملاحظتك ✓');
            closeAddModal();
            switchNotesTab('mine');
          }
          return;
        }

        // Network/RLS failure: keep the note in the durable pending queue.
        // It is uploaded by syncNotesFromCloud() on the next connection.
        console.warn('Save failed, falling back to pending:', lastError);
        const pendingNote = Object.assign({}, cloudNote, { _pending: true });
        state.pendingNotes.push(pendingNote);
        saveToStorage(KEYS.PENDING, state.pendingNotes);
        updateMineCount();
        updateSharedCount();

        showToast(isShared
          ? 'تعذّر النشر — ستُزامن تلقائياً'
          : 'حُفظت محلياً — ستُزامن تلقائياً', 'info');
        closeAddModal();
        switchNotesTab(isShared ? 'shared' : 'mine');
        return;
        
      } catch (err) {
        console.error('saveNote error:', err);
        showToast(err.message || 'تعذّر الحفظ', 'error');
      } finally {
        state.isSaving = false;
        saveBtn.disabled = false;
        saveBtn.innerHTML = originalBtnHTML;
        lucide.createIcons();
      }
    }

    // ============================================
    // Events
    // ============================================
    window.addEventListener('online', () => {
      showConnectionBanner(true);
      // انتظار قصير ثم مزامنة
      setTimeout(() => {
        syncPending();
      }, 500);
    });

    window.addEventListener('offline', () => {
      showConnectionBanner(false);
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        const modal = document.getElementById('addModal');
        if (modal && modal.classList.contains('active')) {
          closeAddModal();
        } else if (state.deletingId) {
          cancelDelete();
        }
      }
    });

    // ============================================
    // Init
    // ============================================
    async function init() {
      try {
        // تحميل الملاحظات المعلقة
        state.pendingNotes = loadFromStorage(KEYS.PENDING, []);
        if (!Array.isArray(state.pendingNotes)) state.pendingNotes = [];
        updateMineCount();
        updateSharedCount();
        
        // تحميل المستخدم
        const ok = await loadUser();
        if (!ok) return;
        
        // تحميل الملاحظات
        loadMyNotes();
        await loadSharedNotes();
        
        // عرض
        renderNotes();
        
        // مزامنة المعلقة إذا كان متصلاً
        if (navigator.onLine && state.pendingNotes.length > 0) {
          setTimeout(() => syncPending(), 1200);
        }
        
        // فحص حالة الاتصال الأولية
        if (!navigator.onLine) {
          showConnectionBanner(false);
        }
        
        console.log('✅ notes.html loaded');
        
      } catch (err) {
        console.error('Init error:', err);
        showToast('حدث خطأ في التحميل', 'error');
      }
    }

    init();
  
</script>

  <script data-shell>
if ('serviceWorker' in navigator) {
  // If an older worker controlled this page, refresh once when the new worker
  // takes over. This guarantees a stale (previous-deploy) page cannot linger.
  var hadController = !!navigator.serviceWorker.controller;
  var reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (!hadController || reloading) return;
    reloading = true;
    window.location.reload();
  });

  window.addEventListener('load', () => {
    // Force a fresh check so a previously cached (possibly outdated) worker
    // is replaced as soon as a new sw.js is deployed.
    navigator.serviceWorker.getRegistration().then(reg => {
      if (reg) { try { reg.update(); } catch (e) {} }
    }).catch(() => {});

    navigator.serviceWorker.register('sw.js')
      .then(reg => {
        console.log('✅ SW registered:', reg.scope);
        try { reg.update(); } catch (e) {}
      })
      .catch(err => console.warn('⚠️ SW failed:', err));
  });
}
