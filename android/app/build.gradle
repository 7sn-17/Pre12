apply plugin: 'com.android.application'
// ⭐⭐ Phase W1 — Kotlin (required by Jetpack Glance) + Compose compiler.
//    Classes stay in src/main/java next to MainActivity.java; Gradle compiles
//    both languages into the same module.
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

// ⭐ ملف مفتاح التوقيع (يفكّه الـ CI من السر KEYSTORE_BASE64)
def keystoreFile = file('release.keystore')

android {
    namespace = "com.pre12.medical"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.pre12.medical"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 51
        versionName "5.1.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // ⭐ مفتاح التوقيع — comes from the GitHub Actions secrets:
    //    KEYSTORE_BASE64 · KEYSTORE_PASSWORD · KEY_ALIAS · KEY_PASSWORD
    //    الملف نفسه (release.keystore) يفكّه الـ CI قبل البناء.
    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            // نوقّع فقط إذا كان المفتاح موجوداً — حتى يبقى البناء
            // ممكناً محلياً (نسخة غير موقّعة) بدون أسرار.
            if (keystoreFile.exists()) {
                signingConfig signingConfigs.release
            }
            // ⭐⭐ لا تصغير الكود ولا ضغط الموارد (Phase 18).
            //    التطبيق واجهة WebView: الموارد الأصلية (صور الأدوات،
            //    الخطوط، أصوات الإشعارات) يجب أن تبقى كما هي.
            //    minifyEnabled = true مع R8 كان يشطب أصوات WebView
            //    ويُنتج حزمة لا تُثبَّت على بعض الأجهزة.
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    // ⭐⭐ Phase W1 — Kotlin must emit the same bytecode level as Java
    //    (capacitor.build.gradle sets Java 21). A mismatch fails the build.
    kotlinOptions {
        jvmTarget = '21'
    }

    // ⭐⭐ لا splits ولا abiFilters — نُبقي كل المعماريات
    //    (arm64-v8a · armeabi-v7a · x86 · x86_64) حتى يعمل الـ APK
    //    على أي هاتف. إضافة abiFilters هنا كانت ستُنتج حزمة
    //    "لا يوجد ملف أصلي مناسب" على أجهزة معمارية أخرى.
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // ⭐⭐ Phase W1 — Jetpack Glance home-screen widgets (Material You).
    implementation "androidx.glance:glance-appwidget:$glanceVersion"
    implementation "androidx.glance:glance-material3:$glanceVersion"
    // ⭐⭐ Phase W5 — offline-first background sync (widget taps while the app is
    //    closed). WorkManager owns the retry/backoff and the network constraint.
    implementation "androidx.work:work-runtime-ktx:2.10.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    // ⭐⭐⭐ Phase W16 — the unit tests parse a real notes payload, and the
    //   android.jar stub of org.json throws "not mocked" in a JVM test.
    //   The real implementation makes the bridge testable off-device.
    testImplementation "org.json:json:20231013"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
