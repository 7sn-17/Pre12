// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'
        // ⭐⭐ Phase W1 — Kotlin + Compose compiler (Jetpack Glance widgets).
        //    The Compose compiler is a Kotlin plugin since Kotlin 2.0, so both
        //    versions MUST stay identical. (Hard-coded: this block runs before
        //    variables.gradle is applied.)
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.21'
        classpath 'org.jetbrains.kotlin:compose-compiler-gradle-plugin:2.2.21'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
