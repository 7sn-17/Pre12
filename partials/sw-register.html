<script data-shell>
if ('serviceWorker' in navigator) {
  // If an older worker controlled this page, refresh once when the new worker
  // takes over. This guarantees a stale (previous-deploy) page cannot linger.
  var hadController = !!navigator.serviceWorker.controller;
  var reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (!hadController || reloading) return;
    reloading = true;
    window.location.reload();
  });

  // ⭐⭐⭐ عامل خدمة جديد — نُعيد تحميل الصفحة فوراً حتى لا تخلط
  //    الصفحة الجديدة (HTML) مع JavaScript قديم
  navigator.serviceWorker.addEventListener('updatefound', function () {
    var reg = navigator.serviceWorker.controller;
    if (!reg) return;
    reg.addEventListener('statechange', function () {
      if (reg.state === 'installed' && navigator.serviceWorker.controller) {
        try { reg.update(); } catch (e) {}
        if (!reloading) { reloading = true; window.location.reload(); }
      }
    });
  });

  window.addEventListener('load', () => {
    // Force a fresh check so a previously cached (possibly outdated) worker
    // is replaced as soon as a new sw.js is deployed.
    navigator.serviceWorker.getRegistration().then(reg => {
      if (reg) { try { reg.update(); } catch (e) {} }
    }).catch(() => {});

    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
      .then(reg => {
        console.log('✅ SW registered:', reg.scope);
        try { reg.update(); } catch (e) {}
      })
      .catch(err => console.warn('⚠️ SW failed:', err));
  });
}
</script>
