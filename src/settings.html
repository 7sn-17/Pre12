<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<!-- @include partials/head.html -->

<style>
    :root {
      --bg-main: #06110d;
      --accent-emerald: #10b981;
      --accent-light: #34d399;
      --accent-dark: #059669;
      --accent-glow: rgba(16, 185, 129, 0.28);
      --text-primary: #f0fdf4;
      --text-secondary: #94a3b8;
      --line: rgba(52, 211, 153, 0.18);
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: 'Cairo', system-ui, -apple-system, sans-serif;
      color: var(--text-primary);
      background:
        radial-gradient(120% 80% at 50% 0%, rgba(16, 185, 129, 0.20) 0%, rgba(16, 185, 129, 0) 60%),
        linear-gradient(165deg, #0f3327 0%, #0a2019 48%, #06110d 100%);
      -webkit-tap-highlight-color: transparent;
    }

    .settings-card {
      width: 100%;
      max-width: 420px;
      padding: 32px 24px 26px;
      border-radius: 30px;
      text-align: center;
      position: relative;
      overflow: hidden;
      background: linear-gradient(165deg, rgba(17, 44, 34, 0.94), rgba(8, 25, 19, 0.96));
      border: 1px solid rgba(52, 211, 153, 0.26);
      box-shadow:
        0 40px 90px -30px rgba(0, 0, 0, 0.85),
        0 0 80px -30px var(--accent-glow),
        inset 0 1px 0 rgba(255, 255, 255, 0.07);
    }

    /* بريق خفيف يمرّ فوق البطاقة */
    .settings-card::before {
      content: "";
      position: absolute;
      inset: -60% -30% auto -30%;
      height: 120%;
      background: radial-gradient(60% 40% at 50% 0%, rgba(52, 211, 153, 0.16), transparent 70%);
      pointer-events: none;
    }

    .settings-icon {
      width: 74px;
      height: 74px;
      margin: 0 auto 16px;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #d1fae5;
      background: linear-gradient(140deg, rgba(52, 211, 153, 0.30), rgba(5, 150, 105, 0.12));
      border: 1px solid rgba(52, 211, 153, 0.45);
      box-shadow:
        0 0 0 6px rgba(16, 185, 129, 0.07),
        0 0 40px -8px rgba(52, 211, 153, 0.6);
    }

    .settings-icon i { width: 34px; height: 34px; }

    .settings-title {
      margin: 0 0 6px;
      font-size: 1.24rem;
      font-weight: 800;
      letter-spacing: -0.01em;
    }

    .settings-sub {
      margin: 0 0 24px;
      font-size: 0.82rem;
      line-height: 1.9;
      color: var(--text-secondary);
    }

    /* ⭐ الزرّ الوحيد في هذه الصفحة — «إضافة ودجت للشاشة» */
    .widget-cta {
      position: relative;
      width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 17px 22px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 20px;
      font-family: inherit;
      font-size: 0.98rem;
      font-weight: 800;
      color: #ffffff;
      cursor: pointer;
      overflow: hidden;
      background: linear-gradient(135deg, #34d399 0%, #10b981 42%, #047857 100%);
      box-shadow:
        0 18px 40px -16px rgba(16, 185, 129, 0.95),
        0 4px 14px -6px rgba(0, 0, 0, 0.6),
        inset 0 1px 0 rgba(255, 255, 255, 0.28);
      transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.18s ease, filter 0.18s ease;
    }

    /* لمعة تمرّ على الزرّ */
    .widget-cta::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      width: 45%;
      left: -60%;
      background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.32), transparent);
      transform: skewX(-18deg);
      animation: ctaSheen 4.5s ease-in-out infinite;
    }

    @keyframes ctaSheen {
      0%, 62% { left: -60%; }
      100% { left: 130%; }
    }

    .widget-cta:hover { filter: brightness(1.06); }

    .widget-cta:active {
      transform: scale(0.975);
      box-shadow: 0 8px 22px -12px rgba(16, 185, 129, 0.9);
    }

    .widget-cta:disabled {
      opacity: 0.65;
      filter: saturate(0.7);
      cursor: default;
    }

    .widget-cta i { width: 20px; height: 20px; }

    /* ⭐ الشرح تحت الزرّ مباشرة */
    .widget-hint {
      margin: 13px 2px 0;
      font-size: 0.72rem;
      font-weight: 600;
      line-height: 1.8;
      color: var(--text-secondary);
    }

    .settings-status {
      min-height: 20px;
      margin: 12px 0 0;
      font-size: 0.74rem;
      font-weight: 700;
      line-height: 1.7;
      color: #6ee7b7;
    }

    .settings-status.is-error { color: #fca5a5; }

    /* يظهر فقط إذا لم يوفّر المُشغّل نافذة اختيار النظام. */
    .widget-chooser {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      text-align: start;
    }

    .widget-chooser[hidden] { display: none; }

    .widget-chooser-title {
      margin: 0 0 10px;
      font-size: 0.78rem;
      font-weight: 800;
      color: #a7f3d0;
    }

    .widget-choice {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 12px;
      margin-bottom: 8px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: rgba(6, 78, 59, 0.35);
      color: var(--text-primary);
      font-family: inherit;
      text-align: start;
      cursor: pointer;
      transition: transform 0.16s ease, border-color 0.16s ease, background 0.16s ease;
    }

    .widget-choice:last-child { margin-bottom: 0; }

    .widget-choice:hover {
      border-color: rgba(52, 211, 153, 0.42);
      background: rgba(6, 78, 59, 0.55);
    }

    .widget-choice:active { transform: scale(0.985); }

    .widget-choice-icon {
      width: 36px;
      height: 36px;
      flex: 0 0 auto;
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #d1fae5;
      background: rgba(16, 185, 129, 0.18);
    }

    .widget-choice-icon i { width: 18px; height: 18px; }

    .widget-choice-copy { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .widget-choice-name { font-size: 0.84rem; font-weight: 800; }
    .widget-choice-sub { font-size: 0.68rem; font-weight: 600; color: var(--text-secondary); }
</style>
</head>
<body>
  <main class="settings-card">
    <div class="settings-icon" aria-hidden="true">
      <i data-lucide="layout-grid"></i>
    </div>
    <h1 class="settings-title">الودجات الذكية</h1>
    <p class="settings-sub">مهامك وسلسلتك وأهدافك على شاشتك الرئيسية — تُحدَّث فوراً وتعمل بدون إنترنت.</p>

    <button type="button" class="widget-cta" id="addWidgetBtn">
      <i data-lucide="plus-circle"></i>
      <span>إضافة ودجت للشاشة</span>
    </button>

    <p class="widget-hint">
      إذا لم تعمل القائمة، يمكنك إضافة الودجت بالضغط المطول على شاشتك الرئيسية ثم اختيار «الودجات» (Widgets).
    </p>

    <p class="settings-status" id="settingsStatus" aria-live="polite"></p>

    <section class="widget-chooser" id="widgetChooser" hidden>
      <p class="widget-chooser-title">اختر الودجت الذي تريده</p>
      <button type="button" class="widget-choice" data-kind="tasks">
        <span class="widget-choice-icon"><i data-lucide="list-checks"></i></span>
        <span class="widget-choice-copy">
          <span class="widget-choice-name">مهام اليوم</span>
          <span class="widget-choice-sub">3×2 — قائمة مهامك مع مربّعات الإنجاز</span>
        </span>
      </button>
      <button type="button" class="widget-choice" data-kind="streak">
        <span class="widget-choice-icon"><i data-lucide="flame"></i></span>
        <span class="widget-choice-copy">
          <span class="widget-choice-name">سلسلة الأيام</span>
          <span class="widget-choice-sub">1×1 — عدد أيامك المتتالية</span>
        </span>
      </button>
      <button type="button" class="widget-choice" data-kind="streak_detail">
        <span class="widget-choice-icon"><i data-lucide="calendar-days"></i></span>
        <span class="widget-choice-copy">
          <span class="widget-choice-name">سلسلة مفصّلة</span>
          <span class="widget-choice-sub">4×2 — رقم كبير وخريطة أسبوع من ٧ أيام</span>
        </span>
      </button>
      <button type="button" class="widget-choice" data-kind="notes">
        <span class="widget-choice-icon"><i data-lucide="sticky-note"></i></span>
        <span class="widget-choice-copy">
          <span class="widget-choice-name">ملاحظات وأهداف</span>
          <span class="widget-choice-sub">2×2 — ورق أزرق وبنفسجي مع نسب التقدّم</span>
        </span>
      </button>
      <button type="button" class="widget-choice" data-kind="goals">
        <span class="widget-choice-icon"><i data-lucide="target"></i></span>
        <span class="widget-choice-copy">
          <span class="widget-choice-name">أهدافي</span>
          <span class="widget-choice-sub">2×2 — ورقة زرقاء لنسب التقدّم</span>
        </span>
      </button>
      <button type="button" class="widget-choice" data-kind="notes_only">
        <span class="widget-choice-icon"><i data-lucide="notebook-pen"></i></span>
        <span class="widget-choice-copy">
          <span class="widget-choice-name">ملاحظاتي</span>
          <span class="widget-choice-sub">2×2 — ورقة بنفسجية لمحتوى الملاحظات</span>
        </span>
      </button>
    </section>
  </main>

  <script>
    (function () {
      'use strict';

      var button = document.getElementById('addWidgetBtn');
      var statusEl = document.getElementById('settingsStatus');
      var chooser = document.getElementById('widgetChooser');
      var busy = false;

      function setStatus(text, isError) {
        if (!statusEl) return;
        statusEl.textContent = text || '';
        statusEl.classList.toggle('is-error', !!isError);
      }

      function bridge() {
        var cap = window.Capacitor;
        if (!cap || !cap.Plugins) return null;
        var api = cap.Plugins.MedWidgets;
        if (!api) return null;
        return api;
      }

      function showChooser() {
        if (chooser) chooser.hidden = false;
      }

      /**
       * ⭐⭐ Phase W8 — the button really works now.
       *
       * The order is deliberate:
       *   1) `openWidgetPicker()` — the launcher's own widget picker, which
       *      lists every widget of the app;
       *   2) `requestPinWidget()` — the documented system "add to home screen"
       *      dialog for a single widget, when the launcher has no picker;
       *   3) the in-page chooser — always available, one tap from the answer.
       */
      async function addWidget() {
        if (busy) return;
        var api = bridge();
        if (!api) {
          setStatus('إضافة الودجات متاحة داخل تطبيق أندرويد فقط.', true);
          showChooser();
          return;
        }

        busy = true;
        if (button) button.disabled = true;
        setStatus('جارٍ فتح نافذة الودجات…');

        try {
          if (typeof api.openWidgetPicker === 'function') {
            var picked = await api.openWidgetPicker();
            if (picked && picked.opened) {
              setStatus('اختر الودجت الذي تريده من نافذة النظام.');
              if (chooser) chooser.hidden = true;
              return;
            }
          }

          if (typeof api.requestPinWidget === 'function') {
            var pinned = await api.requestPinWidget({ kind: 'tasks' });
            if (pinned && pinned.requested === false) {
              setStatus('لا يدعم المُشغّل نافذة الإضافة — اختر الودجت من القائمة أدناه.', true);
              showChooser();
              return;
            }
            setStatus('تم فتح نافذة الإضافة — اختر «مهام اليوم» أو أي ودجت آخر.');
            return;
          }

          setStatus('اختر الودجت من القائمة أدناه.');
          showChooser();
        } catch (e) {
          setStatus('تعذّر فتح نافذة النظام — اختر الودجت من القائمة أدناه.', true);
          showChooser();
        } finally {
          busy = false;
          if (button) button.disabled = false;
        }
      }

      async function pinWidget(kind, name) {
        var api = bridge();
        if (!api || typeof api.requestPinWidget !== 'function') {
          setStatus('إضافة الودجات متاحة داخل تطبيق أندرويد فقط.', true);
          return;
        }
        try {
          var result = await api.requestPinWidget({ kind: kind });
          if (result && result.requested === false) {
            setStatus('لا يدعم المُشغّل نافذة الإضافة — اضغط مطوّلاً على الشاشة الرئيسية ثم «الودجات».', true);
          } else {
            setStatus('تم فتح نافذة إضافة «' + name + '» — اضغط «إضافة».');
          }
        } catch (e) {
          setStatus('تعذّرت إضافة الودجت — حاول من الشاشة الرئيسية.', true);
        }
      }

      // ⭐ The listeners are attached *before* the icon library runs: a missing
      //    icon must never leave the button dead.
      if (button) button.addEventListener('click', addWidget);

      Array.prototype.forEach.call(
        document.querySelectorAll('.widget-choice'),
        function (choice) {
          choice.addEventListener('click', function () {
            var nameEl = choice.querySelector('.widget-choice-name');
            pinWidget(choice.getAttribute('data-kind'), nameEl ? nameEl.textContent : '');
          });
        }
      );

      try {
        if (window.lucide && typeof lucide.createIcons === 'function') lucide.createIcons();
      } catch (e) {
        console.warn('[settings] icons failed:', e);
      }
    })();
  </script>
</body>
</html>
