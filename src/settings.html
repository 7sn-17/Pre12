<!--@
title: الودجات الذكية - المنصة الطبية
libs: lucide
sw: true
backHref: index.html
headerTitle: الودجات الذكية
-->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<!-- @include partials/head.html -->

<style>
    :root {
      --bg-main: #06110d;
      --accent-emerald: #10b981;
      --accent-light: #34d399;
      --accent-dark: #059669;
      --accent-glow: rgba(16, 185, 129, 0.28);
      --text-primary: #f0fdf4;
      --text-secondary: #94a3b8;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: 'Cairo', system-ui, -apple-system, sans-serif;
      color: var(--text-primary);
      background:
        radial-gradient(120% 80% at 50% 0%, rgba(16, 185, 129, 0.20) 0%, rgba(16, 185, 129, 0) 60%),
        linear-gradient(165deg, #0f3327 0%, #0a2019 48%, #06110d 100%);
      -webkit-tap-highlight-color: transparent;
    }

    .settings-card {
      width: 100%;
      max-width: 400px;
      padding: 30px 24px 26px;
      border-radius: 28px;
      text-align: center;
      background: linear-gradient(165deg, rgba(17, 44, 34, 0.92), rgba(8, 25, 19, 0.94));
      border: 1px solid rgba(52, 211, 153, 0.24);
      box-shadow:
        0 40px 90px -30px rgba(0, 0, 0, 0.85),
        0 0 70px -26px var(--accent-glow);
    }

    .settings-icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 16px;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #d1fae5;
      background: linear-gradient(140deg, rgba(52, 211, 153, 0.28), rgba(5, 150, 105, 0.12));
      border: 1px solid rgba(52, 211, 153, 0.45);
      box-shadow:
        0 0 0 6px rgba(16, 185, 129, 0.07),
        0 0 34px -8px rgba(52, 211, 153, 0.6);
    }

    .settings-icon i { width: 32px; height: 32px; }

    .settings-title {
      margin: 0 0 6px;
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: -0.01em;
    }

    .settings-sub {
      margin: 0 0 22px;
      font-size: 0.82rem;
      line-height: 1.9;
      color: var(--text-secondary);
    }

    /* ⭐ الزرّ الوحيد في هذه الصفحة — «إضافة ودجت للشاشة» */
    .widget-cta {
      width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px 20px;
      border: none;
      border-radius: 18px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 800;
      color: #ffffff;
      cursor: pointer;
      background: linear-gradient(135deg, var(--accent-light), var(--accent-emerald) 46%, var(--accent-dark));
      box-shadow:
        0 16px 36px -14px rgba(16, 185, 129, 0.95),
        inset 0 1px 0 rgba(255, 255, 255, 0.24);
      transition: transform 0.16s ease, box-shadow 0.16s ease;
    }

    .widget-cta:active {
      transform: scale(0.98);
      box-shadow: 0 8px 22px -12px rgba(16, 185, 129, 0.9);
    }

    .widget-cta i { width: 19px; height: 19px; }

    .settings-status {
      min-height: 20px;
      margin: 14px 0 0;
      font-size: 0.74rem;
      font-weight: 600;
      line-height: 1.7;
      color: var(--text-secondary);
    }

    /* يظهر فقط إذا لم يوفّر المُشغّل نافذة اختيار النظام. */
    .widget-chooser {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid rgba(52, 211, 153, 0.16);
      text-align: start;
    }

    .widget-chooser[hidden] { display: none; }

    .widget-chooser-title {
      margin: 0 0 10px;
      font-size: 0.78rem;
      font-weight: 800;
      color: #a7f3d0;
    }

    .widget-choice {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 12px;
      margin-bottom: 8px;
      border-radius: 16px;
      border: 1px solid rgba(52, 211, 153, 0.18);
      background: rgba(6, 78, 59, 0.35);
      color: var(--text-primary);
      font-family: inherit;
      text-align: start;
      cursor: pointer;
    }

    .widget-choice:last-child { margin-bottom: 0; }
    .widget-choice:active { transform: scale(0.985); }

    .widget-choice-icon {
      width: 36px;
      height: 36px;
      flex: 0 0 auto;
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #d1fae5;
      background: rgba(16, 185, 129, 0.18);
    }

    .widget-choice-icon i { width: 18px; height: 18px; }

    .widget-choice-copy { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .widget-choice-name { font-size: 0.84rem; font-weight: 800; }
    .widget-choice-sub { font-size: 0.68rem; font-weight: 600; color: var(--text-secondary); }
</style>
</head>
<body>
  <main class="settings-card">
    <div class="settings-icon" aria-hidden="true">
      <i data-lucide="layout-grid"></i>
    </div>
    <h1 class="settings-title">الودجات الذكية</h1>
    <p class="settings-sub">مهامك وسلسلتك وأهدافك على شاشتك الرئيسية — تُحدَّث فوراً وتعمل بدون إنترنت.</p>

    <button type="button" class="widget-cta" id="addWidgetBtn">
      <i data-lucide="plus-circle"></i>
      <span>إضافة ودجت للشاشة</span>
    </button>

    <p class="settings-status" id="settingsStatus" aria-live="polite"></p>

    <section class="widget-chooser" id="widgetChooser" hidden>
      <p class="widget-chooser-title">اختر الودجت الذي تريده</p>
      <button type="button" class="widget-choice" data-kind="tasks">
        <span class="widget-choice-icon"><i data-lucide="list-checks"></i></span>
        <span class="widget-choice-copy">
          <span class="widget-choice-name">مهام اليوم</span>
          <span class="widget-choice-sub">2×3 — قائمة مهامك مع مربّعات الإنجاز</span>
        </span>
      </button>
      <button type="button" class="widget-choice" data-kind="streak">
        <span class="widget-choice-icon"><i data-lucide="flame"></i></span>
        <span class="widget-choice-copy">
          <span class="widget-choice-name">سلسلة الأيام</span>
          <span class="widget-choice-sub">1×1 — عدد أيامك المتتالية</span>
        </span>
      </button>
      <button type="button" class="widget-choice" data-kind="lectures">
        <span class="widget-choice-icon"><i data-lucide="image"></i></span>
        <span class="widget-choice-copy">
          <span class="widget-choice-name">المحاضرة القادمة</span>
          <span class="widget-choice-sub">1×1 — غلاف المادة، والضغط يفتح الألبوم</span>
        </span>
      </button>
      <button type="button" class="widget-choice" data-kind="notes">
        <span class="widget-choice-icon"><i data-lucide="sticky-note"></i></span>
        <span class="widget-choice-copy">
          <span class="widget-choice-name">ملاحظات وأهداف</span>
          <span class="widget-choice-sub">2×2 — ورق أزرق وبنفسجي مع نسب التقدّم</span>
        </span>
      </button>
      <button type="button" class="widget-choice" data-kind="streak_detail">
        <span class="widget-choice-icon"><i data-lucide="calendar-days"></i></span>
        <span class="widget-choice-copy">
          <span class="widget-choice-name">سلسلة مفصّلة</span>
          <span class="widget-choice-sub">4×2 — أرقام كبيرة وأسبوع كامل</span>
        </span>
      </button>
    </section>
  </main>

  <script>
    lucide.createIcons();

    function setStatus(text) {
      var el = document.getElementById('settingsStatus');
      if (el) el.textContent = text || '';
    }

    function api() {
      var cap = window.Capacitor;
      return cap && cap.Plugins ? cap.Plugins.MedWidgets : null;
    }

    /**
     * Phase W7 — the button asks the launcher for its *picker* (all widgets).
     * Android only guarantees "pin this one", so when no launcher entry point
     * answers, the five-widget chooser below appears instead of pinning blindly.
     */
    async function addWidget() {
      var bridge = api();
      if (!bridge) {
        setStatus('إضافة الودجات متاحة داخل تطبيق أندرويد فقط.');
        return;
      }

      setStatus('جارٍ فتح نافذة الودجات…');
      try {
        var result = await bridge.openWidgetPicker();
        if (result && result.opened) {
          setStatus('اختر الودجت الذي تريده من نافذة النظام.');
          document.getElementById('widgetChooser').hidden = true;
          return;
        }
        document.getElementById('widgetChooser').hidden = false;
        setStatus('مُشغّل جهازك لا يعرض قائمة عامة — اختر الودجت من القائمة التالية.');
      } catch (e) {
        document.getElementById('widgetChooser').hidden = false;
        setStatus('تعذّر فتح نافذة النظام — اختر الودجت من القائمة التالية.');
      }
    }

    async function pinWidget(kind, name) {
      var bridge = api();
      if (!bridge) return;
      try {
        var result = await bridge.requestPinWidget({ kind: kind });
        if (result && result.requested === false) {
          setStatus('لا يدعم المُشغّل نافذة الإضافة — اضغط مطوّلاً على الشاشة الرئيسية ثم «الودجات».');
        } else {
          setStatus('تم فتح نافذة إضافة «' + name + '» — اضغط «إضافة».');
        }
      } catch (e) {
        setStatus('تعذّرت إضافة الودجت — حاول من الشاشة الرئيسية.');
      }
    }

    document.getElementById('addWidgetBtn').addEventListener('click', addWidget);

    Array.prototype.forEach.call(
      document.querySelectorAll('.widget-choice'),
      function (button) {
        button.addEventListener('click', function () {
          pinWidget(
            button.getAttribute('data-kind'),
            button.querySelector('.widget-choice-name').textContent
          );
        });
      }
    );
  </script>
</body>
</html>
