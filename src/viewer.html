<!--@
title: معاينة الملف — المنصة الطبية
themeColor: #f8fafb
libs: pdfjs, supabase, lucide
scripts: supabase-config, auth, db, files, native, notifications
sw: true
-->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<!-- @include partials/head.html -->

<style>
:root {
  --bg-main: #f8fafb;
  --bg-card: #ffffff;
  --bg-elevated: #f1f5f9;
  --bg-header: rgba(248, 250, 251, 0.95);
  --bg-overlay: rgba(255, 255, 255, 0.98);
  --border: rgba(16, 185, 129, 0.2);
  --border-strong: rgba(16, 185, 129, 0.4);
  --accent: #059669;
  --accent-light: #10b981;
  --text-primary: #0f172a;
  --text-secondary: #475569;
  --text-muted: #94a3b8;
  --danger: #ef4444;
  --viewer-bg: #e8ecf0;
  --paper-bg: #ffffff;
  --page-shadow: 0 2px 12px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0, 0, 0, 0.06);
  --header-h: 58px;
  --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}

[data-theme="dark"] {
  --bg-main: #06110d;
  --bg-card: rgba(16, 34, 27, 0.7);
  --bg-elevated: #0a1a14;
  --bg-header: rgba(6, 17, 13, 0.95);
  --bg-overlay: rgba(10, 26, 20, 0.98);
  --border: rgba(16, 185, 129, 0.25);
  --border-strong: rgba(16, 185, 129, 0.5);
  --accent: #10b981;
  --accent-light: #34d399;
  --text-primary: #f0fdf4;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;
  --viewer-bg: #0a1410;
  --paper-bg: #f5f5f5;
  --page-shadow: 0 2px 12px rgba(0, 0, 0, 0.4), 0 1px 3px rgba(0, 0, 0, 0.3);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Cairo', system-ui, sans-serif;
  -webkit-tap-highlight-color: transparent;
}

html, body { height: 100%; overflow: hidden; }

body {
  background: var(--bg-main);
  color: var(--text-primary);
  display: flex;
  flex-direction: column;
  transition: background var(--transition), color var(--transition);
}

/* ⭐⭐ v4.6.2 — Phase 31: الشريط العلوي بتخطيط flex نظيف
   ------------------------------------------------------------
   كان الشريط يستخدم padding-top ثابتاً فيتداخل زرّ الرجوع
   ومؤشّر الصفحة وزرّ البحث (وتحت النتش). الآن:
   • الشريط عمود أفقي مرن (flex) بلا تداخل.
   • حشوة علوية = المنطقة الآمنة (النتش) + مسافات مرنة.
   • مؤشّر الصفحة كبسولة داخل الشريط (لا يطفو ولا يتقاطع). */
.header {
  min-height: var(--header-h);
  padding: 0 10px;
  padding-top: env(safe-area-inset-top, 0px);
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--bg-header);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  z-index: 100;
  position: relative;
}

/* ⭐ مؤشّر الصفحة داخل الشريط — كبسولة مرنة */
.header-page-pill {
  flex: 0 1 auto;
  min-width: 0;
  max-width: 42%;
  padding: 5px 10px;
  border-radius: 999px;
  background: rgba(5, 150, 105, 0.1);
  border: 1px solid var(--border);
  color: var(--text-secondary);
  font-size: 0.7rem;
  font-weight: 800;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  text-align: center;
  display: none;
}

.header-page-pill.show { display: block; }

.header-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex: 0 0 auto;
}

.icon-btn {
  width: 42px;
  height: 42px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--text-primary);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  text-decoration: none;
  transition: all var(--transition);
  flex-shrink: 0;
}

.icon-btn:hover { border-color: var(--accent); color: var(--accent); }
.icon-btn:active { transform: scale(0.94); }
.icon-btn svg { width: 19px; height: 19px; }

.file-info {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 10px;
}

.file-icon {
  width: 38px;
  height: 38px;
  border-radius: 11px;
  background: rgba(16, 185, 129, 0.12);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--accent);
  flex-shrink: 0;
}

.file-icon svg { width: 19px; height: 19px; }

.file-text { min-width: 0; flex: 1; }

.file-title {
  font-size: 0.88rem;
  font-weight: 800;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--text-primary);
}

.file-sub {
  font-size: 0.7rem;
  color: var(--text-muted);
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  margin-top: 1px;
}

/* منطقة العرض */
.viewer {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  background: var(--viewer-bg);
  padding: 12px 8px 40px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  -webkit-overflow-scrolling: touch;
  position: relative;
  overscroll-behavior: contain;
}

/* ⭐⭐ v4.6.6 — TASK 6: مسرح التحويل (scale/translate) + منع تدخّل المتصفّح */
.pdf-stage {
  position: relative;
  transform-origin: 0 0;
  will-change: transform;
  /* ⭐ عند التكبير نتحكّم بالتمرير بأنفسنا (none)، وبعده pan-y للتمرير العادي */
  touch-action: pan-y;
  -webkit-user-select: none;
  user-select: none;
}

.pdf-stage.zoomed {
  touch-action: none;
}

.pdf-stage.gesture {
  transition: none;
}

.viewer::-webkit-scrollbar { width: 5px; }
.viewer::-webkit-scrollbar-track { background: transparent; }
.viewer::-webkit-scrollbar-thumb {
  background: var(--border-strong);
  border-radius: 3px;
}

/* صفحة */
.pdf-page {
  background: var(--paper-bg);
  border-radius: 4px;
  box-shadow: var(--page-shadow);
  overflow: hidden;
  max-width: 100%;
  position: relative;
  display: block;
  flex-shrink: 0;
  transition: box-shadow 0.3s;
}

.pdf-page canvas {
  display: block;
  width: 100%;
  height: auto;
}

/* Text Layer (للنسخ) */
.pdf-page .text-layer {
  position: absolute;
  inset: 0;
  overflow: hidden;
  line-height: 1;
  z-index: 2;
  pointer-events: auto;
  user-select: text;
  -webkit-user-select: text;
}

.pdf-page .text-layer span,
.pdf-page .text-layer br {
  color: transparent;
  position: absolute;
  white-space: pre;
  cursor: text;
  transform-origin: 0% 0%;
  pointer-events: auto;
  /* ⭐⭐ v4.6.7 — TASK 3: تفعيل تحديد/نسخ النصّ داخل الـPDF */
  user-select: text;
  -webkit-user-select: text;
}

/* ⭐⭐ v4.6.7 — TASK 3: زرّ «نسخ» العائم (يظهر عند التحديد فقط) */
.pdf-copy-btn {
  position: fixed;
  z-index: 130;
  display: none;
  align-items: center;
  gap: 6px;
  padding: 9px 14px;
  border-radius: 999px;
  border: 1px solid var(--border-strong, rgba(16, 185, 129, 0.4));
  background: var(--bg-overlay, rgba(10, 26, 20, 0.96));
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  color: var(--text-primary, #f0fdf4);
  font-family: inherit;
  font-size: 0.8rem;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 0 14px 34px -14px rgba(0, 0, 0, 0.7);
}

.pdf-copy-btn.show { display: inline-flex; }
.pdf-copy-btn svg { width: 15px; height: 15px; }

.pdf-page .text-layer span::selection {
  background: rgba(16, 185, 129, 0.4);
}

/* Placeholder */
.pdf-page.placeholder {
  background: linear-gradient(90deg, var(--bg-elevated) 25%, rgba(200, 200, 200, 0.15) 50%, var(--bg-elevated) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.5s infinite;
}

@keyframes shimmer {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

.pdf-page.placeholder::after {
  content: attr(data-page-num);
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 0.9rem;
  font-weight: 700;
  color: var(--text-muted);
  opacity: 0.5;
}

/* ⭐⭐ v4.6.2 — Phase 31: شريط تقدّم رفيع + هيكل عظمي بدل
   حبة «جاري تحضير الملف…» العائمة.
   ------------------------------------------------------------ */
.viewer-progress {
  position: relative;
  height: 3px;
  background: transparent;
  flex-shrink: 0;
  z-index: 99;
  overflow: hidden;
}

.viewer-progress .progress-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--accent), var(--accent-light));
  border-radius: 0 2px 2px 0;
  transition: width 0.25s ease;
}

/* ⭐ هيكل عظمي مركزي أنيق */
.viewer-skeleton {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  padding: 18px 14px;
  background: var(--viewer-bg);
  z-index: 60;
  overflow: hidden;
  transition: opacity 0.3s ease, visibility 0.3s ease;
}

.viewer-skeleton.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.skeleton-page {
  width: min(92%, 560px);
  border-radius: 6px;
  background: linear-gradient(90deg, var(--bg-elevated) 25%, rgba(200, 200, 200, 0.12) 50%, var(--bg-elevated) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.4s infinite;
  box-shadow: var(--page-shadow);
  flex: 0 0 auto;
}

.skeleton-page:nth-child(1) { height: 46vh; }
.skeleton-page:nth-child(2) { height: 34vh; opacity: 0.7; }
.skeleton-page:nth-child(3) { height: 26vh; opacity: 0.45; }

/* ⭐⭐ v4.6.2: شريط أزرار عائم (تكبير/تصغير + وضع العرض) */
.fab-bar {
  position: fixed;
  left: 14px;
  bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  z-index: 120;
  /* ⭐⭐ v4.6.6 — TASK 5: قابل للسحب (Pointer Events) */
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
  transition: transform 0.18s ease-out;
  will-change: transform;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 6px;
  border-radius: 18px;
  background: var(--bg-header);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border: 1px solid var(--border);
  box-shadow: 0 12px 30px -14px rgba(0, 0, 0, 0.55);
}

.fab-btn {
  width: 40px;
  height: 40px;
  border-radius: 13px;
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--text-primary);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all var(--transition);
  padding: 0;
}

.fab-bar.dragging {
  transition: none;
  cursor: grabbing;
  transform-origin: center;
  box-shadow: 0 18px 40px -16px rgba(0, 0, 0, 0.7);
  border-color: var(--accent);
}

.fab-bar.snapping {
  transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}

.fab-btn:hover { border-color: var(--accent); color: var(--accent); }
.fab-btn:active { transform: scale(0.92); }
.fab-btn.active {
  background: linear-gradient(135deg, var(--accent), var(--accent-light));
  color: #fff;
  border-color: transparent;
}
.fab-btn svg { width: 19px; height: 19px; }

/* ⭐ أزرار التنقّل بين الصفحات (تظهر في وضع صفحة واحدة فقط) */
body:not(.single-page) .fab-nav { display: none; }
.fab-btn:disabled { opacity: 0.4; cursor: not-allowed; }

/* ⭐ وضع صفحة واحدة */
body.single-page .viewer { scroll-snap-type: y mandatory; }
body.single-page .pdf-page { scroll-snap-align: start; margin-bottom: 40vh; }
body.single-page .pdf-page:not(.current) { display: none; }
body.single-page .pdf-page.current { margin-bottom: 0; }

/* ⭐⭐⭐ v4.6.6: صندوق التظليل — يُضاف داخل حاوية الصفحة (position:relative)
   فوق الـcanvas (z-index:1) وطبقة النصّ (z-index:5) بـ z-index:10 */
.pdf-page {
  position: relative;
}

.pdf-highlight-box {
  position: absolute;
  background-color: rgba(255, 235, 59, 0.8);
  z-index: 999;
  pointer-events: none;
  mix-blend-mode: multiply;
  border-radius: 4px;
  animation: medappHighlightPulse 0.35s ease-out;
}

@keyframes medappHighlightPulse {
  0%   { opacity: 0; transform: scale(1.12); }
  60%  { opacity: 1; transform: scale(1); }
  100% { opacity: 1; transform: scale(1); }
}

/* ⭐⭐⭐ v4.6.5: تظليل النتائج داخل صفحة PDF — واضح جداً فوق الـcanvas */
.pdf-page canvas {
  position: relative;
  z-index: 1;
}

.pdf-page .text-layer {
  z-index: 5;
}

.pdf-page .text-layer span.hit {
  background-color: rgba(255, 235, 59, 0.8);
  background-image: none;
  z-index: 999;
  pointer-events: none;
  mix-blend-mode: multiply;
  border-radius: 3px;
  box-shadow: 0 0 0 1px rgba(202, 138, 4, 0.7);
}

.pdf-page .text-layer span.current {
  background-color: rgba(255, 235, 59, 0.8);
  background-image: none;
  z-index: 999;
  pointer-events: none;
  mix-blend-mode: multiply;
  border-radius: 3px;
  box-shadow: 0 0 0 2px rgba(234, 88, 12, 0.9);
}

/* ⭐ أزرار التنقّل بين النتائج + عدّاد */
.search-nav {
  display: flex;
  align-items: center;
  gap: 6px;
  flex: 0 0 auto;
}

.search-nav-btn {
  width: 32px;
  height: 32px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--text-primary);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  padding: 0;
  transition: all var(--transition);
}

.search-nav-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.search-nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
.search-nav-btn svg { width: 15px; height: 15px; }

.search-count {
  font-size: 0.7rem;
  font-weight: 800;
  color: var(--text-muted);
  min-width: 46px;
  text-align: center;
  white-space: nowrap;
}

/* ⭐⭐ v4.6.2: صندوق النتائج يعرض رقم الصفحة وعدد التطابقات */
.search-result-item .page-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: 999px;
  background: rgba(5, 150, 105, 0.12);
  border: 1px solid var(--border);
  color: var(--accent);
  font-size: 0.66rem;
  font-weight: 800;
  margin-left: 6px;
}

.search-result-item.active {
  border-color: var(--accent);
  background: rgba(5, 150, 105, 0.08);
}

.loading-overlay.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.spinner {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  animation: spin 0.85s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

.loading-text {
  font-size: 0.9rem;
  font-weight: 700;
  color: var(--text-primary);
}

.loading-sub {
  font-size: 0.78rem;
  color: var(--text-muted);
  margin-top: -10px;
  min-height: 20px;
}

/* خطأ */
.error-state {
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  padding: 40px 20px;
  text-align: center;
  height: 100%;
}

.error-state.visible { display: flex; }

.error-state svg {
  width: 60px;
  height: 60px;
  color: var(--danger);
  opacity: 0.6;
}

.error-state h3 {
  font-size: 1.05rem;
  font-weight: 800;
  color: var(--text-primary);
}

.error-state p {
  font-size: 0.82rem;
  color: var(--text-secondary);
  max-width: 320px;
  line-height: 1.6;
}

/* البحث */
.search-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.5);
  backdrop-filter: blur(6px);
  z-index: 500;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  /* ⭐ v4.6.4 — دفع نافذة البحث أسفل النتش/شريط الحالة */
  padding: 16px;
  padding-top: calc(env(safe-area-inset-top, 0px) + 16px);
  opacity: 0;
  visibility: hidden;
  transition: all 0.25s;
}

.search-overlay.visible { opacity: 1; visibility: visible; }

.search-box {
  width: 100%;
  max-width: 500px;
  background: var(--bg-overlay);
  border: 1px solid var(--border-strong, rgba(16, 185, 129, 0.35));
  border-radius: 20px;
  padding: 14px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
  transform: translateY(-20px);
  transition: transform 0.25s;
  /* ⭐ v4.6.4 — زجاج نظيف */
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}

.search-overlay.visible .search-box { transform: translateY(0); }

.search-input-wrap {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 0 14px;
}

.search-input-wrap:focus-within { border-color: var(--accent); }
.search-input-wrap svg { width: 18px; height: 18px; color: var(--text-muted); flex-shrink: 0; }

.search-input {
  flex: 1;
  border: none;
  background: transparent;
  color: var(--text-primary);
  font-family: 'Cairo', sans-serif;
  font-size: 0.9rem;
  font-weight: 600;
  padding: 13px 0;
  outline: none;
}

.search-input::placeholder { color: var(--text-muted); }

.search-results {
  margin-top: 10px;
  max-height: 50vh;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.search-result-item {
  padding: 11px 13px;
  border-radius: 12px;
  background: var(--bg-elevated);
  border: 1px solid transparent;
  cursor: pointer;
  transition: all var(--transition);
}

.search-result-item:hover {
  border-color: var(--accent);
  background: rgba(16, 185, 129, 0.08);
}

.search-result-item .page-label {
  font-size: 0.68rem;
  color: var(--accent);
  font-weight: 700;
  margin-bottom: 4px;
}

.search-result-item .snippet {
  font-size: 0.78rem;
  color: var(--text-secondary);
  line-height: 1.5;
  direction: ltr;
  text-align: left;
}

.search-result-item .snippet mark {
  background: rgba(245, 158, 11, 0.3);
  color: var(--text-primary);
  padding: 0 2px;
  border-radius: 3px;
}

.search-hint {
  text-align: center;
  padding: 20px 10px;
  color: var(--text-muted);
  font-size: 0.8rem;
}

/* Toast */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: var(--bg-overlay);
  border: 1px solid var(--border);
  color: var(--text-primary);
  padding: 12px 20px;
  border-radius: 14px;
  font-size: 0.85rem;
  font-weight: 700;
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.25);
  display: flex;
  align-items: center;
  gap: 10px;
  opacity: 0;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  pointer-events: none;
  max-width: calc(100% - 32px);
  backdrop-filter: blur(16px);
  z-index: 2147483647;
}

.toast.show {
  transform: translateX(-50%) translateY(0);
  opacity: 1;
}

.toast svg { width: 17px; height: 17px; flex-shrink: 0; }
.toast.success svg { color: var(--accent); }
.toast.error svg { color: var(--danger); }
.toast.info svg { color: #3b82f6; }

/* مؤشر الصفحة */
.page-hud {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(80px);

const MAX_SEARCH_MATCHES = 300;
const MAX_SEARCH_RESULTS = 50;

const state = {

  fileInfo: null,

const $ = id => document.getElementById(id);
const els = {
  fileTitle:     $('fileTitle'),
  fileSub:       $('fileSub'),
  viewer:        $('viewer'),
  errorState:    $('errorState'),
  errorTitle:    $('errorTitle'),
  errorMessage:  $('errorMessage'),
  skeleton:      $('skeleton'),
  progressFill:  $('progressFill'),
  headerPagePill:$('headerPagePill'),
  stage:         $('pdfStage'),
  fabBar:        $('fabBar'),
  copyBtn:       $('pdfCopyBtn'),
  zoomInBtn:     $('zoomInBtn'),
  zoomOutBtn:    $('zoomOutBtn'),
  pageModeBtn:   $('pageModeBtn'),
  pagePrevBtn:   $('pagePrevBtn'),
  pageNextBtn:   $('pageNextBtn'),
  searchPrevBtn: $('searchPrevBtn'),
  searchNextBtn: $('searchNextBtn'),
  searchCount:   $('searchCount'),
  themeBtn:      $('themeBtn'),
  searchBtn:     $('searchBtn'),
  searchOverlay: $('searchOverlay'),
  searchInput:   $('searchInput'),
  searchResults: $('searchResults'),
  toast:         $('toast'),
  toastText:     $('toastText'),
  pageHud:       $('pageHud'),
};

/* ═══ Toast ═══ */
let toastTimer = null;
function showToast(message, type = 'success') {
  if (toastTimer) clearTimeout(toastTimer);
  els.toastText.textContent = message;
  els.toast.className = 'toast show ' + type;
  const icons = {
    success: '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>',
    error:   '<circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>',
    info:    '<circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>'
  };
  els.toast.querySelector('svg').innerHTML = icons[type] || icons.info;
  toastTimer = setTimeout(() => els.toast.classList.remove('show'), 2200);
}

/* ═══ الثيم ═══ */
function applyTheme() {
  const theme = localStorage.getItem('medfav_theme') || 'light';
  document.documentElement.setAttribute('data-theme', theme);
  updateThemeIcon(theme);
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.content = theme === 'dark' ? '#06110d' : '#f8fafb';
}

function updateThemeIcon(theme) {
  const icon = els.themeBtn.querySelector('svg');
  if (theme === 'dark') {
    icon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
  } else {
    icon.innerHTML = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>';
  }
}

function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme') || 'light';
  const next = current === 'light' ? 'dark' : 'light';
  localStorage.setItem('medfav_theme', next);
  applyTheme();
  showToast(next === 'dark' ? 'الوضع الليلي' : 'الوضع النهاري', 'info');
}

/* ═══ تقدم التحميل ═══ */
/* ⭐ v4.6.2 — شريط رفيع + نصّ في الشريط العلوي (بلا حبة عائمة) */
function setProgress(pct, text) {
  if (els.progressFill) els.progressFill.style.width = Math.max(0, Math.min(100, pct)) + '%';
  if (text && els.fileSub) els.fileSub.textContent = text;
}

function hideLoading() {
  if (els.skeleton) {
    els.skeleton.classList.add('hidden');
    setTimeout(() => {
      if (els.skeleton && els.skeleton.parentNode) els.skeleton.remove();
    }, 350);
  }
  if (els.progressFill) els.progressFill.style.width = '100%';
  setTimeout(() => { if (els.progressFill) els.progressFill.style.width = '0%'; }, 600);
}

/* ═══ تحميل الملف كامل ═══ */
async function downloadPdf(fileId, fileUrl) {
  // ⭐ وضع الزائر: حفظ الملف للقراءة دون إنترنت يحتاج حساباً.
  if (typeof requireLoginAction === 'function' &&
      !requireLoginAction('سجّل الدخول لحفظ هذا الملف وقراءته دون إنترنت.')) return;

  // 1) IndexedDB
  try {
    const cached = await getDownloadedFile(fileId);
    if (cached && cached.blob) {
      return cached.blob;
    }
  } catch (e) { /* تجاهل */ }

  // 2) الشبكة
  if (!navigator.onLine) throw new Error('لا يوجد اتصال بالإنترنت والملف غير محفوظ');

  const response = await fetch(fileUrl);
  if (!response.ok) throw new Error('فشل التحميل: ' + response.status);

  const total = parseInt(response.headers.get('content-length') || '0', 10);
  const chunks = [];
  let received = 0;

  const reader = response.body.getReader();
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value);
    received += value.length;
    if (total > 0) {
      const realPct = Math.round((received / total) * 100);
      const barPct = Math.round((received / total) * 55);
      setProgress(barPct, `تحميل ${realPct}%`);
    }
  }

  return new Blob(chunks, { type: 'application/pdf' });
}

/* ═══ تحميل PDF تدريجي (Range requests) ═══ */
function buildViewerPdfConfig(extra) {
  return Object.assign({
    cMapUrl: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/cmaps/',
    cMapPacked: true,
  }, extra || {});
}

async function openPdfProgressively(fileInfo) {
  state.pdfBlob = null;

  // 1) النسخة المحفوظة في IndexedDB تعمل حتى بدون إنترنت.
  let cached = null;
  try {
    if (typeof getDownloadedFile === 'function') {
      cached = await getDownloadedFile(state.fileId);
    }
  } catch (e) { /* تجاهل */ }

  if (cached && cached.blob) {
    setProgress(12, 'فتح النسخة المحفوظة...');
    const cachedBuffer = await cached.blob.arrayBuffer();
    const cachedTask = pdfjsLib.getDocument(buildViewerPdfConfig({ data: cachedBuffer }));
    state.pdfDoc = await cachedTask.promise;
    return;
  }

  const fileUrl = fileInfo.file_url || fileInfo.external_url || '';
  if (!fileUrl) throw new Error('رابط الملف غير متوفر');
  if (!navigator.onLine) throw new Error('لا يوجد اتصال بالإنترنت والملف غير محفوظ');

  // 2) الرابط مباشرة: PDF.js يطلب أجزاء Range عند الحاجة فقط.
  setProgress(6, 'بدء التحميل التدريجي...');

  const streamOptions = typeof buildPdfStreamOptions === 'function'
    ? buildPdfStreamOptions(fileUrl)
    : { url: fileUrl, disableRange: false, disableStream: false, disableAutoFetch: true, rangeChunkSize: 65536 };

  const loadingTask = pdfjsLib.getDocument(buildViewerPdfConfig(streamOptions));

  loadingTask.onProgress = (progress) => {
    if (!progress || !progress.total) {
      setProgress(24, 'تحميل تدريجي — الصفحات تُعرض عند الطلب');
      return;
    }
    const pct = Math.min(55, 8 + Math.round((progress.loaded / progress.total) * 47));
    setProgress(pct, 'تحميل تدريجي — الصفحات تُعرض عند الطلب');
  };

  try {
    state.pdfDoc = await loadingTask.promise;
  } catch (err) {
    // بعض السيرفرات لا تدعم Accept-Ranges؛ نرجع لتحميل كامل مرة واحدة.
    console.warn('تعذّر التحميل التدريجي، سيتم الرجوع للتحميل الكامل:', err);
    try { loadingTask.destroy(); } catch (e) {}

    setProgress(12, 'السيرفر لا يدعم التحميل التدريجي — تحميل كامل...');
    const blob = await downloadPdf(state.fileId, fileUrl);
    state.pdfBlob = blob;
    const arrayBuffer = await blob.arrayBuffer();
    const fallbackTask = pdfjsLib.getDocument(buildViewerPdfConfig({ data: arrayBuffer }));
    state.pdfDoc = await fallbackTask.promise;
  }
}

/* ═══ حساب العرض ═══ */
function calcContainerWidth() {
  const rect = els.viewer.getBoundingClientRect();
  const padding = window.innerWidth <= 640 ? 16 : 32;
  const w = rect.width - padding;
  return Math.max(w, 280);
}

/* ═══ إنشاء Placeholders ═══ */
async function createPlaceholders() {
  // ⭐ v4.6.6 — العرض يبقى بعرض الشاشة، والتكبير يتم بالتحويل (transform)
  state.containerWidth = Math.round(calcContainerWidth());

  // أبعاد الصفحة الأولى
  const firstPage = await state.pdfDoc.getPage(1);
  const vp = firstPage.getViewport({ scale: 1 });
  state.pageRatio = vp.height / vp.width;

  const pageHeight = Math.round(state.containerWidth * state.pageRatio);

  const frag = document.createDocumentFragment();
  for (let i = 1; i <= state.totalPages; i++) {
    const div = document.createElement('div');
    div.className = 'pdf-page placeholder';
    div.dataset.pageNum = i;
    div.style.width = state.containerWidth + 'px';
    div.style.height = pageHeight + 'px';
    frag.appendChild(div);
  }
  // ⭐ v4.6.6 — الصفحات داخل مسرح التحويل
  (els.stage || els.viewer).appendChild(frag);
  applyStageTransform();
}

/* ═══════════════════════════════════════════════════════
   ⭐⭐ v4.6.6 — TASK 6: التكبير/التصغير عبر CSS transform
   ------------------------------------------------------------
   • المسرح (pdfStage) يحمل scale() و translate().
   • الأزرار والإيماءة (pinch) يمرّان بنفس الدالة ⇒ متزامنة دائماً.
   • بعد استقرار التكبير نعيد رسم الصفحات الظاهرة بدقة أعلى
     (رسم أنظف) دون تغيير المقاسات.
   ═══════════════════════════════════════════════════════ */
var STAGE_MIN_ZOOM = 0.6;
var STAGE_MAX_ZOOM = 3;

function clampNumber(value, min, max) {
  var n = Number(value);
  if (isNaN(n)) return min;
  return Math.max(min, Math.min(max, n));
}

/** ⭐ أصل المسرح في إحداثيات الشاشة (قبل التحويل) */
function stageOrigin() {
  var stage = els.stage;
  if (!stage) return { x: 0, y: 0 };
  var r = stage.getBoundingClientRect();
  return { x: r.left - state.panX, y: r.top - state.panY };
}

/** ⭐ يطبّق التحويل ويوسّع منطقة التمرير بمقدار الزيادة */
function applyStageTransform() {
  var stage = els.stage;
  if (!stage) return;
  var k = state.zoom;

  stage.style.transform = 'translate3d(' + state.panX + 'px,' + state.panY + 'px,0) scale(' + k + ')';

  var w = stage.offsetWidth || 0;
  var h = stage.offsetHeight || 0;
  stage.style.marginRight = Math.max(0, Math.round(w * (k - 1))) + 'px';
  stage.style.marginBottom = Math.max(0, Math.round(h * (k - 1))) + 'px';

  // ⭐ عند التكبير نتحكّم بالتمرير بأنفسنا.
  stage.classList.toggle('zoomed', k > 1.01);
}

/** ⭐ يحدّزاحة التمرير ضمن حدود المحتوى */
function clampPan() {
  var stage = els.stage;
  if (!stage) return;
  if (state.zoom <= 1.01) { state.panX = 0; state.panY = 0; return; }
  var w = stage.offsetWidth || 0;
  var h = stage.offsetHeight || 0;
  var viewW = els.viewer ? els.viewer.clientWidth : window.innerWidth;
  var viewH = els.viewer ? els.viewer.clientHeight : window.innerHeight;
  var maxX = Math.max(0, (w * state.zoom - viewW) / 2);
  var maxY = Math.max(0, (h * state.zoom - viewH) / 2);
  state.panX = clampNumber(state.panX, -maxX, maxX);
  state.panY = clampNumber(state.panY, -maxY, maxY);
}

/**
 * ⭐⭐ تكبير/تصغير موحّد — تستدعيه الأزرار والإيماءة معاً.
 * @param {number} next
 * @param {object} [options] { anchor: {x, y} } — نقطة تُثبَّت أثناء التكبير
 */
function setZoom(next, options) {
  options = options || {};
  var k = clampNumber(next, STAGE_MIN_ZOOM, STAGE_MAX_ZOOM);
  var changed = Math.abs(k - state.zoom) > 0.001;

  if (changed && options.anchor) {
    // ⭐ نُبقي نقطة البؤرة تحت الإصبع/القرص.
    var origin = stageOrigin();
    var k0 = state.zoom || 1;
    var contentX = (options.anchor.x - origin.x - state.panX) / k0;
    var contentY = (options.anchor.y - origin.y - state.panY) / k0;
    state.zoom = k;
    state.panX = options.anchor.x - origin.x - contentX * k;
    state.panY = options.anchor.y - origin.y - contentY * k;
  } else {
    state.zoom = k;
  }

  clampPan();
  applyStageTransform();
  scheduleQualityRerender();

  if (els.fileSub) els.fileSub.textContent = 'التكبير ' + Math.round(state.zoom * 100) + '%';
  if (changed && options.silent !== true) {
    showToast('التكبير ' + Math.round(state.zoom * 100) + '%', 'info');
  }
}

/* ⭐ إعادة الرسم بدقة أعلى بعد استقرار التكبير (نصّ أوضح) */
var qualityTimer = null;
function scheduleQualityRerender() {
  if (qualityTimer) clearTimeout(qualityTimer);
  qualityTimer = setTimeout(function () {
    qualityTimer = null;
    var quality = Math.min(2.2, Math.max(1, state.zoom));
    if (Math.abs(quality - state.quality) < 0.05) return;
    state.quality = quality;
    state.renderedPages.forEach(function (num) {
      var el = document.querySelector('.pdf-page[data-page-num="' + num + '"]');
      if (!el) return;
      el.innerHTML = '';
      el.classList.add('placeholder');
      el.classList.remove('rendered');
    });
    state.renderedPages.clear();
    renderVisiblePages();
  }, 320);
}

/* ⭐ v4.6.2 — وضع صفحة واحدة ↔ تمرير متواصل */
function togglePageMode() {
  state.singlePage = !state.singlePage;
  document.body.classList.toggle('single-page', state.singlePage);
  if (els.pageModeBtn) els.pageModeBtn.classList.toggle('active', state.singlePage);

  if (state.singlePage) {
    setCurrentPage(state.currentPage, true);
    showToast('وضع صفحة واحدة', 'info');
  } else {
    document.querySelectorAll('.pdf-page').forEach(function (el) { el.classList.remove('current'); });
    showToast('تمرير متواصل', 'info');
  }
  renderVisiblePages();
}

/* ⭐ v4.6.2 — الانتقال إلى صفحة بعينها */
function goToPage(num) {
  var target = Math.max(1, Math.min(state.totalPages || 1, Number(num) || 1));
  if (state.singlePage) {
    setCurrentPage(target, true);
  } else {
    var el = document.querySelector('.pdf-page[data-page-num="' + target + '"]');
    if (el) {
      els.viewer.scrollTo({ top: Math.max(0, el.offsetTop - 8), behavior: 'smooth' });
      renderPage(el);
    }
  }
  setCurrentPage(target);
}

/* ⭐ v4.6.2 — الصفحة الحالية (للمؤشّر + وضع صفحة واحدة) */
function setCurrentPage(num, force) {
  if (!num || num === state.currentPage && !force) return;
  state.currentPage = num;

  if (els.headerPagePill) {
    els.headerPagePill.textContent = num + ' / ' + state.totalPages;
    els.headerPagePill.classList.add('show');
  }
  if (els.pageHud) els.pageHud.textContent = 'الصفحة ' + num + ' من ' + state.totalPages;

  if (state.singlePage) {
    document.querySelectorAll('.pdf-page').forEach(function (el) {
      el.classList.remove('current');
    });
    var current = document.querySelector('.pdf-page[data-page-num="' + num + '"]');
    if (current) {
      current.classList.add('current');
      els.viewer.scrollTop = 0;
      renderPage(current);
    }
  }
}

/* ═══ طبقة النصّ (مواضع دقيقة) ═══
   * ⭐ v4.6.2 — نبني طبقة النصّ بأنفسنا بدل pdfjsLib.renderTextLayer
   *   (غير متوفّرة في نسخة CDN المضغوطة) — وبها نعرف الموضع الدقيق
   *   لكل كلمة لنقفز إليها ونظلّلها. */
function buildTextLayer(container, textContent, viewport, pageNum) {
  var frag = document.createDocumentFragment();
  var items = [];
  var offset = 0;

  (textContent.items || []).forEach(function (item, idx) {
    if (typeof item.str !== 'string' || !item.str.length) return;

    var tx;
    try {
      tx = pdfjsLib.Util.transform(viewport.transform, item.transform);
    } catch (e) {
      tx = [1, 0, 0, 1, 0, 0];
    }

    var fontHeight = Math.hypot(tx[2], tx[3]) || 12;
    var x = tx[4];
    var y = tx[5] - fontHeight;   // أعلى السطر

    var span = document.createElement('span');
    span.textContent = item.str;
    span.style.left = x + 'px';
    span.style.top = y + 'px';
    span.style.fontSize = fontHeight + 'px';
    span.style.fontFamily = 'sans-serif';
    span.dataset.idx = String(idx);
    span.dataset.x = String(x);
    span.dataset.y = String(y);
    frag.appendChild(span);

    items.push({ idx: idx, str: item.str, start: offset, end: offset + item.str.length });
    offset += item.str.length + 1;   // مسافة بين العناصر (كما في join)
  });

  container.appendChild(frag);

  // ⭐ الفهرس: نصّ الصفحة + حدود كل عنصر
  var text = items.map(function (i) { return i.str; }).join(' ');
  state.textIndex.set(pageNum, { text: text, items: items });
  state.pageTextCache.set(pageNum, text);
  state.indexedPages.add(pageNum);
}

/* ═══ رسم صفحة ═══ */
async function renderPage(pageEl) {
  var pageNum = parseInt(pageEl.dataset.pageNum, 10);
  if (!pageNum) return;
  if (state.renderedPages.has(pageNum)) { resolveRenderWaiters(pageNum); return; }
  if (state.renderingPages.has(pageNum)) return;
  state.renderingPages.add(pageNum);

  try {
    var page = await state.pdfDoc.getPage(pageNum);

    // أبعاد
    var baseViewport = page.getViewport({ scale: 1 });
    var containerWidth = state.containerWidth || calcContainerWidth() || 360;
    var scale = (containerWidth / baseViewport.width);
    var viewport = page.getViewport({ scale });

    // Canvas
    // ⭐ v4.6.6 — دقة أعلى عند التكبير (رسم أنظف) دون تغيير المقاس
    var dpr = Math.min(window.devicePixelRatio || 1, 2) * (state.quality || 1);
    var canvas = document.createElement('canvas');
    canvas.width = Math.max(1, Math.floor(viewport.width * dpr));
    canvas.height = Math.max(1, Math.floor(viewport.height * dpr));
    canvas.style.width = '100%';
    canvas.style.height = 'auto';

    var ctx = canvas.getContext('2d', { alpha: false });
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    await page.render({
      canvasContext: ctx,
      viewport: viewport,
      transform: dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : null,
    }).promise;

    // Text Layer بمواضع دقيقة
    var textLayer = document.createElement('div');
    textLayer.className = 'text-layer';
    textLayer.style.width = viewport.width + 'px';
    textLayer.style.height = viewport.height + 'px';

    try {
      var textContent = await page.getTextContent();
      buildTextLayer(textLayer, textContent, viewport, pageNum);
    } catch (e) {
      console.warn('Text layer failed for page ' + pageNum, e);
    }

    // استبدال
    pageEl.classList.remove('placeholder');
    pageEl.classList.add('rendered');
    pageEl.style.width = viewport.width + 'px';
    pageEl.style.height = 'auto';
    pageEl.innerHTML = '';
    pageEl.appendChild(canvas);
    pageEl.appendChild(textLayer);

    state.renderedPages.add(pageNum);
    resolveRenderWaiters(pageNum);

  } catch (e) {
    console.error('فشل رسم الصفحة ' + pageNum, e);
    pageEl.classList.remove('placeholder');
    pageEl.style.display = 'flex';
    pageEl.style.alignItems = 'center';
    pageEl.style.justifyContent = 'center';
    pageEl.innerHTML = '<span style="color:var(--text-muted);font-size:0.85rem;">تعذّر عرض الصفحة ' + pageNum + '</span>';
    resolveRenderWaiters(pageNum);
  } finally {
    state.renderingPages.delete(pageNum);
  }
}

/* ⭐ ننتظر حتى تُرسم صفحة (للقفز إلى نتيجة بحث) */
function waitForPage(pageNum) {
  if (state.renderedPages.has(pageNum)) return Promise.resolve(true);
  return new Promise(function (resolve) {
    var list = state.renderWaiters.get(pageNum) || [];
    list.push(resolve);
    state.renderWaiters.set(pageNum, list);
  });
}

function resolveRenderWaiters(pageNum) {
  var list = state.renderWaiters.get(pageNum);
  if (!list || !list.length) return;
  state.renderWaiters.delete(pageNum);
  list.forEach(function (fn) { try { fn(true); } catch (e) {} });
}

/* ⭐ يضمن رسم صفحة معيّنة (فوراً) */
function ensurePageRendered(pageNum) {
  var el = document.querySelector('.pdf-page[data-page-num="' + pageNum + '"]');
  if (!el) return Promise.resolve(false);
  if (state.renderedPages.has(pageNum)) return Promise.resolve(true);
  var waiting = waitForPage(pageNum);
  renderPage(el);
  return waiting;
}

/* ═══ IntersectionObserver ═══ */
function setupObserver() {
  if (state.observer) state.observer.disconnect();

  // ⭐ v4.6.2 — عرض افتراضي: الصفحة الظاهرة + صفحة فوقها وأخرى تحتها
  state.observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const el = entry.target;
        requestAnimationFrame(() => renderPage(el));
        if (!state.singlePage) {
          const num = parseInt(el.dataset.pageNum, 10);
          if (num) setCurrentPage(num);
        }
      }
    });
  }, {
    root: els.viewer,
    rootMargin: '100% 0px',
    threshold: 0,
  });

  document.querySelectorAll('.pdf-page').forEach(el => {
    state.observer.observe(el);
  });
}

/* ═══ الصفحات المرئية ═══ */
/**
 * ⭐ v4.6.2 — يرسم الصفحات الظاهرة فقط (والقريبة منها).
 */
function renderVisiblePages() {
  if (!els.viewer) return;
  var top = els.viewer.scrollTop;
  var height = els.viewer.clientHeight || window.innerHeight;

  document.querySelectorAll('.pdf-page').forEach(function (el) {
    var pageTop = el.offsetTop;
    var pageBottom = pageTop + el.offsetHeight;
    if (pageBottom > top - height && pageTop < top + height * 2) {
      renderPage(el);
    }
  });
}

/**
 * ⭐ v4.6.2 — يحرّر ذاكرة الصفحات البعيدة (عرض افتراضي حقيقي).
 */
function releaseFarPages() {
  var top = els.viewer.scrollTop;
  var height = els.viewer.clientHeight || window.innerHeight;

  document.querySelectorAll('.pdf-page.rendered').forEach(function (el) {
    var pageTop = el.offsetTop;
    var pageBottom = pageTop + el.offsetHeight;
    var tooFar = pageBottom < top - height * 2.5 || pageTop > top + height * 3.5;
    if (!tooFar) return;
    if (state.singlePage && el.classList.contains('current')) return;

    var num = parseInt(el.dataset.pageNum, 10);
    el.innerHTML = '';
    el.classList.remove('rendered');
    el.classList.add('placeholder');
    el.style.height = Math.round(state.containerWidth * state.pageRatio) + 'px';
    state.renderedPages.delete(num);
  });
}

/* ═══ HUD السكرول ═══ */
let hudTimer = null;
function setupScrollHUD() {
  els.viewer.addEventListener('scroll', () => {
    const containerRect = els.viewer.getBoundingClientRect();
    const centerY = containerRect.top + containerRect.height / 2;

    let closestPage = 1;
    let minDist = Infinity;

    document.querySelectorAll('.pdf-page').forEach(p => {
      const rect = p.getBoundingClientRect();
      const pageCenter = rect.top + rect.height / 2;
      const dist = Math.abs(pageCenter - centerY);
      if (dist < minDist) {
        minDist = dist;
        closestPage = parseInt(p.dataset.pageNum, 10);
      }
    });

    els.pageHud.textContent = `الصفحة ${closestPage} من ${state.totalPages}`;
    els.pageHud.classList.add('show');

    clearTimeout(hudTimer);
    hudTimer = setTimeout(() => els.pageHud.classList.remove('show'), 1200);

    if (!state.singlePage) setCurrentPage(closestPage);

    // ⭐ v4.6.2 — تحرير ذاكرة الصفحات البعيدة
    if (!scrollReleaseTimer) {
      scrollReleaseTimer = setTimeout(() => {
        scrollReleaseTimer = null;
        releaseFarPages();
      }, 400);
    }
  }, { passive: true });
}
let scrollReleaseTimer = null;

/* ═══════════════════════════════════════════════════════
   ⭐⭐ v4.6.2 — Phase 31: بحث عميق (فهرسة + قفز دقيق + تظليل)
   ------------------------------------------------------------
   1) نفهرس نصّ كل الصفحات في الخلفية (pdf.getTextContent).
   2) البحث يبدأ من أول حرف.
   3) النتيجة تنقلك إلى الصفحة وإلى الموضع Y الدقيق.
   4) الكلمة المطابقة تُظلَّل بلون أصفر مؤقّتاً.
   5) سهما «التالي/السابق» للتنقّل بين كل المطابقات.
   ═══════════════════════════════════════════════════════ */

/**
 * ⭐ فهرسة نصّ كل الصفحات في الخلفية (بلا تجميد الواجهة).
 */
async function buildSearchIndex() {
  if (state.indexing || !state.pdfDoc) return;
  state.indexing = true;

  for (let i = 1; i <= state.totalPages; i++) {
    if (state.indexedPages.has(i)) continue;
    try {
      const page = await state.pdfDoc.getPage(i);
      const tc = await page.getTextContent();
      const items = [];
      let offset = 0;
      (tc.items || []).forEach((item, idx) => {
        if (typeof item.str !== 'string' || !item.str.length) return;
        items.push({ idx: idx, str: item.str, start: offset, end: offset + item.str.length });
        offset += item.str.length + 1;
      });
      const text = items.map((it) => it.str).join(' ');
      state.textIndex.set(i, { text: text, items: items });
      state.pageTextCache.set(i, text);
      state.indexedPages.add(i);
    } catch (e) {
      /* صفحة بلا نصّ */
    }
    // ⭐ إفساح المجال للواجهة بين الصفحات
    await new Promise((r) => setTimeout(r, 0));
  }

  state.indexing = false;
  updateSearchStatus();

  // ⭐ نعيد البحث إن كان المستخدم قد كتب شيئاً أثناء الفهرسة
  if (state.searchTerm) {
    searchDocument(state.searchTerm);
  }
}

/** ⭐ حالة الفهرسة في شريط البحث */
function updateSearchStatus() {
  if (!els.searchResults) return;
  const term = (els.searchInput && els.searchInput.value || '').trim();
  if (!term) {
    const indexed = state.indexedPages.size;
    const total = state.totalPages;
    els.searchResults.innerHTML = '<div class="search-hint">' +
      (state.indexing
        ? 'جارٍ فهرسة الصفحات… ' + indexed + ' / ' + total
        : 'اكتب كلمة للبحث في ' + total + ' صفحة') +
      '</div>';
    return;
  }
  if (state.indexing && !state.searchMatches.length) {
    els.searchResults.innerHTML = '<div class="search-hint">جارٍ البحث… (' +
      state.indexedPages.size + ' / ' + state.totalPages + ')</div>';
  }
}

/**
 * ⭐ البحث في الفهرس — من أول حرف.
 */
/**
 * ⭐⭐⭐ Phase W16 — تطبيع عربي **يحافظ على المواضع**.
 *   السبب: مواضع التظليل داخل الـPDF تُحسب من أرقام حروف النصّ الأصلي،
 *   فلا يجوز تغيير طوله (ولذلك نستخدم foldArabic لا normalizeArabic).
 */
function arabicFold(value) {
  const engine = window.MedAppSearch;
  if (engine && typeof engine.foldArabic === 'function') {
    return engine.foldArabic(value);
  }
  return String(value === undefined || value === null ? '' : value).toLowerCase();
}

function searchDocument(term) {
  const q = arabicFold(String(term || '').trim());
  state.searchTerm = q;

  if (!q) {
    state.searchMatches = [];
    state.searchMatchIndex = -1;
    renderSearchResults();
    updateSearchStatus();
    updateSearchNav();
    return;
  }

  const matches = [];
  const pages = Array.from(state.textIndex.keys()).sort((a, b) => a - b);

  for (const page of pages) {
    const entry = state.textIndex.get(page);
    if (!entry || !entry.text) continue;
    // ⭐ W16 — نفس التطبيع على النصّ (المواضع محفوظة ⇒ التظليل صحيح).
    const hay = arabicFold(entry.text);
    // ⭐ v4.6.4 — includes(): مطابقة متجاهلة لحالة الأحرف
    if (!hay.includes(q)) continue;
    let idx = hay.indexOf(q);
    let guard = 0;
    // ⭐ v4.6.4 — حدّ أعلى للمطابقات (منع التجمّد مع الملفات الضخمة)
    while (idx >= 0 && guard < 300 && matches.length < MAX_SEARCH_MATCHES) {
      let item = null;
      for (const it of entry.items) {
        if (idx >= it.start && idx < it.end) { item = it; break; }
        if (it.start > idx) break;
      }
      matches.push({ page: page, offset: idx, itemIdx: item ? item.idx : 0 });
      idx = hay.indexOf(q, idx + q.length);
      guard++;
    }
  }

  state.searchMatches = matches;
  state.searchMatchIndex = matches.length ? 0 : -1;
  renderSearchResults();
  updateSearchNav();
}

/** ⭐ رسم قائمة النتائج (حسب الصفحة مع رقمها وعدد التطابقات) */
function renderSearchResults() {
  if (!els.searchResults) return;
  const term = state.searchTerm;

  if (!term) {
    updateSearchStatus();
    return;
  }
  if (!state.searchMatches.length) {
    els.searchResults.innerHTML = '<div class="search-hint">' +
      (state.indexing ? 'جارٍ البحث…' : 'لا توجد نتائج') + '</div>';
    return;
  }

  const groups = [];
  let current = null;
  state.searchMatches.forEach((m, i) => {
    if (!current || current.page !== m.page) {
      current = { page: m.page, count: 0, first: i, snippet: '' };
      groups.push(current);
    }
    current.count++;
    if (!current.snippet) {
      const entry = state.textIndex.get(m.page);
      const text = (entry && entry.text) || '';
      const start = Math.max(0, m.offset - 40);
      const end = Math.min(text.length, m.offset + term.length + 40);
      let snippet = text.substring(start, end);
      if (start > 0) snippet = '…' + snippet;
      if (end < text.length) snippet = snippet + '…';
      current.snippet = snippet;
    }
  });

  const escapeHtml = (s) => String(s).replace(/[&<>"]/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'
  }[c]));

  // ⭐ v4.6.4 — حدّ 50 نتيجة + رسم عبر requestAnimationFrame
  const shown = groups.slice(0, MAX_SEARCH_RESULTS);

  const paintResults = () => {
  els.searchResults.innerHTML = shown.map((g) => {
    const idx = g.first;
    const active = idx === state.searchMatchIndex ? ' active' : '';
    const snippet = escapeHtml(g.snippet).replace(
      new RegExp(term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'ig'),
      (m) => '<mark>' + m + '</mark>'
    );
    return '<div class="search-result-item' + active + '" data-page="' + g.page + '" data-index="' + idx + '">' +
      '<div class="page-label">الصفحة ' + g.page +
      '<span class="page-badge">' + g.count + ' نتيجة</span></div>' +
      '<div class="snippet">' + snippet + '</div>' +
      '</div>';
  }).join('');

  els.searchResults.querySelectorAll('.search-result-item').forEach((item) => {
    item.addEventListener('click', () => {
      const index = parseInt(item.dataset.index, 10);
      if (isNaN(index)) return;
      state.searchMatchIndex = index;
      // ⭐⭐ v4.6.5 — STEP 1: إغلاق نافذة البحث فوراً.
      closeSearch();
      // ⭐ STEP 2: ثم القفز إلى الموضع الدقيق + التظليل.
      jumpToMatch(state.searchMatches[index]);
      renderSearchResults();
      updateSearchNav();
    });
  });
  };

  // ⭐ v4.6.4 — الرسم عبر requestAnimationFrame (لا تجميد الواجهة)
  if (typeof requestAnimationFrame === 'function') {
    requestAnimationFrame(paintResults);
  } else {
    paintResults();
  }
}

/** ⭐ عدّاد النتائج + تفعيل الأسهم */
function updateSearchNav() {
  const total = state.searchMatches.length;
  if (els.searchCount) {
    els.searchCount.textContent = total ? (state.searchMatchIndex + 1) + '/' + total : '0/0';
  }
  if (els.searchPrevBtn) els.searchPrevBtn.disabled = total < 1;
  if (els.searchNextBtn) els.searchNextBtn.disabled = total < 1;
}

/**
 * ⭐ القفز إلى المطابقة: الصفحة + الموضع Y الدقيق + التظليل.
 */
async function jumpToMatch(match) {
  if (!match) return;
  const pageNum = match.page;

  // ⭐⭐ v4.6.6 — STEP 1: إغلاق نافذة البحث فوراً.
  closeSearch();

  // ⭐ STEP 2: إجبار العارض على الانتقال إلى الصفحة الهدف
  //   (الـvirtualized renderer يتطلّب ذلك قبل أن تُرسم).
  var el = document.querySelector('.pdf-page[data-page-num="' + pageNum + '"]');
  if (!el) return;

  if (state.singlePage) {
    setCurrentPage(pageNum, true);
  } else {
    // ⭐ نضع الصفحة في مكانها الصحيح داخل العمود المرئي.
    el.scrollIntoView({ behavior: 'auto', block: 'start' });
  }

  // ⭐ STEP 3: انتظار رسم الصفحة + ظهور عنصر النصّ (المشكلة: الت	virtualization
  //   يحذف محتوى الصفحات البعيدة، فننتظر ظهور العنصر فعلياً).
  await ensurePageRendered(pageNum);
  var span = await waitForTextElement(pageNum, match.itemIdx, 3000);

  el = document.querySelector('.pdf-page[data-page-num="' + pageNum + '"]');
  if (!el) return;

  // ⭐ STEP 4: التمرير إلى الموضع الدقيق (إزاحة 100px لأعلى centré).
  if (span) {
    var viewerRect = els.viewer.getBoundingClientRect();
    var spanRect = span.getBoundingClientRect();
    var targetTop = els.viewer.scrollTop + (spanRect.top - viewerRect.top) - 100;
    if (typeof els.viewer.scrollTo === 'function') {
      els.viewer.scrollTo({ top: Math.max(0, targetTop), behavior: 'smooth' });
    }
    if (typeof span.scrollIntoView === 'function') {
      span.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
    // ⭐ احتياط: إن كان التمرير على النافذة itself.
    var doc = document.scrollingElement || document.documentElement;
    if (doc && doc.scrollHeight > els.viewer.scrollHeight + 4) {
      window.scrollTo({ top: Math.max(0, spanRect.top + window.scrollY - 100), behavior: 'smooth' });
    }
  } else {
    // ⭐ احتياط: الصفحة نفسها (لم يُبنَ طبقة النصّ).
    el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // ⭐ التظليل (بعد الوصول للصفحة).
  highlightMatch(match);

  if (els.pageHud) {
    els.pageHud.textContent = 'الصفحة ' + pageNum + ' من ' + state.totalPages;
    els.pageHud.classList.add('show');
    clearTimeout(hudTimer);
    hudTimer = setTimeout(() => els.pageHud.classList.remove('show'), 1400);
  }
}

/* ═══════════════════════════════════════════════════════
   ⭐⭐⭐ v4.6.7 — TASK 3: زرّ «نسخ» الذي يظهر عند تحديد النصّ
   ═══════════════════════════════════════════════════════ */
function initCopyButton() {
  const btn = els.copyBtn;
  if (!btn) return;

  function hideCopyButton() {
    btn.classList.remove('show');
  }

  function syncCopyButton() {
    const sel = window.getSelection ? window.getSelection() : null;
    if (!sel || sel.rangeCount === 0 || sel.isCollapsed) { hideCopyButton(); return; }
    const text = sel.toString();
    if (!text || !text.trim()) { hideCopyButton(); return; }

    let rect = null;
    try { rect = sel.getRangeAt(0).getBoundingClientRect(); } catch (e) { rect = null; }
    if (!rect || (!rect.width && !rect.height)) { hideCopyButton(); return; }

    const top = Math.max(8, rect.top - 48);
    const left = Math.min(
      Math.max(8, window.innerWidth - 96),
      Math.max(8, rect.left + rect.width / 2 - 34)
    );
    btn.style.top = top + 'px';
    btn.style.left = left + 'px';
    btn.dataset.text = text;
    btn.classList.add('show');
  }

  document.addEventListener('selectionchange', syncCopyButton);
  if (els.viewer) {
    els.viewer.addEventListener('mouseup', function () { setTimeout(syncCopyButton, 10); });
    els.viewer.addEventListener('touchend', function () { setTimeout(syncCopyButton, 10); });
  }

  btn.addEventListener('click', function () {
    const text = btn.dataset.text || '';
    if (!text) { hideCopyButton(); return; }
    const done = function () {
      showToast('تم النسخ', 'success');
      hideCopyButton();
      try {
        const sel = window.getSelection && window.getSelection();
        if (sel && sel.removeAllRanges) sel.removeAllRanges();
      } catch (e) {}
    };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        Promise.resolve(navigator.clipboard.writeText(text)).then(done, function () {
          showToast('تعذّر النسخ', 'error');
        });
        return;
      }
      // ⭐ احتياط للمتصفّحات القديمة
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
      done();
    } catch (e) {
      showToast('تعذّر النسخ', 'error');
    }
  });
}

/* ═══════════════════════════════════════════════════════
   ⭐⭐ v4.6.6 — TASK 6: إيماءات التكبير (pinch) والتمرير (pan)
   ------------------------------------------------------------
   • إصبعان: المسافة بينهما ⇒ تكبير/تصغير حول نقطة البؤرة.
   • إصبع واحد (عند التكبير): سحب المحتوى للتنقّل.
   • touch-action: none على المسرح عند التكبير حتى لا يتدخّل
     المتصفّح (وفي وضع Fit نبقي pan-y للتمرير العمودي المعتاد).
   ═══════════════════════════════════════════════════════ */
function bindStageGestures() {
  const stage = els.stage;
  if (!stage) return;

  let touchDist = 0;
  let startZoom = 1;
  let startPanX = 0;
  let startPanY = 0;
  let startMid = null;
  let startOrigin = { x: 0, y: 0 };
  let panning = false;
  let lastX = 0;
  let lastY = 0;

  function distance(t1, t2) {
    const dx = t1.clientX - t2.clientX;
    const dy = t1.clientY - t2.clientY;
    return Math.sqrt(dx * dx + dy * dy);
  }
  function midpoint(t1, t2) {
    return { x: (t1.clientX + t2.clientX) / 2, y: (t1.clientY + t2.clientY) / 2 };
  }

  stage.addEventListener('touchstart', function (e) {
    if (e.touches.length === 2) {
      // ⭐ بداية التكبير
      touchDist = distance(e.touches[0], e.touches[1]);
      startZoom = state.zoom || 1;
      startPanX = state.panX;
      startPanY = state.panY;
      startMid = midpoint(e.touches[0], e.touches[1]);
      startOrigin = stageOrigin();
      panning = false;
      stage.classList.add('gesture');
      e.preventDefault();
      return;
    }
    if (e.touches.length === 1 && state.zoom > 1.01) {
      // ⭐ سحب المحتوى (pan) عند التكبير
      panning = true;
      lastX = e.touches[0].clientX;
      lastY = e.touches[0].clientY;
    }
  }, { passive: false });

  stage.addEventListener('touchmove', function (e) {
    if (e.touches.length === 2 && touchDist > 0 && startMid) {
      e.preventDefault();
      const d = distance(e.touches[0], e.touches[1]);
      const mid = midpoint(e.touches[0], e.touches[1]);
      const k = clampNumber(startZoom * (d / touchDist), STAGE_MIN_ZOOM, STAGE_MAX_ZOOM);

      // ⭐ نقطة البؤرة تبقى تحت الأصابع
      const contentX = (startMid.x - startOrigin.x - startPanX) / (startZoom || 1);
      const contentY = (startMid.y - startOrigin.y - startPanY) / (startZoom || 1);
      state.zoom = k;
      state.panX = mid.x - startOrigin.x - contentX * k;
      state.panY = mid.y - startOrigin.y - contentY * k;
      clampPan();
      applyStageTransform();
      return;
    }
    if (panning && e.touches.length === 1) {
      e.preventDefault();
      state.panX += e.touches[0].clientX - lastX;
      state.panY += e.touches[0].clientY - lastY;
      lastX = e.touches[0].clientX;
      lastY = e.touches[0].clientY;
      clampPan();
      applyStageTransform();
    }
  }, { passive: false });

  function endGesture(e) {
    if (e && e.touches && e.touches.length < 2) {
      touchDist = 0;
      startMid = null;
    }
    if (!e || !e.touches || e.touches.length === 0) {
      panning = false;
      stage.classList.remove('gesture');
      // ⭐ بعد الإيماءة: رسم أوضح للتكبير النهائي
      scheduleQualityRerender();
    }
  }

  stage.addEventListener('touchend', endGesture);
  stage.addEventListener('touchcancel', endGesture);
}

/* ═══ TASK 5: شريط عائم قابل للسحب ═══ */
const FAB_POS_KEY = 'medapp_fab_position';

function restoreFabPosition() {
  const bar = els.fabBar;
  if (!bar) return;
  try {
    const raw = localStorage.getItem(FAB_POS_KEY);
    if (!raw) return;
    const pos = JSON.parse(raw);
    if (!pos || typeof pos.x !== 'number' || typeof pos.y !== 'number') return;
    const rect = bar.getBoundingClientRect();
    const maxX = Math.max(8, window.innerWidth - rect.width - 8);
    const maxY = Math.max(8, window.innerHeight - rect.height - 8);
    bar.style.left = clampNumber(pos.x, 8, maxX) + 'px';
    bar.style.top = clampNumber(pos.y, 8, maxY) + 'px';
    bar.style.bottom = 'auto';
    bar.style.right = 'auto';
  } catch (e) {}
}

function saveFabPosition() {
  const bar = els.fabBar;
  if (!bar) return;
  try {
    const rect = bar.getBoundingClientRect();
    localStorage.setItem(FAB_POS_KEY, JSON.stringify({ x: rect.left, y: rect.top }));
  } catch (e) {}
}

/** ⭐ يثبّت الشريط في أقرب زاوية */
function snapFabToCorner() {
  const bar = els.fabBar;
  if (!bar) return;
  const rect = bar.getBoundingClientRect();
  const margin = 14;
  const nearLeft = rect.left < (window.innerWidth - rect.right);
  const nearTop = rect.top < (window.innerHeight - rect.bottom);
  const targetX = nearLeft ? margin : Math.max(margin, window.innerWidth - rect.width - margin);
  const targetY = nearTop ? margin : Math.max(margin, window.innerHeight - rect.height - margin);
  bar.classList.add('snapping');
  bar.style.left = targetX + 'px';
  bar.style.top = targetY + 'px';
  bar.style.bottom = 'auto';
  bar.style.right = 'auto';
  setTimeout(function () { bar.classList.remove('snapping'); }, 240);
}

function bindFabDrag() {
  const bar = els.fabBar;
  if (!bar) return;

  let pressing = false;
  let dragging = false;
  let suppressClick = false;
  let holdTimer = null;
  let startX = 0;
  let startY = 0;
  let startLeft = 0;
  let startTop = 0;

  function beginDrag(e) {
    dragging = true;
    bar.classList.add('dragging');
    bar.classList.remove('snapping');
    try { bar.setPointerCapture(e.pointerId); } catch (err) {}
  }

  bar.addEventListener('pointerdown', function (e) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    pressing = true;
    startX = e.clientX;
    startY = e.clientY;
    const rect = bar.getBoundingClientRect();
    startLeft = rect.left;
    startTop = rect.top;
    // ⭐ ضغط مطوّل (350ms) لفتح السحب — واللمسة العادية تبقى ضغطة زرّ.
    if (holdTimer) clearTimeout(holdTimer);
    holdTimer = setTimeout(function () { if (pressing) beginDrag(e); }, 350);
  });

  bar.addEventListener('pointermove', function (e) {
    if (!pressing) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    if (!dragging) {
      // ⭐ السحب الفوري مسموح أيضاً (أسرع).
      if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
      beginDrag(e);
    }
    const rect = bar.getBoundingClientRect();
    const maxX = Math.max(8, window.innerWidth - rect.width - 8);
    const maxY = Math.max(8, window.innerHeight - rect.height - 8);
    bar.style.left = clampNumber(startLeft + dx, 8, maxX) + 'px';
    bar.style.top = clampNumber(startTop + dy, 8, maxY) + 'px';
    bar.style.bottom = 'auto';
    bar.style.right = 'auto';
    e.preventDefault();
  });

  function endPointer(e) {
    if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
    if (!pressing) return;
    pressing = false;
    if (dragging) {
      dragging = false;
      bar.classList.remove('dragging');
      snapFabToCorner();
      saveFabPosition();
      suppressClick = true;   // ⭐ نمنع ضغطة الزرّ بعد السحب
      setTimeout(function () { suppressClick = false; }, 120);
    }
    try { bar.releasePointerCapture(e.pointerId); } catch (err) {}
  }

  bar.addEventListener('pointerup', endPointer);
  bar.addEventListener('pointercancel', endPointer);

  // ⭐ نمنع تنفيذ الزرّ إذا كان آخر تفاعل سحباً.
  bar.addEventListener('click', function (e) {
    if (suppressClick) {
      e.preventDefault();
      e.stopPropagation();
      suppressClick = false;
    }
  }, true);
}

/**
 * ⭐⭐⭐ v4.6.7 — ننتظر ظهور عنصر النصّ في الـDOM.
 *   (الصفحات مُvirtualized: قد يكون محتواها حُذف، فنستدعيه وننتظر.)
 */
function waitForTextElement(pageNum, itemIdx, timeoutMs) {
  return new Promise(function (resolve) {
    const started = Date.now();
    const limit = timeoutMs || 3000;
    function check() {
      const el = document.querySelector('.pdf-page[data-page-num="' + pageNum + '"]');
      const span = el ? el.querySelector('.text-layer span[data-idx="' + itemIdx + '"]') : null;
      if (span) { resolve(span); return; }
      if (Date.now() - started > limit) { resolve(null); return; }
      if (typeof requestAnimationFrame === 'function') requestAnimationFrame(check);
      else setTimeout(check, 60);
    }
    check();
  });
}

/** ⭐ تظليل كل مطابقات الصفحة + المطابقة الحالية بلون أقوى */
function highlightMatch(match) {
  document.querySelectorAll('.text-layer span.hit, .text-layer span.current')
    .forEach((s) => s.classList.remove('hit', 'current'));
  document.querySelectorAll('.pdf-highlight-box')
    .forEach((box) => box.remove());

  const el = document.querySelector('.pdf-page[data-page-num="' + match.page + '"]');
  if (!el) return;
  const term = state.searchTerm.toLowerCase();
  if (!term) return;

  el.querySelectorAll('.text-layer span').forEach((span) => {
    if (String(span.textContent || '').toLowerCase().includes(term)) {
      span.classList.add('hit');
    }
  });

  const current = el.querySelector('.text-layer span[data-idx="' + match.itemIdx + '"]');
  if (current) {
    current.classList.add('current');
    setTimeout(() => current.classList.remove('current'), 2600);
  }

  // ⭐⭐ v4.6.6 — TASK 3: صندوق تظليل صريح داخل حاوية الصفحة،
  //   بموضع محسوب ديناميكياً فوق الـcanvas (z-index: 10).
  if (!current) return;

  const pageRect = el.getBoundingClientRect();
  const spanRect = current.getBoundingClientRect();
  if (!pageRect.width || !spanRect.width) return;

  const box = document.createElement('div');
  box.className = 'pdf-highlight-box';
  box.style.position = 'absolute';
  box.style.left = (spanRect.left - pageRect.left - 2) + 'px';
  box.style.top = (spanRect.top - pageRect.top - 2) + 'px';
  box.style.width = (spanRect.width + 4) + 'px';
  box.style.height = (spanRect.height + 4) + 'px';
  // ⭐ v4.6.7 — أصفر ساطع + z-index 999 (فوق الـcanvas وطبقة النصّ)
  box.style.backgroundColor = 'rgba(255, 235, 59, 0.8)';
  box.style.zIndex = '999';
  box.style.pointerEvents = 'none';
  box.style.borderRadius = '4px';
  box.style.boxShadow = '0 0 0 2px rgba(255, 80, 80, 0.85)';
  box.style.mixBlendMode = 'multiply';
  el.appendChild(box);

  setTimeout(function () {
    if (box && box.parentNode) box.parentNode.removeChild(box);
  }, 3200);
}

/** ⭐ التالي / السابق بين المطابقات */
function stepMatch(delta) {
  const total = state.searchMatches.length;
  if (!total) return;
  let index = state.searchMatchIndex + delta;
  if (index < 0) index = total - 1;
  if (index >= total) index = 0;
  state.searchMatchIndex = index;
  jumpToMatch(state.searchMatches[index]);
  renderSearchResults();
  updateSearchNav();
}

/** ⭐ تنفيذ البحث (يُستدعى من input/Enter) */
function performSearch(query) {
  const q = String(query || '').trim();
  if (!q) {
    searchDocument('');
    return;
  }
  // ⭐ فهرسة فورية للصفحة الأولى ثم بحث
  searchDocument(q);
  updateSearchStatus();
}

/** ⭐ Enter: الانتقال إلى أول نتيجة */
function runSearchNow() {
  const value = els.searchInput.value;
  performSearch(value);
  if (state.searchMatches.length) {
    state.searchMatchIndex = 0;
    jumpToMatch(state.searchMatches[0]);
    renderSearchResults();
    updateSearchNav();
  }
}

function openSearch() {
  els.searchOverlay.classList.add('visible');
  // ⭐ v4.6.1 — تركيز فوري: لا نفقد أول حرف يكتبه المستخدم.
  try {
    els.searchInput.focus();
    els.searchInput.setSelectionRange(els.searchInput.value.length, els.searchInput.value.length);
  } catch (e) {
    setTimeout(() => els.searchInput.focus(), 50);
  }
  updateSearchStatus();
  if (!state.indexing && state.indexedPages.size < state.totalPages) {
    buildSearchIndex();
  }
}

function closeSearch() {
  els.searchOverlay.classList.remove('visible');
  els.searchInput.value = '';
  state.searchTerm = '';
  state.searchMatches = [];
  state.searchMatchIndex = -1;
  els.searchResults.innerHTML = '<div class="search-hint">اكتب كلمة للبحث في جميع الصفحات</div>';
  updateSearchNav();
  document.querySelectorAll('.text-layer span.hit, .text-layer span.current')
    .forEach((s) => s.classList.remove('hit', 'current'));
}

/* ═══ خطأ ═══ */
function showError(title, message) {
  els.errorTitle.textContent = title;
  els.errorMessage.textContent = message;
  els.errorState.classList.add('visible');
  hideLoading();
}

/* ═══ URL Params ═══ */
function parseParams() {
  const params = new URLSearchParams(location.search);
  const fileId = params.get('id');
  if (!fileId) return null;
  return {
    id: fileId,
    title:   params.get('file')     || 'بدون عنوان',
    subject: params.get('subject')  || '',
    size:    params.get('size')     || '',
    url:     params.get('url')      || '',
    path:    params.get('path')     || '',
    category:params.get('category') || '',
  };
}

/* ═══ التشغيل ═══ */
async function init() {
  applyTheme();

  // تنظيف أي عرض سابق (مثلاً إذا أُعيد تشغيل init بعد swap).
  if (state.observer) {
    state.observer.disconnect();
    state.observer = null;
  }
  if (state.pdfDoc && typeof state.pdfDoc.destroy === 'function') {
    try { state.pdfDoc.destroy(); } catch (e) {}
  }
  state.pdfDoc = null;
  state.totalPages = 0;
  state.renderedPages = new Set();
  state.renderingPages = new Set();
  state.pageTextCache = new Map();
  state.textIndex = new Map();
  state.indexedPages = new Set();
  state.indexing = false;
  state.searchMatches = [];
  state.searchMatchIndex = -1;
  state.searchTerm = '';
  state.zoom = 1;
  state.singlePage = false;
  state.currentPage = 1;
  document.body.classList.remove('single-page');
  if (els.pageModeBtn) els.pageModeBtn.classList.remove('active');
  if (els.headerPagePill) {
    els.headerPagePill.classList.remove('show');
    els.headerPagePill.textContent = '1 / 1';
  }

  try {
    const params = parseParams();
    if (!params) {
      showError('ملف غير محدد', 'لم يتم تحديد ملف للعرض.');
      return;
    }

    state.fileId = params.id;

    let fileInfo;
    if (params.url && params.title) {
      fileInfo = {
        id: params.id,
        title: params.title,
        subject_name: params.subject,
        file_url: params.url,
        file_path: params.path,
      };
    } else {
      fileInfo = await fetchFileById(params.id);
      if (!fileInfo) throw new Error('الملف غير موجود');
    }

    state.fileInfo = fileInfo;

    els.fileTitle.textContent = fileInfo.title || 'بدون عنوان';
    els.fileSub.textContent = [fileInfo.subject_name, params.size].filter(Boolean).join(' • ') || 'PDF';
    document.title = (fileInfo.title || 'ملف') + ' — المنصة الطبية';

    // 1. فتح الملف: Range requests + صفحات عند الطلب.
    //    لا ننتظر تنزيل الملف كاملاً قبل عرض الصفحة الأولى.
    setProgress(4, 'الاتصال بالسيرفر...');
    await openPdfProgressively(fileInfo);

    setProgress(72, 'جاري تجهيز العرض...');
    state.totalPages = state.pdfDoc.numPages;

    setProgress(82, 'جاري تجهيز الصفحات...');

    // 4. Placeholders
    await createPlaceholders();

    setProgress(95, 'جاري عرض الصفحة الأولى...');

    // 5. العرض: ⭐ v4.6.2 — الصفحة الأولى تُرسم فوراً (لا ننتظر الملف
    //    كاملاً)، ثم نُخفي الهيكل العظمي ونبدأ الفهرسة في الخلفية.
    els.viewer.scrollTop = 0;

    const firstPageEl = document.querySelector('.pdf-page[data-page-num="1"]');
    if (firstPageEl && state.pdfDoc) {
      try {
        await renderPage(firstPageEl);
      } catch (e) {
        console.warn('تعذّر رسم الصفحة الأولى:', e);
      }
    }

    if (els.fileSub) {
      els.fileSub.textContent = [fileInfo.subject_name, params.size].filter(Boolean).join(' • ') || 'PDF';
    }
    setCurrentPage(1, true);

    hideLoading();
    setupObserver();
    setupScrollHUD();

    // ⭐⭐ v4.6.6 — TASK 5/6: إيماءات التكبير والتمرير + الشريط القابل للسحب
    bindStageGestures();
    bindFabDrag();
    restoreFabPosition();
    // ⭐ v4.6.7 — TASK 3: زرّ النسخ
    initCopyButton();

    // ⭐ v4.6.2 — الفهرسة الكاملة في الخلفية (بحث فوري من أول حرف)
    setTimeout(() => { buildSearchIndex(); }, 400);

    // ⭐⭐ v4.6.3 — HOTFIX: كان `scheduleProgressiveRender()` هنا، وهي دالة
    //   حُذفت مع العرض الافتراضي (v4.6.2) — فكان التطبيق ي crashes بـ
    //   "scheduleProgressiveRender is not defined". البديل الصحيح القائم
    //   هو renderVisiblePages() (يرسم الصفحات الظاهرة + المجاورة).
    renderVisiblePages();

    // تتبع المشاهدة
    try { incrementFileViews(state.fileId); } catch (e) {}

    // إعادة حساب عند تغيير الحجم
    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        state.containerWidth = calcContainerWidth();
      }, 300);
    });

  } catch (e) {
    console.error('فشل التهيئة:', e);
    showError('تعذّر فتح الملف', e.message || 'حدث خطأ غير متوقع.');
  }
}

/* ═══ الأحداث ═══ */
els.themeBtn.addEventListener('click', toggleTheme);
els.searchBtn.addEventListener('click', openSearch);

els.searchOverlay.addEventListener('click', (e) => {
  if (e.target === els.searchOverlay) closeSearch();
});

// ⭐⭐⭐ v4.6.5 — TASK 1: تدمير وإعادة بناء مستمعي الحقل.
//   • 'input' واحد فقط، بلا أي شرط (يشمل insertText/deleteContentBackward).
//   • 'compositionend' لالتقاط الكلمة العربية بعد انتهاء التكوين.
//   لا keydown ولا keyup ولا change على حقل البحث.
let searchTimeout = null;

function bindViewerSearchInput() {
  const input = els.searchInput;
  if (!input) return;

  // ⭐⭐⭐ v4.6.7 — البحث فوراً عند كل حرف: لا مؤقّت ولا شرط.
  const engine = window.MedAppSearch;
  if (engine && typeof engine.bindSearchInput === 'function') {
    engine.bindSearchInput(input, (value) => {
      performSearch(value);
    });
    return;
  }

  // ⭐ احتياط: نفس السلوك بدون المحرّك.
  const onChange = (event) => {
    const value = event.target.value;
    performSearch(value);
  };
  input.addEventListener('input', onChange);
  input.addEventListener('compositionupdate', onChange);
  input.addEventListener('compositionend', onChange);
  input.addEventListener('keyup', onChange);
}

bindViewerSearchInput();

// ⭐ v4.6.2 — أسهما «التالي/السابق» للتنقّل بين المطابقات
els.searchNextBtn.addEventListener('click', () => stepMatch(1));
els.searchPrevBtn.addEventListener('click', () => stepMatch(-1));

// ⭐ v4.6.2 — شريط الأزرار العائم
els.zoomInBtn.addEventListener('click', () => setZoom(state.zoom + 0.2));
els.zoomOutBtn.addEventListener('click', () => setZoom(state.zoom - 0.2));
els.pageModeBtn.addEventListener('click', togglePageMode);
els.pagePrevBtn.addEventListener('click', () => goToPage(state.currentPage - 1));
els.pageNextBtn.addEventListener('click', () => goToPage(state.currentPage + 1));

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeSearch();
  if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
    e.preventDefault();
    openSearch();
  }
});

/* ═══ ابدأ ═══ */
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
