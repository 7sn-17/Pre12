<!-- Smooth page transitions (View Transitions API + fallback fade).
     The fixed bottom navigation gets its own view-transition-name and is
     frozen, so it can never move or fade while the page content changes. -->
<style data-shell>
  /* Global theme defaults. `data-theme` is always set by theme-init.js
     (light or dark), so native controls and scrollbars follow the app. */
  :root { color-scheme: light; --medapp-amber: #fbbf24; --medapp-orange: #fb923c; --medapp-blue: #93c5fd; --medapp-blue-soft: #bfdbfe; --medapp-violet: #c4b5fd; --medapp-green: #34d399; --medapp-red: #f87171; --medapp-pink: #f472b6; }
  [data-theme="dark"] { color-scheme: dark; }
  [data-theme="light"] { --medapp-amber: #b45309; --medapp-orange: #c2410c; --medapp-blue: #2563eb; --medapp-blue-soft: #1d4ed8; --medapp-violet: #6d28d9; --medapp-green: #047857; --medapp-red: #b91c1c; --medapp-pink: #be185d; }

  /* Premium smooth scrolling. The SPA router temporarily disables this for
     page swaps / Back restoration so navigation is instant, never animated. */
  html { scroll-behavior: smooth; }
  /* app.js sets this only for instant SPA swaps / Back restoration. */
  html.medapp-scroll-jump { scroll-behavior: auto !important; }

  html.medapp-navigating { cursor: progress; }

  /* ⭐IMPORTANT: the `hidden` attribute must always win.
     Author rules like `.detail-empty { display: flex }` beat the user-agent
     `[hidden] { display: none }` rule, which made "empty" blocks stay on
     screen on top of real content. */
  [hidden] { display: none !important; }

  /* ⭐ Tap targets: 44px minimum, no double-tap zoom, no grey flash. */
  button,
  a[role="button"],
  [role="button"] {
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }

  /* ⭐ انتقال ناعم بين الوضعين النهاري والليلي.
     يُفعَّل هذا الصنف لحظياً قبل تبديل الثيم (MedApp.withThemeTransition)
     فيتحوّل لون الخلفية والنص والحدود تدريجياً بدل القفز المفاجئ. */
  html.theme-transition,
  html.theme-transition body,
  html.theme-transition *,
  html.theme-transition *::before,
  html.theme-transition *::after {
    transition:
      background-color 0.34s ease,
      color 0.34s ease,
      border-color 0.34s ease,
      fill 0.34s ease,
      stroke 0.34s ease,
      box-shadow 0.34s ease !important;
    transition-delay: 0s !important;
  }

  /* Very thin top progress bar, shown by app.js during SPA navigation. */
  #medapp-loader {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    z-index: 2147483647;
    pointer-events: none;
    overflow: hidden;
    opacity: 0;
    transition: opacity 0.15s ease;
  }

  #medapp-loader::before {
    content: '';
    display: block;
    width: 40%;
    height: 100%;
    border-radius: 0 999px 999px 0;
    background: linear-gradient(90deg, transparent, #059669 18%, #10b981 52%, #34d399 82%, transparent);
    box-shadow: 0 0 8px rgba(16, 185, 129, 0.6);
    transform: translateX(-110%);
    will-change: transform;
  }

  html.medapp-loading #medapp-loader { opacity: 1; }
  html.medapp-loading #medapp-loader::before {
    animation: medapp-loader-slide 1.05s cubic-bezier(0.4, 0, 0.2, 1) infinite;
  }

  @keyframes medapp-loader-slide {
    0%   { transform: translateX(-110%); }
    100% { transform: translateX(360%); }
  }

  /* Only same-document transitions (started by app.js). Cross-document
     @view-transition is intentionally NOT enabled: full loads must behave
     exactly like the original pages. */

  .floating-nav-wrapper { view-transition-name: medapp-bottom-nav; }
  ::view-transition-group(medapp-bottom-nav) { animation: none; }
  ::view-transition-old(medapp-bottom-nav),
  ::view-transition-new(medapp-bottom-nav) { animation: none; }

  /* Keep the sticky header out of the root cross-fade. Otherwise the old and
     new snapshots of a translucent, blurred header overlap and look frozen /
     show a ghost shadow while the page changes. */
  header { view-transition-name: medapp-header; }
  ::view-transition-group(medapp-header) { animation: none; }
  ::view-transition-old(medapp-header),
  ::view-transition-new(medapp-header) { animation: none; }

  /* Light mode: the header must use a soft neutral shadow, never the heavy
     black shadow used by the dark theme. */
  [data-theme="light"] header {
    background: rgba(248, 250, 251, 0.92);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    backdrop-filter: blur(20px) saturate(180%);
    border-bottom-color: rgba(15, 23, 42, 0.08);
    box-shadow: 0 1px 0 rgba(15, 23, 42, 0.04);
    color: var(--text-primary);
  }

  /* Wins over every page-level `header.scrolled` (higher specificity). */
  [data-theme="light"] header.scrolled {
    background: rgba(248, 250, 251, 0.97);
    border-bottom-color: rgba(15, 23, 42, 0.1);
    box-shadow:
      0 4px 18px rgba(15, 23, 42, 0.08),
      0 1px 0 rgba(15, 23, 42, 0.05);
  }

  @media (prefers-reduced-motion: no-preference) {
    ::view-transition-old(root) { animation: pt-fade-out 0.14s cubic-bezier(0.4, 0, 0.2, 1) both; }
    ::view-transition-new(root) { animation: pt-fade-in 0.2s cubic-bezier(0.4, 0, 0.2, 1) both; }
  }

  /* No body animation on browsers without View Transitions: the swap is
     already synchronous, and fading the body element would also fade the
     fixed bottom navigation. The nav must never move or fade. */

  @keyframes pt-fade-in  { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pt-fade-out { from { opacity: 1; } to { opacity: 0; } }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto !important; }
    html.theme-transition,
    html.theme-transition body,
    html.theme-transition *,
    html.theme-transition *::before,
    html.theme-transition *::after {
      transition: none !important;
    }
    #medapp-loader::before {
      animation: none !important;
      transform: none;
      width: 60%;
    }
    ::view-transition-old(root), ::view-transition-new(root),
    ::view-transition-old(medapp-bottom-nav), ::view-transition-new(medapp-bottom-nav),
    ::view-transition-old(medapp-header), ::view-transition-new(medapp-header) { animation: none !important; }
  }

  /* ============================================================
     ⭐ المنطقة الآمنة + الشريط العلوي الثابت (Phase 14)
     ------------------------------------------------------------
     • الشريط العلوي fixed ⇒ لا يختفي تحت شريط الحالة عند السحب
       (الـ rubber-band كان يُظهره خلف الشريط).
     • جسم الصفحة يحمل padding-top بمقدار ارتفاع الشريط حتى
       لا يختفي المحتوى تحته.
     • overscroll-behavior: لا اهتزاز عند السحب إلى ما بعد الحواف.
     ============================================================ */
  :root {
    --safe-area-inset-top: env(safe-area-inset-top, 0px);
    --safe-area-inset-bottom: env(safe-area-inset-bottom, 0px);
    --safe-area-inset-left: env(safe-area-inset-left, 0px);
    --safe-area-inset-right: env(safe-area-inset-right, 0px);

    /* ⭐⭐ رموز احتياطية — الصفحات التي تعرّف رموزها الخاصة تتجاوزها،
       والصفحات التي لا تعرّفها تحصل على قيم سليمة.
       بدونها كان زر "تسجيل الدخول" بلا خلفية (لأن --accent-emerald
       غير معرّف) فيظهر النص الأبيض على خلفية شفافة = نص غير مرئي. */
    --accent-emerald: #10b981;
    --accent-light: #34d399;
    --accent-dark: #059669;
    --accent-glow: rgba(16, 185, 129, 0.25);
    --accent-glow-strong: rgba(16, 185, 129, 0.42);
    --bg-main: #06110d;
    --bg-card: rgba(16, 34, 27, 0.68);
    --bg-card-hover: rgba(22, 48, 38, 0.92);
    --bg-solid: #0d221a;
    --bg-elevated: #102a22;
    --border-card: rgba(16, 185, 129, 0.18);
    --border-card-hover: rgba(16, 185, 129, 0.46);
    --text-primary: #f0fdf4;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
    --transition-fast: 0.18s ease;
    --transition-smooth: 0.25s cubic-bezier(0.4, 0, 0.2, 1);

    --app-header-h: 72px;
    --app-header-pad-x: 20px;
  }

  [data-theme="light"] {
    --accent-emerald: #059669;
    --bg-main: #f8fafb;
    --bg-card: rgba(255, 255, 255, 0.9);
    --bg-card-hover: #ffffff;
    --bg-solid: #ffffff;
    --bg-elevated: #f1f5f9;
    --border-card: rgba(16, 185, 129, 0.24);
    --border-card-hover: rgba(16, 185, 129, 0.55);
    --text-primary: #0f172a;
    --text-secondary: #475569;
    --text-muted: #94a3b8;
  }

  @media (max-width: 480px) {
    :root {
      --app-header-h: 68px;
      --app-header-pad-x: 16px;
    }
  }

  html, body, main {
    overscroll-behavior-y: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }

  /* ⭐ لكن حقول الإدخال تبقى قابلة للتحديد والنسخ */
  input,
  textarea,
  select,
  [contenteditable="true"] {
    -webkit-user-select: text;
    user-select: text;
  }

  body {
    margin: 0;
    padding: 0;
  }

  /* ⭐ الشريط العلوي: ثابت في الأعلى، فوق كل شيء، ويحترم النوتش */
  body > header,
  body > .ml-topbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    width: 100%;
    z-index: 9999;
    box-sizing: border-box;
    min-height: calc(var(--app-header-h) + var(--safe-area-inset-top, env(safe-area-inset-top, 0px)));
    padding-top: var(--safe-area-inset-top, env(safe-area-inset-top, 0px)) !important;
    padding-bottom: 0 !important;
    padding-left: var(--app-header-pad-x) !important;
    padding-right: var(--app-header-pad-x) !important;
  }

  /* حالة "مُمرَّر" لا يجب أن تكسر الارتفاع ولا المنطقة الآمنة */
  body > header.scrolled,
  body > .ml-topbar {
    padding-top: var(--safe-area-inset-top, env(safe-area-inset-top, 0px)) !important;
  }

  /* ⭐ جسم الصفحة يتزحزح بمقدار الشريط حتى لا يختفي تحته */
  body:has(> header),
  body:has(> .ml-topbar) {
    padding-top: calc(var(--app-header-h) + var(--safe-area-inset-top, env(safe-area-inset-top, 0px)));
  }

  /* ⭐ حاويات التطبيق تحترم المنطقة الآمنة من الأسفل */
  body > main,
  body > .container,
  .app-container {
    padding-bottom: var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));
  }

  /* ============================================================
     نافذة "سجّل الدخول" (وضع الزائر) — مشتركة بين كل الصفحات
     ============================================================ */
    .auth-required-overlay {
      position: fixed;
      inset: 0;
      background: rgba(3, 10, 8, 0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 4000;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--transition-smooth);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    [data-theme="light"] .auth-required-overlay { background: rgba(248, 250, 251, 0.9); }

    .auth-required-overlay.active { opacity: 1; pointer-events: auto; }

    .auth-required-card {
      background: var(--bg-solid);
      border: 1px solid var(--border-card-hover);
      border-radius: 24px;
      padding: 28px 24px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      transform: translateY(20px) scale(0.96);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 0 0 40px var(--accent-glow);
    }

    [data-theme="light"] .auth-required-card {
      box-shadow:
        0 20px 60px rgba(15, 23, 42, 0.16),
        0 0 40px var(--accent-glow);
    }

    .auth-required-overlay.active .auth-required-card { transform: translateY(0) scale(1); }

    .auth-required-icon {
      width: 72px;
      height: 72px;
      border-radius: 22px;
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(5, 150, 105, 0.15));
      border: 1px solid var(--accent-emerald);
      color: var(--accent-light);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 18px;
      box-shadow: 0 8px 24px var(--accent-glow);
      position: relative;
    }

    .auth-required-icon::after {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 26px;
      border: 1px solid rgba(16, 185, 129, 0.25);
      animation: pulse 2.5s ease-in-out infinite;
    }

    .auth-required-title {
      font-size: 1.2rem;
      font-weight: 900;
      color: var(--text-primary);
      margin-bottom: 10px;
    }

    .auth-required-message {
      font-size: 0.85rem;
      color: var(--text-secondary);
      line-height: 1.7;
      margin-bottom: 22px;
    }

    .auth-required-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .auth-required-btn {
      padding: 13px 20px;
      border-radius: 14px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      transition: all var(--transition-fast);
      border: 1px solid transparent;
    }

    .auth-required-btn i { width: 16px; height: 16px; }

    .auth-required-btn.primary {
      background: linear-gradient(135deg, var(--accent-emerald), var(--accent-dark));
      color: white;
      box-shadow: 0 8px 20px var(--accent-glow);
    }

    .auth-required-btn.primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px var(--accent-glow-strong);
    }

    .auth-required-btn.secondary {
      background: rgba(128, 128, 128, 0.08);
      border-color: var(--border-card);
      color: var(--text-secondary);
    }

    .auth-required-btn.secondary:hover {
      background: rgba(128, 128, 128, 0.15);
      border-color: var(--border-card-hover);
      color: var(--text-primary);
    }

    /* ============================================ */
    /* Responsive */
    /* ============================================ */
    @media (max-width: 640px) {
      .container { padding: 16px 14px; }
      header { padding: 12px 16px; }
      .brand-title { font-size: 1rem; }
      .brand-icon { width: 40px; height: 40px; }
      .welcome-header { padding: 16px; }
      .welcome-greeting { font-size: 1.05rem; }
      .welcome-icon-wrap { width: 48px; height: 48px; }
      .welcome-icon-wrap i { width: 22px; height: 22px; }
      .subject-icon-box { width: 46px; height: 46px; }
      .floating-nav { max-width: 100%; }
      .toast { top: 78px; padding: 12px 18px; font-size: 0.84rem;
      z-index: 2147483647;
    }
      .files-horizontal { margin: 0 -14px; padding-left: 14px; padding-right: 14px; }
      .user-name { display: none; }
      .user-avatar-btn { padding: 6px; }
      .file-mini-card { min-width: 260px; max-width: 260px; }
      .skeleton-mini { min-width: 260px; }
      .search-modal-close { width: 42px; height: 42px; }
      .icon-btn { width: 38px; height: 38px; }
      .icon-btn i { width: 18px; height: 18px; }
      .nav-btn-center { width: 54px; height: 54px; margin-top: -22px; }
      .nav-btn-center i { width: 22px; height: 22px; }
      .quick-access-grid { gap: 8px; }
      .quick-access-btn { padding: 12px 6px; }
      .qa-icon { width: 40px; height: 40px; }
      .qa-icon i { width: 20px; height: 20px; }
      .qa-label { font-size: 0.68rem; }
      .study-card-icon { width: 46px; height: 46px; }
      .study-card-icon i { width: 22px; height: 22px; }
    }

    @media (max-width: 380px) {
      .toast { top: 72px; font-size: 0.8rem; padding: 10px 16px;
      z-index: 2147483647;
    }
      .file-mini-card { min-width: 240px; max-width: 240px; }
      .nav-btn-center { width: 50px; height: 50px; margin-top: -20px; }
      .nav-btn span { font-size: 0.6rem; }
      .quick-access-grid { gap: 6px; }
      .quick-access-btn { padding: 10px 4px; }
      .qa-icon { width: 36px; height: 36px; }
      .qa-icon i { width: 18px; height: 18px; }
      .qa-label { font-size: 0.62rem; }
    }

    @supports (padding: env(safe-area-inset-bottom)) {
      .floating-nav-wrapper { bottom: calc(20px + env(safe-area-inset-bottom)); }
    }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

  /* ============================================================
     Premium file visual — shared by every file surface.
     The helper `getFileIconMarkup()` in files.js supplies the
     colour tokens; page classes (mini-file-icon, file-icon,
     file-type-icon, …) keep their existing dimensions.
     ============================================================ */
  .premium-file-icon {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    border-radius: 12px;
    flex-shrink: 0;
    overflow: hidden;
    isolation: isolate;
    color: var(--pf-color, #94a3b8);
    background:
      linear-gradient(145deg, var(--pf-bg, rgba(148, 163, 184, 0.16)), rgba(255, 255, 255, 0.02)),

<style>
    :root {
      --bg-main: #06110d;
      --bg-card: rgba(16, 34, 27, 0.75);
      --border-card: rgba(16, 185, 129, 0.22);
      --accent-emerald: #10b981;
      --accent-light: #34d399;
      --accent-dark: #059669;
      --accent-glow: rgba(16, 185, 129, 0.3);
      --text-primary: #f0fdf4;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --warning: #f59e0b;
      --transition-fast: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-smooth: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    [data-theme="light"] {
      --bg-main: #f8fafb;
      --bg-card: rgba(255, 255, 255, 0.9);
      --border-card: rgba(16, 185, 129, 0.25);
      --accent-emerald: #059669;
      --accent-light: #10b981;
      --accent-dark: #047857;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }

    body {
      background-color: var(--bg-main);
      background-image: 
        radial-gradient(circle at 50% 20%, rgba(16, 185, 129, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(245, 158, 11, 0.05) 0%, transparent 45%);
      background-attachment: fixed;
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* خلفية حيّة */
    .particles-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      bottom: -20px;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--accent-light);
      box-shadow: 0 0 8px var(--accent-emerald);
      opacity: 0;
      animation: floatUp linear infinite;
    }

    @keyframes floatUp {
      0% { opacity: 0; transform: translateY(0) scale(0.6); }
      10% { opacity: 0.9; }
      50% { opacity: 0.7; transform: translateY(-50vh) translateX(20px) scale(1); }
      100% { opacity: 0; transform: translateY(-110vh) scale(0.4); }
    }

    /* الحاوية */
    .container {
      width: 100%;
      max-width: 460px;
      position: relative;
      z-index: 1;
      text-align: center;
    }

    /* الأيقونة */
    .offline-icon {
      width: 120px;
      height: 120px;
      border-radius: 36px;
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.2), rgba(217, 119, 6, 0.15));
      border: 2px solid rgba(245, 158, 11, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      color: var(--medapp-amber);
      box-shadow: 0 12px 32px rgba(245, 158, 11, 0.25);
      position: relative;
      animation: iconPulse 3s ease-in-out infinite;
    }

    @keyframes iconPulse {
      0%, 100% { transform: scale(1); box-shadow: 0 12px 32px rgba(245, 158, 11, 0.25); }
      50% { transform: scale(1.05); box-shadow: 0 16px 40px rgba(245, 158, 11, 0.4); }
    }

    .offline-icon svg {
      width: 56px;
      height: 56px;
    }

    /* العنوان */
    .offline-title {
      font-size: 1.75rem;
      font-weight: 900;
      color: var(--text-primary);
      margin-bottom: 12px;
      line-height: 1.3;
    }

    .offline-subtitle {
      font-size: 1rem;
      color: var(--text-secondary);
      line-height: 1.7;
      margin-bottom: 28px;
      padding: 0 10px;
    }

    /* بطاقة المعلومات */
    .info-card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 20px;
      padding: 22px;
      margin-bottom: 20px;
      backdrop-filter: blur(16px);
      text-align: right;
    }

    .info-title {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .info-title svg {
      width: 20px;
      height: 20px;
      color: var(--accent-light);
    }

    .info-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .info-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    .info-item-icon {
      width: 28px;
      height: 28px;
      border-radius: 9px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-light);
      flex-shrink: 0;
    }

    .info-item-icon svg {
      width: 14px;
      height: 14px;
    }

    /* الأزرار */
    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .action-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 15px 22px;
      border-radius: 16px;
      font-family: inherit;
      font-size: 0.98rem;
      font-weight: 800;
      cursor: pointer;
      text-decoration: none;
      transition: all var(--transition-fast);
      border: none;
    }

    .action-btn svg {
      width: 20px;
      height: 20px;
    }

    .action-btn.primary {
      background: linear-gradient(135deg, var(--accent-emerald), var(--accent-dark));
      color: white;
      box-shadow: 0 8px 24px var(--accent-glow);
    }

    .action-btn.primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(16, 185, 129, 0.5);
    }

    .action-btn.secondary {
      background: rgba(128, 128, 128, 0.08);
      border: 1px solid var(--border-card);
      color: var(--text-primary);
    }

    .action-btn.secondary:hover {
      background: rgba(128, 128, 128, 0.15);
      border-color: var(--accent-emerald);
    }

    /* مؤشر الحالة */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 12px;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: var(--medapp-amber);
      font-size: 0.78rem;
      font-weight: 800;
      margin-bottom: 20px;
    }

    .status-badge svg {
      width: 14px;
      height: 14px;
      animation: blink 2s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* Responsive */
    @media (max-width: 400px) {
      .offline-icon { width: 100px; height: 100px; border-radius: 30px; }
      .offline-icon svg { width: 46px; height: 46px; }
      .offline-title { font-size: 1.5rem; }
      .offline-subtitle { font-size: 0.92rem; }
    }
  </style>
</head>
<body>

  <div class="particles-bg" id="particlesBg"></div>

  <div class="container">

    <!-- الحالة -->
    <div class="status-badge">
      <i data-lucide="wifi-off"></i>
      <span>غير متصل بالإنترنت</span>
    </div>

    <!-- الأيقونة -->
    <div class="offline-icon">
      <i data-lucide="cloud-off"></i>
    </div>

    <!-- العنوان -->
    <h1 class="offline-title">لا يوجد اتصال</h1>
    <p class="offline-subtitle">
      يبدو أنك غير متصل بالإنترنت حالياً.<br>
      لا تقلق — يمكنك الوصول إلى المحتوى المحمّل.
    </p>

    <!-- بطاقة المعلومات -->
    <div class="info-card">
      <div class="info-title">
        <i data-lucide="check-circle-2"></i>
        <span>متاح بدون إنترنت:</span>
      </div>
      <div class="info-list">
        
        <div class="info-item">
          <div class="info-item-icon">
            <i data-lucide="download"></i>
          </div>
          <span>الملفات المحمّلة على جهازك</span>
        </div>
        
        <div class="info-item">
          <div class="info-item-icon">
            <i data-lucide="bookmark"></i>
          </div>
          <span>الملفات المحفوظة في المفضلة</span>
        </div>
        
        <div class="info-item">
          <div class="info-item-icon">
            <i data-lucide="notebook-pen"></i>
          </div>
          <span>ملاحظاتك الشخصية</span>
        </div>
        
        <div class="info-item">
          <div class="info-item-icon">
            <i data-lucide="target"></i>
          </div>
          <span>أهدافك الدراسية</span>
        </div>
        
      </div>
    </div>

    <!-- الأزرار -->
    <div class="actions">
      <a href="index.html?tab=favorites" class="action-btn primary">
        <i data-lucide="folder-open"></i>
        <span>عرض ملفاتي</span>
      </a>
      
      <button onclick="retryConnection()" class="action-btn secondary">
        <i data-lucide="refresh-cw"></i>
        <span>حاول الاتصال مجدداً</span>
      </button>
    </div>

  </div>

  <script>
    lucide.createIcons();

    // خلفية حيّة
    function createParticles() {
      const container = document.getElementById('particlesBg');
      const count = 20;
      
      for (let i = 0; i < count; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = Math.random() * 100 + '%';
        const duration = 8 + Math.random() * 12;
        p.style.animationDuration = duration + 's';
        p.style.animationDelay = Math.random() * duration + 's';
        container.appendChild(p);
      }
    }
    createParticles();

    // إعادة المحاولة
    function retryConnection() {
      if (navigator.onLine) {
        window.location.href = 'index.html';
      } else {
        // تأثير وميض على الأيقونة
        const icon = document.querySelector('.offline-icon');
        icon.style.animation = 'none';
        setTimeout(() => {
          icon.style.animation = 'iconPulse 3s ease-in-out infinite';
        }, 50);
      }
    }

    // مراقبة الاتصال
    window.addEventListener('online', () => {
      console.log('✅ متصل الآن');
      setTimeout(() => {
        window.location.href = 'index.html';
      }, 500);
    });

    window.addEventListener('offline', () => {
      console.log('⚠️ انقطع الاتصال');
    });

    // فحص أولي
    if (navigator.onLine) {
      setTimeout(() => {
        window.location.href = 'index.html';
      }, 1000);
    }
  </script>
</body>
