<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#06110d">
<title>محاضراتي — المنصة الطبية</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="theme-init.js"></script>

<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-512.png">

<style>
:root {
  --bg: #06110d;
  --bg-card: rgba(16, 34, 27, 0.7);
  --bg-solid: #0d221a;
  --border: rgba(16, 185, 129, 0.18);
  --border-hover: rgba(16, 185, 129, 0.5);
  --accent: #10b981;
  --accent-light: #34d399;
  --accent-dark: #059669;
  --glow: rgba(16, 185, 129, 0.25);
  --glow-strong: rgba(16, 185, 129, 0.45);
  --text: #f0fdf4;
  --text-2: #94a3b8;
  --text-3: #64748b;
  --danger: #ef4444;
  --warning: #f59e0b;
  --pink: #ec4899;
  --gold: #fbbf24;
  --t: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}
[data-theme="light"] {
  --bg: #f8fafb;
  --bg-card: rgba(255, 255, 255, 0.9);
  --bg-solid: #ffffff;
  --border: rgba(16, 185, 129, 0.25);
  --border-hover: rgba(16, 185, 129, 0.6);
  --accent: #059669;
  --accent-light: #10b981;
  --accent-dark: #047857;
  --text: #0f172a;
  --text-2: #475569;
  --text-3: #94a3b8;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
html, body { overscroll-behavior-y: contain; }
body {
  background: var(--bg);
  background-image:
    radial-gradient(circle at 10% 5%, rgba(16, 185, 129, 0.08) 0%, transparent 45%),
    radial-gradient(circle at 90% 95%, rgba(5, 150, 105, 0.06) 0%, transparent 45%);
  background-attachment: fixed;
  color: var(--text);
  min-height: 100vh;
  padding-bottom: 110px;
  overflow-x: hidden;
}

/* ══ Header ══ */
.top {
  position: sticky; top: 0; z-index: 100;
  background: rgba(6, 17, 13, 0.85);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 12px 16px;
  display: flex; align-items: center; gap: 10px;
}
[data-theme="light"] .top { background: rgba(248, 250, 251, 0.9); }
.icon-btn {
  width: 42px; height: 42px; border-radius: 13px;
  background: var(--bg-card); border: 1px solid var(--border);
  color: var(--text); display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all var(--t); text-decoration: none; flex-shrink: 0;
  padding: 0;
}
.icon-btn:hover { border-color: var(--accent); color: var(--accent-light); }
.icon-btn:active { transform: scale(0.94); }
.icon-btn svg { width: 20px; height: 20px; }
.top-title { flex: 1; text-align: center; min-width: 0; }
.top-title h1 { font-size: 1.05rem; font-weight: 800; }
.top-title p { font-size: 0.7rem; color: var(--accent-light); font-weight: 600; margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ══ Tabs ══ */
.tabs-wrap {
  position: sticky; top: 67px; z-index: 90;
  background: var(--bg);
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
}
.tabs {
  display: flex; gap: 6px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 5px;
  backdrop-filter: blur(12px);
}
.tab {
  flex: 1; padding: 10px 6px; border: none; background: transparent;
  color: var(--text-2); font-family: inherit; font-size: 0.82rem; font-weight: 800;
  cursor: pointer; border-radius: 12px; transition: all var(--t);
  display: flex; align-items: center; justify-content: center; gap: 5px;
}
.tab svg { width: 16px; height: 16px; }
.tab.active {
  background: linear-gradient(135deg, var(--accent), var(--accent-dark));
  color: white;
  box-shadow: 0 4px 12px var(--glow);
}
.tab:not(.active):hover { color: var(--text); }

/* ══ Grid ══ */
.grid {
  padding: 14px;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}
@media (min-width: 640px) { .grid { grid-template-columns: repeat(3, 1fr); gap: 14px; padding: 16px; } }
@media (min-width: 900px) { .grid { grid-template-columns: repeat(4, 1fr); } }

/* ══ Card ══ */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 18px;
  overflow: hidden;
  transition: transform var(--t), border-color var(--t), box-shadow var(--t);
  position: relative;
  display: flex; flex-direction: column;
  animation: cardIn 0.35s cubic-bezier(0.16,1,0.3,1) backwards;
  backdrop-filter: blur(10px);
  user-select: none;
  -webkit-user-select: none;
}
@keyframes cardIn {
  from { opacity: 0; transform: translateY(12px) scale(0.97); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
.card:hover {
  transform: translateY(-4px);
  border-color: var(--border-hover);
  box-shadow: 0 12px 28px -8px rgba(0, 0, 0, 0.45);
}
.card.pressing { transform: scale(0.97); }

.card-img-wrap {
  position: relative;
  width: 100%;
  aspect-ratio: 3 / 4;
  overflow: hidden;
  background: var(--bg-solid);
  cursor: zoom-in;
}
.card-img {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.5s ease, opacity 0.3s ease;
  opacity: 0;
  pointer-events: none;
  -webkit-user-drag: none;
}
.card-img.loaded { opacity: 1; }
.card:hover .card-img.loaded { transform: scale(1.05); }
.card-img-skeleton {
  position: absolute; inset: 0;
  background: linear-gradient(90deg, rgba(128,128,128,0.1) 25%, rgba(128,128,128,0.18) 50%, rgba(128,128,128,0.1) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.5s infinite;
  pointer-events: none;
}
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
.card-img.loaded ~ .card-img-skeleton { display: none; }

/* Overlay image counter on multi-image */
.subject-badge {
  position: absolute; bottom: 8px; inset-inline-end: 8px;
  padding: 3px 9px; border-radius: 8px;
  font-size: 0.62rem; font-weight: 800;
  backdrop-filter: blur(8px); color: white;
  background: rgba(16, 185, 129, 0.9);
  z-index: 2;
}

.card-body { padding: 10px 12px 12px; flex: 1; display: flex; flex-direction: column; }
.card-title {
  font-size: 0.84rem; font-weight: 800;
  line-height: 1.35; margin-bottom: 4px;
  overflow: hidden; text-overflow: ellipsis;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  min-height: 2.2em;
}
.card-author {
  font-size: 0.68rem; color: var(--text-3); font-weight: 600;
  margin-bottom: 8px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  display: flex; align-items: center; gap: 4px;
}
.card-author svg { width: 11px; height: 11px; flex-shrink: 0; }

.card-stats {
  display: flex; align-items: center; gap: 4px;
  margin-top: auto;
  padding-top: 8px;
  border-top: 1px solid var(--border);
}
.stat-btn {
  flex: 1;
  display: flex; align-items: center; justify-content: center; gap: 4px;
  padding: 7px 4px;
  border-radius: 9px;
  background: transparent; border: none;
  color: var(--text-2);
  font-family: inherit;
  font-size: 0.7rem; font-weight: 800;
  cursor: pointer;
  transition: all var(--t);
}
.stat-btn svg { width: 14px; height: 14px; }
.stat-btn:hover { background: rgba(128,128,128,0.1); }
.stat-btn:active { transform: scale(0.92); }
.stat-btn.liked { color: var(--pink); }
.stat-btn.liked svg { fill: var(--pink); }
.stat-btn.saved { color: var(--gold); }
.stat-btn.saved svg { fill: var(--gold); }

/* ══ Empty ══ */
.empty {
  text-align: center; padding: 70px 20px;
  display: flex; flex-direction: column; align-items: center; gap: 12px;
}
.empty-icon {
  width: 88px; height: 88px; border-radius: 26px;
  background: rgba(16,185,129,0.08);
  border: 1px dashed var(--border);
  display: flex; align-items: center; justify-content: center;
  color: var(--text-3);
}
.empty-icon svg { width: 38px; height: 38px; stroke-width: 1.6; }
.empty h3 { font-size: 1.05rem; font-weight: 800; }
.empty p { font-size: 0.85rem; color: var(--text-2); max-width: 300px; line-height: 1.6; }

.sk-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 18px; height: 280px;
  background-image: linear-gradient(90deg, rgba(128,128,128,0.06) 25%, rgba(128,128,128,0.12) 50%, rgba(128,128,128,0.06) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.5s infinite;
}

/* ══ FAB ══ */
.fab {
  position: fixed;
  bottom: 22px; inset-inline-start: 50%;
  transform: translateX(50%);
  padding: 15px 26px; border-radius: 999px;
  background: linear-gradient(135deg, var(--accent), var(--accent-dark));
  color: white; border: none; font-family: inherit;
  font-size: 0.92rem; font-weight: 800;
  cursor: pointer; z-index: 500;
  display: flex; align-items: center; gap: 8px;
  box-shadow: 0 12px 32px var(--glow-strong), 0 0 0 5px rgba(6,17,13,0.4);
  transition: transform var(--t);
}
[data-theme="light"] .fab { box-shadow: 0 12px 32px var(--glow-strong), 0 0 0 5px rgba(255,255,255,0.5); }
.fab:hover { transform: translateX(50%) translateY(-3px); }
.fab:active { transform: translateX(50%) translateY(-1px) scale(0.97); }
.fab svg { width: 20px; height: 20px; stroke-width: 2.4; }
@supports (padding: env(safe-area-inset-bottom)) { .fab { bottom: calc(22px + env(safe-area-inset-bottom)); } }

/* ══ Overlay & Sheets ══ */
.overlay {
  position: fixed; inset: 0; z-index: 3000;
  background: rgba(3, 10, 8, 0.9);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  opacity: 0; visibility: hidden; pointer-events: none;
  transition: opacity var(--t), visibility var(--t);
  display: flex; align-items: flex-end; justify-content: center;
}
[data-theme="light"] .overlay { background: rgba(248, 250, 251, 0.92); }
.overlay.active { opacity: 1; visibility: visible; pointer-events: auto; }
.sheet {
  background: var(--bg-solid);
  border: 1px solid var(--border-hover);
  border-top-left-radius: 26px; border-top-right-radius: 26px;
  padding: 20px; width: 100%; max-width: 560px;
  max-height: 92vh; overflow-y: auto;
  transform: translateY(40px);
  transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: 0 -20px 60px rgba(0,0,0,0.5);
  padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  -webkit-overflow-scrolling: touch;
}
.overlay.active .sheet { transform: translateY(0); }
.handle {
  width: 42px; height: 4px; border-radius: 2px;
  background: var(--text-3); opacity: 0.4; margin: 0 auto 18px;
}
.sheet-title {
  font-size: 1.1rem; font-weight: 900;
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 6px;
}
.sheet-title svg { width: 22px; height: 22px; color: var(--accent-light); }
.sheet-sub { font-size: 0.78rem; color: var(--text-2); margin-bottom: 16px; line-height: 1.5; }

.field { margin-bottom: 13px; }
.field label {
  display: block; font-size: 0.78rem; font-weight: 700;
  color: var(--text-2); margin-bottom: 6px;
}
.input, .select, .textarea {
  width: 100%; padding: 12px 14px; border-radius: 12px;
  background: var(--bg-card); border: 1px solid var(--border);
  color: var(--text); font-family: inherit; font-size: 0.88rem;
  outline: none; transition: border-color var(--t), box-shadow var(--t);
  -webkit-appearance: none; appearance: none;
}
.textarea { min-height: 60px; resize: vertical; }
.input:focus, .select:focus, .textarea:focus {
  border-color: var(--accent); box-shadow: 0 0 0 3px var(--glow);
}

/* Upload zone */
.upload-zone {
  border: 2px dashed var(--border); border-radius: 16px;
  padding: 34px 20px; text-align: center;
  cursor: pointer; transition: all var(--t);
  background: var(--bg-card);
  display: block;
  user-select: none; -webkit-user-select: none;
}
.upload-zone:hover, .upload-zone:focus { border-color: var(--accent); background: rgba(16,185,129,0.05); outline: none; }
.upload-zone:active { transform: scale(0.99); }
.upload-zone svg { width: 44px; height: 44px; color: var(--accent-light); margin-bottom: 10px; stroke-width: 1.6; pointer-events: none; }
.upload-zone h4 { font-size: 0.95rem; font-weight: 800; margin-bottom: 4px; pointer-events: none; }
.upload-zone p { font-size: 0.76rem; color: var(--text-2); pointer-events: none; }

.file-input-hidden {
  position: absolute;
  width: 1px; height: 1px;
  opacity: 0.01;
  pointer-events: none;
  z-index: -1;
  top: 0; left: 0;
  overflow: hidden;
}

/* Per-image editor list */
.edit-list {
  display: flex; flex-direction: column; gap: 10px;
  margin: 12px 0;
  max-height: 50vh;
  overflow-y: auto;
  padding: 4px;
}
.edit-item {
  display: grid;
  grid-template-columns: 80px 1fr;
  gap: 10px;
  padding: 10px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 14px;
  position: relative;
  animation: cardIn 0.3s ease backwards;
}
.edit-thumb {
  width: 80px; height: 80px;
  border-radius: 12px;
  overflow: hidden;
  background: var(--bg-solid);
  border: 1px solid var(--border);
  position: relative;
}
.edit-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.edit-fields { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.edit-fields .input,
.edit-fields .textarea {
  padding: 8px 10px;
  font-size: 0.8rem;
  border-radius: 9px;
}
.edit-fields .textarea { min-height: 40px; }
.edit-remove {
  position: absolute; top: 6px; inset-inline-end: 6px;
  width: 26px; height: 26px; border-radius: 8px;
  background: rgba(239, 68, 68, 0.92); border: none;
  color: white; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  padding: 0;
  z-index: 2;
}
.edit-remove svg { width: 14px; height: 14px; }

.loading-files { text-align: center; padding: 30px 20px; }
.loading-files svg { width: 36px; height: 36px; color: var(--accent-light); }
.loading-files p { margin-top: 10px; font-size: 0.82rem; color: var(--text-2); }

/* Buttons */
.btn {
  padding: 13px 18px; border-radius: 13px;
  border: 1px solid var(--border); background: var(--bg-card);
  color: var(--text); font-family: inherit; font-size: 0.88rem; font-weight: 800;
  cursor: pointer; transition: all var(--t);
  display: flex; align-items: center; justify-content: center; gap: 7px;
}
.btn svg { width: 16px; height: 16px; }
.btn:hover { border-color: var(--accent); color: var(--accent-light); }
.btn:active { transform: scale(0.98); }
.btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }
.btn.primary {
  background: linear-gradient(135deg, var(--accent), var(--accent-dark));
  border-color: transparent; color: white;
  box-shadow: 0 6px 16px var(--glow);
}
.btn.primary:hover { color: white; transform: translateY(-1px); box-shadow: 0 10px 24px var(--glow-strong); }
.btn.danger { color: var(--danger); border-color: rgba(239, 68, 68, 0.3); }
.btn.danger:hover { background: rgba(239, 68, 68, 0.1); color: var(--danger); }
.btn.ghost { background: transparent; }
.btn.full { width: 100%; }
.row2 { display: grid; grid-template-columns: 1fr 2fr; gap: 8px; }

/* Toggle */
.toggle-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 14px; border-radius: 12px;
  background: var(--bg-card); border: 1px solid var(--border);
  cursor: pointer; user-select: none;
}
.toggle-info h4 { font-size: 0.85rem; font-weight: 800; }
.toggle-info p { font-size: 0.7rem; color: var(--text-3); margin-top: 2px; }
.toggle {
  width: 46px; height: 26px; border-radius: 13px;
  background: rgba(128,128,128,0.25);
  position: relative; flex-shrink: 0;
  transition: background var(--t);
}
.toggle::after {
  content: ''; position: absolute;
  top: 3px; right: 3px; width: 20px; height: 20px;
  border-radius: 50%; background: #94a3b8;
  transition: all var(--t);
}
.toggle.on { background: var(--accent); }
.toggle.on::after { background: white; right: calc(100% - 23px); }

/* ══ Fullscreen viewer (image only) ══ */
.fullscreen {
  position: fixed; inset: 0; z-index: 5000;
  background: #000;
  opacity: 0; visibility: hidden;
  transition: opacity 0.25s ease, visibility 0.25s ease;
  display: flex; align-items: center; justify-content: center;
  cursor: zoom-out;
  user-select: none; -webkit-user-select: none;
}
.fullscreen.active { opacity: 1; visibility: visible; }
.fullscreen img {
  max-width: 100vw;
  max-height: 100vh;
  object-fit: contain;
  user-select: none;
  -webkit-user-drag: none;
  pointer-events: none;
  transition: transform 0.3s ease;
}
.fullscreen.zoomed img { transform: scale(2); }

/* ══ Action sheet (long press) ══ */
.action-list { display: flex; flex-direction: column; gap: 6px; }
.action-item {
  display: flex; align-items: center; gap: 12px;
  padding: 13px 14px; border-radius: 12px;
  background: var(--bg-card); border: 1px solid var(--border);
  cursor: pointer; transition: all var(--t);
  font-family: inherit; color: var(--text); text-align: right;
  width: 100%;
  font-size: 0.88rem; font-weight: 700;
}
.action-item:hover { border-color: var(--accent); background: rgba(16,185,129,0.05); }
.action-item:active { transform: scale(0.98); }
.action-item svg { width: 20px; height: 20px; flex-shrink: 0; }
.action-item.danger { color: var(--danger); }
.action-item.danger:hover { background: rgba(239,68,68,0.08); border-color: var(--danger); }

/* ══ Toast ══ */
.toast-wrap {
  position: fixed; top: 78px; left: 50%; transform: translateX(-50%);
  z-index: 9999; display: flex; flex-direction: column; gap: 8px;
  width: calc(100% - 24px); max-width: 400px; pointer-events: none;
}
.toast {
  background: linear-gradient(145deg, rgba(14, 34, 24, 0.98), rgba(6, 18, 12, 0.98));
  backdrop-filter: blur(15px); border-radius: 14px;
  padding: 12px 15px; display: flex; align-items: center; gap: 11px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6); color: #fff;
  opacity: 0; transform: translateY(-30px);
  animation: toastIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  border-right: 4px solid #10b981;
}
@keyframes toastIn { to { opacity: 1; transform: translateY(0); } }
.toast.error { border-right-color: #ef4444; }
.toast.info { border-right-color: #3b82f6; }
.toast.warning { border-right-color: #f59e0b; }
.toast-icon {
  width: 34px; height: 34px; border-radius: 50%;
  background: linear-gradient(145deg, #10b981, #059669);
  display: flex; align-items: center; justify-content: center;
  color: white; flex-shrink: 0;
}
.toast-icon svg { width: 17px; height: 17px; }
.toast.error .toast-icon { background: linear-gradient(145deg, #ff6b5b, #b8332a); }
.toast.info .toast-icon { background: linear-gradient(145deg, #5dade2, #21618c); }
.toast.warning .toast-icon { background: linear-gradient(145deg, #ffb340, #b87700); }
.toast-content { flex: 1; min-width: 0; }
.toast-title { font-weight: 800; font-size: 0.85rem; }
.toast-msg { font-size: 0.74rem; color: #b0c8b0; margin-top: 1px; }

@keyframes spin { to { transform: rotate(360deg); } }
.spin { animation: spin 1s linear infinite; }

.progress-bar {
  height: 6px; background: rgba(128,128,128,0.12); border-radius: 3px;
  overflow: hidden; margin: 10px 0;
}
.progress-fill {
  height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-light));
  border-radius: 3px; transition: width 0.3s ease;
}

@media (max-width: 380px) {
  .grid { gap: 8px; padding: 10px; }
  .card-body { padding: 8px 10px 10px; }
  .card-title { font-size: 0.76rem; }
  .edit-item { grid-template-columns: 70px 1fr; }
  .edit-thumb { width: 70px; height: 70px; }
}
</style>
</head>
<body>

<header class="top">
  <a href="index.html" class="icon-btn" title="رجوع">
    <i data-lucide="arrow-right"></i>
  </a>
  <div class="top-title">
    <h1>محاضراتي</h1>
    <p id="subtitle">جاري التحميل...</p>
  </div>
  <button class="icon-btn" id="themeBtn" title="الثيم">
    <i data-lucide="sun-moon"></i>
  </button>
</header>

<script>
'use strict';

/* ═══════════════════════════════════════════════════
   Constants
   ═══════════════════════════════════════════════════ */
const BUCKET = 'schedule-images';
const MAX_FILES = 10;
const MAX_FILE_SIZE = 8 * 1024 * 1024;
const LONG_PRESS_MS = 600;
const CACHE_NAME = 'medfav-lectures-v1';         // ⭐ جديد
const META_CACHE_KEY = 'medfav_lectures_meta_v1'; // ⭐ جديد

/* ═══════════════════════════════════════════════════
   State
   ═══════════════════════════════════════════════════ */
const state = {
  user: null,
  profile: null,
  all: [],
  likedIds: new Set(),
  savedIds: new Set(),
  filter: 'explore',
  files: [],           // { file, preview, title, description }
  isPublic: true,
  uploading: false,
  preparing: false,
  current: null,       // opened image
  shareTarget: null,
  actionTarget: null,
  longPressTimer: null,
  longPressTriggered: false
};

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
const refreshIcons = () => { try { if (window.lucide) lucide.createIcons(); } catch (e) {} };

/* ═══════════════════════════════════════════════════
   Toast
   ═══════════════════════════════════════════════════ */
function toast(msg, type = 'success', title = null) {
  let wrap = document.querySelector('.toast-wrap');
  if (!wrap) {
    wrap = document.createElement('div');
    wrap.className = 'toast-wrap';
    document.body.appendChild(wrap);
  }
  const cfg = {
    success: { icon: 'check-circle-2', title: 'تم بنجاح' },
    error:   { icon: 'alert-circle',   title: 'خطأ' },
    warning: { icon: 'alert-triangle', title: 'تنبيه' },
    info:    { icon: 'info',           title: 'معلومة' }
  }[type] || { icon: 'info', title: 'معلومة' };

  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.innerHTML = `
    <div class="toast-icon"><i data-lucide="${cfg.icon}"></i></div>
    <div class="toast-content">
      <div class="toast-title">${esc(title || cfg.title)}</div>
      <div class="toast-msg">${esc(msg)}</div>
    </div>`;
  wrap.appendChild(t);
  refreshIcons();
  setTimeout(() => {
    t.style.transition = 'all 0.3s';
    t.style.opacity = '0';
    t.style.transform = 'translateY(-30px)';
    setTimeout(() => {
      t.remove();
      if (wrap.children.length === 0) wrap.remove();
    }, 300);
  }, 3000);
}

/* ═══════════════════════════════════════════════════
   Theme
   ═══════════════════════════════════════════════════ */
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
  const next = cur === 'dark' ? 'light' : 'dark';
  try { localStorage.setItem('medfav_theme', next); } catch (e) {}
  if (next === 'light') document.documentElement.setAttribute('data-theme', 'light');
  else document.documentElement.removeAttribute('data-theme');
  toast(next === 'light' ? 'الوضع النهاري' : 'الوضع الليلي', 'info');
}
(function initTheme() {
  try {
    const t = localStorage.getItem('medfav_theme') || 'dark';
    if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
  } catch (e) {}
})();

/* ═══════════════════════════════════════════════════
   Modals
   ═══════════════════════════════════════════════════ */
function openM(id) {
  const el = $(id);
  if (el) { el.classList.add('active'); document.body.style.overflow = 'hidden'; refreshIcons(); }
}
function closeM(id) {
  const el = $(id);
  if (el) { el.classList.remove('active'); document.body.style.overflow = ''; }
}

/* ═══════════════════════════════════════════════════
   Auth
   ═══════════════════════════════════════════════════ */
async function initUser() {
  try {
    const session = await getSession();
    if (!session) {
      toast('سجّل الدخول أولاً', 'warning');
      setTimeout(() => { location.href = 'login.html'; }, 1200);
      return false;
    }
    state.user = session.user;
    state.profile = await getProfile(session.user.id);
    return true;
  } catch (err) {
    console.error('initUser:', err);
    return false;
  }
}

/* ═══════════════════════════════════════════════════
   ⭐ Offline Cache (Level 1)
   ═══════════════════════════════════════════════════ */

// خزّن صورة في Cache API
async function cacheImage(url) {
  if (!('caches' in window) || !url) return;
  try {
    const cache = await caches.open(CACHE_NAME);
    const exists = await cache.match(url);
    if (!exists) await cache.add(url);
  } catch (e) { /* silent */ }
}

// اقرأ الصورة من Cache (أو أرجع الرابط الأصلي)
async function getCachedImageURL(url) {
  if (!url) return url;
  if (!('caches' in window)) return url;
  try {
    const cache = await caches.open(CACHE_NAME);
    const cached = await cache.match(url);
    if (cached) {
      const blob = await cached.blob();
      return URL.createObjectURL(blob);
    }
  } catch (e) {}
  return url;
}

// خزّن الميتاداتا في localStorage
function saveMetaCache() {
  try {
    const data = {
      items: state.all.slice(0, 80).map(i => ({
        id: i.id, user_id: i.user_id, title: i.title,
        description: i.description, image_url: i.image_url,
        image_path: i.image_path, is_public: i.is_public,
        likes_count: i.likes_count, saves_count: i.saves_count,
        author_name: i.author_name, university: i.university,
        subject_key: i.subject_key, created_at: i.created_at
      })),
      likedIds: [...state.likedIds],
      savedIds: [...state.savedIds],
      at: Date.now()
    };
    localStorage.setItem(META_CACHE_KEY, JSON.stringify(data));
  } catch (e) { console.warn('saveMetaCache:', e); }
}

// اقرأ الميتاداتا من localStorage
function loadMetaCache() {
  try {
    const raw = localStorage.getItem(META_CACHE_KEY);
    if (!raw) return null;
    const data = JSON.parse(raw);
    // صلاحية 7 أيام
    if (data.at && Date.now() - data.at > 7 * 24 * 60 * 60 * 1000) {
      localStorage.removeItem(META_CACHE_KEY);
      return null;
    }
    return data;
  } catch (e) { return null; }
}

/* ═══════════════════════════════════════════════════
   Load
   ═══════════════════════════════════════════════════ */
async function loadAll() {
  $('content').innerHTML = `
    <div class="grid">
      <div class="sk-card"></div><div class="sk-card"></div>
      <div class="sk-card"></div><div class="sk-card"></div>
    </div>`;

  // ⭐ أوفلاين → اعرض الكاش مباشرة
  if (!navigator.onLine) {
    loadFromCache();
    return;
  }

  try {
    const { data, error } = await supabaseClient
      .from('schedule_images')
      .select('*')
      .order('created_at', { ascending: false })
      .limit(80);
    if (error) throw error;

    state.all = data || [];

    // احفظ في الكاش المحلي
    saveMetaCache();

    // ⭐ خزّن كل الصور في Cache API في الخلفية
    state.all.forEach(it => {
      if (it.image_url) cacheImage(it.image_url);
    });

    if (state.all.length > 0 && state.user) {
      const ids = state.all.map(i => i.id);
      const [likesRes, savesRes] = await Promise.all([
        supabaseClient.from('schedule_image_likes').select('image_id').eq('user_id', state.user.id).in('image_id', ids),
        supabaseClient.from('schedule_image_saves').select('image_id').eq('user_id', state.user.id).in('image_id', ids)
      ]);
      state.likedIds = new Set((likesRes.data || []).map(l => l.image_id));
      state.savedIds = new Set((savesRes.data || []).map(s => s.image_id));
    } else {
      state.likedIds = new Set();
      state.savedIds = new Set();
    }

    // احفظ الإعجابات/الحفظ في الكاش أيضاً
    saveMetaCache();

    updateSubtitle();
    render();
  } catch (err) {
    console.error('loadAll:', err);
    // شبكة فشلت → جرّب الكاش
    loadFromCache();
  }
}

// ⭐ تحميل من الكاش (بدون إنترنت)
function loadFromCache() {
  const cached = loadMetaCache();
  if (cached && cached.items?.length > 0) {
    state.all = cached.items;
    state.likedIds = new Set(cached.likedIds || []);
    state.savedIds = new Set(cached.savedIds || []);
    updateSubtitle();
    render();
    toast('أنت غير متصل — يتم عرض المحتوى المحفوظ', 'info');
    return true;
  }

  // لا يوجد كاش
  $('content').innerHTML = `
    <div class="empty">
      <div class="empty-icon"><i data-lucide="wifi-off"></i></div>
      <h3>لا يوجد اتصال</h3>
      <p>افتح الصفحة مرة واحدة بالإنترنت لتحميل المحتوى أوفلاين</p>
    </div>`;
  refreshIcons();
  return false;
}

function updateSubtitle() {
  const mine = state.all.filter(i => i.user_id === state.user?.id).length;
  const saved = state.all.filter(i => state.savedIds.has(i.id)).length;
  $('subtitle').textContent = `${state.all.length} صورة • ${mine} لي • ${saved} محفوظة`;
}

/* ═══════════════════════════════════════════════════
   Filter (3 tabs)
   ═══════════════════════════════════════════════════ */
function setFilter(f) {
  state.filter = f;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.f === f));
  render();
}

function getFilteredItems() {
  const uid = state.user?.id;
  if (state.filter === 'mine') return state.all.filter(i => i.user_id === uid);
  if (state.filter === 'saved') return state.all.filter(i => state.savedIds.has(i.id));
  // explore: صور الآخرين العامة فقط
  return state.all.filter(i => i.user_id !== uid && i.is_public);
}

/* ═══════════════════════════════════════════════════
   Render
   ═══════════════════════════════════════════════════ */
function render() {
  const content = $('content');
  const items = getFilteredItems();

  if (items.length === 0) {
    const cfg = {
      explore: { icon: 'compass',    title: 'لا توجد صور للاستكشاف', desc: 'كن أول من يشارك جدوله مع الآخرين' },
      mine:    { icon: 'image-plus', title: 'لم ترفع صوراً بعد',     desc: 'اضغط زر "رفع صور" في الأسفل لتبدأ' },
      saved:   { icon: 'bookmark',   title: 'لا توجد محفوظات',       desc: 'احفظ الصور التي تعجبك للرجوع إليها لاحقاً' }
    }[state.filter];

    content.innerHTML = `
      <div class="empty">
        <div class="empty-icon"><i data-lucide="${cfg.icon}"></i></div>
        <h3>${cfg.title}</h3>
        <p>${cfg.desc}</p>
      </div>`;
    refreshIcons();
    return;
  }

  content.innerHTML = `<div class="grid">${items.map((it, i) => renderCard(it, i)).join('')}</div>`;
  refreshIcons();
  loadCardImages();
}

function renderCard(it, i) {
  const liked = state.likedIds.has(it.id);
  const saved = state.savedIds.has(it.id);

  return `
    <div class="card" style="animation-delay: ${i * 0.03}s" data-card-id="${it.id}">
      <div class="card-img-wrap" data-img-id="${it.id}">
        <img class="card-img" data-src="${esc(it.image_url)}" alt="${esc(it.title)}" loading="lazy" decoding="async">
        <div class="card-img-skeleton"></div>
      </div>
      <div class="card-body">
        <div class="card-title">${esc(it.title)}</div>
        <div class="card-author">
          <i data-lucide="user"></i><span>${esc(it.author_name || 'مستخدم')}</span>
        </div>
        <div class="card-stats">
          <button class="stat-btn ${liked ? 'liked' : ''}" data-action="like" data-id="${it.id}" title="إعجاب">
            <i data-lucide="heart"></i><span>${it.likes_count || 0}</span>
          </button>
          <button class="stat-btn ${saved ? 'saved' : ''}" data-action="save" data-id="${it.id}" title="حفظ">
            <i data-lucide="bookmark"></i><span>${it.saves_count || 0}</span>
          </button>
          <button class="stat-btn" data-action="share" data-id="${it.id}" title="مشاركة">
            <i data-lucide="share-2"></i>
          </button>
        </div>
      </div>
    </div>`;
}

/* ═══════════════════════════════════════════════════
   Lazy load — direct URLs (no blob issues!)
   ═══════════════════════════════════════════════════ */
let imgObserver = null;
function loadCardImages() {
  if (imgObserver) imgObserver.disconnect();
  if (!('IntersectionObserver' in window)) {
    document.querySelectorAll('.card-img[data-src]').forEach(img => {
      img.src = img.dataset.src;
      img.addEventListener('load', () => img.classList.add('loaded'), { once: true });
    });
    return;
  }
  imgObserver = new IntersectionObserver(async (entries) => {
    for (const entry of entries) {
      if (!entry.isIntersecting) continue;
      const img = entry.target;
      const url = img.dataset.src;
      if (!url || img.dataset.loaded) continue;
      img.dataset.loaded = '1';
      imgObserver.unobserve(img);

      try {
        // ⭐ جرّب الكاش أولاً
        const finalUrl = await getCachedImageURL(url);
        img.src = finalUrl;

        if (img.complete && img.naturalHeight > 0) {
          img.classList.add('loaded');
        } else {
          img.addEventListener('load', () => img.classList.add('loaded'), { once: true });
          img.addEventListener('error', () => {
            if (img.src !== url) img.src = url;
            img.addEventListener('load', () => img.classList.add('loaded'), { once: true });
          }, { once: true });
        }

        // ⭐ خزّن الصورة في الكاش للمرة القادمة
        cacheImage(url);
      } catch (e) {
        img.src = url;
      }
    }
  }, { rootMargin: '300px 0px' });

  document.querySelectorAll('.card-img[data-src]').forEach(img => imgObserver.observe(img));
}

/* ═══════════════════════════════════════════════════
   Like / Save
   ═══════════════════════════════════════════════════ */
async function toggleLike(id) {
  const item = state.all.find(x => x.id === id);
  if (!item) return;
  const liked = state.likedIds.has(id);

  if (liked) {
    state.likedIds.delete(id);
    item.likes_count = Math.max(0, (item.likes_count || 0) - 1);
  } else {
    state.likedIds.add(id);
    item.likes_count = (item.likes_count || 0) + 1;
  }
  render();

  try {
    if (liked) {
      await supabaseClient.from('schedule_image_likes')
        .delete().eq('user_id', state.user.id).eq('image_id', id);
    } else {
      await supabaseClient.from('schedule_image_likes')
        .insert({ user_id: state.user.id, image_id: id });
    }
  } catch (err) {
    console.error(err);
    if (liked) {
      state.likedIds.add(id);
      item.likes_count = (item.likes_count || 0) + 1;
    } else {
      state.likedIds.delete(id);
      item.likes_count = Math.max(0, (item.likes_count || 0) - 1);
    }
    render();
    toast('تعذر التحديث', 'error');
  }
}

async function toggleSave(id) {
  const item = state.all.find(x => x.id === id);
  if (!item) return;
  const saved = state.savedIds.has(id);

  if (saved) {
    state.savedIds.delete(id);
    item.saves_count = Math.max(0, (item.saves_count || 0) - 1);
  } else {
    state.savedIds.add(id);
    item.saves_count = (item.saves_count || 0) + 1;
  }
  updateSubtitle();
  render();

  try {
    if (saved) {
      await supabaseClient.from('schedule_image_saves')
        .delete().eq('user_id', state.user.id).eq('image_id', id);
      toast('أُزيل من المحفوظات', 'info');
    } else {
      await supabaseClient.from('schedule_image_saves')
        .insert({ user_id: state.user.id, image_id: id });
      toast('أُضيف للمحفوظات');
    }
  } catch (err) {
    console.error(err);
    if (saved) { state.savedIds.add(id); item.saves_count = (item.saves_count || 0) + 1; }
    else { state.savedIds.delete(id); item.saves_count = Math.max(0, (item.saves_count || 0) - 1); }
    updateSubtitle();
    render();
    toast('تعذر التحديث', 'error');
  }
}

/* ═══════════════════════════════════════════════════
   Card Image: single tap → fullscreen, long press → actions
   ═══════════════════════════════════════════════════ */
document.addEventListener('click', (e) => {
  // Image wrapper click
  const imgWrap = e.target.closest('[data-img-id]');
  if (imgWrap && !state.longPressTriggered) {
    e.stopPropagation();
    openFullscreen(imgWrap.dataset.imgId);
    return;
  }

  // Stat buttons
  const btn = e.target.closest('[data-action]');
  if (btn) {
    e.stopPropagation();
    const id = btn.dataset.id;
    if (btn.dataset.action === 'like') toggleLike(id);
    else if (btn.dataset.action === 'save') toggleSave(id);
    else if (btn.dataset.action === 'share') openShare(id);
  }
});

// Reset flag after click
document.addEventListener('click', () => {
  setTimeout(() => { state.longPressTriggered = false; }, 50);
}, true);

// Long press handler (touch + mouse)
function startLongPress(e) {
  const imgWrap = e.target.closest('[data-img-id]');
  if (!imgWrap) return;
  const id = imgWrap.dataset.imgId;
  state.longPressTriggered = false;

  const card = imgWrap.closest('.card');
  state.longPressTimer = setTimeout(() => {
    state.longPressTriggered = true;
    if (card) card.classList.remove('pressing');
    if (navigator.vibrate) navigator.vibrate(40);
    openActions(id);
  }, LONG_PRESS_MS);

  if (card) card.classList.add('pressing');
}

function cancelLongPress(e) {
  if (state.longPressTimer) {
    clearTimeout(state.longPressTimer);
    state.longPressTimer = null;
  }
  document.querySelectorAll('.card.pressing').forEach(c => c.classList.remove('pressing'));
}

document.addEventListener('touchstart', startLongPress, { passive: true });
document.addEventListener('touchend', cancelLongPress);
document.addEventListener('touchmove', cancelLongPress);
document.addEventListener('touchcancel', cancelLongPress);
document.addEventListener('mousedown', startLongPress);
document.addEventListener('mouseup', cancelLongPress);
document.addEventListener('mouseleave', cancelLongPress);

/* ═══════════════════════════════════════════════════
   Fullscreen viewer (image only)
   ═══════════════════════════════════════════════════ */
function openFullscreen(id) {
  const item = state.all.find(x => x.id === id);
  if (!item) return;
  state.current = item;

  const fs = $('fullscreen');
  const img = $('fullscreenImg');
  img.src = item.image_url;
  fs.classList.remove('zoomed');
  fs.classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeFullscreen() {
  $('fullscreen').classList.remove('active', 'zoomed');
  document.body.style.overflow = '';
  setTimeout(() => { $('fullscreenImg').src = ''; }, 300);
  state.current = null;
}

$('fullscreen').addEventListener('click', function () {
  // Toggle zoom or close? → close for simplicity
  closeFullscreen();
});

/* ═══════════════════════════════════════════════════
   Actions Sheet (long press)
   ═══════════════════════════════════════════════════ */
function openActions(id) {
  const item = state.all.find(x => x.id === id);
  if (!item) return;
  state.actionTarget = item;

  const isMine = item.user_id === state.user?.id;
  const saved = state.savedIds.has(id);
  const liked = state.likedIds.has(id);

  const items = [
    { icon: 'download', label: 'تنزيل الصورة', action: 'download' },
    { icon: saved ? 'bookmark-minus' : 'bookmark-plus', label: saved ? 'إزالة من المحفوظات' : 'حفظ', action: 'save' },
    { icon: 'heart', label: liked ? 'إزالة الإعجاب' : 'إعجاب', action: 'like' },
    { icon: 'share-2', label: 'مشاركة', action: 'share' },
  ];

  if (isMine) {
    items.push({ icon: 'trash-2', label: 'حذف', action: 'delete', danger: true });
  }

  $('actionsTitle').innerHTML = `<i data-lucide="settings-2"></i><span>${esc(item.title)}</span>`;
  $('actionsList').innerHTML = items.map(x => `
    <button class="action-item ${x.danger ? 'danger' : ''}" data-action-sheet="${x.action}" type="button">
      <i data-lucide="${x.icon}"></i><span>${x.label}</span>
    </button>
  `).join('');

  refreshIcons();
  openM('m-actions');
}

$('actionsList').addEventListener('click', async (e) => {
  const btn = e.target.closest('[data-action-sheet]');
  if (!btn) return;
  const action = btn.dataset.actionSheet;
  const item = state.actionTarget;
  if (!item) return;
  closeM('m-actions');

  if (action === 'download') downloadImage(item);
  else if (action === 'save') await toggleSave(item.id);
  else if (action === 'like') await toggleLike(item.id);
  else if (action === 'share') openShare(item.id);
  else if (action === 'delete') await deleteImage(item);
});

/* ═══════════════════════════════════════════════════
   Download
   ═══════════════════════════════════════════════════ */
async function downloadImage(item) {
  toast('جاري التحضير...', 'info');
  try {
    const response = await fetch(item.image_url);
    if (!response.ok) throw new Error('fetch failed');
    const blob = await response.blob();
    const blobUrl = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = blobUrl;
    const safeTitle = (item.title || 'image').replace(/[\\/:*?"<>|]/g, '_').slice(0, 60);
    a.download = `${safeTitle}.jpg`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(blobUrl), 2000);
    toast('تم التنزيل');
  } catch (err) {
    console.error(err);
    // fallback: open in new tab
    window.open(item.image_url, '_blank', 'noopener,noreferrer');
    toast('تم فتح الصورة — احفظها يدوياً', 'info');
  }
}

/* ═══════════════════════════════════════════════════
   Delete
   ═══════════════════════════════════════════════════ */
async function deleteImage(item) {
  if (!item || item.user_id !== state.user?.id) return;
  if (!confirm('حذف هذه الصورة نهائياً؟')) return;

  try {
    if (item.image_path) {
      await supabaseClient.storage.from(BUCKET).remove([item.image_path]).catch(() => {});
    }
    await supabaseClient.from('schedule_images').delete().eq('id', item.id);
    state.all = state.all.filter(x => x.id !== item.id);
    updateSubtitle();
    render();
    toast('تم الحذف', 'info');
  } catch (err) {
    console.error(err);
    toast('تعذر الحذف', 'error');
  }
}

/* ═══════════════════════════════════════════════════
   Share
   ═══════════════════════════════════════════════════ */
function buildShareUrl(id) {
  return `${location.origin}${location.pathname}?id=${encodeURIComponent(id)}`;
}

function openShare(id) {
  const item = state.all.find(x => x.id === id);
  if (!item) return;
  state.shareTarget = item;
  $('shareNativeBtn').style.display = (typeof navigator.share === 'function') ? 'flex' : 'none';
  openM('m-share');
}

async function copyText(text) {
  if (!text) return false;
  if (navigator.clipboard && window.isSecureContext) {
    try { await navigator.clipboard.writeText(text); return true; } catch (e) {}
  }
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, 99999);
    const ok = document.execCommand('copy');
    ta.remove();
    return ok;
  } catch (e) { return false; }
}

$('shareNativeBtn').addEventListener('click', async () => {
  const item = state.shareTarget;
  if (!item) return;
  try {
    await navigator.share({
      title: item.title,
      text: `شاهد هذا الجدول: ${item.title}`,
      url: buildShareUrl(item.id)
    });
    closeM('m-share');
  } catch (err) {
    if (err && err.name === 'AbortError') return;
    const ok = await copyText(buildShareUrl(item.id));
    if (ok) { toast('تم نسخ الرابط'); closeM('m-share'); }
  }
});

$('shareCopyLinkBtn').addEventListener('click', async () => {
  const item = state.shareTarget;
  if (!item) return;
  const ok = await copyText(buildShareUrl(item.id));
  if (ok) { toast('تم نسخ رابط المشاركة'); closeM('m-share'); }
  else toast('تعذر النسخ', 'error');
});

$('shareCopyImageBtn').addEventListener('click', async () => {
  const item = state.shareTarget;
  if (!item) return;
  const ok = await copyText(item.image_url);
  if (ok) { toast('تم نسخ رابط الصورة'); closeM('m-share'); }
  else toast('تعذر النسخ', 'error');
});

$('shareCloseBtn').addEventListener('click', () => closeM('m-share'));
$('m-share').addEventListener('click', (e) => { if (e.target === e.currentTarget) closeM('m-share'); });
$('m-actions').addEventListener('click', (e) => { if (e.target === e.currentTarget) closeM('m-actions'); });

/* ═══════════════════════════════════════════════════
   Upload
   ═══════════════════════════════════════════════════ */
function cleanupFiles() {
  state.files.forEach(f => {
    if (f.preview?.startsWith('blob:')) {
      try { URL.revokeObjectURL(f.preview); } catch (e) {}
    }
  });
  state.files = [];
}

function fileToDataURL(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error || new Error('read failed'));
    reader.readAsDataURL(file);
  });
}

function openUpload() {
  cleanupFiles();
  state.isPublic = true;
  state.uploading = false;
  state.preparing = false;

  try { $('fileInput').value = ''; } catch (e) {}

  $('uploadEmpty').style.display = 'block';
  $('uploadForm').style.display = 'none';
  $('editList').style.display = 'none';
  $('editList').innerHTML = '';
  $('loadingFiles').style.display = 'none';
  $('uUni').value = '';
  $('publicToggle').classList.add('on');
  $('progressWrap').style.display = 'none';
  $('uploadBtn').disabled = false;
  $('cancelUploadBtn').disabled = false;
  $('uploadCount').textContent = '0';
  $('progressFill').style.width = '0%';

  openM('m-upload');
}

function closeUpload() {
  if (state.uploading || state.preparing) return;
  closeM('m-upload');
  cleanupFiles();
  try { $('fileInput').value = ''; } catch (e) {}
}

function triggerFileSelect(e) {
  if (e) { e.preventDefault(); e.stopPropagation(); }
  if (state.preparing || state.uploading) return;
  const input = $('fileInput');
  try { input.value = ''; } catch (err) {}
  input.click();
}

async function handleFiles(e) {
  const fileList = e.target.files;
  const count = fileList ? fileList.length : 0;
  if (!count) return;

  const rawFiles = [];
  for (let i = 0; i < fileList.length; i++) {
    if (fileList[i]) rawFiles.push(fileList[i]);
  }

  if (rawFiles.length > MAX_FILES) {
    toast(`الحد الأقصى ${MAX_FILES} صور — تم أخذ الأولى فقط`, 'warning');
    rawFiles.length = MAX_FILES;
  }

  const valid = [];
  let skipped = 0;
  for (const f of rawFiles) {
    if (f.type && f.type.startsWith('image/') && f.size <= MAX_FILE_SIZE) valid.push(f);
    else skipped++;
  }
  if (skipped > 0) toast(`${skipped} ملف تم تجاهله`, 'warning');
  if (!valid.length) return toast('لم يتم اختيار صور صالحة', 'error');

  state.preparing = true;
  $('uploadEmpty').style.display = 'none';
  $('uploadForm').style.display = 'block';
  $('loadingFiles').style.display = 'block';
  $('editList').style.display = 'none';
  $('editList').innerHTML = '';
  refreshIcons();

  const previews = [];
  for (const f of valid) {
    try {
      const dataUrl = await fileToDataURL(f);
      previews.push({
        file: f,
        preview: dataUrl,
        title: (f.name || '').replace(/\.[^.]+$/, '').slice(0, 80),
        description: '',
        name: f.name,
        size: f.size,
        type: f.type
      });
    } catch (err) {
      console.warn('FileReader failed', f.name);
    }
  }

  state.preparing = false;

  if (!previews.length) {
    $('uploadEmpty').style.display = 'block';
    $('uploadForm').style.display = 'none';
    toast('تعذر تحضير الصور', 'error');
    return;
  }

  state.files = previews;
  $('loadingFiles').style.display = 'none';
  $('editList').style.display = 'flex';
  renderEditList();
  $('uploadCount').textContent = state.files.length;
  refreshIcons();
}

function renderEditList() {
  const wrap = $('editList');
  wrap.innerHTML = state.files.map((f, i) => `
    <div class="edit-item" style="animation-delay:${i * 0.04}s">
      <div class="edit-thumb">
        <img src="${f.preview}" alt="" loading="lazy">
      </div>
      <div class="edit-fields">
        <input type="text" class="input" data-title="${i}" placeholder="عنوان الصورة..." maxlength="80" value="${esc(f.title)}">
        <textarea class="textarea" data-desc="${i}" placeholder="وصف (اختياري)..." maxlength="300">${esc(f.description)}</textarea>
      </div>
      <button class="edit-remove" data-remove="${i}" type="button" aria-label="حذف">
        <i data-lucide="x"></i>
      </button>
    </div>
  `).join('');
  $('uploadCount').textContent = state.files.length;
  refreshIcons();
}

// Input events for edit list
$('editList').addEventListener('input', (e) => {
  const t = e.target;
  if (t.dataset.title !== undefined) {
    const i = parseInt(t.dataset.title, 10);
    if (!isNaN(i) && state.files[i]) state.files[i].title = t.value;
  } else if (t.dataset.desc !== undefined) {
    const i = parseInt(t.dataset.desc, 10);
    if (!isNaN(i) && state.files[i]) state.files[i].description = t.value;
  }
});

// Remove button
$('editList').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-remove]');
  if (!btn) return;
  const i = parseInt(btn.dataset.remove, 10);
  if (isNaN(i)) return;
  state.files.splice(i, 1);
  if (!state.files.length) {
    $('uploadEmpty').style.display = 'block';
    $('uploadForm').style.display = 'none';
    $('editList').style.display = 'none';
    try { $('fileInput').value = ''; } catch (e) {}
  } else {
    renderEditList();
  }
});

function togglePublic() {
  state.isPublic = !state.isPublic;
  $('publicToggle').classList.toggle('on', state.isPublic);
}

async function startUpload() {
  if (state.uploading) return;
  if (!state.files.length) return toast('اختر صوراً أولاً', 'warning');

  // تحقق من كل صورة لها عنوان
  for (let i = 0; i < state.files.length; i++) {
    if (!state.files[i].title.trim()) {
      return toast(`الصورة ${i + 1} بدون عنوان`, 'warning');
    }
  }

  state.uploading = true;
  $('uploadBtn').disabled = true;
  $('cancelUploadBtn').disabled = true;
  $('progressWrap').style.display = 'block';
  setProgress(0, 'بدء الرفع...');

  const uni = $('uUni').value.trim() || null;
  const isPublic = state.isPublic;
  const authorName = state.profile?.full_name || state.user.email?.split('@')[0] || 'مستخدم';

  let successCount = 0, failedCount = 0;
  const total = state.files.length;

  for (let i = 0; i < total; i++) {
    const entry = state.files[i];
    const file = entry.file;
    const pct = Math.round((i / total) * 100);
    setProgress(pct, `جاري رفع الصورة ${i + 1} من ${total}...`);

    try {
      let ext = 'jpg';
      const parts = (file.name || '').split('.');
      if (parts.length > 1) ext = parts.pop().toLowerCase().replace(/[^a-z0-9]/g, '') || 'jpg';
      const filePath = `${state.user.id}/${Date.now()}_${Math.random().toString(36).slice(2, 8)}.${ext}`;

      const { error: upErr } = await supabaseClient.storage
        .from(BUCKET)
        .upload(filePath, file, {
          cacheControl: '31536000',
          upsert: false,
          contentType: file.type || 'image/jpeg'
        });
      if (upErr) throw upErr;

      const { data: urlData } = supabaseClient.storage.from(BUCKET).getPublicUrl(filePath);
      const publicUrl = urlData?.publicUrl;
      if (!publicUrl) throw new Error('no public url');

      const { error: dbErr } = await supabaseClient
        .from('schedule_images')
        .insert({
          user_id: state.user.id,
          title: entry.title.trim(),
          description: entry.description.trim() || null,
          image_url: publicUrl,
          image_path: filePath,
          is_public: isPublic,
          author_name: authorName,
          university: uni
        });
if (dbErr) throw dbErr;

// ⭐ خزّن الصورة في الكاش فوراً
cacheImage(publicUrl);

successCount++;
    } catch (err) {
      console.error(`Upload ${i + 1} failed:`, err);
      failedCount++;
    }
  }

  setProgress(100, 'تم!');
  state.uploading = false;
  $('uploadBtn').disabled = false;
  $('cancelUploadBtn').disabled = false;

  cleanupFiles();
  try { $('fileInput').value = ''; } catch (e) {}

  closeM('m-upload');

  if (successCount > 0 && failedCount === 0) {
    toast(`تم رفع ${successCount} صورة بنجاح`);
    await loadAll();
  } else if (successCount > 0) {
    toast(`تم رفع ${successCount} — فشل ${failedCount}`, 'warning');
    await loadAll();
  } else {
    toast('تعذر الرفع — حاول مجدداً', 'error');
  }
}

function setProgress(pct, text) {
  $('progressFill').style.width = pct + '%';
  $('progressText').textContent = text;
}

/* ═══════════════════════════════════════════════════
   Deep link (?id=xxx)
   ═══════════════════════════════════════════════════ */
async function handleDeepLink() {
  const id = new URLSearchParams(location.search).get('id');
  if (!id) return;
  await new Promise(r => setTimeout(r, 500));
  const item = state.all.find(x => x.id === id);
  if (item) {
    openFullscreen(id);
    try { history.replaceState({}, '', location.pathname); } catch (e) {}
  }
}

/* ═══════════════════════════════════════════════════
   Online/Offline
   ═══════════════════════════════════════════════════ */
window.addEventListener('online', () => {
  toast('عاد الاتصال', 'info');
  setTimeout(loadAll, 500);
});

/* ═══════════════════════════════════════════════════
   Keyboard
   ═══════════════════════════════════════════════════ */
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if ($('fullscreen').classList.contains('active')) return closeFullscreen();
    if ($('m-actions').classList.contains('active')) return closeM('m-actions');
    if ($('m-share').classList.contains('active')) return closeM('m-share');
    if ($('m-upload').classList.contains('active') && !state.uploading && !state.preparing) return closeUpload();
  }
});

/* ═══════════════════════════════════════════════════
   Event Bindings
   ═══════════════════════════════════════════════════ */
$('themeBtn').addEventListener('click', toggleTheme);

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => setFilter(tab.dataset.f));
});

$('fabBtn').addEventListener('click', openUpload);

// Upload zone — direct click
$('uploadZone').addEventListener('click', triggerFileSelect);
$('uploadZone').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' || e.key === ' ') triggerFileSelect(e);
});

// File input
$('fileInput').addEventListener('change', handleFiles);

// Upload controls
$('cancelUploadBtn').addEventListener('click', closeUpload);
$('uploadBtn').addEventListener('click', startUpload);
$('publicToggleRow').addEventListener('click', togglePublic);

// Close upload on backdrop (if not uploading)
$('m-upload').addEventListener('click', (e) => {
  if (e.target === e.currentTarget && !state.uploading && !state.preparing) closeUpload();
});

/* ═══════════════════════════════════════════════════
   Init
   ═══════════════════════════════════════════════════ */
async function init() {
  refreshIcons();
  const ok = await initUser();
  if (!ok) return;
  await loadAll();
  await handleDeepLink();
  refreshIcons();
  console.log('✅ my-lectures ready');
}

init();
