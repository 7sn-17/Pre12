<!-- Smooth page transitions (View Transitions API + fallback fade).
     The fixed bottom navigation gets its own view-transition-name and is
     frozen, so it can never move or fade while the page content changes. -->
<style data-shell>
  /* Global theme defaults. `data-theme` is always set by theme-init.js
     (light or dark), so native controls and scrollbars follow the app. */
  :root { color-scheme: light; --medapp-amber: #fbbf24; --medapp-orange: #fb923c; --medapp-blue: #93c5fd; --medapp-blue-soft: #bfdbfe; --medapp-violet: #c4b5fd; --medapp-green: #34d399; --medapp-red: #f87171; --medapp-pink: #f472b6; }
  [data-theme="dark"] { color-scheme: dark; }
  [data-theme="light"] { --medapp-amber: #b45309; --medapp-orange: #c2410c; --medapp-blue: #2563eb; --medapp-blue-soft: #1d4ed8; --medapp-violet: #6d28d9; --medapp-green: #047857; --medapp-red: #b91c1c; --medapp-pink: #be185d; }

  /* Premium smooth scrolling. The SPA router temporarily disables this for
     page swaps / Back restoration so navigation is instant, never animated. */
  html { scroll-behavior: smooth; }
  /* app.js sets this only for instant SPA swaps / Back restoration. */
  html.medapp-scroll-jump { scroll-behavior: auto !important; }

  html.medapp-navigating { cursor: progress; }

  /* ⭐IMPORTANT: the `hidden` attribute must always win.
     Author rules like `.detail-empty { display: flex }` beat the user-agent
     `[hidden] { display: none }` rule, which made "empty" blocks stay on
     screen on top of real content. */
  [hidden] { display: none !important; }

  /* ⭐ Tap targets: 44px minimum, no double-tap zoom, no grey flash. */
  button,
  a[role="button"],
  [role="button"] {
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }

  /* ⭐ انتقال ناعم بين الوضعين النهاري والليلي.
     يُفعَّل هذا الصنف لحظياً قبل تبديل الثيم (MedApp.withThemeTransition)
     فيتحوّل لون الخلفية والنص والحدود تدريجياً بدل القفز المفاجئ. */
  html.theme-transition,
  html.theme-transition body,
  html.theme-transition *,
  html.theme-transition *::before,
  html.theme-transition *::after {
    transition:
      background-color 0.34s ease,
      color 0.34s ease,
      border-color 0.34s ease,
      fill 0.34s ease,
      stroke 0.34s ease,
      box-shadow 0.34s ease !important;
    transition-delay: 0s !important;
  }

  /* Very thin top progress bar, shown by app.js during SPA navigation. */
  #medapp-loader {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    z-index: 2147483647;
    pointer-events: none;
    overflow: hidden;
    opacity: 0;
    transition: opacity 0.15s ease;
  }

  #medapp-loader::before {
    content: '';
    display: block;
    width: 40%;
    height: 100%;
    border-radius: 0 999px 999px 0;
    background: linear-gradient(90deg, transparent, #059669 18%, #10b981 52%, #34d399 82%, transparent);
    box-shadow: 0 0 8px rgba(16, 185, 129, 0.6);
    transform: translateX(-110%);
    will-change: transform;
  }

  html.medapp-loading #medapp-loader { opacity: 1; }
  html.medapp-loading #medapp-loader::before {
    animation: medapp-loader-slide 1.05s cubic-bezier(0.4, 0, 0.2, 1) infinite;
  }

  @keyframes medapp-loader-slide {
    0%   { transform: translateX(-110%); }
    100% { transform: translateX(360%); }
  }

  /* Only same-document transitions (started by app.js). Cross-document
     @view-transition is intentionally NOT enabled: full loads must behave
     exactly like the original pages. */

  .floating-nav-wrapper { view-transition-name: medapp-bottom-nav; }
  ::view-transition-group(medapp-bottom-nav) { animation: none; }
  ::view-transition-old(medapp-bottom-nav),
  ::view-transition-new(medapp-bottom-nav) { animation: none; }

  /* Keep the sticky header out of the root cross-fade. Otherwise the old and
     new snapshots of a translucent, blurred header overlap and look frozen /
     show a ghost shadow while the page changes. */
  header { view-transition-name: medapp-header; }
  ::view-transition-group(medapp-header) { animation: none; }
  ::view-transition-old(medapp-header),
  ::view-transition-new(medapp-header) { animation: none; }

  /* Light mode: the header must use a soft neutral shadow, never the heavy
     black shadow used by the dark theme. */
  [data-theme="light"] header {
    background: rgba(248, 250, 251, 0.92);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    backdrop-filter: blur(20px) saturate(180%);
    border-bottom-color: rgba(15, 23, 42, 0.08);
    box-shadow: 0 1px 0 rgba(15, 23, 42, 0.04);
    color: var(--text-primary);
  }

  /* Wins over every page-level `header.scrolled` (higher specificity). */
  [data-theme="light"] header.scrolled {
    background: rgba(248, 250, 251, 0.97);
    border-bottom-color: rgba(15, 23, 42, 0.1);
    box-shadow:
      0 4px 18px rgba(15, 23, 42, 0.08),
      0 1px 0 rgba(15, 23, 42, 0.05);
  }

  @media (prefers-reduced-motion: no-preference) {
    ::view-transition-old(root) { animation: pt-fade-out 0.14s cubic-bezier(0.4, 0, 0.2, 1) both; }
    ::view-transition-new(root) { animation: pt-fade-in 0.2s cubic-bezier(0.4, 0, 0.2, 1) both; }
  }

  /* No body animation on browsers without View Transitions: the swap is
     already synchronous, and fading the body element would also fade the
     fixed bottom navigation. The nav must never move or fade. */

  @keyframes pt-fade-in  { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pt-fade-out { from { opacity: 1; } to { opacity: 0; } }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto !important; }
    html.theme-transition,
    html.theme-transition body,
    html.theme-transition *,
    html.theme-transition *::before,
    html.theme-transition *::after {
      transition: none !important;
    }
    #medapp-loader::before {
      animation: none !important;
      transform: none;
      width: 60%;
    }
    ::view-transition-old(root), ::view-transition-new(root),
    ::view-transition-old(medapp-bottom-nav), ::view-transition-new(medapp-bottom-nav),
    ::view-transition-old(medapp-header), ::view-transition-new(medapp-header) { animation: none !important; }
  }

  /* ============================================================
     ⭐ المنطقة الآمنة + الشريط العلوي الثابت (Phase 14)
     ------------------------------------------------------------
     • الشريط العلوي fixed ⇒ لا يختفي تحت شريط الحالة عند السحب
       (الـ rubber-band كان يُظهره خلف الشريط).
     • جسم الصفحة يحمل padding-top بمقدار ارتفاع الشريط حتى
       لا يختفي المحتوى تحته.
     • overscroll-behavior: لا اهتزاز عند السحب إلى ما بعد الحواف.
     ============================================================ */
  :root {
    --safe-area-inset-top: env(safe-area-inset-top, 0px);
    --safe-area-inset-bottom: env(safe-area-inset-bottom, 0px);
    --safe-area-inset-left: env(safe-area-inset-left, 0px);
    --safe-area-inset-right: env(safe-area-inset-right, 0px);

    /* ⭐⭐ رموز احتياطية — الصفحات التي تعرّف رموزها الخاصة تتجاوزها،
       والصفحات التي لا تعرّفها تحصل على قيم سليمة.
       بدونها كان زر "تسجيل الدخول" بلا خلفية (لأن --accent-emerald
       غير معرّف) فيظهر النص الأبيض على خلفية شفافة = نص غير مرئي. */
    --accent-emerald: #10b981;
    --accent-light: #34d399;
    --accent-dark: #059669;
    --accent-glow: rgba(16, 185, 129, 0.25);
    --accent-glow-strong: rgba(16, 185, 129, 0.42);
    --bg-main: #06110d;
    --bg-card: rgba(16, 34, 27, 0.68);
    --bg-card-hover: rgba(22, 48, 38, 0.92);
    --bg-solid: #0d221a;
    --bg-elevated: #102a22;
    --border-card: rgba(16, 185, 129, 0.18);
    --border-card-hover: rgba(16, 185, 129, 0.46);
    --text-primary: #f0fdf4;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
    --transition-fast: 0.18s ease;
    --transition-smooth: 0.25s cubic-bezier(0.4, 0, 0.2, 1);

    --app-header-h: 72px;
    --app-header-pad-x: 20px;
  }

  [data-theme="light"] {
    --accent-emerald: #059669;
    --bg-main: #f8fafb;
    --bg-card: rgba(255, 255, 255, 0.9);
    --bg-card-hover: #ffffff;
    --bg-solid: #ffffff;
    --bg-elevated: #f1f5f9;
    --border-card: rgba(16, 185, 129, 0.24);
    --border-card-hover: rgba(16, 185, 129, 0.55);
    --text-primary: #0f172a;
    --text-secondary: #475569;
    --text-muted: #94a3b8;
  }

  @media (max-width: 480px) {
    :root {
      --app-header-h: 68px;
      --app-header-pad-x: 16px;
    }
  }

  html, body, main {
    overscroll-behavior-y: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }

  /* ⭐ لكن حقول الإدخال تبقى قابلة للتحديد والنسخ */
  input,
  textarea,
  select,
  [contenteditable="true"] {
    -webkit-user-select: text;
    user-select: text;
  }

  body {
    margin: 0;
    padding: 0;
  }

  /* ⭐ الشريط العلوي: ثابت في الأعلى، فوق كل شيء، ويحترم النوتش */
  body > header,
  body > .ml-topbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    width: 100%;
    z-index: 9999;
    box-sizing: border-box;
    min-height: calc(var(--app-header-h) + var(--safe-area-inset-top, env(safe-area-inset-top, 0px)));
    padding-top: var(--safe-area-inset-top, env(safe-area-inset-top, 0px)) !important;
    padding-bottom: 0 !important;
    padding-left: var(--app-header-pad-x) !important;
    padding-right: var(--app-header-pad-x) !important;
  }

  /* حالة "مُمرَّر" لا يجب أن تكسر الارتفاع ولا المنطقة الآمنة */
  body > header.scrolled,
  body > .ml-topbar {
    padding-top: var(--safe-area-inset-top, env(safe-area-inset-top, 0px)) !important;
  }

  /* ⭐ جسم الصفحة يتزحزح بمقدار الشريط حتى لا يختفي تحته */
  body:has(> header),
  body:has(> .ml-topbar) {
    padding-top: calc(var(--app-header-h) + var(--safe-area-inset-top, env(safe-area-inset-top, 0px)));
  }

  /* ⭐ حاويات التطبيق تحترم المنطقة الآمنة من الأسفل */
  body > main,
  body > .container,
  .app-container {
    padding-bottom: var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));
  }

  /* ============================================================
     نافذة "سجّل الدخول" (وضع الزائر) — مشتركة بين كل الصفحات
     ============================================================ */
    .auth-required-overlay {
      position: fixed;
      inset: 0;
      background: rgba(3, 10, 8, 0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 4000;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--transition-smooth);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    [data-theme="light"] .auth-required-overlay { background: rgba(248, 250, 251, 0.9); }

    .auth-required-overlay.active { opacity: 1; pointer-events: auto; }

    .auth-required-card {
      background: var(--bg-solid);
      border: 1px solid var(--border-card-hover);
      border-radius: 24px;
      padding: 28px 24px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      transform: translateY(20px) scale(0.96);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 0 0 40px var(--accent-glow);
    }

    [data-theme="light"] .auth-required-card {
      box-shadow:
        0 20px 60px rgba(15, 23, 42, 0.16),
        0 0 40px var(--accent-glow);
    }

    .auth-required-overlay.active .auth-required-card { transform: translateY(0) scale(1); }

    .auth-required-icon {
      width: 72px;
      height: 72px;
      border-radius: 22px;
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(5, 150, 105, 0.15));
      border: 1px solid var(--accent-emerald);
      color: var(--accent-light);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 18px;
      box-shadow: 0 8px 24px var(--accent-glow);
      position: relative;
    }

    .auth-required-icon::after {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 26px;
      border: 1px solid rgba(16, 185, 129, 0.25);
      animation: pulse 2.5s ease-in-out infinite;
    }

    .auth-required-title {
      font-size: 1.2rem;
      font-weight: 900;
      color: var(--text-primary);
      margin-bottom: 10px;
    }

    .auth-required-message {
      font-size: 0.85rem;
      color: var(--text-secondary);
      line-height: 1.7;
      margin-bottom: 22px;
    }

    .auth-required-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .auth-required-btn {
      padding: 13px 20px;
      border-radius: 14px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      transition: all var(--transition-fast);
      border: 1px solid transparent;
    }

    .auth-required-btn i { width: 16px; height: 16px; }

    .auth-required-btn.primary {
      background: linear-gradient(135deg, var(--accent-emerald), var(--accent-dark));
      color: white;
      box-shadow: 0 8px 20px var(--accent-glow);
    }

    .auth-required-btn.primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px var(--accent-glow-strong);
    }

    .auth-required-btn.secondary {
      background: rgba(128, 128, 128, 0.08);
      border-color: var(--border-card);
      color: var(--text-secondary);
    }

    .auth-required-btn.secondary:hover {
      background: rgba(128, 128, 128, 0.15);
      border-color: var(--border-card-hover);
      color: var(--text-primary);
    }

    /* ============================================ */
    /* Responsive */
    /* ============================================ */
    @media (max-width: 640px) {
      .container { padding: 16px 14px; }
      header { padding: 12px 16px; }
      .brand-title { font-size: 1rem; }
      .brand-icon { width: 40px; height: 40px; }
      .welcome-header { padding: 16px; }
      .welcome-greeting { font-size: 1.05rem; }
      .welcome-icon-wrap { width: 48px; height: 48px; }
      .welcome-icon-wrap i { width: 22px; height: 22px; }
      .subject-icon-box { width: 46px; height: 46px; }
      .floating-nav { max-width: 100%; }
      .toast { top: 78px; padding: 12px 18px; font-size: 0.84rem;
      z-index: 2147483647;
    }
      .files-horizontal { margin: 0 -14px; padding-left: 14px; padding-right: 14px; }
      .user-name { display: none; }
      .user-avatar-btn { padding: 6px; }
      .file-mini-card { min-width: 260px; max-width: 260px; }
      .skeleton-mini { min-width: 260px; }
      .search-modal-close { width: 42px; height: 42px; }
      .icon-btn { width: 38px; height: 38px; }
      .icon-btn i { width: 18px; height: 18px; }
      .nav-btn-center { width: 54px; height: 54px; margin-top: -22px; }
      .nav-btn-center i { width: 22px; height: 22px; }
      .quick-access-grid { gap: 8px; }
      .quick-access-btn { padding: 12px 6px; }
      .qa-icon { width: 40px; height: 40px; }
      .qa-icon i { width: 20px; height: 20px; }
      .qa-label { font-size: 0.68rem; }
      .study-card-icon { width: 46px; height: 46px; }
      .study-card-icon i { width: 22px; height: 22px; }
    }

    @media (max-width: 380px) {
      .toast { top: 72px; font-size: 0.8rem; padding: 10px 16px;
      z-index: 2147483647;
    }
      .file-mini-card { min-width: 240px; max-width: 240px; }
      .nav-btn-center { width: 50px; height: 50px; margin-top: -20px; }
      .nav-btn span { font-size: 0.6rem; }
      .quick-access-grid { gap: 6px; }
      .quick-access-btn { padding: 10px 4px; }
      .qa-icon { width: 36px; height: 36px; }
      .qa-icon i { width: 18px; height: 18px; }
      .qa-label { font-size: 0.62rem; }
    }

    @supports (padding: env(safe-area-inset-bottom)) {
      .floating-nav-wrapper { bottom: calc(20px + env(safe-area-inset-bottom)); }
    }

@media (prefers-reduced-motion: reduce) {

}

     Premium file visual — shared by every file surface.

const USER_SUBJECTS = [
  { key: 'physics',   name: 'الفيزياء',   icon: 'fa-atom',     color: '#34d399', bg: 'rgba(52, 211, 153, 0.14)', border: 'rgba(52, 211, 153, 0.30)' },
  { key: 'chemistry', name: 'الكيمياء',   icon: 'fa-flask',    color: '#fbbf24', bg: 'rgba(251, 191, 36, 0.14)', border: 'rgba(251, 191, 36, 0.30)' },
  { key: 'biology',   name: 'البيولوجيا', icon: 'fa-dna',      color: '#60a5fa', bg: 'rgba(96, 165, 250, 0.14)', border: 'rgba(96, 165, 250, 0.30)' },
  { key: 'history',   name: 'تاريخ الطب', icon: 'fa-scroll',   color: '#a78bfa', bg: 'rgba(167, 139, 250, 0.14)', border: 'rgba(167, 139, 250, 0.30)' },
  { key: 'english',   name: 'الإنجليزية', icon: 'fa-language', color: '#f472b6', bg: 'rgba(244, 114, 182, 0.14)', border: 'rgba(244, 114, 182, 0.30)' }
];

const USER_PREFIX = { phys: 'physics', chem: 'chemistry', bio: 'biology', zero: 'history', eng: 'english' };

const userState = {
  targetId: '',
  profile: null,
  currentProfile: null,
  rows: [],
  currentRows: [],
  plans: {},
  totalTasks: 0
};

function escapeHtml(value) {
  return String(value == null ? '' : value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function formatDate(value) {
  if (!value) return '';
  const d = new Date(value);
  if (isNaN(d.getTime())) return String(value);
  const months = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
  return d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear();
}

function taskSubject(row) {
  const prefix = String(row.task_id || '').split('_')[0];
  if (USER_PREFIX[prefix]) return USER_PREFIX[prefix];
  const name = String(row.subject || '');
  if (name.indexOf('فيزياء') !== -1) return 'physics';
  if (name.indexOf('كيمياء') !== -1) return 'chemistry';
  if (name.indexOf('بيولوج') !== -1) return 'biology';
  if (name.indexOf('تاريخ') !== -1) return 'history';
  if (name.indexOf('إنجليز') !== -1) return 'english';
  return '';
}

function getSubject(key) {
  return USER_SUBJECTS.find(function (item) { return item.key === key; }) || USER_SUBJECTS[0];
}

function roleInfo(role) {
  const map = {
    student: { label: 'طالب', icon: 'fa-graduation-cap', className: 'green' },
    moderator: { label: 'مراقب', icon: 'fa-eye', className: '' },
    admin: { label: 'مشرف', icon: 'fa-crown', className: 'gold' }
  };
  return map[role] || map.student;
}

function showToast(message, error) {
  const toast = document.getElementById('toast');
  if (!toast) return;
  toast.innerHTML = '<i class="fa-solid ' + (error ? 'fa-circle-exclamation' : 'fa-circle-check') + '"></i><span>' + escapeHtml(message) + '</span>';
  toast.classList.add('visible');
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(function () { toast.classList.remove('visible'); }, 2800);
}

async function loadPlans() {
  const response = await fetch('plans-data.json', { cache: 'no-cache' });
  if (!response.ok) throw new Error('HTTP ' + response.status);
  const data = await response.json();
  const plans = {};
  let total = 0;
  if (data && typeof data === 'object') {
    Object.keys(data).forEach(function (date) {
      if (!Array.isArray(data[date])) return;
      data[date].forEach(function (task) {
        if (!task || !task.id) return;
        total++;
        plans[date + '|' + task.id] = {
          id: String(task.id),
          date: date,
          subject: task.subject || '',
          instructor: task.instructor || '',
          task: task.task || '',
          type: task.type || ''
        };
      });
    });
  }
  return { plans: plans, total: total };
}

function renderError(message) {
  const root = document.getElementById('pageContent');
  if (!root) return;
  root.innerHTML =
    '<div class="error-card">' +
      '<i class="fa-solid fa-triangle-exclamation"></i>' +
      '<strong>تعذّر تحميل الملف</strong>' +
      '<span>' + escapeHtml(message || 'تحقق من الرابط أو الصلاحيات ثم حاول مرة أخرى.') + '</span>' +
      '<a class="back-inline" href="admin.html"><i class="fa-solid fa-arrow-right"></i> العودة إلى لوحة التحكم</a>' +
    '</div>';
}

async function loadUserProfile() {
  const params = new URLSearchParams(window.location.search);
  userState.targetId = params.get('id') || '';
  if (!userState.targetId) throw new Error('معرّف الطالب غير موجود في الرابط.');

  const session = await requireAuth('login.html');
  if (!session) return false;

  userState.currentProfile = await getProfile(session.id);
  const role = userState.currentProfile && userState.currentProfile.role;
  if (role !== 'admin' && role !== 'moderator') {
    throw new Error('هذه الصفحة متاحة للمشرفين والمراقبين فقط.');
  }

  const results = await Promise.all([
    getProfile(userState.targetId),
    loadPlans()
  ]);
  const profile = results[0];
  if (!profile) throw new Error('لم يتم العثور على حساب هذا الطالب.');
  userState.profile = profile;

  const planData = results[1];
  userState.plans = planData.plans;
  userState.totalTasks = planData.total;

  try {
    const { data, error } = await supabaseClient
      .from('task_progress')
      .select('plan_date,task_id,subject,task_title,instructor,task_type,completed,completed_at,updated_at')
      .eq('user_id', userState.targetId)
      .eq('completed', true)
      .order('plan_date', { ascending: false });
    if (error) throw error;

    // Keep the full completed-history for the task list, but only tasks that
    // still exist in the current plan may contribute to the percentages.
    // Rows left over from an older plan must not push a student above 100%.
    const seen = new Set();
    userState.rows = (data || []).filter(function (row) {
      if (!row || !row.completed || !row.plan_date || !row.task_id) return false;
      const key = String(row.plan_date) + '|' + String(row.task_id);
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    });
    userState.currentRows = userState.rows.filter(function (row) {
      return !!userState.plans[String(row.plan_date) + '|' + String(row.task_id)];
    });
  } catch (err) {
    console.warn('task_progress load error:', err);
    userState.rows = [];
    showToast('تعذّر تحميل سجل تقدم الطالب — تحقق من الاتصال ثم أعد المحاولة.', true);
  }

  return true;
}

function buildSubjectStats() {
  return USER_SUBJECTS.map(function (subject) {
    let total = 0;
    Object.keys(userState.plans).forEach(function (key) {
      const task = userState.plans[key];
      if (taskSubject({ task_id: task.id, subject: task.subject }) === subject.key) total++;
    });
    const done = userState.currentRows.filter(function (row) {
      const task = userState.plans[row.plan_date + '|' + row.task_id];
      return task && taskSubject({ task_id: task.id, subject: task.subject }) === subject.key;
    }).length;
    return {
      subject: subject,
      total: total,
      done: done,
      percent: total ? Math.round((done / total) * 100) : 0
    };
  });
}

function renderProfile() {
  const root = document.getElementById('pageContent');
  if (!root) return;
  const profile = userState.profile;
  const role = roleInfo(profile.role);
  const displayName = profile.full_name || (profile.email ? profile.email.split('@')[0] : 'طالب');
  const initial = displayName.charAt(0).toUpperCase();
  const totalDone = userState.currentRows.length;
  const total = userState.totalTasks;
  const percent = total ? Math.min(100, Math.round((totalDone / total) * 100)) : 0;
  const lastActive = userState.rows.reduce(function (latest, row) {
    const value = row.updated_at || row.completed_at || '';
    return value > latest ? value : latest;
  }, '');
  const subjectStats = buildSubjectStats();

  const avatar = profile.avatar_url
    ? '<img src="' + escapeHtml(profile.avatar_url) + '" alt="' + escapeHtml(displayName) + '">'
    : escapeHtml(initial);

  const subjectsMarkup = subjectStats.map(function (item) {
    return '<div class="subject-card" style="--subject-color:' + item.subject.color + ';--subject-bg:' + item.subject.bg + ';--subject-border:' + item.subject.border + ';">' +
      '<div class="subject-top">' +
        '<span class="subject-icon"><i class="fa-solid ' + item.subject.icon + '"></i></span>' +
        '<span class="subject-count">' + item.done + ' / ' + item.total + '</span>' +
      '</div>' +
      '<div class="subject-name">' + item.subject.name + '</div>' +
      '<div class="subject-bar"><span style="width:' + item.percent + '%;"></span></div>' +
      '<div class="subject-percent">' + item.percent + '%</div>' +
    '</div>';
  }).join('');

  const rows = userState.rows.slice().sort(function (a, b) {
    const dateA = a.plan_date || '';
    const dateB = b.plan_date || '';
    if (dateA !== dateB) return dateA < dateB ? 1 : -1;
    return String(a.task_id || '').localeCompare(String(b.task_id || ''));
  });

  const tasksMarkup = rows.length ? rows.map(function (row) {
    const plan = userState.plans[row.plan_date + '|' + row.task_id] || {};
    const subject = getSubject(taskSubject(row));
    const title = plan.task || row.task_title || 'مهمة دراسية';
    const instructor = plan.instructor || row.instructor || '';
    return '<div class="task-row">' +
      '<span class="task-check"><i class="fa-solid fa-check"></i></span>' +
      '<span class="task-copy">' +
        '<span class="task-title">' + escapeHtml(title) + '</span>' +
        '<span class="task-meta">' +
          '<span style="color:' + subject.color + ';">' + subject.name + '</span>' +
          (instructor ? '<span class="dot"></span><span>' + escapeHtml(instructor) + '</span>' : '') +
          '<span class="dot"></span><span class="task-date"><i class="fa-regular fa-calendar" style="font-size:0.6rem;"></i> ' + escapeHtml(formatDate(row.plan_date)) + '</span>' +
        '</span>' +
      '</span>' +
    '</div>';
  }).join('') :
    '<div class="empty-state">' +
      '<i class="fa-solid fa-clipboard-check"></i>' +
      '<strong>لا توجد مهام مكتملة بعد</strong>' +
      '<span>عندما يبدأ الطالب بإنجاز مهامه من الصفحة الرئيسية، ستظهر هنا تلقائياً بعد المزامنة.</span>' +
    '</div>';

  root.innerHTML =
    '<section class="profile-hero">' +
      '<div class="profile-avatar">' + avatar + '</div>' +
      '<div class="profile-copy">' +
        '<div class="profile-name">' + escapeHtml(displayName) + '</div>' +
        '<div class="profile-email">' + escapeHtml(profile.email || '—') + '</div>' +
        '<div class="profile-chips">' +
          '<span class="profile-chip ' + role.className + '"><i class="fa-solid ' + role.icon + '"></i> ' + role.label + '</span>' +
          '<span class="profile-chip green"><i class="fa-solid fa-calendar-plus"></i> انضم ' + escapeHtml(formatDate(profile.created_at)) + '</span>' +
          (lastActive ? '<span class="profile-chip"><i class="fa-solid fa-clock-rotate-left"></i> آخر نشاط ' + escapeHtml(formatDate(lastActive)) + '</span>' : '') +
        '</div>' +
      '</div>' +
      '<div class="profile-ring" style="--value:' + percent + ';" role="img" aria-label="نسبة إنجاز الطالب">' +
        '<div class="profile-ring-inner">' +
          '<span class="profile-ring-value">' + percent + '%</span>' +
          '<span class="profile-ring-label">نسبة الإنجاز</span>' +
        '</div>' +
      '</div>' +
    '</section>' +

    '<div class="stats-row">' +
      '<div class="stat-box"><i class="fa-solid fa-circle-check"></i><div class="stat-value">' + totalDone + '</div><div class="stat-label">مهمة مكتملة</div></div>' +
      '<div class="stat-box"><i class="fa-solid fa-list-check"></i><div class="stat-value">' + Math.max(total - totalDone, 0) + '</div><div class="stat-label">مهمة متبقية</div></div>' +
      '<div class="stat-box"><i class="fa-solid fa-layer-group"></i><div class="stat-value">' + total + '</div><div class="stat-label">إجمالي المهام</div></div>' +
      '<div class="stat-box"><i class="fa-solid fa-chart-simple"></i><div class="stat-value">' + percent + '%</div><div class="stat-label">من الخطة</div></div>' +
    '</div>' +

    '<div class="section-head">' +
      '<div class="section-title"><i class="fa-solid fa-layer-group"></i> التقدم حسب المادة</div>' +
    '</div>' +
    '<div class="subject-grid">' + subjectsMarkup + '</div>' +

    '<section class="tasks-card">' +
      '<div class="tasks-head">' +
        '<div class="tasks-title">المهام المكتملة</div>' +
        '<div class="tasks-sub">' + (rows.length ? 'أحدث ' + rows.length + ' مهمة أنجزها الطالب' : 'سيظهر سجل الإنجاز هنا') + '</div>' +
      '</div>' +
      '<div class="tasks-list">' + tasksMarkup + '</div>' +
    '</section>' +

    '<a class="back-inline" href="admin.html"><i class="fa-solid fa-arrow-right"></i> العودة إلى لوحة التحكم</a>';

  document.title = displayName + ' — ملف الطالب';
}

async function initUserPage() {
  try {
    const allowed = await loadUserProfile();
    if (allowed === false) return;
    renderProfile();
  } catch (err) {
    console.error('admin-user init error:', err);
    renderError(err && err.message ? err.message : 'حدث خطأ غير متوقع.');
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initUserPage);
} else {
  initUserPage();
}
</script>

<script data-shell>
if ('serviceWorker' in navigator) {
  // If an older worker controlled this page, refresh once when the new worker
  // takes over. This guarantees a stale (previous-deploy) page cannot linger.
  var hadController = !!navigator.serviceWorker.controller;
  var reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (!hadController || reloading) return;
    reloading = true;
    window.location.reload();
  });

  window.addEventListener('load', () => {
    // Force a fresh check so a previously cached (possibly outdated) worker
    // is replaced as soon as a new sw.js is deployed.
    navigator.serviceWorker.getRegistration().then(reg => {
      if (reg) { try { reg.update(); } catch (e) {} }
    }).catch(() => {});

    navigator.serviceWorker.register('sw.js')
      .then(reg => {
        console.log('✅ SW registered:', reg.scope);
        try { reg.update(); } catch (e) {}
      })
      .catch(err => console.warn('⚠️ SW failed:', err));
  });
}
</script>

<!-- ============================================
     Shell feature flag: browsers without the View Transitions API.
     app.js picks the fallback animation itself; this class is exposed
     for page CSS that may want to opt out of motion.
     ============================================ -->
<script data-shell>
  (function () {
    try {
      if (!(window.CSS && CSS.supports && CSS.supports('view-transition-name', 'none'))) {
        document.documentElement.classList.add('no-vt');
      }
    } catch (e) {
      document.documentElement.classList.add('no-vt');
    }
  })();
</script>
