<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

<meta name="theme-color" content="#06110d">
<title>أهدافي - المنصة الطبية</title>

<!-- الخطوط -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/lucide@latest"></script>

<!-- ⭐ النوافذ المنبثقة المخصّصة — بديل alert()/confirm() -->
<script src="ui.js"></script>
<!-- ⭐ نظام التحديث داخل التطبيق (In-App Update) -->
<script src="app-update.js"></script>
<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-512.png">
<script>
  (function() {
    const theme = localStorage.getItem('medfav_theme') || 'dark';
    if (theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
  })();
</script>
<!-- Smooth page transitions (View Transitions API + fallback fade).
     The fixed bottom navigation gets its own view-transition-name and is
     frozen, so it can never move or fade while the page content changes. -->
<style data-shell>
  /* Global theme defaults. `data-theme` is always set by theme-init.js
     (light or dark), so native controls and scrollbars follow the app. */
  :root { color-scheme: light; --medapp-amber: #fbbf24; --medapp-orange: #fb923c; --medapp-blue: #93c5fd; --medapp-blue-soft: #bfdbfe; --medapp-violet: #c4b5fd; --medapp-green: #34d399; --medapp-red: #f87171; --medapp-pink: #f472b6; }
  [data-theme="dark"] { color-scheme: dark; }
  [data-theme="light"] { --medapp-amber: #b45309; --medapp-orange: #c2410c; --medapp-blue: #2563eb; --medapp-blue-soft: #1d4ed8; --medapp-violet: #6d28d9; --medapp-green: #047857; --medapp-red: #b91c1c; --medapp-pink: #be185d; }

  /* Premium smooth scrolling. The SPA router temporarily disables this for
     page swaps / Back restoration so navigation is instant, never animated. */
  html { scroll-behavior: smooth; }
  /* app.js sets this only for instant SPA swaps / Back restoration. */
  html.medapp-scroll-jump { scroll-behavior: auto !important; }

  html.medapp-navigating { cursor: progress; }

  /* ⭐IMPORTANT: the `hidden` attribute must always win.
     Author rules like `.detail-empty { display: flex }` beat the user-agent
     `[hidden] { display: none }` rule, which made "empty" blocks stay on
     screen on top of real content. */
  [hidden] { display: none !important; }

  /* ⭐ Tap targets: 44px minimum, no double-tap zoom, no grey flash. */
  button,
  a[role="button"],
  [role="button"] {
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }

  /* ⭐ انتقال ناعم بين الوضعين النهاري والليلي.
     يُفعَّل هذا الصنف لحظياً قبل تبديل الثيم (MedApp.withThemeTransition)
     فيتحوّل لون الخلفية والنص والحدود تدريجياً بدل القفز المفاجئ. */
  html.theme-transition,
  html.theme-transition body,
  html.theme-transition *,
  html.theme-transition *::before,
  html.theme-transition *::after {
    transition:
      background-color 0.34s ease,
      color 0.34s ease,
      border-color 0.34s ease,
      fill 0.34s ease,
      stroke 0.34s ease,
      box-shadow 0.34s ease !important;
    transition-delay: 0s !important;
  }

  /* Very thin top progress bar, shown by app.js during SPA navigation. */
  #medapp-loader {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    z-index: 2147483647;
    pointer-events: none;
    overflow: hidden;
    opacity: 0;
    transition: opacity 0.15s ease;
  }

  #medapp-loader::before {
    content: '';
    display: block;
    width: 40%;
    height: 100%;
    border-radius: 0 999px 999px 0;
    background: linear-gradient(90deg, transparent, #059669 18%, #10b981 52%, #34d399 82%, transparent);
    box-shadow: 0 0 8px rgba(16, 185, 129, 0.6);
    transform: translateX(-110%);
    will-change: transform;
  }

  html.medapp-loading #medapp-loader { opacity: 1; }
  html.medapp-loading #medapp-loader::before {
    animation: medapp-loader-slide 1.05s cubic-bezier(0.4, 0, 0.2, 1) infinite;
  }

  @keyframes medapp-loader-slide {
    0%   { transform: translateX(-110%); }
    100% { transform: translateX(360%); }
  }

  /* Only same-document transitions (started by app.js). Cross-document
     @view-transition is intentionally NOT enabled: full loads must behave
     exactly like the original pages. */

  .floating-nav-wrapper { view-transition-name: medapp-bottom-nav; }
  ::view-transition-group(medapp-bottom-nav) { animation: none; }
  ::view-transition-old(medapp-bottom-nav),
  ::view-transition-new(medapp-bottom-nav) { animation: none; }

  /* Keep the sticky header out of the root cross-fade. Otherwise the old and
     new snapshots of a translucent, blurred header overlap and look frozen /
     show a ghost shadow while the page changes. */
  header { view-transition-name: medapp-header; }
  ::view-transition-group(medapp-header) { animation: none; }
  ::view-transition-old(medapp-header),
  ::view-transition-new(medapp-header) { animation: none; }

  /* Light mode: the header must use a soft neutral shadow, never the heavy
     black shadow used by the dark theme. */
  [data-theme="light"] header {
    background: rgba(248, 250, 251, 0.92);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    backdrop-filter: blur(20px) saturate(180%);
    border-bottom-color: rgba(15, 23, 42, 0.08);
    box-shadow: 0 1px 0 rgba(15, 23, 42, 0.04);
    color: var(--text-primary);
  }

  /* Wins over every page-level `header.scrolled` (higher specificity). */
  [data-theme="light"] header.scrolled {
    background: rgba(248, 250, 251, 0.97);
    border-bottom-color: rgba(15, 23, 42, 0.1);
    box-shadow:
      0 4px 18px rgba(15, 23, 42, 0.08),
      0 1px 0 rgba(15, 23, 42, 0.05);
  }

  @media (prefers-reduced-motion: no-preference) {
    ::view-transition-old(root) { animation: pt-fade-out 0.14s cubic-bezier(0.4, 0, 0.2, 1) both; }
    ::view-transition-new(root) { animation: pt-fade-in 0.2s cubic-bezier(0.4, 0, 0.2, 1) both; }
  }

  /* No body animation on browsers without View Transitions: the swap is
     already synchronous, and fading the body element would also fade the
     fixed bottom navigation. The nav must never move or fade. */

  @keyframes pt-fade-in  { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pt-fade-out { from { opacity: 1; } to { opacity: 0; } }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto !important; }
    html.theme-transition,
    html.theme-transition body,
    html.theme-transition *,
    html.theme-transition *::before,
    html.theme-transition *::after {
      transition: none !important;
    }
    #medapp-loader::before {
      animation: none !important;
      transform: none;
      width: 60%;
    }
    ::view-transition-old(root), ::view-transition-new(root),
    ::view-transition-old(medapp-bottom-nav), ::view-transition-new(medapp-bottom-nav),
    ::view-transition-old(medapp-header), ::view-transition-new(medapp-header) { animation: none !important; }
  }

  /* ============================================================
     ⭐ المنطقة الآمنة + الشريط العلوي الثابت (Phase 14)
     ------------------------------------------------------------
     • الشريط العلوي fixed ⇒ لا يختفي تحت شريط الحالة عند السحب
       (الـ rubber-band كان يُظهره خلف الشريط).
     • جسم الصفحة يحمل padding-top بمقدار ارتفاع الشريط حتى
       لا يختفي المحتوى تحته.
     • overscroll-behavior: لا اهتزاز عند السحب إلى ما بعد الحواف.
     ============================================================ */
  :root {
    /* ⭐⭐ سلّم الـ z-index — كل الطبقات في مكانها (Phase 27)
       ------------------------------------------------------------
       1        عناصر داخل الصفحة
       100      عناصر لاصقة
       9999     الشريط العلوي
       10000+   الأوراق السفلية (السلسلة · مهام اليوم …)
       20000    الطبقات شبه الشفافة (البحث · نافذة الدخول)
       1000000  نوافذ ui.js
       1000100  نافذة التحديث
       2147483647  التنبيهات (toast) — الأعلى دائماً */
    --z-header: 9999;
    --z-sheet: 10000;
    --z-overlay: 20000;
    --z-modal: 1000000;
    --z-update: 1000100;
    --z-toast: 2147483647;

    --safe-area-inset-top: env(safe-area-inset-top, 0px);
    --safe-area-inset-bottom: env(safe-area-inset-bottom, 0px);
    --safe-area-inset-left: env(safe-area-inset-left, 0px);
    --safe-area-inset-right: env(safe-area-inset-right, 0px);

    /* ⭐⭐ رموز احتياطية — الصفحات التي تعرّف رموزها الخاصة تتجاوزها،
       والصفحات التي لا تعرّفها تحصل على قيم سليمة.
       بدونها كان زر "تسجيل الدخول" بلا خلفية (لأن --accent-emerald
       غير معرّف) فيظهر النص الأبيض على خلفية شفافة = نص غير مرئي. */
    --accent-emerald: #10b981;
    --accent-light: #34d399;
    --accent-dark: #059669;
    --accent-glow: rgba(16, 185, 129, 0.25);
    --accent-glow-strong: rgba(16, 185, 129, 0.42);
    --bg-main: #06110d;
    --bg-card: rgba(16, 34, 27, 0.68);
    --bg-card-hover: rgba(22, 48, 38, 0.92);
    --bg-solid: #0d221a;
    --bg-elevated: #102a22;
    --border-card: rgba(16, 185, 129, 0.18);
    --border-card-hover: rgba(16, 185, 129, 0.46);
    --text-primary: #f0fdf4;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
    --transition-fast: 0.18s ease;
    --transition-smooth: 0.25s cubic-bezier(0.4, 0, 0.2, 1);

    --app-header-h: 72px;
    --app-header-pad-x: 20px;
  }

  [data-theme="light"] {
    --accent-emerald: #059669;
    --bg-main: #f8fafb;
    --bg-card: rgba(255, 255, 255, 0.9);
    --bg-card-hover: #ffffff;
    --bg-solid: #ffffff;
    --bg-elevated: #f1f5f9;
    --border-card: rgba(16, 185, 129, 0.24);
    --border-card-hover: rgba(16, 185, 129, 0.55);
    --text-primary: #0f172a;
    --text-secondary: #475569;
    --text-muted: #94a3b8;
  }

  @media (max-width: 480px) {
    :root {
      --app-header-h: 68px;
      --app-header-pad-x: 16px;
    }
  }

  html, body, main {
    overscroll-behavior-y: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }

  /* ⭐ لكن حقول الإدخال تبقى قابلة للتحديد والنسخ */
  input,
  textarea,
  select,
  [contenteditable="true"] {
    -webkit-user-select: text;
    user-select: text;
  }

  body {
    margin: 0;
    padding: 0;
  }

  /* ⭐ الشريط العلوي: ثابت في الأعلى، فوق كل شيء، ويحترم النوتش */
  body > header,
  body > .ml-topbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    width: 100%;
    z-index: 9999;
    box-sizing: border-box;
    min-height: calc(var(--app-header-h) + var(--safe-area-inset-top, env(safe-area-inset-top, 0px)));
    padding-top: var(--safe-area-inset-top, env(safe-area-inset-top, 0px)) !important;
    padding-bottom: 0 !important;
    padding-left: var(--app-header-pad-x) !important;
    padding-right: var(--app-header-pad-x) !important;
  }

  /* حالة "مُمرَّر" لا يجب أن تكسر الارتفاع ولا المنطقة الآمنة */
  body > header.scrolled,
  body > .ml-topbar {
    padding-top: var(--safe-area-inset-top, env(safe-area-inset-top, 0px)) !important;
  }

  /* ⭐ جسم الصفحة يتزحزح بمقدار الشريط حتى لا يختفي تحته */
  body:has(> header),
  body:has(> .ml-topbar) {
    padding-top: calc(var(--app-header-h) + var(--safe-area-inset-top, env(safe-area-inset-top, 0px)));
  }

  /* ⭐ حاويات التطبيق تحترم المنطقة الآمنة من الأسفل */
  body > main,
  body > .container,
  .app-container {
    padding-bottom: var(--safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));
  }

  /* ============================================================
     ⭐⭐⭐ نافذة التحديث داخل التطبيق (In-App Update)
     ------------------------------------------------------------
     تصميم أخضر فاخر يعرض الإصدار الجديد وملاحظات الإصدار.
     ============================================================ */
  .medapp-update-overlay {
    position: fixed;
    inset: 0;
    z-index: var(--z-update, 1000100);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 22px;
    background: rgba(2, 10, 7, 0.78);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    opacity: 0;
    transition: opacity 0.25s ease;
  }
  .medapp-update-overlay.open { opacity: 1; }

  .medapp-update-card {
    width: 100%;
    max-width: 430px;
    max-height: 86vh;
    overflow-y: auto;
    padding: 26px 22px 20px;
    border-radius: 26px;
    text-align: center;
    background: linear-gradient(160deg, #0e2b21 0%, #08170f 100%);
    border: 1px solid rgba(16, 185, 129, 0.4);
    box-shadow: 0 30px 90px -24px rgba(0, 0, 0, 0.8), 0 0 60px -20px rgba(16, 185, 129, 0.35);
    transform: translateY(18px) scale(0.95);
    transition: transform 0.32s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .medapp-update-overlay.open .medapp-update-card { transform: translateY(0) scale(1); }

  .medapp-update-badge {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 6px 14px;
    border-radius: 999px;
    background: rgba(16, 185, 129, 0.16);
    border: 1px solid rgba(16, 185, 129, 0.38);
    color: #34d399;
    font-size: 0.7rem;
    font-weight: 800;
    margin-bottom: 14px;
  }
  .medapp-update-icon {
    width: 66px;
    height: 66px;
    margin: 0 auto 12px;
    border-radius: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, rgba(16, 185, 129, 0.24), rgba(5, 150, 105, 0.12));
    border: 1px solid rgba(16, 185, 129, 0.4);
    color: #34d399;
    box-shadow: 0 0 34px -8px rgba(16, 185, 129, 0.55);
  }
  .medapp-update-icon i { width: 30px; height: 30px; }
  .medapp-update-title {
    font-size: 1.2rem;
    font-weight: 900;
    color: #f0fdf4;
    line-height: 1.5;
  }
  .medapp-update-version {
    display: inline-block;
    margin-top: 8px;
    padding: 5px 14px;
    border-radius: 10px;
    background: rgba(16, 185, 129, 0.14);
    color: #34d399;
    font-size: 0.92rem;
    font-weight: 900;
    direction: ltr;
  }
  .medapp-update-notes {
    margin-top: 16px;
    padding: 14px;
    border-radius: 16px;
    background: rgba(0, 0, 0, 0.25);
    border: 1px solid rgba(16, 185, 129, 0.16);
    color: #cbd5e1;
    font-size: 0.78rem;
    font-weight: 600;
    line-height: 1.85;
    text-align: right;
    max-height: 220px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .medapp-update-progress {
    margin-top: 14px;
    display: none;
  }
  .medapp-update-progress.visible { display: block; }
  .medapp-update-bar {
    height: 7px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.08);
    overflow: hidden;
  }
  .medapp-update-bar span {
    display: block;
    height: 100%;
    width: 0%;
    border-radius: 999px;
    background: linear-gradient(90deg, #10b981, #34d399);
    transition: width 0.25s ease;
  }
  .medapp-update-status {
    margin-top: 8px;
    font-size: 0.74rem;
    font-weight: 700;
    color: #94a3b8;
  }
  .medapp-update-actions {
    margin-top: 20px;
    display: flex;
    gap: 10px;
  }
  .medapp-update-btn {
    flex: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 13px 16px;
    border-radius: 14px;
    border: 1px solid rgba(16, 185, 129, 0.3);
    background: transparent;
    color: #94a3b8;
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 800;
    cursor: pointer;
    transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
  }
  .medapp-update-btn.primary {
    border: none;
    background: linear-gradient(135deg, #10b981, #059669);
    color: #fff;
    box-shadow: 0 12px 30px -14px rgba(16, 185, 129, 0.9);
  }
  .medapp-update-btn:hover { transform: translateY(-2px); }
  .medapp-update-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

  /* ============================================================
     ⭐⭐ النوافذ المنبثقة المخصّصة (Custom Alerts / Modals)
     ------------------------------------------------------------
     تحلّ محل alert() و confirm() الأصليين في أندرويد.
     ════════════════════════════════════════════════════════════ */
  .medapp-ui-root {
    position: fixed;
    inset: 0;
    z-index: var(--z-modal, 1000000);
    pointer-events: none;
  }
  .medapp-ui-root.open { pointer-events: auto; }

  .medapp-ui-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 22px;
    background: rgba(3, 10, 8, 0.68);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    opacity: 0;
    transition: opacity 0.22s ease;
  }
  [data-theme="light"] .medapp-ui-overlay { background: rgba(15, 23, 42, 0.42); }
  .medapp-ui-root.open .medapp-ui-overlay { opacity: 1; }

  .medapp-ui-card {
    width: 100%;
    max-width: 400px;
    padding: 26px 22px 20px;
    border-radius: 24px;
    text-align: center;
    background: var(--bg-solid, #0d221a);
    border: 1px solid var(--border-card, rgba(16, 185, 129, 0.18));
    box-shadow: 0 30px 80px -24px rgba(0, 0, 0, 0.65);
    transform: translateY(16px) scale(0.94);
    opacity: 0;
    transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.22s ease;
  }
  .medapp-ui-root.open .medapp-ui-card { transform: translateY(0) scale(1); opacity: 1; }

  .medapp-ui-icon {
    width: 62px;
    height: 62px;
    margin: 0 auto 14px;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: color-mix(in srgb, var(--medapp-ui-tone, var(--medapp-blue, #60a5fa)) 16%, transparent);
    border: 1px solid color-mix(in srgb, var(--medapp-ui-tone, var(--medapp-blue, #60a5fa)) 38%, transparent);
    color: var(--medapp-ui-tone, var(--medapp-blue, #60a5fa));
  }
  .medapp-ui-icon i { width: 28px; height: 28px; }

  .medapp-ui-title {
    font-size: 1.06rem;
    font-weight: 900;
    color: var(--text-primary, #f0fdf4);
    line-height: 1.5;
  }
  .medapp-ui-message {
    margin-top: 8px;
    font-size: 0.84rem;
    font-weight: 600;
    line-height: 1.8;
    color: var(--text-secondary, #94a3b8);
  }
  .medapp-ui-actions {
    margin-top: 20px;
    display: flex;
    gap: 10px;
  }
  .medapp-ui-input {
    width: 100%;
    margin-top: 18px;
    padding: 13px 15px;
    border-radius: 13px;
    border: 1.5px solid var(--border-card, rgba(16, 185, 129, 0.18));
    background: var(--bg-elevated, #102a22);
    color: var(--text-primary, #f0fdf4);
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 700;
    text-align: center;
    outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
    -webkit-user-select: text;
    user-select: text;
  }
  .medapp-ui-input:focus {
    border-color: var(--accent-emerald, #10b981);
    box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.15);
  }
  .medapp-ui-input.shake { animation: medappShake 0.4s ease; }
  @keyframes medappShake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  .medapp-ui-btn {
    flex: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 12px 16px;
    border-radius: 13px;
    border: 1px solid var(--border-card, rgba(16, 185, 129, 0.18));
    background: var(--bg-elevated, #102a22);

  gap: 14px;
  padding-left: 48px; /* مساحة لزر الحذف */
  position: relative;
  z-index: 1;
}

.goal-checkbox {
  width: 30px;
  height: 30px;
  border-radius: 10px;
  background: transparent;
  border: 2px dashed #64748b;
  cursor: pointer;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  margin-top: 2px;
  position: relative;
  z-index: 2;
}

[data-theme="light"] .goal-checkbox {
  border-color: #94a3b8;
}

.goal-checkbox:hover {
  border-color: var(--accent-emerald);
  border-style: solid;
  background: rgba(16, 185, 129, 0.08);
  transform: scale(1.08);
  box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1);
}

/* علامة الصح - مخفية افتراضياً (تعمل مع SVG الذي يولّده Lucide) */
.goal-checkbox svg,
.goal-checkbox i {
  display: none !important;
  width: 18px;
  height: 18px;
  color: white;
  stroke-width: 3;
}

/* تظهر فقط عند الإكمال */
.goal-checkbox.checked {
  background: linear-gradient(135deg, var(--accent-emerald), var(--accent-dark));
  border: 2px solid var(--accent-emerald);
  border-style: solid;
  box-shadow: 
    0 4px 12px var(--accent-glow-strong),
    inset 0 1px 0 rgba(255, 255, 255, 0.25);
}

.goal-checkbox.checked svg,
.goal-checkbox.checked i {
  display: block !important;
}

.goal-checkbox.checked:hover {
  box-shadow: 
    0 6px 16px var(--accent-glow-strong),
    0 0 0 4px rgba(16, 185, 129, 0.15),
    inset 0 1px 0 rgba(255, 255, 255, 0.3);
}

/* Content */
.goal-content {
  flex: 1;
  min-width: 0;
}

.goal-text {
  font-size: 1rem;
  font-weight: 700;
  color: var(--text-primary);
  line-height: 1.6;
  margin-bottom: 10px;
  word-break: break-word;
  transition: all var(--transition-fast);
  position: relative;
  padding-right: 4px;
}

.goal-card.completed .goal-text {
  color: var(--text-muted);
  text-decoration: line-through;
  text-decoration-color: var(--accent-emerald);
  text-decoration-thickness: 2px;
}

/* Meta row */
.goal-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.goal-meta-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 5px 10px;
  border-radius: 10px;
  background: rgba(128, 128, 128, 0.08);
  border: 1px solid var(--border-card);
  font-size: 0.72rem;
  color: var(--text-secondary);
  font-weight: 600;
  transition: all var(--transition-fast);
}

.goal-meta-chip i {
  width: 12px;
  height: 12px;
  color: var(--text-muted);
}

.goal-meta-chip.deadline-soon {
  background: rgba(245, 158, 11, 0.12);
  border-color: rgba(245, 158, 11, 0.35);
  color: var(--medapp-amber);
}

.goal-meta-chip.deadline-soon i {
  color: var(--medapp-amber);
}

.goal-meta-chip.deadline-overdue {
  background: rgba(239, 68, 68, 0.12);
  border-color: rgba(239, 68, 68, 0.35);
  color: var(--medapp-red);
}

.goal-meta-chip.deadline-overdue i {
  color: var(--medapp-red);
}

/* Status badge */
.goal-status {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 10px;
  border-radius: 10px;
  font-size: 0.68rem;
  font-weight: 800;
  background: rgba(100, 116, 139, 0.15);
  border: 1px solid rgba(100, 116, 139, 0.3);
  color: #94a3b8;
}

.goal-status i {
  width: 11px;
  height: 11px;
}

.goal-status.completed {
  background: rgba(16, 185, 129, 0.15);
  border-color: rgba(16, 185, 129, 0.35);
  color: var(--accent-light);
}

/* Delete Button - أوضح وقابل للنقر */
.goal-delete {
  position: absolute;
  top: 14px;
  left: 14px;
  width: 38px;
  height: 38px;
  border-radius: 12px;
  background: rgba(239, 68, 68, 0.12);
  border: 1px solid rgba(239, 68, 68, 0.35);
  color: var(--medapp-red);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  font-family: inherit;
  z-index: 10;
  pointer-events: auto;
}

.goal-delete:hover {
  background: rgba(239, 68, 68, 0.25);
  border-color: var(--danger);
  transform: scale(1.08);
  box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
}

.goal-delete:active {
  transform: scale(0.95);
}

.goal-delete i {
  width: 17px;
  height: 17px;
  pointer-events: none;
}

    /* Empty */

  <script src="app.js?v=3.5.0"></script>
<script>

    lucide.createIcons();

    // ============================================
    // الحالة
    // ============================================
    var goalsState = {
      goals: []
    };

    var GOALS_KEY = 'medfav_goals';

    // ============================================
    // Toast
    // ============================================
    function showToast(message, type = 'success') {
      const existing = document.querySelector('.toast');
      if (existing) existing.remove();
      
      const toast = document.createElement('div');
      toast.className = 'toast' + (type === 'error' ? ' error' : type === 'info' ? ' info' : '');
      
      const icon = type === 'error' ? 'alert-circle' : type === 'info' ? 'info' : 'check-circle-2';
      toast.innerHTML = `
        <i data-lucide="${icon}" style="width: 18px; height: 18px; flex-shrink: 0;"></i>
        <span>${message}</span>
      `;
      
      document.body.appendChild(toast);
      lucide.createIcons();
      
      requestAnimationFrame(() => toast.classList.add('visible'));
      
      setTimeout(() => {
        toast.classList.remove('visible');
        setTimeout(() => toast.remove(), 350);
      }, 2600);
    }

    // ============================================
    // التحميل من localStorage
    // ============================================
    function loadGoals() {
      try {
        const data = localStorage.getItem(GOALS_KEY);
        goalsState.goals = data ? JSON.parse(data) : [];
      } catch (err) {
        console.error('loadGoals error:', err);
        goalsState.goals = [];
      }
      
      renderGoals();
      updateProgress();
    }

    // ============================================
    // الحفظ في localStorage
    // ============================================
    function saveGoalsToStorage() {
      try {
        localStorage.setItem(GOALS_KEY, JSON.stringify(goalsState.goals));
      } catch (err) {
        console.error('saveGoals error:', err);
      }
    }

    // ============================================
    // عرض الأهداف
    // ============================================
    function renderGoals() {
      const list = document.getElementById('goalsList');
      const empty = document.getElementById('goalsEmpty');
      
      list.innerHTML = '';
      
      if (goalsState.goals.length === 0) {
        empty.classList.add('visible');
        return;
      }
      
      empty.classList.remove('visible');
      
      // ترتيب: غير المكتملة أولاً، ثم المكتملة
      const sorted = [...goalsState.goals].sort((a, b) => {
        if (a.completed === b.completed) {
          return new Date(b.created_at) - new Date(a.created_at);
        }
        return a.completed ? 1 : -1;
      });
      
      sorted.forEach((goal, i) => {
        const card = createGoalCard(goal, i);
        list.appendChild(card);
      });
      
      lucide.createIcons();
    }

// ============================================
// إنشاء بطاقة هدف
// ============================================
function createGoalCard(goal, index) {
  const card = document.createElement('div');
  card.className = 'goal-card' + (goal.completed ? ' completed' : '');
  card.style.animationDelay = (index * 0.04) + 's';
  
  // شريحة تاريخ الاستحقاق
  let deadlineHtml = '';
  if (goal.deadline) {
    const deadlineInfo = getDeadlineInfo(goal.deadline);
    deadlineHtml = `
      <div class="goal-meta-chip ${deadlineInfo.className}">
        <i data-lucide="calendar"></i>
        <span>${deadlineInfo.text}</span>
      </div>
    `;
  }
  
  // شارة الحالة
  const statusHtml = goal.completed 
    ? `<span class="goal-status completed">
         <i data-lucide="check-circle-2"></i>
         مكتمل
       </span>`
    : `<span class="goal-status">
         <i data-lucide="circle-dashed"></i>
         قيد الإنجاز
       </span>`;
  
  card.innerHTML = `
  <button type="button" class="goal-delete" onclick="event.stopPropagation(); deleteGoal('${goal.id}')" title="حذف">
    <i data-lucide="trash-2"></i>
  </button>
    
    <div class="goal-main">
      <div class="goal-checkbox ${goal.completed ? 'checked' : ''}" 
           onclick="toggleGoal('${goal.id}')"
           title="${goal.completed ? 'إلغاء الإكمال' : 'تحديد كمكتمل'}">
        <i data-lucide="check"></i>
      </div>
      <div class="goal-content">
        <div class="goal-text">${escapeHtml(goal.text)}</div>
        <div class="goal-meta">
          ${statusHtml}
          <div class="goal-meta-chip">
            <i data-lucide="clock"></i>
            <span>${formatGoalDate(goal.created_at)}</span>
          </div>
          ${deadlineHtml}
        </div>
      </div>
    </div>
  `;
  
  return card;
}

// ============================================
// معلومات تاريخ الاستحقاق
// ============================================
function getDeadlineInfo(dateString) {
  const date = new Date(dateString);
  const now = new Date();
  now.setHours(0, 0, 0, 0);
  
  const deadlineDate = new Date(date);
  deadlineDate.setHours(0, 0, 0, 0);
  
  const diffMs = deadlineDate - now;
  const diffDays = Math.ceil(diffMs / 86400000);
  
  if (diffDays < 0) {
    return {
      text: `متأخر ${Math.abs(diffDays)} يوم`,
      className: 'deadline-overdue'
    };
  }
  if (diffDays === 0) {
    return { text: 'اليوم', className: 'deadline-soon' };
  }
  if (diffDays === 1) {
    return { text: 'غداً', className: 'deadline-soon' };
  }
  if (diffDays <= 3) {
    return { text: `بعد ${diffDays} أيام`, className: 'deadline-soon' };
  }
  if (diffDays <= 7) {
    return { text: `بعد ${diffDays} أيام`, className: '' };
  }
  
  return {
    text: date.toLocaleDateString('ar-EG', { month: 'short', day: 'numeric' }),
    className: ''
  };
}

    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function formatGoalDate(dateString) {
      const date = new Date(dateString);
      const now = new Date();
      const diffMs = now - date;
      const diffMins = Math.floor(diffMs / 60000);
      const diffHours = Math.floor(diffMs / 3600000);
      const diffDays = Math.floor(diffMs / 86400000);
      
      if (diffMins < 1) return 'الآن';
      if (diffMins < 60) return `منذ ${diffMins} دقيقة`;
      if (diffHours < 24) return `منذ ${diffHours} ساعة`;
      if (diffDays < 7) return `منذ ${diffDays} يوم`;
      
      return date.toLocaleDateString('ar-EG', {
        year: 'numeric',
        month: 'short',
        day: 'numeric'
      });
    }

    function formatDeadline(dateString) {
      const date = new Date(dateString);
      const now = new Date();
      now.setHours(0, 0, 0, 0);
      
      const deadlineDate = new Date(date);
      deadlineDate.setHours(0, 0, 0, 0);
      
      const diffMs = deadlineDate - now;
      const diffDays = Math.ceil(diffMs / 86400000);
      
      if (diffDays < 0) return `متأخر ${Math.abs(diffDays)} يوم`;
      if (diffDays === 0) return 'اليوم';
      if (diffDays === 1) return 'غداً';
      if (diffDays < 7) return `بعد ${diffDays} أيام`;
      
      return date.toLocaleDateString('ar-EG', {
        month: 'short',
        day: 'numeric'
      });
    }

    // ============================================
    // تحديث التقدم
    // ============================================
    function updateProgress() {
      const total = goalsState.goals.length;
      const completed = goalsState.goals.filter(g => g.completed).length;
      const percent = total === 0 ? 0 : Math.round((completed / total) * 100);
      
      // تحديث الدائرة
      const circle = document.getElementById('progressCircle');
      const degrees = (percent / 100) * 360;
      circle.style.background = `conic-gradient(var(--pink) ${degrees}deg, rgba(255,255,255,0.1) ${degrees}deg)`;
      
      // تحديث النسبة
      animateNumber('progressPercent', percent, '%');
      
      // تحديث النص
      const subtitle = document.getElementById('statsSubtitle');
      if (total === 0) {
        subtitle.textContent = 'لم تقم بإضافة أي هدف بعد';
      } else if (completed === total) {
        subtitle.textContent = `أحسنت! أكملت جميع أهدافك (${total}/${total})`;
      } else {
        subtitle.textContent = `أكملت ${completed} من ${total} أهداف`;
      }
    }

    function animateNumber(elementId, target, suffix = '') {
      const el = document.getElementById(elementId);
      if (!el) return;
      
      const duration = 800;
      const start = performance.now();
      const startValue = parseInt(el.textContent) || 0;
      
      function update(now) {
        const elapsed = now - start;
        const progress = Math.min(elapsed / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 3);
        const current = Math.round(startValue + (target - startValue) * eased);
        el.textContent = current + suffix;
        if (progress < 1) requestAnimationFrame(update);
        else el.textContent = target + suffix;
      }
      
      requestAnimationFrame(update);
    }

    // ============================================
    // تبديل حالة الهدف
    // ============================================
    function toggleGoal(goalId) {
      const goal = goalsState.goals.find(g => g.id === goalId);
      if (!goal) return;
      
      goal.completed = !goal.completed;
      saveGoalsToStorage();
      renderGoals();
      updateProgress();
      
      if (goal.completed) {
        showToast('أحسنت! تم إكمال الهدف');
      }
    }

    // ============================================
    // حذف الهدف
    // ============================================
    async function deleteGoal(goalId) {
      // ⭐ نافذة التأكيد المخصّصة (بديل confirm() الأصلي)
      const confirmed = await showCustomConfirm(
        'حذف الهدف',
        'هل تريد حذف هذا الهدف؟',
        null,
        { confirmText: 'حذف', cancelText: 'إلغاء', type: 'warning', danger: true }
      );
      if (!confirmed) return;

      goalsState.goals = goalsState.goals.filter(g => g.id !== goalId);
      saveGoalsToStorage();
      renderGoals();
      updateProgress();

      showToast('تم حذف الهدف', 'info');
    }

    // ============================================
    // Modal
    // ============================================
    function openAddModal() {
      document.getElementById('goalText').value = '';
      document.getElementById('goalDeadline').value = '';
      
      document.getElementById('addModal').classList.add('active');
      document.body.style.overflow = 'hidden';
      
      setTimeout(() => {
        document.getElementById('goalText').focus();
      }, 300);
      
      lucide.createIcons();
    }

    function closeAddModal() {
      document.getElementById('addModal').classList.remove('active');
      document.body.style.overflow = '';
    }

    function closeAddModalIfOutside(event) {
      if (event.target.id === 'addModal') closeAddModal();
    }

    // ============================================
    // حفظ الهدف
    // ============================================
    function saveGoal() {
      const text = document.getElementById('goalText').value.trim();
      const deadline = document.getElementById('goalDeadline').value;
      
      if (!text) {
        showToast('نص الهدف مطلوب', 'error');
        return;
      }
      
      const newGoal = {
        id: 'goal_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9),
        text: text,
        deadline: deadline || null,
        completed: false,
        created_at: new Date().toISOString()
      };
      
      goalsState.goals.push(newGoal);
      saveGoalsToStorage();
      
      showToast('تم إضافة الهدف');
      closeAddModal();
      
      renderGoals();
      updateProgress();
    }

    // ============================================
    // ESC
    // ============================================
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        const modal = document.getElementById('addModal');
        if (modal && modal.classList.contains('active')) {
          closeAddModal();
        }
      }
    });

    // ============================================
    // التشغيل الأولي
    // ============================================
    async function init() {
      // التحقق من تسجيل الدخول
      const session = await getSession();
      if (!session) {
        window.location.href = 'login.html';
        return;
      }
      
      loadGoals();
      
    }

    init();
  
</script>

<script data-shell>
if ('serviceWorker' in navigator) {
  // If an older worker controlled this page, refresh once when the new worker
  // takes over. This guarantees a stale (previous-deploy) page cannot linger.
  var hadController = !!navigator.serviceWorker.controller;
  var reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (!hadController || reloading) return;
    reloading = true;
    window.location.reload();
  });

  window.addEventListener('load', () => {
    // Force a fresh check so a previously cached (possibly outdated) worker
    // is replaced as soon as a new sw.js is deployed.
    navigator.serviceWorker.getRegistration().then(reg => {
      if (reg) { try { reg.update(); } catch (e) {} }
    }).catch(() => {});

    navigator.serviceWorker.register('sw.js')
      .then(reg => {
        console.log('✅ SW registered:', reg.scope);
        try { reg.update(); } catch (e) {}
      })
      .catch(err => console.warn('⚠️ SW failed:', err));
  });
}
</script>
